/* ══════════════════════════════════════════════════════════════
   IMPORTÉR FRA DRAW.IO
   Læser en .drawio-fil og bygger ark ud fra den. Tre slags filer:
   1) eksporteret fra SignalFlow med mærker (sf=kanal osv.) – genskabes præcist,
      også efter man har rettet, flyttet eller kopieret figurer i draw.io
   2) ældre SignalFlow-eksporter uden mærker – genkendes på deres stil
   3) almindelige draw.io-tegninger – teksten lægges ind som frie tekstfelter
   Sektioner, grupper og kanaler findes ud fra, hvor figurerne STÅR, ikke ud
   fra en rækkefølge i filen. Så overlever det, at man flytter rundt i draw.io.
   ══════════════════════════════════════════════════════════════ */

/* draw.io gemmer ofte hver side pakket: base64 → deflate → URI-kodet */
async function dioUdpak(tekst){
  const t=(tekst||'').trim();
  if(!t || t.startsWith('<')) return t;
  if(typeof DecompressionStream==='undefined')
    throw new Error('Din browser kan ikke pakke draw.io-filen ud. Gem den i draw.io med "Komprimeret" slået fra.');
  const bin=Uint8Array.from(atob(t), c=>c.charCodeAt(0));
  const strom=new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  const ud=await new Response(strom).text();
  try{ return decodeURIComponent(ud); }catch(e){ return ud; }
}

/* HTML-etiketter fra draw.io → ren tekst med linjeskift */
function dioTekst(v){
  if(!v) return '';
  let t=String(v)
    .replace(/<br\s*\/?>/gi,'\n').replace(/<\/(div|p|li)>/gi,'\n')
    .replace(/<[^>]+>/g,'');
  const d=document.createElement('textarea'); d.innerHTML=t; t=d.value;
  /* nogle etiketter har fået kopieret en hel draw.io-model med ind (%3CmxGraphModel…) */
  t=t.replace(/%3CmxGraphModel[\s\S]*$/i,'').replace(/\/\s*$/,'');
  return t.replace(/\u00a0/g,' ').replace(/[ \t]{2,}/g,'  ').replace(/\n{3,}/g,'\n\n').trim();
}

function dioStil(s){
  const o={};
  String(s||'').split(';').forEach(p=>{
    if(!p) return;
    const i=p.indexOf('=');
    if(i<0) o[p]=true; else o[p.slice(0,i)]=p.slice(i+1);
  });
  return o;
}

/* Læs hele filen og returnér siderne som figurer og streger */
async function dioLaesFil(xmlTekst){
  const doc=new DOMParser().parseFromString(xmlTekst,'text/xml');
  if(doc.querySelector('parsererror')) throw new Error('Filen er ikke gyldig draw.io.');
  let diagrammer=[...doc.getElementsByTagName('diagram')];
  if(!diagrammer.length && doc.getElementsByTagName('mxGraphModel').length)
    diagrammer=[{getAttribute:()=> 'Side 1', _model:doc.getElementsByTagName('mxGraphModel')[0]}];
  const sider=[];
  for(const d of diagrammer){
    let model=d._model || d.getElementsByTagName && d.getElementsByTagName('mxGraphModel')[0];
    if(!model){
      const indre=await dioUdpak(d.textContent);
      model=new DOMParser().parseFromString(indre,'text/xml').getElementsByTagName('mxGraphModel')[0];
    }
    if(!model) continue;
    const alle={};
    [...model.getElementsByTagName('mxCell')].forEach(c=>{
      const omslag=c.parentNode && /^(object|UserObject)$/i.test(c.parentNode.nodeName) ? c.parentNode : null;
      const id=(omslag&&omslag.getAttribute('id'))||c.getAttribute('id');
      alle[id]={c:c, id:id, parent:c.getAttribute('parent'),
                vaerdi:omslag?(omslag.getAttribute('label')||''):(c.getAttribute('value')||'')};
    });
    /* Figurer i en gruppe har koordinater i forhold til gruppen – læg dem sammen */
    const abs=function(id){
      let x=0,y=0,n=alle[id],vagt=0;
      while(n && n.id!=='0' && n.id!=='1' && vagt++<30){
        const g=n.c.getElementsByTagName('mxGeometry')[0];
        if(g && g.getAttribute('relative')!=='1'){ x+=+(g.getAttribute('x')||0); y+=+(g.getAttribute('y')||0); }
        n=alle[n.parent];
      }
      return {x:x,y:y};
    };
    const figurer=[], kanter=[];
    Object.values(alle).forEach(n=>{
      const c=n.c, stil=c.getAttribute('style')||'', g=c.getElementsByTagName('mxGeometry')[0];
      if(c.getAttribute('vertex')==='1' && g){
        /* etiketter på en streg hører til stregen, ikke som selvstændig figur */
        if(/^edgeLabel/.test(stil) || (alle[n.parent] && alle[n.parent].c.getAttribute('edge')==='1')) return;
        const p=abs(n.id);
        figurer.push({id:n.id, stil:dioStil(stil), raaStil:stil, tekst:dioTekst(n.vaerdi),
          x:p.x, y:p.y, w:+(g.getAttribute('width')||0), h:+(g.getAttribute('height')||0)});
      }else if(c.getAttribute('edge')==='1'){
        kanter.push({n:n, g:g});
      }
    });
    /* Stregerne: endepunkter fra deres figurer, eller fra de frie punkter */
    const midt=id=>{ const f=figurer.find(x=>x.id===id); return f?{x:f.x+f.w/2,y:f.y+f.h/2}:null; };
    const streger=kanter.map(function(k){
      const c=k.n.c, stil=dioStil(c.getAttribute('style')||'');
      const pkt={};
      if(k.g) [...k.g.getElementsByTagName('mxPoint')].forEach(p=>{
        const as=p.getAttribute('as'); if(as) pkt[as]={x:+(p.getAttribute('x')||0), y:+(p.getAttribute('y')||0)};
      });
      const fra=midt(c.getAttribute('source'))||pkt.sourcePoint, til=midt(c.getAttribute('target'))||pkt.targetPoint;
      if(!fra||!til) return null;
      const etiketter=[dioTekst(k.n.vaerdi)].concat(Object.values(alle)
        .filter(x=>x.parent===k.n.id).map(x=>dioTekst(x.vaerdi))).filter(Boolean);
      return {fra:fra, til:til, y:(fra.y+til.y)/2, x0:Math.min(fra.x,til.x), x1:Math.max(fra.x,til.x),
              tekst:etiketter.join(' ').trim(), stil:stil};
    }).filter(Boolean);
    sider.push({navn:(d.getAttribute('name')||('Side '+(sider.length+1))).trim(), figurer:figurer, streger:streger});
  }
  return sider;
}

/* Hvad er figuren? Mærket fra vores egen eksport vinder; ellers kigger vi på stilen */
function dioType(f){
  if(f.stil.sf) return f.stil.sf;
  const s=f.stil, fs=+(s.fontSize||0);
  if(s.text && fs>=20 && s.fontStyle==='1') return 'titel';
  if(s.rounded && s.arcSize==='4' && s.verticalAlign==='top' && fs===14) return 'boks';
  if(s.rounded && s.arcSize==='50' && fs===10) return 'transport';
  if(s.ellipse) return 'prik';
  if(s.text && fs===11 && s.fontStyle==='1') return 'grupperad';
  if(s.text && fs===10 && /3a3a3a/i.test(s.fontColor||'')) return 'kanal';
  if(s.text && fs===8) return 'txrx';
  return 'andet';
}


/* ── En håndtegnet signalflow i draw.io ─────────────────────────
   Mange har tegnet deres planer i draw.io, før SignalFlow fandtes. De er
   bygget på samme måde: en tekst til venstre (fødningen), en klamme om en
   bunke pile, en ellipse med transporten i midten, og en etiket på hver pil
   ("Ch. 1 Vært"). Den første etiket uden kanalnummer er gruppens navn. */
const DIO_KANAL=/^((?:ch\.?|kanal|kan\.?)\s*\d+|\d+\s*w\s*\d+|\d+)\b\s*[-:.]?\s*(.*)$/i;

function dioByggTegning(side){
  const F=side.figurer, S=side.streger.filter(x=>x.tekst);
  const sh=newSheet(side.navn);
  const brugt=new Set();
  const midtY=f=>f.y+f.h/2;
  const tekster=F.filter(f=>f.tekst && !f.stil.ellipse);

  /* Hvor ligger pilene? Det giver os venstre og højre side af tegningen. */
  const minX=Math.min(...S.map(x=>x.x0)), maxX=Math.max(...S.map(x=>x.x1));
  const forsteY=Math.min(...S.map(x=>x.y));

  /* Afsender og modtager: teksterne øverst til venstre og højre for pilene */
  /* Øverst = over den første pil, eller højst lidt nede i den. Venstre og
     højre afgøres i forhold til midten af tegningen, ikke pilenes ender –
     boksene står tit et stykke inde. */
  const midten=(minX+maxX)/2, kvart=(maxX-minX)/4;
  const oeverst=tekster.filter(f=>midtY(f)<=forsteY+15);
  const venstre=oeverst.filter(f=>f.x+f.w/2<midten-kvart).sort((a,b)=>a.y-b.y)[0];
  const hoejre =oeverst.filter(f=>f.x+f.w/2>midten+kvart).sort((a,b)=>a.y-b.y)[0];
  const overskrift=oeverst.filter(f=>f!==venstre && f!==hoejre)
    .sort((a,b)=>(b.w)-(a.w))[0];
  [venstre,hoejre,overskrift].forEach(f=>f&&brugt.add(f));

  const sc=newSection();
  sc.src=(venstre&&venstre.tekst)||'Afsender';
  sc.dst=(hoejre&&hoejre.tekst)||'Modtager';
  if(overskrift) sc.srcLines=[];          // overskriften lægges som tekstfelt nedenfor

  /* Grupper: helst ud fra klammerne. Pile uden for en klamme samles efter
     de lodrette mellemrum mellem dem. */
  const klammer=F.filter(f=>/curly/i.test(f.raaStil||'')).sort((a,b)=>a.y-b.y);
  const baand=klammer.map(k=>({top:k.y-6, bund:k.y+k.h+6, klamme:k, pile:[]}));
  const loese=[];
  S.slice().sort((a,b)=>a.y-b.y).forEach(function(p){
    const b=baand.find(b=>p.y>=b.top && p.y<=b.bund);
    if(b) b.pile.push(p); else loese.push(p);
  });
  /* løse pile: nyt bånd ved hvert spring på mere end 38 punkter */
  let cur=null;
  loese.forEach(function(p){
    if(!cur || p.y-cur.sidste>38){ cur={top:p.y-6, bund:p.y+6, pile:[], sidste:p.y}; baand.push(cur); }
    cur.pile.push(p); cur.bund=p.y+6; cur.sidste=p.y;
  });
  baand.sort((a,b)=>a.top-b.top);

  const ellipser=F.filter(f=>f.stil.ellipse && f.tekst);
  let kanaler=0;
  baand.filter(b=>b.pile.length).forEach(function(b){
    b.pile.sort((p,q)=>p.y-q.y);
    /* Fødningen: teksten til venstre for pilene, inden for båndet */
    const venstreGraense=b.klamme ? b.klamme.x+10 : Math.min(...b.pile.map(p=>p.x0))+10;
    const feed=tekster.filter(f=>!brugt.has(f) && f.x+f.w<=venstreGraense+40
        && midtY(f)>=b.top-20 && midtY(f)<=b.bund+20)
      .sort((p,q)=>Math.abs(midtY(p)-(b.top+b.bund)/2)-Math.abs(midtY(q)-(b.top+b.bund)/2))[0];
    if(feed) brugt.add(feed);
    /* Transporten: den ellipse, der dækker mest af båndet */
    const overlap=e=>Math.max(0,Math.min(e.y+e.h,b.bund)-Math.max(e.y,b.top));
    const tr=ellipser.slice().sort((p,q)=>overlap(q)-overlap(p))[0];

    /* Første etiket uden kanalnummer er gruppens navn */
    let navn=null;
    const forste=b.pile[0];
    if(forste && !DIO_KANAL.test(forste.tekst)){ navn=forste.tekst; b.pile=b.pile.slice(1); }
    const g=newGroup(navn || (feed&&feed.tekst) || 'Gruppe');
    g.feed=feed?feed.tekst:'';
    g.transport=(tr&&overlap(tr)>0)?tr.tekst:'';
    g.layer=/intercom|4w|conf/i.test(b.pile.map(p=>p.tekst).join(' '))?'intercom'
          :/ch\.?\s*\d/i.test(b.pile.map(p=>p.tekst).join(' '))?'lyd':'video';
    g.dir='ltr';
    g.channels=b.pile.map(function(p){
      const m=p.tekst.match(DIO_KANAL);
      const ch={id:id(), nr:m?m[1].replace(/\s+/g,' ').trim():'', label:m?m[2].trim():p.tekst, layer:g.layer};
      /* retningen af pilen: pilespids i begge ender = begge veje */
      const start=p.stil.startArrow && p.stil.startArrow!=='none';
      const slut=p.stil.endArrow!=='none';
      const venstreTilHoejre=p.fra.x<=p.til.x;
      if(start && slut) ch.dir='both';
      else if(start && !slut) ch.dir=venstreTilHoejre?'rtl':'ltr';
      else ch.dir=venstreTilHoejre?'ltr':'rtl';
      return ch;
    });
    kanaler+=g.channels.length;
    sc.groups.push(g);
  });
  sh.sections=[sc];

  /* Det, vi ikke kunne placere, kommer med som frie tekstfelter – så intet
     går tabt. De skaleres ned, så hele tegningen passer på arket. */
  const rest=tekster.filter(f=>!brugt.has(f)).concat(ellipser.filter(e=>!sc.groups.some(g=>g.transport===e.tekst)));
  const alleX=F.map(f=>f.x+f.w), bredde=Math.max(...alleX,1)-Math.min(...F.map(f=>f.x),0);
  const skala=Math.min(1, 1100/Math.max(bredde,1));
  const x0=Math.min(...F.map(f=>f.x),0), y0=Math.min(...F.map(f=>f.y),0);
  sh.items=rest.filter(f=>f.tekst).map(f=>({id:id(), type:'text',
    x:Math.round((f.x-x0)*skala)+20, y:Math.round((f.y-y0)*skala)+20,
    w:Math.max(120,Math.min(360,Math.round(f.w*skala)||160)), text:f.tekst}));
  if(overskrift) sh.items.unshift({id:id(), type:'text', x:420, y:14, w:420, text:overskrift.tekst});

  return {ark:sh, slags:'tegning', sektioner:1, grupper:sc.groups.length, kanaler:kanaler,
          frie:sh.items.length};
}

/* Byg ét SignalFlow-ark ud fra en side med figurer */
function dioByggArk(side){
  const F=side.figurer.map(f=>Object.assign(f,{type:dioType(f)}));
  const sh=newSheet(side.navn);
  const titel=F.find(f=>f.type==='titel');
  if(titel && titel.tekst) sh.title=titel.tekst;

  /* Bokse: afsender til venstre, modtager til højre. Uden mærker afgør x. */
  let bokse=F.filter(f=>f.type==='afsender'||f.type==='modtager'||f.type==='boks');
  if(bokse.some(b=>b.type==='boks')){
    const midt=bokse.reduce((a,b)=>a+b.x+b.w/2,0)/Math.max(1,bokse.length);
    bokse.forEach(b=>{ if(b.type==='boks') b.type=(b.x+b.w/2<midt)?'afsender':'modtager'; });
  }
  const afs=bokse.filter(b=>b.type==='afsender').sort((a,b)=>a.y-b.y);
  const mod=bokse.filter(b=>b.type==='modtager').sort((a,b)=>a.y-b.y);

  const kendt=afs.length>0;
  /* Ikke vores egen eksport – men er det en håndtegnet signalflow med pile? */
  if(!kendt && (side.streger||[]).filter(x=>x.tekst).length>=3) return dioByggTegning(side);
  if(!kendt){
    /* En almindelig draw.io-tegning: læg teksten ind som frie tekstfelter */
    const minX=Math.min(...F.map(f=>f.x),0), minY=Math.min(...F.map(f=>f.y),0);
    const maxX=Math.max(...F.map(f=>f.x+f.w),1);
    const k=Math.min(1, 1100/Math.max(maxX-minX,1));
    sh.items=F.filter(f=>f.tekst && f!==titel).map(f=>({
      id:id(), type:'text', x:Math.round((f.x-minX)*k)+20, y:Math.round((f.y-minY)*k)+20,
      w:Math.max(120,Math.min(420,Math.round(f.w*k)||200)), text:f.tekst
    }));
    sh.sections=[];
    return {ark:sh, slags:'fritekst', antal:sh.items.length};
  }

  const delBoks=t=>{
    const l=(t||'').split('\n');
    return {navn:(l.shift()||'').trim(),
            linjer:l.map(x=>x.trim()).filter(Boolean).map(x=>({id:id(),t:x}))};
  };
  let kanaler=0, grupper=0;
  afs.forEach(function(A,i){
    const top=A.y, bund=A.y+A.h;
    const M=mod.find(m=>Math.abs(m.y-top)<40) || mod[i] || null;
    const a=delBoks(A.tekst), m=M?delBoks(M.tekst):{navn:'',linjer:[]};
    /* newSection tager modtageren først – vi sætter felterne direkte, så der
       ikke kan ske en ombytning */
    const sc=newSection();
    sc.src=a.navn||'Afsender'; sc.dst=m.navn||'Modtager';
    sc.srcLines=a.linjer; sc.dstLines=m.linjer;
    SS(sc).srcW=Math.round(A.w)||190;
    if(M) SS(sc).dstW=Math.round(M.w)||210;
    const farve=(stil,felt)=>stil[felt]&&stil[felt]!=='none'?stil[felt]:null;
    if(farve(A.stil,'fillColor')) SS(sc).srcBg=A.stil.fillColor;
    if(farve(A.stil,'fontColor')) SS(sc).srcFg=A.stil.fontColor;
    if(M && farve(M.stil,'fillColor')) SS(sc).dstBg=M.stil.fillColor;
    if(M && farve(M.stil,'fontColor')) SS(sc).dstFg=M.stil.fontColor;

    /* Alt der står mellem boksenes top og bund hører til sektionen */
    const inde=F.filter(f=>f.y+f.h/2>=top-4 && f.y+f.h/2<=bund+4 && f!==A && f!==M);
    /* Gruppens hovedlinje: gruppenavn (højre) og fødning (venstre) på samme højde */
    const hoved=inde.filter(f=>f.type==='gruppe'||f.type==='feed'||f.type==='grupperad')
      .sort((p,q)=>p.y-q.y);
    const raekker=[];
    hoved.forEach(f=>{
      const cy=f.y+f.h/2;
      let r=raekker.find(r=>Math.abs(r.cy-cy)<8);
      if(!r){ r={cy:cy, del:[]}; raekker.push(r); }
      r.del.push(f);
    });
    raekker.sort((p,q)=>p.cy-q.cy);
    const kan=inde.filter(f=>f.type==='kanal').sort((p,q)=>p.y-q.y);
    const tt=inde.filter(f=>f.type==='transport');

    raekker.forEach(function(r,gi){
      const naeste=raekker[gi+1] ? raekker[gi+1].cy : bund+10;
      r.del.sort((p,q)=>p.x-q.x);
      /* uden mærker: den venstre er fødningen, den højre er gruppenavnet */
      let feed=r.del.find(f=>f.type==='feed'), navn=r.del.find(f=>f.type==='gruppe');
      if(!feed && !navn){ feed=r.del.length>1?r.del[0]:null; navn=r.del[r.del.length-1]; }
      const g=newGroup((navn&&navn.tekst)||'Gruppe');
      if(feed){
        g.feed=(feed.tekst||'').replace(/\s*·\s*BACKUP$/i,'').trim();
        if(/BACKUP$/i.test(feed.tekst||'') || feed.stil.sfrolle==='backup') g.role='backup';
        if(feed.stil.sflag) g.layer=feed.stil.sflag;
        if(feed.stil.sfdir) g.dir=feed.stil.sfdir;
      }
      const t=tt.find(x=>Math.abs(x.y+x.h/2-r.cy)<10);
      if(t && t.tekst && t.tekst!=='—') g.transport=t.tekst;
      const tx=inde.find(f=>(f.type==='tx'||f.type==='txrx') && f.y+f.h/2<r.cy && r.cy-(f.y+f.h/2)<18 && f.x<(navn?navn.x:1e9)-200);
      const rx=inde.find(f=>(f.type==='rx'||f.type==='txrx') && f!==tx && f.y+f.h/2<r.cy && r.cy-(f.y+f.h/2)<18);
      if(tx) g.tx=tx.tekst; if(rx) g.rx=rx.tekst;

      g.channels=kan.filter(k=>{ const cy=k.y+k.h/2; return cy>r.cy+4 && cy<naeste-2; }).map(function(k){
        let tekst=k.tekst||'';
        let rolle=k.stil.sfrolle||'';
        if(/\[B\]\s*$/.test(tekst)){ rolle='backup'; tekst=tekst.replace(/\s*\[B\]\s*$/,''); }
        /* "Ch. 1  Vært" – nummer og navn er adskilt af mindst to mellemrum */
        const dele=tekst.split(/\s{2,}/);
        const nr=dele.length>1?dele[0].trim():'';
        const lbl=dele.length>1?dele.slice(1).join(' ').trim():tekst.trim();
        const ch={id:id(), nr:nr, label:lbl, layer:k.stil.sflag||g.layer||'video'};
        if(k.stil.sfdir) ch.dir=k.stil.sfdir;
        if(rolle) ch.role=rolle;
        return ch;
      });
      kanaler+=g.channels.length; grupper++;
      sc.groups.push(g);
    });
    sh.sections.push(sc);
  });
  return {ark:sh, slags:F.some(f=>f.stil.sf)?'signalflow':'signalflow-gammel',
          sektioner:sh.sections.length, grupper:grupper, kanaler:kanaler};
}

         lægge importen ved siden af en tom skabelon. */
      /* Sammenlign indhold – ikke id'er, der er tilfældige hver gang */
      const indhold=sh=>JSON.stringify((sh.sections||[]).map(sc=>[sc.src,sc.dst,
        (sc.groups||[]).map(g=>[g.label,g.feed,(g.channels||[]).map(c=>[c.nr,c.label])])]));
      const urort = pages.length===1 && indhold(pages[0])===indhold(blank())
                    && !(pages[0].items||[]).length;
      const nye=valgte.map(r=>{ const a=r.ark; a.id=id(); a.mt=Date.now(); return a; });
      if(urort) pages=nye; else pages=pages.concat(nye);
      activePage = urort ? 0 : pages.length-nye.length;
      doc=pages[activePage]; path=[]; sel=null;
      closeModal(); draw();
      setSync('importeret '+nye.length+' side'+(nye.length===1?'':'r')+' fra draw.io');
    };
  });
}


/* ══════════════════════════════════════════════════════════════
   LÅS ARKET
   Når en plan er sendt videre, skal den ikke laves om ved et uheld. Låsen er
   en hængelås uden kode: den sidder på det enkelte ark, følger med når
   projektet deles, og kan låses op med ét klik (og et "er du sikker?").
   ══════════════════════════════════════════════════════════════ */
let laasUndtagelse=false;           // sat mens selve låsen skiftes
function arkLaast(i){
  const p=pages[i==null?activePage:i];
  return !!(p && p.laast);
}
function laasTekst(p){
  if(!p||!p.laast) return '';
  const d=new Date(p.laast.kl||0);
  const kl=isNaN(d)?'':d.toLocaleString('da-DK',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  return 'Låst'+(p.laast.af?' af '+p.laast.af:'')+(kl?' · '+kl:'');
}
function skiftLaas(){
  const p=pages[activePage]; if(!p) return;
  if(p.laast){
    if(!confirm('Lås "'+p.title+'" op, så arket kan rettes igen?\n\n'+laasTekst(p)))return;
  }
  laasUndtagelse=true;
  try{
    snap();
    if(p.laast) delete p.laast;
    else p.laast={af:meName()||'', kl:new Date().toISOString()};
  }finally{ laasUndtagelse=false; }
  sel=null; focus=null;
  draw();
  setSync(p.laast?'arket er låst':'arket er låst op');
}
/* Kort besked, når man prøver at rette et låst ark */
let laasBeskedTimer=null;
function laasBesked(){
  const b=document.getElementById('laasbanner'); if(!b) return;
  b.classList.remove('blink'); void b.offsetWidth; b.classList.add('blink');
  clearTimeout(laasBeskedTimer);
  laasBeskedTimer=setTimeout(()=>b.classList.remove('blink'),900);
}
/* Bliver man på et låst ark, må intet på arket kunne rettes – uanset hvor
   klikket rammer. Kun det at folde grupper sammen og ud er lovligt. */
['mousedown','click','dblclick','contextmenu'].forEach(function(typ){
  document.getElementById('sheet').addEventListener(typ, function(ev){
    if(view!=='flow' || !arkLaast()) return;
    if(ev.target.closest('[data-fold]')) return;
    if(ev.target.closest('a[href]')) return;
    ev.stopPropagation(); ev.preventDefault();
    if(typ==='click') laasBesked();
  }, true);
});


/* ══════════════════════════════════════════════════════════════
   IMPORTÉR INTERCOM-PANELER FRA EXCEL
   Et panel i regnearket er et navn i én celle med tasterne i rækkerne under
   (fx 4 × 6). Står der "2nd Panel" under, er det udvidelsespanelet. Noter
   ved siden af et panel kommer med som bemærkning, og en tabel med ALIAS og
   TYPE bruges til at farve tasterne (CONF / IFB).
   ══════════════════════════════════════════════════════════════ */

/* ── lille xlsx-læser: en xlsx er en zip med xml indeni ── */
async function xlsxLaes(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf);
  let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break} }
  if(eocd<0) throw new Error('Filen er ikke en xlsx-fil.');
  const antal=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true);
  const filer={};
  const dek=new TextDecoder();
  for(let n=0;n<antal;n++){
    const metode=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    const lokal=dv.getUint32(p+42,true);
    const navn=dek.decode(u8.subarray(p+46,p+46+nl));
    filer[navn]={metode, csize, lokal};
    p+=46+nl+el+cl;
  }
  const hent=async function(navn){
    const f=filer[navn]; if(!f) return null;
    const l=f.lokal, nl=dv.getUint16(l+26,true), el=dv.getUint16(l+28,true);
    const data=u8.subarray(l+30+nl+el, l+30+nl+el+f.csize);
    if(f.metode===0) return dek.decode(data);
    if(typeof DecompressionStream==='undefined') throw new Error('Din browser kan ikke læse xlsx. Kopiér cellerne fra Excel og sæt dem ind i stedet.');
    const s=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(s).text();
  };
  const xml=t=>new DOMParser().parseFromString(t,'text/xml');
  /* delte tekster */
  const delte=[];
  const ss=await hent('xl/sharedStrings.xml');
  if(ss) [...xml(ss).getElementsByTagName('si')].forEach(si=>{
    delte.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join(''));
  });
  /* første faneblad (eller det der hedder INTERCOM) */
  let arkSti='xl/worksheets/sheet1.xml';
  const wb=await hent('xl/workbook.xml'), rel=await hent('xl/_rels/workbook.xml.rels');
  if(wb && rel){
    const ark=[...xml(wb).getElementsByTagName('sheet')];
    const valgt=ark.find(a=>/intercom/i.test(a.getAttribute('name')||'')) || ark[0];
    const rid=valgt && (valgt.getAttribute('r:id')||valgt.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'));
    const r=[...xml(rel).getElementsByTagName('Relationship')].find(x=>x.getAttribute('Id')===rid);
    if(r){ const t=r.getAttribute('Target'); arkSti=t.startsWith('/')?t.slice(1):'xl/'+t.replace(/^\.\//,''); }
  }
  const sh=await hent(arkSti);
  if(!sh) throw new Error('Kunne ikke finde regnearket i filen.');
  const gitter=[];
  [...xml(sh).getElementsByTagName('c')].forEach(c=>{
    const ref=c.getAttribute('r')||''; const m=ref.match(/^([A-Z]+)(\d+)$/); if(!m) return;
    let col=0; for(const ch of m[1]) col=col*26+(ch.charCodeAt(0)-64);
    const row=+m[2], t=c.getAttribute('t');
    let v='';
    if(t==='s'){ const vv=c.getElementsByTagName('v')[0]; v=vv?(delte[+vv.textContent]||''):''; }
    else if(t==='inlineStr'){ v=[...c.getElementsByTagName('t')].map(x=>x.textContent).join(''); }
    else { const vv=c.getElementsByTagName('v')[0]; v=vv?vv.textContent:''; }
    v=String(v).trim(); if(!v) return;
    (gitter[row-1]||(gitter[row-1]=[]))[col-1]=v;
  });
  return gitter;
}

/* indsat fra Excel: tabulator mellem kolonner, linjeskift mellem rækker */
function ipTsvTilGitter(tekst){
  return tekst.replace(/\r/g,'').split('\n').map(l=>l.split('\t').map(c=>renCelleIP(c)));
}
function renCelleIP(c){
  c=(c==null?'':String(c)).trim();
  if(c.length>=2 && c[0]==='"' && c[c.length-1]==='"') c=c.slice(1,-1).replace(/""/g,'"');
  return c;
}

/* ── find paneler i gitteret ── */
function ipFindPaneler(g){
  const v=(r,c)=>((g[r]||[])[c]||'').trim();
  /* tomme rækker er huller i listen – regn bredden ud række for række */
  const rows=g.length;
  let cols=0; for(let i=0;i<rows;i++) cols=Math.max(cols,(g[i]||[]).length);
  const brugt=new Set(); const K=(r,c)=>r+':'+c;
  const er2nd=t=>/^2(nd|\.)?\s*panel/i.test(t);
  const tael=(r,c,w)=>{ let n=0; for(let i=0;i<w;i++) if(v(r,c+i)) n++; return n; };
  /* Blokkenes bredde findes ud fra, hvor panelnavnene står. Står de i B og I,
     er et panel 6 kolonner bredt med én tom kolonne imellem. En tom kolonne
     INDE i et panel betyder bare, at de taster ikke er i brug. */
  /* Et panelnavn: står alene (højst én note ved siden af), cellen til
     venstre er tom, og tasterne begynder i samme kolonne lige under. */
  const erNavn=function(r,c){
    const t=v(r,c); if(!t||er2nd(t)) return false;
    if(c>0 && v(r,c-1)) return false;
    if(!v(r+1,c) || er2nd(v(r+1,c))) return false;
    let under=0, ved=0;
    for(let i=0;i<6;i++){ if(v(r+1,c+i)) under++; if(i>0&&v(r,c+i)) ved++; }
    return under>=2 && ved<=1;
  };
  /* "2nd Panel" står altid i blokkens første kolonne – det er det sikreste
     anker for, hvor panelerne begynder. Findes den ikke, bruger vi navnene. */
  const navneKol=new Set();
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(er2nd(v(r,c))) navneKol.add(c);
  const ankret=navneKol.size>0;
  if(!ankret) for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(erNavn(r,c)) navneKol.add(c);
  const ks=[...navneKol].sort((a,b)=>a-b), huller=[];
  for(let i=1;i<ks.length;i++) if(ks[i]-ks[i-1]>=3) huller.push(ks[i]-ks[i-1]);
  const W=huller.length ? Math.max(1,Math.min(16,Math.min(...huller)-1)) : 6;
  const paneler=[], noter=[];
  /* 1) alias-tabel: en række med ALIAS og TYPE */
  const typer={}; let tabel=null;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if(/^alias$/i.test(v(r,c)) && /^type$/i.test(v(r,c+1))){
      const hoved=[]; for(let i=0;i<8&&v(r,c+i);i++) hoved.push(v(r,c+i));
      tabel={r,c,hoved,rk:[]};
      /* læs rækkerne under – en enkelt tom række imellem er tilladt */
      let rr=r+1, tomme=0;
      while(rr<rows){
        if(!v(rr,c)){ if(++tomme>1) break; rr++; continue; }
        tomme=0;
        const linje=hoved.map((_,i)=>v(rr,c+i)); tabel.rk.push(linje);
        typer[ipNorm(linje[0])]=(linje[1]||'').toUpperCase();
        for(let i=0;i<hoved.length;i++) brugt.add(K(rr,c+i));
        rr++;
      }
      for(let i=0;i<hoved.length;i++) brugt.add(K(r,c+i));
      /* tabellens overskrift står typisk lige over */
      for(let op=1;op<=3;op++) if(v(r-op,c)&&tael(r-op,c,6)===1){ tabel.titel=v(r-op,c); brugt.add(K(r-op,c)); break; }
    }
  }
  /* 2) læs et gitter af taster fra (r,c) og nedad */
  const laesTaster=function(r0,c){
    const rk=[];
    let r=r0;
    /* tæl kun celler i selve blokken, der ikke allerede er brugt */
    const fri=(rr,cc,w)=>{ let n=0; for(let i=0;i<w;i++) if(v(rr,cc+i)&&!brugt.has(K(rr,cc+i))) n++; return n; };
    while(r<rows && rk.length<8){
      if(er2nd(v(r,c))) break;
      if(fri(r,c,W)===0) break;
      /* Et panel slutter ved en tom række eller "2nd Panel" – ikke ved en
         række, der tilfældigvis ligner et navn (fx "A KEY GROUP 3" med én
         tast ved siden af). */
      rk.push(r); r++;
    }
    if(!rk.length) return null;
    const bredde=W;             // hele blokken – så tasterne står på deres rigtige plads
    const taster=[]; const note=[];
    rk.forEach(rr=>{
      for(let i=0;i<bredde;i++){ taster.push(v(rr,c+i)); brugt.add(K(rr,c+i)); }
      /* tekst i skillekolonnen lige efter blokken er en note til panelet */
      if(v(rr,c+bredde)&&!brugt.has(K(rr,c+bredde))&&!navneKol.has(c+bredde)){ note.push(v(rr,c+bredde)); brugt.add(K(rr,c+bredde)); }
    });
    return {raekker:rk.length, kolonner:bredde, taster, note, slut:r};
  };
  /* 3) paneler: en navnecelle med en fuld række taster under */
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const t=v(r,c);
    if(!t||brugt.has(K(r,c))||er2nd(t)) continue;
    if(!erNavn(r,c)) continue;
    if(ankret && !navneKol.has(c)) continue;         // står ikke i en blokkolonne
    const hoved=laesTaster(r+1,c); if(!hoved) continue;
    brugt.add(K(r,c));
    const note=[...hoved.note];
    for(let i=1;i<W;i++) if(v(r,c+i)&&!brugt.has(K(r,c+i))){ note.push(v(r,c+i)); brugt.add(K(r,c+i)); }
    const p={navn:t, r:r, c:c, hoved:hoved, note:note, ekstra:null};
    if(er2nd(v(hoved.slut,c))){
      brugt.add(K(hoved.slut,c));
      const ek=laesTaster(hoved.slut+1,c);
      if(ek){ p.ekstra=ek; p.note.push(...ek.note); }
    }
    paneler.push(p);
  }
  /* 4) alt andet er noter; en tekst med linjeskift øverst er typisk arkets titel */
  /* Titlen er den tekst øverst i arket, der mest ligner en overskrift –
     flest store bogstaver. En instruks med et enkelt ord i versaler er ikke titlen. */
  let titel='', titelK='';
  const store=t=>{ const b=(t.match(/[a-zæøåA-ZÆØÅ]/g)||[]).length; return b?(t.match(/[A-ZÆØÅ]/g)||[]).length/b:0; };
  let bedst=0.6;
  for(let r=0;r<Math.min(rows,6);r++) for(let c=0;c<cols;c++){
    const t=v(r,c); if(!t||brugt.has(K(r,c))||t.length<10) continue;
    if(store(t)>bedst){ bedst=store(t); titel=t; titelK=K(r,c); }
  }
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const t=v(r,c); if(!t||brugt.has(K(r,c))||K(r,c)===titelK) continue;
    noter.push({t:t, r:r, c:c});
  }
  return {paneler, noter, tabel, typer, titel};
}

function ipNorm(t){ return (t||'').toLowerCase().replace(/\b(ifb|conf|fonf|cf)\b/g,'').replace(/[^a-z0-9æøå]/g,''); }

/* farve efter type: tabellen først, ellers endelsen på tasten */
const IP_FARVE={CONF:'#1e3a5f', IFB:'#8a5a00'};
function ipTypeFor(tekst, typer){
  const n=ipNorm(tekst);
  if(n && typer[n]) return typer[n];
  if(/\bifb\b|\bfib\b/i.test(tekst)) return 'IFB';
  if(/\bconf\b|\bfonf\b|\bcf\b/i.test(tekst)) return 'CONF';
  return '';
}

function ipByggPanel(navn, g, typer, farv){
  return {id:id(), type:'panel', x:0, y:0, w:Math.max(260, g.kolonner*56+40), title:navn,
    prows:g.raekker, pcols:g.kolonner, scale:1, keyColor:'#2e2e2e',
    net:{alias:''}, keys:g.taster.map(t=>{
      const ty=farv?ipTypeFor(t,typer):'';
      return {t:t, c:(ty&&IP_FARVE[ty])||''};
    })};
}

/* Placer panelerne pænt: hovedpanel og 2nd panel side om side, to par pr.
   række, og noterne til sidst. Højderne måles på de tegnede paneler. */
function ipLayout(){
  const L=IP.layout; if(!L) return;
  const hoejde=it=>{ const n=el.querySelector('[data-item="'+it.id+'"]'); return n?n.offsetHeight:300; };
  const breddeArk=el.clientWidth||1300;
  let x=20, y=L.start, raekkeH=0;
  L.par.forEach(function(pp){
    const [h,e]=pp;
    const parB=h.w+(e?e.w+16:0);
    if(x>20 && x+parB>breddeArk-20){ x=20; y+=raekkeH+34; raekkeH=0; }
    h.x=x; h.y=y;
    if(e){ e.x=x+h.w+16; e.y=y; }
    raekkeH=Math.max(raekkeH, hoejde(h), e?hoejde(e):0);
    x+=parB+40;
  });
  y+=raekkeH+40; x=20;
  L.noter.forEach(function(n){
    n.x=x; n.y=y; delete n._note;
    x+=n.w+30; if(x>breddeArk-380){ x=20; y+=160; }
  });
  IP.layout=null;
}


/* ══════════════════════════════════════════════════════════════
   IMPORTÉR PLAN FRA FIL
   Læser vores egen csv-eksport tilbage, et Excel-ark, eller en liste fra et
   andet system. Kolonnerne genkendes på deres overskrifter – både danske og
   engelske – og man ser altid, hvad der bliver oprettet, før det sker.
   ══════════════════════════════════════════════════════════════ */

let KI={rk:[], kol:{}, forhaand:[]};

/* Excel gemmer ofte csv i windows-1252. Læser vi den som UTF-8, bliver æ, ø
   og å til spørgsmålstegn – så prøver vi det andet tegnsæt. */
async function kiFilTekst(f){
  const buf=await f.arrayBuffer();
  try{
    const t=new TextDecoder('utf-8',{fatal:true}).decode(buf);
    return t;
  }catch(e){
    return new TextDecoder('windows-1252').decode(buf);
  }
}
function kiDelTekst(tekst){
  const linjer=tekst.replace(/\r/g,'').split('\n').filter(l=>l.trim().length);
  if(!linjer.length) return [];
  const tael=(l,c)=>l.split(c).length-1;
  const h=linjer[0];
  const sep = tael(h,'\t')>0 ? '\t' : (tael(h,';')>=tael(h,',') ? ';' : ',');
  /* en celle kan indeholde skilletegnet, hvis den står i anførselstegn */
  const del=function(l){
    const ud=[]; let c='', inde=false;
    for(let i=0;i<l.length;i++){
      const t=l[i];
      if(t==='"'){ if(inde&&l[i+1]==='"'){c+='"';i++} else inde=!inde; continue }
      if(t===sep && !inde){ ud.push(c); c=''; continue }
      c+=t;
    }
    ud.push(c);
    return ud.map(x=>x.trim());
  };
  return linjer.map(del);
}

/* find kolonnerne ud fra overskrifterne */
function kiKolonner(hoved){
  const h=hoved.map(x=>(x||'').toLowerCase().replace(/\s+/g,' ').trim());
  const find=(...ord)=>h.findIndex(c=>ord.some(o=>c===o||c.startsWith(o)));
  return {
    dom:   find('domæne','domaene','domain','område','omraade'),
    udstyr:find('udstyr','device','equipment','enhed','rack','system'),
    sted:  find('placering','sted','location','place','position i vogn'),
    side:  find('side','retning','i/o','in/out','type i/o'),
    nr:    find('nr','no','ch','kanal nr','kanal','channel','port'),
    freq:  find('frekvens','mhz','frequency'),
    label: find('signal / bruger','signal','bruger','label','navn på signal','beskrivelse','description','name'),
    ftype: find('type'),
    patch: find('patchet','patched','sat op'),
    tjek:  find('tjekket','checked','afprøvet','afproevet'),
    af:    find('sat af','af','by','initialer')
  };
}

const KI_DOM={lyd:'lyd',audio:'lyd',video:'video',net:'net','netværk':'net',netvaerk:'net',network:'net',
  data:'net',freq:'freq',frekvens:'freq',frekvenser:'freq',rf:'freq',frequency:'freq'};



/* Stil de nyimporterede kort op i rækker uden overlap. Højden måles på de
   tegnede kort, så et kort med 30 linjer ikke lægger sig oven på det næste. */
function kiStilOp(navne){
  const d0=ensurePlan()[planDom]; if(!d0) return;
  const kort=alive(d0.devices||[]).filter(d=>navne.indexOf((d.name||'').toLowerCase())>=0);
  if(!kort.length) return;
  const maal=d=>{
    const n=document.querySelector('[data-dev="'+d.id+'"]');
    return n?{b:n.offsetWidth, h:n.offsetHeight}:{b:CARDW, h:260};
  };
  const hoejde=d=>maal(d).h, bredde=d=>maal(d).b;
  const andre=alive(d0.devices||[]).filter(d=>kort.indexOf(d)<0);
  let y=20;
  andre.forEach(d=>{ y=Math.max(y,(d.y||0)+hoejde(d)+30); });   // under det der var i forvejen
  let x=20, raekkeH=0;
  const maxB=3*(CARDW+60);
  kort.forEach(function(d){
    const b=bredde(d);
    if(x>20 && x+b>maxB){ x=20; y+=raekkeH+34; raekkeH=0; }
    d.x=x; d.y=y;
    raekkeH=Math.max(raekkeH, hoejde(d));
    x+=b+40;                       // den målte bredde, ikke et gæt
  });
}


/* ── Kameraopsæt i et regneark ─────────────────────────────────
   Én række pr. kamera: nummer, type, source, placering og fire lydkanaler.
   Hvert kamera bliver et kort med fire kanaler, hvor de to sidste er AES –
   samme navngivning som på stageboksene. */
function kiFindKameraer(g){
  const v=(r,c)=>((g[r]||[])[c]||'').toString().trim();
  const rows=g.length; let cols=0; for(let i=0;i<rows;i++) cols=Math.max(cols,(g[i]||[]).length);
  let hr=-1, c0=-1;
  for(let r=0;r<rows && hr<0;r++) for(let c=0;c<cols;c++){
    if(/^(camera|kamera)\s*(nr|no|nummer)?$/i.test(v(r,c))){ hr=r; c0=c; break; }
  }
  if(hr<0) return null;
  /* kolonnerne: type, source, placering, og de nummererede lydkanaler */
  const K={nr:c0, type:-1, source:-1, sted:-1, retur:-1, kanaler:[]};
  for(let c=c0+1;c<Math.min(cols,c0+14);c++){
    const t=v(hr,c).toLowerCase();
    if(!t) continue;
    if(/^type/.test(t) && K.type<0) K.type=c;
    else if(/^(source|kilde|ccu)/.test(t) && K.source<0) K.source=c;
    else if(/^(placering|position|sted|location)/.test(t) && K.sted<0) K.sted=c;
    else if(/^(retur|return|tb|talkback)/.test(t)) K.retur=c;
    else if(/^\d+$/.test(t)) K.kanaler.push(c);
  }
  if(!K.kanaler.length) return null;
  const kort=[];
  for(let r=hr+1;r<rows;r++){
    const nr=v(r,K.nr);
    if(!nr){ if(!v(r,K.type>=0?K.type:K.nr+1) && !v(r,K.sted>=0?K.sted:K.nr+2)) continue; }
    const type=K.type>=0?v(r,K.type):'', src=K.source>=0?v(r,K.source):'', sted=K.sted>=0?v(r,K.sted):'';
    if(!nr && !type && !sted) continue;
    const navn=(/^\d+$/.test(nr)?'Kamera '+nr:(nr||'Kilde'))+(type?' · '+type:'');
    /* 1 og 2 er mic/line, 3 og 4 er AES-parret. Står der noget på 3 eller 4,
       er AES i brug, og så udgår kanal 2. */
    /* To analoge spor som standard. Står der noget i kolonne 3 eller 4, har
       kameraet også AES-parret, og så kommer de med som AES-linjer. */
    const brugt=K.kanaler.map(c=>v(r,c));
    const harAes=brugt.slice(2).some(x=>x);
    const antal=harAes?Math.max(4,brugt.length):2;
    const ins=[];
    for(let i=0;i<antal;i++) ins.push({n:String(i+1), label:brugt[i]||'', freq:'', ftype:'',
      kamtype:(harAes&&i>=2)?'aes':'mic', patched:false, checked:false, by:''});
    const outs=[];
    if(K.retur>=0 && v(r,K.retur)) outs.push({n:'1', label:v(r,K.retur), freq:'', ftype:'', patched:false, checked:false, by:''});
    kort.push({dom:'kam', navn:navn, sted:[sted,src].filter(Boolean).join(' · '), ins, outs});
  }
  return kort.length?kort:null;
}

/* ── Regneark med blokke ved siden af hinanden ─────────────────
   Mange lydplaner er bygget som et stort ark: en stageboks pr. blok, hver
   med sine egne kolonner (kanal · Navn · Source) og både Inputs og Outputs.
   Vi finder blokkene ved at lede efter den samme kolonneoverskrift flere
   gange i samme række. */
const KI_NR=/^(kanal|kanal nr|nr\.?|no\.?|ch\.?|channel|port|nummer|input|in)$/i;
const KI_NAVN=/^(navn|signal|name|beskrivelse|label|kilde|indhold|source|description)$/i;
const KI_SIDE=/^(inputs?|outputs?|ind|ud|udgange|indgange)$/i;

function kiFindBlokke(g){
  const v=(r,c)=>((g[r]||[])[c]||'').toString().trim();
  const rows=g.length; let cols=0; for(let i=0;i<rows;i++) cols=Math.max(cols,(g[i]||[]).length);
  /* 1. rækker der er overskrifter for flere blokke */
  const hoveder=[];
  for(let r=0;r<rows;r++){
    const start=[];
    for(let c=0;c<cols;c++) if(KI_NR.test(v(r,c)) && KI_NAVN.test(v(r,c+1))) start.push(c);
    if(start.length>=2) hoveder.push({r, start});
  }
  if(!hoveder.length) return null;
  const bredde=(()=>{ const h=hoveder[0].start; return h.length>1 ? h[1]-h[0] : 4 })();
  const blokke=[]; const titler={};
  hoveder.forEach(function(h){
    h.start.forEach(function(c){
      /* 2. Hvilken side (Inputs/Outputs) står lige over overskriften.
         Titlen står kun ved den ØVERSTE overskrift – den husker vi pr.
         kolonne, så Outputs-delen får samme navn som Inputs-delen og ikke
         kommer til at hedde det samme som den sidste datarække ovenfor. */
      let side='ins';
      for(let i=0;i<bredde;i++){
        const t=v(h.r-1, c+i);
        if(t && KI_SIDE.test(t)){ side=/out|ud/i.test(t)?'outs':'ins'; break; }
      }
      let navn=titler[c]||'';
      if(!navn){
        for(let op=1; op<=6 && h.r-op>=0; op++){
          for(let i=0;i<bredde;i++){
            const t=v(h.r-op, c+i);
            if(!t || KI_SIDE.test(t) || KI_NR.test(t) || KI_NAVN.test(t)) continue;
            navn=t; break;
          }
          if(navn) break;
        }
        if(navn) titler[c]=navn;
      }
      /* 3. linjerne under overskriften */
      const linjer=[];
      for(let r=h.r+1; r<rows; r++){
        let tomme=0; for(let i=0;i<bredde;i++) if(!v(r,c+i)) tomme++;
        if(tomme===bredde) break;
        if(KI_SIDE.test(v(r,c))) break;                       // næste afsnit begynder
        if(KI_NR.test(v(r,c)) && KI_NAVN.test(v(r,c+1))) break;
        const nr=v(r,c), nv=v(r,c+1), kilde=bredde>2?v(r,c+2):'';
        if(!nr && !nv && !kilde) continue;
        linjer.push({n:nr, label:nv || kilde, kilde:(nv&&kilde)?kilde:''});
      }
      if(linjer.length) blokke.push({navn:navn||('Blok '+(blokke.length+1)), side, linjer});
    });
  });
  if(!blokke.length) return null;
  /* 4. saml Inputs og Outputs for samme navn i ét kort */
  const kort={}, raekkef=[];
  blokke.forEach(function(b){
    const k=b.navn.toLowerCase();
    /* Blokke med kanal/navn/kilde er en lydplan. Står man i Kameraer eller
       Frekvenser, hører de alligevel hjemme under Lyd. */
    if(!kort[k]){ kort[k]={dom:(planDom==='kam'||planDom==='freq')?'lyd':planDom,
      navn:b.navn, sted:'', ins:[], outs:[]}; raekkef.push(k); }
    b.linjer.forEach(l=>kort[k][b.side].push({
      n:l.n, label:l.label+(l.kilde?' · '+l.kilde:''), freq:'', ftype:'',
      patched:false, checked:false, by:''
    }));
  });
  return raekkef.map(k=>kort[k]);
}

function kiLaes(gitter){
  if(!gitter.length) return {fejl:'Filen er tom.'};
  /* Er arket bygget som blokke ved siden af hinanden, læser vi det sådan */
  const blokke=kiFindBlokke(gitter);
  const kam=kiFindKameraer(gitter);
  if(blokke && blokke.length>=2) return {liste:blokke.concat(kam||[]), form:'blokke'};
  if(kam) return {liste:kam, form:'kameraer'};
  const kol=kiKolonner(gitter[0]);
  if(kol.udstyr<0 && kol.nr<0 && kol.label<0)
    return {fejl:'Kunne ikke genkende kolonnerne. Der skal mindst være en kolonne med udstyr, nummer eller signal.'};
  const v=(r,i)=>(i>=0?(r[i]||'').trim():'');
  const ja=t=>/^(ja|x|✓|yes|true|1)$/i.test((t||'').trim());
  const kort={}; const raekkef=[];
  for(let i=1;i<gitter.length;i++){
    const r=gitter[i];
    if(!r.join('').trim()) continue;
    const navn=v(r,kol.udstyr) || v(r,kol.sted) || 'Uden navn';
    let d=(v(r,kol.dom)||'').toLowerCase();
    d=KI_DOM[d]|| (v(r,kol.freq)?'freq':planDom);
    const n=v(r,kol.nr), lbl=v(r,kol.label), fq=v(r,kol.freq);
    if(!n && !lbl && !fq) continue;                     // en tom linje
    const key=d+'|'+navn;
    if(!kort[key]){ kort[key]={dom:d, navn:navn, sted:v(r,kol.sted)===navn?'':v(r,kol.sted), ins:[], outs:[]}; raekkef.push(key); }
    const ud=/^(out|ud|udgang|output)/i.test(v(r,kol.side)) && d!=='freq';
    (ud?kort[key].outs:kort[key].ins).push({
      n:n, label:lbl, freq:fq.replace(',','.'), ftype:v(r,kol.ftype),
      patched:ja(v(r,kol.patch)), checked:ja(v(r,kol.tjek)), by:v(r,kol.af)
    });
  }
  const liste=raekkef.map(k=>kort[k]);
  if(!liste.length) return {fejl:'Fandt ingen linjer med indhold.'};
  return {liste, kol};
}

   </div>

      KI.forhaand=r.liste;

        .forEach(d=>findes.add(k+'|'+(d.name||'').toLowerCase())));

      vis.innerHTML=`<div class="imp-status"><b>${KI.forhaand.length}</b> kort · <b>${linjer}</b> linjer`
        +(r.form==='blokke'?' <em style="color:var(--faint)">(ark med blokke ved siden af hinanden)</em>':'')
        +(dub?` · <span class="imp-mangler">${dub} findes allerede – linjerne lægges til</span>`:'')+`</div>
        <div class="dio-liste">${KI.forhaand.map(k=>`<div class="dio-side">
          <b>${esc(k.navn)}${k.sted?' · '+esc(k.sted):''}</b>
          <span>${PLANDOMS[k.dom]||k.dom} · ${k.ins.length} ${k.dom==='freq'?'frekvenser':'input'}${k.outs.length?' · '+k.outs.length+' output':''}
          ${findes.has(k.dom+'|'+k.navn.toLowerCase())?' <em>(findes – lægges til)</em>':''}</span></div>`).join('')}</div>`;
      root.querySelector('#kiOk').disabled=false;
    };
    root.querySelector('#kiFil').onchange=async function(){
      const f=this.files&&this.files[0]; if(!f) return;
      vis.innerHTML='<div class="hint">Læser filen …</div>';
      try{
        if(/\.xlsx?$/i.test(f.name)) brug(await xlsxLaes(await f.arrayBuffer()));
        else if(/\.pdf$/i.test(f.name))
          vis.innerHTML='<div class="imp-tom">En pdf kan ikke læses direkte. Åbn den, markér tabellen, '
            +'kopiér og sæt ind i feltet nedenfor – eller gem den som csv fra det program, den kom fra.</div>';
        else brug(kiDelTekst(await kiFilTekst(f)));
      }catch(e){ vis.innerHTML='<div class="imp-tom">'+esc(e.message||String(e))+'</div>'; }
    };
    root.querySelector('#kiTekst').addEventListener('input',function(){
      if(this.value.trim().length>10) brug(kiDelTekst(this.value));
    });
    root.querySelector('#kiOk').onclick=function(){
      snap();
      const p=ensurePlan();
      let nye=0, lagt=0;
      KI.forhaand.forEach(function(k){
        const d0=p[k.dom]||(p[k.dom]={devices:[]});
        let dv=alive(d0.devices||[]).find(x=>(x.name||'').toLowerCase()===k.navn.toLowerCase());

          dv={id:id(), name:k.navn, place:k.sted||'', mt:Date.now(),
              x:20+(d0.devices.length%3)*(CARDW+30), y:20+Math.floor(d0.devices.length/3)*320,
              ins:[], outs:[]};
          d0.devices.push(dv); nye++;
        }else if(k.sted && !dv.place) dv.place=k.sted;
        ['ins','outs'].forEach(function(side){
          k[side].forEach(function(l){
            /* findes linjen i forvejen (samme nummer), rettes den i stedet */
            let p2=alive(dv[side]).find(x=>x.n && l.n && x.n===l.n);
            if(!p2){ p2={id:id(), n:l.n, label:'', by:'', at:0}; dv[side].push(p2); }
            p2.label=l.label||p2.label;
            if(l.freq) p2.freq=l.freq;
            if(l.ftype) p2.ftype=l.ftype;
            if(l.kamtype) p2.kamtype=l.kamtype;     // mic/line eller AES på et kamera
            if(l.patched) p2.patched=true;
            if(l.checked) p2.checked=true;
            p2.by=l.by||meName(); p2.at=Date.now();
            lagt++;
          });
        });
        dv.mt=Date.now();
      });
      const tael={}; KI.forhaand.forEach(k=>tael[k.dom]=(tael[k.dom]||0)+1);
      closeModal(); markDirty();
      /* Kortenes højde og bredde kender vi først, når de er tegnet. Derfor
         tegner vi hvert berørt område og stiller kortene op bagefter – ellers
         ville kun det område, man ender i, blive stillet pænt op. */
      const start=planDom;
      Object.keys(tael).forEach(function(d){
        planDom=d; drawPlan();
        kiStilOp(KI.forhaand.filter(k=>k.dom===d).map(k=>k.navn.toLowerCase()));
      });
      /* vis det område, der kom mest ind i */
      planDom=Object.keys(tael).sort((a,b)=>tael[b]-tael[a])[0]||start;
      drawPlan();
      setSync('importeret '+lagt+' linjer'+(nye?' på '+nye+' nye kort':''));
    };
  });
}

/* ---- ryd udskriften væk igen ----
   På en computer står JavaScript stille, mens printvinduet er åbent, så en
   timer på et halvt sekund var nok. På iPhone vender window.print() tilbage
   med det samme, og PDF'en dannes bagefter – så nåede vi at slette indholdet,
   og siden blev blank. Nu ryddes der først, når udskriften er færdig. */

/* ---- udskrift på telefon ----
   Safari på iPhone danner PDF'en efter at window.print() er vendt tilbage, og
   den kan ikke holde på indholdet. Derfor bygger vi i stedet et selvstændigt
   dokument og åbner det i en ny fane. Så trykker man på del-knappen og vælger
   Print – og siden kan ikke nå at forsvinde. */
function aabnUdskriftSomSide(titel){
 const rod=document.getElementById('printroot');
 if(!rod||!rod.innerHTML.trim())return false;
 let css='';
 document.querySelectorAll('style').forEach(st=>{css+=st.textContent+'\n'});
 const doc='<!DOCTYPE html><html lang="da"><head><meta charset="utf-8">'
  +'<meta name="viewport" content="width=device-width,initial-scale=1">'
  +'<title>'+esc(rentNavn(titel)||'SignalFlow')+'</title><style>'+css
  +'\n/* dokumentet ER udskriften, så den vises også på skærmen */\n'
  +'body{margin:0;background:#555;-webkit-text-size-adjust:100%}\n'
  +'#printroot{display:block!important;transform-origin:top left}\n'
  +'.psheet{background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.35);margin:0 0 12px}\n'
  +'#hjaelp{position:sticky;top:0;z-index:9;background:#111a24;color:#e8eef5;'
  +'font:13px/1.5 -apple-system,system-ui,sans-serif;padding:10px 14px;text-align:center}\n'
  +'#hjaelp b{color:#3fd99c}\n'
  +'@media print{body{background:#fff}#hjaelp{display:none}'
  +'#printroot{transform:none!important;width:auto!important}'
  +'.psheet{box-shadow:none;margin:0}}\n'
  +'</style></head><body>'
  +'<div id="hjaelp">Tryk på <b>del-knappen</b> forneden og vælg <b>Udskriv</b> · '
  +'vælg <b>A3</b> og <b>liggende</b>, og gem som PDF</div>'
  +'<div id="printroot">'+rod.innerHTML+'</div>'
  +'<script>(function(){var r=document.getElementById("printroot");'
  +'function fit(){var a=r.firstElementChild;if(!a)return;'
  +'var w=a.offsetWidth||a.getBoundingClientRect().width;if(!w)return;'
  +'var k=Math.min(1,(window.innerWidth-12)/w);'
  +'r.style.width=w+"px";r.style.transform="scale("+k+")";'
  +'document.body.style.height=(r.scrollHeight*k+90)+"px"}'
  +'window.addEventListener("resize",fit);setTimeout(fit,60);fit()})();<\/script>'
  +'</body></html>';
 try{
  const blob=new Blob([doc],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const w=window.open(url,'_blank');
  if(!w)return false;                       // blokeret – så gør vi som før
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  return true;
 }catch(e){ return false }
}
/* Én vej ud for alle tre udskrifter. */
function udskriv(navn){
 if(mobil && aabnUdskriftSomSide(navn)){
  setSync('udskriften er åbnet i en ny fane');
  const r=document.getElementById('printroot');
  setTimeout(()=>{if(r)r.innerHTML=''},1500);
  return;
 }
 printSom(navn,()=>window.print());
 rydEfterPrint();
}

let printRydTimer=null;
function rydEfterPrint(){
 clearTimeout(printRydTimer);
 const ryd=()=>{
  clearTimeout(printRydTimer);
  const r=document.getElementById('printroot');
  if(r)r.innerHTML='';
  window.removeEventListener('afterprint',ryd);
  if(mq&&mq.removeEventListener)mq.removeEventListener('change',vedSkift);
 };
 const vedSkift=e=>{ if(!e.matches)ryd() };      // vi forlod print-visningen
 const mq=window.matchMedia?window.matchMedia('print'):null;
 window.addEventListener('afterprint',ryd);
 if(mq&&mq.addEventListener)mq.addEventListener('change',vedSkift);
 printRydTimer=setTimeout(ryd,120000);            // nødbremse efter to minutter
}


/* ---- navngivning af udskrifter og filer ----
   Browseren foreslår sidens titel som filnavn, når man gemmer som PDF.
   Derfor sætter vi titlen til det, udskriften faktisk er. */
function rentNavn(t){
 return String(t||'').replace(/[^\wæøåÆØÅ .·–-]/g,'').replace(/\s+/g,' ').trim();
}
const BASISTITEL=document.title||'SignalFlow';
function printSom(titel,gør){
 document.title=rentNavn(titel)||BASISTITEL;
 try{ gør() } finally {
  /* altid tilbage til programmets egen titel – ikke til en tidligere udskrift */
  setTimeout(()=>{document.title=BASISTITEL},1500);
 }
}


/* Tegn en vilkårlig side som HTML uden at forstyrre det brugeren ser.
   Gemmer al tilstand, tegner, læser markuppen, og sætter alt tilbage. */

 const sP=activePage,sD=doc,sPath=path,sSel=sel,sFocus=focus,sOn=new Set(on),sB=backupOn;
 if(allLayers){on=new Set(['video','lyd','intercom','net']);backupOn=true}
 activePage=pi;doc=pages[pi];path=[];sel=null;focus=null;
 draw(true);

/* Papirstørrelser i mm: p = den korte side, l = den lange.
   Navnene A2, A1 og A0 kender browseren IKKE – skriver man "size:A1", falder
   Chrome tilbage til Letter uden at sige noget. Derfor skriver vi altid
   målene i mm, og så kan arket blive lige så stort, man vil. */
const PAPER={A5:{p:148,l:210},A4:{p:210,l:297},A3:{p:297,l:420},A2:{p:420,l:594},
 A1:{p:594,l:841},A0:{p:841,l:1189},Letter:{p:215.9,l:279.4},Tabloid:{p:279.4,l:431.8}};
const mmPx=v=>v*96/25.4;
/* "420mm 297mm" i stedet for "A3 landscape" – se kommentaren over PAPER. */
function vendtPapir(navn,retning){
 const p=PAPER[navn]||PAPER.A3;
 return retning==='portrait' ? p.p+'mm '+p.l+'mm' : p.l+'mm '+p.p+'mm';
}

/* ── Udskrift af tegningen ────────────────────────────────────
   Hver side har sin EGEN retning. Det kan lade sig gøre, fordi css kan have
   flere navngivne @page-regler, og hvert ark peger på sin. Uden det måtte
   hele udskriften være enten stående eller liggende – og så blev de tunge
   sider skaleret ned, til teksten ikke var til at læse, mens de lette sider
   lå med luft omkring sig.

   "Auto" regner efter: hvor meget kan arket fylde stående, og hvor meget
   liggende? Den retning, der giver den største skala, vinder. */
function exportPDF(o){
 const idx = (Array.isArray(o.sider)&&o.sider.length) ? o.sider.slice()
           : (o.scope==='all' ? pages.map((_,i)=>i) : [activePage]);
 if(!idx.length){ alert('Der er ikke valgt nogen sider at printe.'); return }
 /* Udskriften er et A3-ark, ikke en telefonskærm. Bruger vi telefonens
    bredde, bliver arket bygget i mobil-opsætning og klippet. */
 const W = Math.max(el.clientWidth||0, 1200);
 const pap = PAPER[o.paper]||PAPER.A3;
 const padPx = o.margin * 96/25.4;
 const LB=mmPx(pap.l), LH=mmPx(pap.p);     // liggende: bred og lav
 const PB=mmPx(pap.p), PH=mmPx(pap.l);     // stående
 const ret = o.ret||{};
 const stamp = new Date().toLocaleDateString('da-DK',{day:'2-digit',month:'2-digit',year:'numeric'});

 /* Først tegnes arkene i fuld bredde. Indholdets mål afhænger ikke af
    papiret – .pfitin har en fast bredde – så vi kan måle én gang og
    bagefter regne på begge retninger. */
 document.getElementById('printroot').innerHTML = idx.map(i=>
   `<div class="psheet" data-pi="${i}" style="width:${LB}px">
      <div class="pfit"><div class="pfitin" style="width:${W}px">${renderPageHTML(i,o.allLayers)}</div></div>
      <div class="pfoot">${esc(pages[i].title)} · side ${idx.indexOf(i)+1} af ${idx.length} · udskrevet ${stamp}</div>
    </div>`).join('');

 const rod=document.getElementById('printroot');
 rod.classList.add('maaler');
 let brugtL=false, brugtP=false;
 document.querySelectorAll('#printroot .psheet').forEach(ps=>{
  const ind=ps.querySelector('.pfitin');
  const fod=ps.querySelector('.pfoot');
  if(!ind)return;
  const pi=+ps.dataset.pi;
  const har = { b: ind.scrollWidth||W, h: ind.scrollHeight||1 };
  const fodH = (fod?fod.offsetHeight+6:0);
  /* Hvor stor kan arket blive på hver af de to retninger? */
  const maal=(sb,sh)=>{
   const plads={b:sb-2*padPx, h:sh-2*padPx-fodH};
   return {kB:plads.b/har.b, kBegge:Math.min(plads.b/har.b, plads.h/har.h), plads:plads, sb:sb, sh:sh};
  };
  const L=maal(LB,LH), P=maal(PB,PH);
  let valgt=ret[pi]||'auto';
  if(valgt==='auto') valgt = (P.kBegge>L.kBegge+0.001) ? 'portrait' : 'landscape';
  const m = valgt==='portrait' ? P : L;
  if(valgt==='portrait')brugtP=true; else brugtL=true;
  ps.classList.add(valgt==='portrait'?'sfP':'sfL');
  ps.style.width=m.sb+'px';
  ps.style.height=(m.sh-2).toFixed(0)+'px';
  /* Under halv størrelse bliver teksten ulæselig. Så er det bedre at lade
     arket løbe over på flere sider end at presse alt ned på ét. */
  const MINK=0.5;
  const enSide = m.kBegge>=MINK;
  /* Skal arket alligevel over flere sider, må vi ikke forstørre det – så
     ville det fylde endnu mere. Der holder vi os til 100 %. */
  const kk = enSide ? Math.max(0.3, Math.min(m.kBegge, 1.8))
                    : Math.max(0.3, Math.min(m.kB, 1));
  /* Selve indholdet skaleres, mens rammen får den færdige størrelse.
     Ellers ville rammen blive skaleret oven i sit eget mål. */
  const box=ps.querySelector('.pfit');
  ind.style.transform='scale('+kk.toFixed(4)+')';
  ind.style.transformOrigin='top left';
  box.style.transform='none';
  box.style.width=(har.b*kk)+'px';
  box.style.height=(har.h*kk)+'px';
  box.style.overflow='hidden';
  /* Krymper arket i højden, bliver det smallere end papiret. Så skal det
     midt på siden – ikke klistret op i venstre hjørne. */
  box.style.marginLeft=Math.max(0,(m.plads.b-har.b*kk)/2)+'px';
  if(!enSide){                       // lad siden vokse og brække naturligt
   ps.style.height='auto';
   ps.style.minHeight=(m.sh-2)+'px';
  }
  ps.dataset.skala=kk.toFixed(2);
  ps.dataset.retning=valgt;
  ps.dataset.ensidet=enSide?'ja':'nej';
 });
 rod.classList.remove('maaler');

 /* Kun de regler, der faktisk bliver brugt. Står der en ubrugt @page-regel
    tilbage, lægger Safari en tom side ind efter den. */
 document.getElementById('pagestyle').textContent =
   `${brugtL?`@page sfL{size:${pap.l}mm ${pap.p}mm;margin:0}`:''}
    ${brugtP?`@page sfP{size:${pap.p}mm ${pap.l}mm;margin:0}`:''}
    @media print{
      html,body{margin:0!important;padding:0!important}
      #printroot{margin:0;padding:0}
      .psheet.sfL{page:sfL}
      .psheet.sfP{page:sfP}
      /* Safari deler sider anderledes end Chrome. Derfor: almindelige blokke
         uden flex, ingen margener, og et sideskift FØR hvert ark undtagen det
         første. Beder man om skift EFTER sidste ark, laver Safari en tom side. */
      .psheet{position:relative;display:block;
              padding:${padPx}px;box-sizing:border-box;overflow:hidden;margin:0;
              break-inside:avoid;page-break-inside:avoid;
              break-before:page;page-break-before:always;
              break-after:auto;page-break-after:auto}
      .psheet:first-child{break-before:auto;page-break-before:auto}
      .pfit{transform-origin:top left}
      .pfoot{position:absolute;left:${padPx}px;right:${padPx}px;bottom:${(padPx/2).toFixed(0)}px;margin:0}
    }`;
 closeModal();
 /* Filnavnet skal sige hvad der ER i filen: én side får sit navn med, et
    udvalg får at vide hvor mange der er. */
 const navn=projectName+' – Tegning'
   +(idx.length===1 ? ' – '+(pages[idx[0]].title||'side '+(idx[0]+1))
     : (idx.length===pages.length ? '' : ' – '+idx.length+' sider'));
 setTimeout(()=>{
   udskriv(navn);
 },120);
}

/* CSV med semikolon og BOM, så dansk Excel åbner det korrekt */
function exportCSV(o){
 const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 const rows=[['Side','Afsender','Modtager','Feed/TX','Gruppe','Transport','Signaltype','Rolle','Retning','Kanal','Kanaltekst','Kanaltype']];
 const idx = o.scope==='all' ? pages.map((_,i)=>i) : [activePage];
 idx.forEach(pi=>{
  const walk=(sh,prefix)=>{
   sh.sections.forEach(sc=>sc.groups.forEach(g=>{
    if(!o.allLayers&&!vis(g.layer,g.role))return;
    const dtxt=v=>({ltr:'frem',rtl:'retur',both:'begge veje'})[v||'ltr'];
    const base=[prefix,sc.src,sc.dst,g.feed||'',g.label,g.transport||'',LAYERS[g.layer]||g.layer,g.role];
    if(!g.channels.length)rows.push(base.concat([dtxt(g.dir),'','','']));
    g.channels.forEach(ch=>rows.push(base.concat([dtxt(ch.dir||g.dir),ch.nr,ch.label||'',LAYERS[ch.layer]||ch.layer])));
    if(o.subs&&g.sub)walk(g.sub,prefix+' › '+g.label);
   }));
  };
  walk(pages[pi],pages[pi].title);
 });
 dl('\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n'),
    fileName('csv',o.scope!=='all','tegning'),'text/csv;charset=utf-8');
 closeModal();
}

/* ---- eksport til draw.io (ren mxGraph-XML, kan redigeres videre) ---- */
function exportDrawio(o){
 const idx = o.scope==='all' ? pages.map((_,i)=>i) : [activePage];
 const X=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'&#10;');
 /* groft mål af tekstbredden, så stregen kan starte lige efter teksten */
 const tw=(t,px2)=>Math.round(String(t||'').length*(px2||10)*0.56);
 const SHEETW=1500, M=40;

 const diagrams = idx.map((pi,n)=>{
  const sh=pages[pi];
  const cells=[]; let uid=2;
  const id2=()=>'n'+(uid++);
  const V=(val,style,x,y,w,h)=>{cells.push(
    `<mxCell id="${id2()}" value="${X(val)}" style="${style}" vertex="1" parent="1">`
   +`<mxGeometry x="${Math.round(x)}" y="${Math.round(y)}" width="${Math.round(w)}" height="${Math.round(h)}" as="geometry"/></mxCell>`)};
  const E=(val,style,x1,y1,x2,y2)=>{cells.push(
    `<mxCell id="${id2()}" value="${X(val)}" style="${style}" edge="1" parent="1">`
   +`<mxGeometry relative="1" as="geometry">`

   +`<mxPoint x="${Math.round(x2)}" y="${Math.round(y2)}" as="targetPoint"/></mxGeometry></mxCell>`)};

  let y=M;
  V(sh.title,'sf=titel;text;html=1;fontSize=22;fontStyle=1;align=center;verticalAlign=middle;',
    M,y,SHEETW-2*M,34);
  y+=54;

  /* forklaringsboksen følger med ud i draw.io – ellers mangler tegningen både
     signalfarverne og hvem der har lavet den */

   V(Object.keys(LAYERS).map(k=>'●  '+LAYERS[k]).join('    ')+'\n'

    +'fontSize=11;spacing=8;fillColor=#ffffff;strokeColor=#c4c4c4;',
     SHEETW-M-iw, M, iw, ih);
   y=Math.max(y, M+ih+20);
  }

  sh.sections.forEach(sc=>{
   const st=sc.style||{};
   const srcW=+(st.srcW||190), dstW=+(st.dstW||210);
   const rowsX=M+srcW+30, dstX=SHEETW-M-dstW;
   const feedW=120, nameW=250;
   /* stregerne skal gå helt frem til modtagerboksen, og gruppenavnet skal
      stå lige før den – ellers hænger det hele i luften midt på arket */
   const lineEnd=dstX-12;                 // her ender kanalpilene
   const nameX=lineEnd-nameW;             // gruppenavnet står lige før boksen
   const lineA=rowsX+feedW, lineB=nameX-8;
   const cloudW=110, cloudX=(lineA+lineB)/2-cloudW/2;

   const secTop=y; let ry=y+14;

   sc.groups.forEach(g=>{
    const col=(g.style&&g.style.lineColor)||{video:'#c62828',lyd:'#9a6500',intercom:'#1e7a55',net:'#1e56b0'}[g.layer]||'#333';
    const dash=g.role==='backup'?'dashed=1;':'';
    const sA=g.dir==='rtl'||g.dir==='both'?'startArrow=classic;startFill=1;':'startArrow=none;';
    const eA=g.dir==='rtl'?'endArrow=none;':'endArrow=classic;endFill=1;';
    const est=`html=1;${dash}${sA}${eA}strokeColor=${col};strokeWidth=1.6;`;

    const feedTxt=(g.feed||'')+(g.role==='backup'?' · BACKUP':'');
    const feedW2=Math.min(feedW-6, Math.max(46, tw(feedTxt,11)+8));
    V(feedTxt,
      `sf=feed;sflag=${g.layer||''};sfdir=${g.dir||'ltr'};sfrolle=${g.role||''};text;html=1;fontSize=11;fontStyle=1;align=left;verticalAlign=middle;fontColor=${col};`,
      rowsX,ry-9,feedW2,18);
    E('',est,rowsX+feedW2+10,ry,cloudX,ry);
    V(g.transport||'—',
      'sf=transport;rounded=1;arcSize=50;html=1;fontSize=10;fontStyle=1;fillColor=#ffffff;strokeColor=#b4b4b4;fontColor=#5c5c5c;',
      cloudX,ry-11,cloudW,22);
    E('',est,cloudX+cloudW,ry,lineB,ry);
    V(g.label,`sf=gruppe;text;html=1;fontSize=11;fontStyle=1;align=left;verticalAlign=middle;fontColor=${col};`,
      nameX,ry-9,nameW,18);
    if(g.tx)V(g.tx,'sf=tx;text;html=1;fontSize=8;align=center;verticalAlign=middle;fontColor=#666666;',lineA+2,ry-16,54,12);
    if(g.rx)V(g.rx,'sf=rx;text;html=1;fontSize=8;align=center;verticalAlign=middle;fontColor=#666666;',lineB-56,ry-16,54,12);
    ry+=20;

    g.channels.forEach(ch=>{
     const crole=ch.role||g.role;
     const cdash=crole==='backup'?'dashed=1;':'';
     const cdot={video:'#ff5252',lyd:'#ffb648',intercom:'#3fd99c',net:'#5ea3ff'}[ch.layer]||'#999';
     V('','ellipse;html=1;fillColor='+cdot+';strokeColor=none;',rowsX+16,ry-4,8,8);
     const chTxt=(ch.nr||'')+'  '+(ch.label||'')+(crole==='backup'?'   [B]':'');
     const chW=Math.min(300, Math.max(60, tw(chTxt,10)+10));
     V(chTxt,`sf=kanal;sflag=${ch.layer||''};sfdir=${ch.dir||''};sfrolle=${ch.role||''};text;html=1;fontSize=10;align=left;verticalAlign=middle;fontColor=#3a3a3a;`,
       rowsX+30,ry-8,chW,16);
     const cd=ch.dir||g.dir||'ltr';
     E('',`html=1;${cdash}${cd==='rtl'||cd==='both'?'startArrow=classic;startFill=1;':'startArrow=none;'}`
        +`${cd==='rtl'?'endArrow=none;':'endArrow=classic;endFill=1;'}strokeColor=#3a3a3a;strokeWidth=1;`,
       rowsX+30+chW+12,ry,lineEnd,ry);
     ry+=16;
    });
    ry+=10;
   });

   /* kassen skal også kunne rumme de bemandingsbokse der er låst fast i den */
   const stackH=side=>{
    let iy=42;
    (sh.items||[]).filter(i=>i.anchor&&i.anchor.sec===sc.id&&i.anchor.side===side)
      .forEach(it=>{iy+=itemH(it)+10});
    return iy+10;
   };
   const secH=Math.max(ry-secTop+10, stackH('src'), stackH('dst'), 90);
   const boxS=(fill,stroke,font)=>`rounded=1;arcSize=4;html=1;whiteSpace=wrap;verticalAlign=top;align=left;`
     +`fontSize=14;fontStyle=1;spacing=8;fillColor=${fill};strokeColor=${stroke};fontColor=${font};`;
   const srcLines=(sc.srcLines||[]).map(l=>l.t).join('\n');
   const dstLines=(sc.dstLines||[]).map(l=>l.t).join('\n');
   V(sc.src+(srcLines?'\n\n'+srcLines:''),
     'sf=afsender;'+boxS(st.srcBg||'#e9c440', st.srcBd||'#bd9a2c', st.srcFg||'#2b2417'), M,secTop,srcW,secH);
   V(sc.dst+(dstLines?'\n\n'+dstLines:''),
     'sf=modtager;'+boxS(st.dstBg||'#6d8764', st.dstBd||'#4c6245', st.dstFg||'#f3f7f1'), dstX,secTop,dstW,secH);

   /* bokse der er låst fast i denne sektion – stables i den boks de hører til */
   ['src','dst'].forEach(side=>{
    let iy=secTop+42;
    (sh.items||[]).filter(i=>i.anchor&&i.anchor.sec===sc.id&&i.anchor.side===side).forEach(it=>{
     const w=Math.min(it.w||240, (side==='src'?srcW:dstW)-24);
     const h=itemH(it);
     V(itemText(it),
       'rounded=1;arcSize=6;html=1;whiteSpace=wrap;verticalAlign=top;align=left;fontSize=10;'
      +'fillColor=#ffffff;strokeColor=#cfcfcf;spacing=7;',
       (side==='src'?M:dstX)+12, iy, w, h);
     iy+=h+10;
    });
   });
   y=secTop+secH+26;
  });

  /* frit placerede bokse */
  const scale=(SHEETW-2*M)/Math.max(600,(el.clientWidth||1340));
  (sh.items||[]).filter(i=>!i.anchor).forEach(it=>{
   V(itemText(it),
     'rounded=1;arcSize=6;html=1;whiteSpace=wrap;verticalAlign=top;align=left;fontSize=10;'
    +(it.type==='text'?'fillColor=none;strokeColor=none;':'fillColor=#ffffff;strokeColor=#cfcfcf;')+'spacing=7;',

  return `<diagram name="${X(sh.title)}" id="d${n+1}">`
   +`<mxGraphModel dx="1200" dy="800" grid="0" gridSize="10" guides="1" tooltips="1" connect="1" `
   +`arrows="1" fold="1" page="1" pageScale="1" pageWidth="1600" pageHeight="1200" math="0" shadow="0">`
   +`<root><mxCell id="0"/><mxCell id="1" parent="0"/>${cells.join('')}</root>`
   +`</mxGraphModel></diagram>`;
 }).join('');

 dl(`<mxfile host="SignalFlow" type="device">${diagrams}</mxfile>`,

/* hjælpere til bokse i draw.io */
function itemText(it){
 if(it.type==='text')return it.text||'';
 const rows=(it.rows||[]).map(r=>`${r.sym||'●'}  ${r.label||''}${(r.count===''||r.count==null)?'':'   '+r.count}`);
 const tot=(it.rows||[]).reduce((a,r)=>a+(+r.count||0),0);
 return [it.title||'Forklaring',''].concat(rows)
   .concat(it.showTotal!==false?['','I alt   '+tot]:[]).join('\n');
}
function itemH(it){
 if(it.type==='text')return Math.max(26,(String(it.text||'').split('\n').length)*16+14);
 return 34+(it.rows||[]).length*15+(it.showTotal!==false?20:0);
}

function planRows(kun){
 const rows=[['Domæne','Udstyr','Placering','Side','Nr','Frekvens MHz','Signal / bruger','Type',
   'Patchet / sat op','Tjekket / afprøvet','Sat af','Tidspunkt']];
 Object.keys(PLANDOMS).filter(k=>!kun||k===kun).forEach(k=>alive((ensurePlan()[k].devices||[])).forEach(d=>{
  [['ins','Input'],['outs','Output']].forEach(([side,txt])=>{
   alive(d[side]).forEach(p=>rows.push([PLANDOMS[k],d.name,d.place||'',
     k==='freq'?'':txt, p.n, p.freq||'', portTekst(k,d,p,side), p.ftype||'',
     p.patched?'ja':'', p.checked?'ja':'', p.by||'',
     p.at?new Date(p.at).toLocaleString('da-DK'):'']));
  });
 }));
 return rows;
}

 const navn=fileName('csv',false,'plan'+(kun?'_'+kun:''));
 dl('\ufeff'+planRows(kun).map(r=>r.map(q).join(';')).join('\r\n'),navn,'text/csv;charset=utf-8');

/* Udstyret med på papir. Det er den linje, der bliver til en pakkeseddel –
   derfor står det under kortets navn og ikke nede i et hjørne. */
function udstyrPrint(dom2,dv){
 const pl=pladserFor(dom2); if(!pl.length)return '';
 const valgt=pl.map(pp=>({pp:pp, v:udstyrPaa(dv,pp.k)})).filter(x=>x.v);
 if(!valgt.length)return '';
 return `<div class="ppudstyr">${valgt.map(x=>
   `<span><em>${esc(x.pp.navn)}</em> ${esc(x.v.navn)}</span>`).join('')}</div>`;
}
function planPrintHTML(kun,o){
 /* Kameraplanen kan printes på to måder: hele listen med lydkanalerne, eller
    kun kameraerne med deres udstyr. Det sidste er pakkesedlen. */
 const medLyd = !o || o.lyd!==false;
 let h=`<div class="sheettitle">${esc(projectName)} · Plan${kun?' · '+PLANDOMS[kun]:''}${
   medLyd?'':' · uden lydkanaler'}${
   harJob()?` <span class="ppdage">${esc(jobTekst())}</span>`:''}</div>`;
 Object.keys(PLANDOMS).filter(k=>!kun||k===kun).forEach(k=>{
  const ds=alive(ensurePlan()[k].devices||[]);
  if(!ds.length)return;
  h+=`<h2 class="pph">${PLANDOMS[k]}</h2>`;
  ds.forEach(d=>{
   const col=(arr,t,side)=>`<div class="ppcol"><div class="ppt">${t}<span class="ppk">P T</span></div>`
     +alive(arr).map(p=>{const tx=portTekst(k,d,p,side);
       return `<div class="ppr"><span class="ppn">${esc(p.n)}</span>
        <span class="ppl">${esc(tx)}</span>
        <span class="ppb">${tx?(p.patched?'✓':'☐'):''}</span>
        <span class="ppb">${tx?(p.checked?'✓':'☐'):''}</span></div>`}).join('')+`</div>`;
   if(k==='freq'){
    /* frekvensplanen står bedre som én tabel med MHz og bruger */
    h+=`<div class="ppdev"><div class="ppname">${esc(d.name)}${d.place?' · '+esc(d.place):''}</div>
      ${udstyrPrint(k,d)}
      <div class="ppfreq">
        <div class="ppfr ppfh"><span>Nr</span><span>MHz</span><span>Bruger / position</span>
          <span>Type</span><span>S</span><span>A</span></div>
        ${alive(d.ins).map(p=>`<div class="ppfr"><span>${esc(p.n)}</span>
          <span class="ppmhz">${esc(p.freq||'')}</span><span>${esc(p.label||'')}</span>
          <span>${esc(p.ftype||'')}</span>
          <span>${p.label?(p.patched?'✓':'☐'):''}</span>
          <span>${p.label?(p.checked?'✓':'☐'):''}</span></div>`).join('')}
      </div></div>`;
    return;
   }
   if(k==='kam'&&!medLyd){
    /* Uden lydkanalerne er kortet en pakkeseddel: hvad hedder kameraet,
       hvor står det, og hvad skal med i kassen. */
    h+=`<div class="ppdev enkel"><div class="ppname">${esc(d.name)}${d.place?' · '+esc(d.place):''}</div>
      ${udstyrPrint(k,d)||'<div class="ppintet">Intet udstyr valgt</div>'}</div>`;
    return;
   }
   h+=`<div class="ppdev"><div class="ppname">${esc(d.name)}${d.place?' · '+esc(d.place):''}</div>
     ${udstyrPrint(k,d)}
     <div class="ppcols">${col(d.ins,k==='kam'?'Lydkanaler':'Input','ins')}${
       k==='kam'&&!alive(d.outs).length?'':col(d.outs,k==='kam'?'Retur':'Output','outs')}</div></div>`;
  });
 });
 return h;
}
/* Kameraplanen printes til to formål: den fulde plan med lydkanalerne, og
   pakkesedlen med kameraerne og deres udstyr. Derfor spørger vi – men kun
   på kameraplanen; de andre områder har ikke noget at vælge imellem. */

/* Filnavnet følger det der rent faktisk ligger i filen: hele projektet,
   eller den enkelte side hvis eksporten kun omfatter den. */
function fileName(ext,onlyPage,slags){
 const raw = onlyPage ? (pages[activePage].title||'side') : (projectName||'signalflow');
 const base = raw.replace(/[^\wæøåÆØÅ -]/g,'').trim().replace(/ +/g,'_');
 return base+(slags?'_'+slags:'')+'.'+ext;
}
function dl(text,name,mime){
 const b=new Blob([text],{type:mime});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download=name;a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

/* ---- paneler i lageret: gem og hent igen ----
   Panelet lægges som udstyr i den fælles tabel under kategorien INTERCOM PANEL,
   så det kan bruges i alle projekter og af alle. */
const PANELKAT='INTERCOM PANEL';
function panelData(it){
 return {prows:+it.prows||2,pcols:+it.pcols||6,keyColor:it.keyColor||'#2e2e2e',
   note:it.note||'',net:it.net||{},keys:(it.keys||[]).map(k=>({t:k.t||'',c:k.c||''}))};
}
async function panelGem(it){
 const nm=prompt('Navn i lageret:',it.title||'Intercom panel');
 if(nm===null)return;
 try{
  await sbFetch('equipment?select=id',{method:'POST',body:JSON.stringify(
    {name:nm||'Intercom panel',category:PANELKAT,qty:1,
     tech:{panel:panelData(it)},
     custom_fields:[{label:'Type',value:'Intercom panel'},
                    {label:'Alias',value:(it.net||{}).alias||''},
                    {label:'IP',value:(it.net||{}).ip||''},
                    {label:'User ID',value:(it.net||{}).user||''}]})});
  if(typeof lagerList==='function')lagerList(true);
  setSync('gemt i lageret');
 }catch(e){alert(e.message)}
}
async function panelListe(){
 const r=await sbFetch('equipment?select=id,name,category,tech&order=name.asc');
 return (r||[]).filter(x=>x.tech&&x.tech.panel);
}
function nytPanel(data,titel){
 snap();

 items().push({id:id(),type:'panel',x:s0.x,y:s0.y,w:430,

    <div class="mf"><label>Rækker</label><input type="number" name="prows" min="1" max="6" value="2"></div>

   root.querySelector('[data-ipimp]').onclick=()=>{ closeModal(); setTimeout(ipAaben,60); };

           ['taster','Kun taster – uden oplysninger'],['navn','Kun navn og adresse i én linje'],
           ['skjul','Tag det slet ikke med']].map(([v,t])=>
          `<option value="${v}" ${f.pmode===v?'selected':''}>${t}</option>`).join('')}

  <div class="msec">Taster</div>

  <div class="mrow">
    <button class="btn go" data-ok="1">Gem</button>
    <button class="btn" data-arch="1">Gem i lageret</button>
    <button class="btn" data-cancel="1">Annullér</button>
    <button class="btn del" data-rm="1">Fjern panelet</button>
  </div>`,root=>{
   mountSwatches(root);
   const liste=root.querySelector('#pkeylist');

   /* tegn tastelisten ud fra kopien */
   const tegnTaster=()=>{
    const n=Math.max(1,+val(root,'prows')||2)*Math.max(1,+val(root,'pcols')||6);
    while(f.keys.length<n)f.keys.push({t:'',c:''});
    liste.innerHTML=f.keys.slice(0,n).map((k,i)=>`<div class="pkrow">
      <span class="pknum">${i+1}</span>
      <input type="text" class="pktxt" data-kt="${i}" value="${esc(k.t||'')}"
             placeholder="tekst på tasten" autocomplete="off">
      <input type="color" class="pkcol" data-kc="${i}" value="${k.c||f.keyColor}" title="Farve på denne taste">
      <button class="mini" data-kclr="${i}" title="Brug panelets farve">↺</button>
    </div>`).join('');
    liste.querySelectorAll('[data-kt]').forEach(inp=>{
      inp.oninput=()=>{f.keys[+inp.dataset.kt].t=inp.value};
      inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault(); gem()} };
    });
    liste.querySelectorAll('[data-kc]').forEach(inp=>inp.oninput=()=>{f.keys[+inp.dataset.kc].c=inp.value});
    liste.querySelectorAll('[data-kclr]').forEach(b=>b.onclick=()=>{f.keys[+b.dataset.kclr].c='';tegnTaster()});
   };
   tegnTaster();
   root.querySelector('[name="prows"]').oninput=tegnTaster;
   root.querySelector('[name="pcols"]').oninput=tegnTaster;

   /* saml alt fra felterne – læses ALTID direkte fra vinduet */
   const laes=()=>{
    liste.querySelectorAll('[data-kt]').forEach(inp=>{f.keys[+inp.dataset.kt].t=inp.value});
    liste.querySelectorAll('[data-kc]').forEach(inp=>{f.keys[+inp.dataset.kc].c=inp.value});
    return {
     title:val(root,'title'),
     note:val(root,'note'),
     prows:Math.max(1,+val(root,'prows')||2),
     pcols:Math.max(1,+val(root,'pcols')||6),
     scale:+val(root,'scale')||1,
     visnet:val(root,'visnet')!=='0',
     pmode:val(root,'pmode')||'alt',
     keyColor:val(root,'keyColor')||'#2e2e2e',
     net:{alias:val(root,'alias'),model:val(root,'model'),sted:val(root,'sted'),
          ejer:val(root,'ejer'),til:val(root,'til'),ip:val(root,'ip'),gw:val(root,'gw'),
          ext:val(root,'ext'),port:val(root,'port'),user:val(root,'user'),pw:val(root,'pw')},
     keys:f.keys.map(k=>({t:k.t||'',c:k.c||''}))
    };
   };

   const gem=()=>{
    const v=laes();
    /* find boksen forfra – den kan være skiftet ud imens */
    const maal=findItem(iid);
    if(!maal){alert('Panelet findes ikke længere på arket.');closeModal();return}
    snap();
    maal.title=v.title; maal.note=v.note;
    maal.prows=v.prows; maal.pcols=v.pcols; maal.scale=v.scale;
    maal.visnet=v.visnet; maal.pmode=v.pmode; maal.keyColor=v.keyColor;
    maal.net=v.net; maal.keys=v.keys;
    delete maal.addr;
    closeModal();
    draw();
    /* send op med det samme, så det ikke kun står her på maskinen */
    if(cloudId&&session()){ dirty=true; push() }
   };

   root.querySelector('[data-ok]').onclick=gem;
   root.querySelector('[data-cancel]').onclick=closeModal;   // kopien kasseres
   root.querySelector('[data-rm]').onclick=()=>{
     if(!confirm('Fjern panelet fra arket?'))return;
     snap(); sheet().items=(sheet().items||[]).filter(x=>x.id!==iid);
     closeModal(); draw();
     if(cloudId&&session()){ dirty=true; push() }
   };
   root.querySelector('[data-arch]').onclick=()=>{
     const v=laes();
     panelGem(Object.assign({},v,{id:iid}));
   };
   /* Enter i et hvilket som helst tekstfelt gemmer */
   root.querySelectorAll('input[type="text"],input[type="number"]').forEach(inp=>{
     inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault(); gem()} };
   });
 });
}
