/* ── Er brugeren midt i at skrive? ─────────────────────────────
   Så må vi hverken hente nyt ned eller tegne arket om – det lukker feltet
   midt i en sætning. Vi venter, til han er færdig (Enter, Tab eller klik
   ved siden af), og henter så det, kollegerne har lavet imens. */
let sidsteTast=0;
document.addEventListener('input',()=>{sidsteTast=Date.now()},true);
document.addEventListener('keydown',()=>{sidsteTast=Date.now()},true);
function skriverNu(){
  /* et åbent felt på arket, et felt i blokdiagrammet, eller et felt man
     har tastet i inden for de sidste par sekunder */
  if(typeof editing!=='undefined' && editing && editing.inp && editing.inp.isConnected) return true;
  const a=document.activeElement;
  const iFelt=a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable)
              && !a.closest('#modal') && !a.closest('#gate');
  return !!(iFelt && Date.now()-sidsteTast<4000);
}

async function pullInner(){
 /* Står et redigeringsvindue åbent, arbejder brugeren i en bestemt boks.
    Henter vi projektet om under fødderne på ham, skriver han bagefter i en
    kopi der ikke længere findes – og rettelsen forsvinder. Vi venter. */
 if(mEl&&mEl.classList.contains('on'))return;
 /* Samme regel, når man skriver direkte på arket: hent ikke midt i en sætning */
 if(skriverNu()){ setSync('venter til du er færdig med at skrive'); return; }
 let r;
 try{ r=await sbFetch('signalflow_projects?id=eq.'+cloudId+'&select=updated_at,updated_by'); }
 catch(e){ setSync('ingen forbindelse',true); return; }
 /* Svarer databasen at projektet ikke findes, er det slettet. Vi venter på to
    tomme svar i træk, så et enkelt skævt svar ikke river projektet fra os. */
 if(!r||!r.length){ if(++tommeSvar>=2)projektVaek(); return }
 tommeSvar=0;
 const t=r[0].updated_at;
 pollN++;
 /* Står tidsstemplet stille, er der ikke sket noget – så henter vi ingenting.
    Hvert eneste skriv sætter updated_at (både klienten og en trigger i basen),
    så tidsstemplet er en pålidelig nøgle. Tidligere hentede vi hele projektet
    hvert 24. sekund "for en sikkerheds skyld"; på et projekt med billeder
    kostede det over 100 MB om dagen pr. bruger. Sikkerhedsnettet er i stedet
    et fuldt tjek hvert tiende minut. */
 const forced = (pollN%100===0);
 if(lastSync&&t===lastSync&&!forced){hentetFoerst=true;setSync('opdateret');return}
 const full=await sbFetch('signalflow_projects?id=eq.'+cloudId+'&select=name,data,updated_at,updated_by');
 if(lastSync&&t===lastSync&&forced){
  const same=JSON.stringify((full[0].data||{}).plan||null)===JSON.stringify(ensurePlan());
  if(same){setSync('opdateret');return}
 }
 if(!lastSync){
  hentetFoerst=true;
  /* Første gang vi taler med serveren: er serverens udgave nyere end den
     kopi, telefonen lå med, så er det serverens der gælder. Ellers ville
     gammelt arbejde fra en anden enhed blive flettet op i projektet. */
  lastSync=t;
  const d0=full[0].data||{};
  const serverNyere = !lokalTs || (parseTS(t)&&parseTS(t).getTime()>lokalTs);
  if(serverNyere){
   if(d0.pages&&d0.pages.length){pages=d0.pages;activePage=0;doc=pages[0];path=[];sel=null;focus=null}
   plan=d0.plan||blankPlan();
   blocks=d0.blocks||blankBlocks();
   if(d0.name)projectName=d0.name;
   if(fletJob(d0))bookingerRydCache();
   dirty=false;
   setSync('hentet fra serveren');
  }else{
   /* Vores egen kopi er nyere – fx arbejde lavet lige inden fanen blev lukket.
      Så flettes serverens ind, og VORES sendes op bagefter. Ellers ville
      arbejdet blive liggende på maskinen og aldrig nå projektet. */
   plan=mergePlan(ensurePlan(),d0.plan);
   if(d0.pages){const flettet=mergePages(pages,d0.pages); if(flettet.length)pages=flettet}
   if(d0.blocks)blocks=mergeBlocks(ensureBlocks(),d0.blocks);
   if(activePage>=pages.length)activePage=0;
   doc=pages[activePage];
   const serverDoc=JSON.stringify({p:d0.pages||null,b:d0.blocks||null,pl:d0.plan||null});
   const voresDoc=JSON.stringify({p:pages,b:ensureBlocks(),pl:plan});
   if(serverDoc!==voresDoc){ dirty=true; setSync('sender dine ændringer op …'); push(); }
   else setSync('opdateret');
  }
  autosave();
  if(view==='plan')drawPlan(); else if(view==='blocks')drawBlocks(); else draw();
  return;}
 const d=full[0].data||{};
 const foc=focusedRef();
 const aktivRef=(foc&&foc.dataset.plabel)||(skriverSelv(skriver.ref)?skriver.ref:null);
 const keep=aktivRef?{ref:aktivRef,
                      val:(foc&&foc.dataset.plabel===aktivRef)?foc.value:skriver.val,
                      felt:document.querySelector('[data-plabel="'+CSS.escape(aktivRef)+'"]'),
                      skriver:skriverSelv(aktivRef)}:null;
 const serverDoc=JSON.stringify({p:d.pages||null,pl:d.plan||null,b:d.blocks||null});
 plan=mergePlan(ensurePlan(),d.plan);
 if(keep){
  const [did,side,pid]=keep.ref.split('|');
  const dv=(planDevices(plan,planDom)||[]).find(x=>x.id===did);
  const p=dv&&dv[side].find(x=>x.id===pid);
  if(p){
   if(keep.skriver){
    /* Vores egen igangværende tekst vinder – og den skal stemples som den
       nyeste, ellers ville kollegaens ældre rettelse vinde ved næste gem. */
    p.label=keep.val; p.at=Date.now(); p.by=meName();
    dirty=true;
   }else if(keep.felt&&keep.felt.value!==(p.label||''))keep.felt.value=p.label||'';
  }
 }
/* tegningen flettes side for side – ikke alt eller intet */
 const aktivId=(pages[activePage]||{}).id;
 if(d.pages){const flettet=mergePages(pages,d.pages); if(flettet.length)pages=flettet}
 if(d.blocks)blocks=mergeBlocks(ensureBlocks(),d.blocks);
 ryddLuft(pages);
 const nyIdx=pages.findIndex(p=>p.id===aktivId);
 if(nyIdx>=0)activePage=nyIdx;
 if(!dirty&&d.name)projectName=d.name;
 if(!dirty&&fletJob(d))bookingerRydCache();
 if(activePage>=pages.length)activePage=0;
 doc=pages[activePage];
 lastSync=full[0].updated_at;
 setSync('opdateret · '+(full[0].updated_by||''));
 /* Har vi noget efter fletningen, som serveren ikke har – i tegningen, i
    planen eller i blokdiagrammet – skal det sendes op. Ellers ville
    vores rettelse kun findes her på maskinen. */
 if(JSON.stringify({p:pages,pl:plan,b:blocks||null})!==serverDoc)dirty=true;
 autosave();
 if(view==='plan')syncPlanDOM(); else if(view==='blocks'){if(!bdrag&&!linkFrom)drawBlocks()} else draw();
 if(dirty)push();                            // send vores egne rettelser videre
}

function push(){
 if(!lastSync)return;      // vi har ikke set serverens udgave endnu
 clearTimeout(pushTimer);
 pushTimer=setTimeout(async()=>{
  if(!cloudId||!session()||!dirty)return;
  /* Midt i en sætning? Prøv igen om lidt – vi må ikke hente og flette nu,
     og uden fletning må vi heller ikke skrive. */
  if(skriverNu()){ push(); return; }
  try{
   /* Hent serverens udgave og flet ind FØR vi skriver. Hele dokumentet
      skrives på én gang, så uden det ville vi slette de rettelser en
      kollega eller en gæst har lavet i mellemtiden. */
   setSync('henter først …');
   try{ await pull() }catch(e){}
   if(!dirty)return;
   setSync('gemmer …');
   await cloudSaveQuiet();
   dirty=false;
   setSync('gemt');
  }catch(e){ setSync('kunne ikke gemme',true) }
 },1800);
}
async function cloudSaveQuiet(){
 const who=cfg().who||userName().split('@')[0]||'';
 /* Uden select= sender serveren HELE projektet retur ved hver gemning – på et
    projekt med billeder er det over 100 KB vi ikke bruger til noget. Vi beder
    kun om tidsstemplet. */
 const r=await sbFetch('signalflow_projects?id=eq.'+cloudId+'&select=updated_at',
   {method:'PATCH',body:JSON.stringify(Object.assign(
     {name:projectName,data:snapshot(),updated_by:who,updated_at:new Date().toISOString()},
     await jobFelter()))});
 if(r&&r.length&&r[0].updated_at)lastSync=r[0].updated_at;
 bookingerSkriv();
}

 n.className=warn?'warn':'';

/* ================= hvem er inde i projektet =================
   Hver maskine melder sig selv hvert tiende sekund og henter de andres
   meldinger. Linjer ældre end et minut regnes som gået igen. */
let presTimer=null, presFolk=[], presFejl=null, presKlar=false, presFejlTal=0;

/* ── Projektet findes ikke længere ────────────────────────────
   Bliver et projekt slettet – af en kollega, eller fra en anden maskine –
   bliver id'et hængende her i browseren. Så melder maskinen sig hvert tiende
   sekund ind i et projekt der ikke er der, databasen afviser det hver gang
   (fejl 23503), og brugeren tror imens at han arbejder i et delt projekt.
   Vi slipper id'et, beholder arbejdet lokalt og siger det højt én gang. */
const DOEDT_PROJEKT=/23503|foreign key|project_id_fkey/i;
let projektVaekSagt=false, tommeSvar=0;
function projektVaek(){
  clearInterval(presTimer); presTimer=null;
  clearInterval(syncTimer); syncTimer=null;
  presFolk=[]; presFejl=null; presFejlTal=0; tommeSvar=0;
  cloudId=null; dirty=false;
  autosave();                 // den lokale kopi må ikke pege på et dødt id
  if(typeof tegnHvemErInde==='function')tegnHvemErInde();
  if(typeof mobilTitel==='function')mobilTitel();
  setAuto('ligger kun lokalt – projektet er væk på serveren',true);
  if(projektVaekSagt)return;
  projektVaekSagt=true;
  alert('Projektet findes ikke længere i databasen – det er slettet et andet '
    +'sted fra.\n\nDit arbejde ligger stadig her i browseren. Tryk Gem, hvis '
    +'det skal op som et nyt projekt.');
}

function presSted(){
 if(view==='plan')return 'Plan · '+(PLANDOMS[planDom]||'');
 if(view==='blocks')return 'Blokdiagram · '+((bp()||{}).title||'');
 if(view==='arch')return 'Lageret';
 const sh=pages[activePage]||{};
 return 'Tegning · '+(sh.title||'');

async function presMeld(){
 if(!cloudId&&!guestToken)return;
 const hvem=(meName()||'').trim();
 if(!hvem||hvem==='?')return;      // meld først når vi ved hvem det er
 try{
  if(guestToken){
   await rpc('sf_pres_set',{tok:guestToken,hvem:hvem,hvor:presSted()});
   presFolk=(await rpc('sf_pres_get',{tok:guestToken}))||[];
  }else{
   if(!session())return;
   await sbFetch('signalflow_presence?on_conflict=project_id,who&select=who',
     {method:'POST',headers:{'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify({project_id:cloudId,who:hvem,sted:presSted(),at:new Date().toISOString()})});
   presFolk=(await sbFetch('signalflow_presence?project_id=eq.'+cloudId+'&select=who,sted,at'))||[];
  }
  presFejl=null; presKlar=true; presFejlTal=0;
  tegnHvemErInde();
 }catch(e){
  /* Tilstedeværelse må aldrig stå i vejen for arbejdet – men vi siger til,
     så man ved hvorfor feltet er tomt i stedet for at tro det virker. */
  const besked=e.message||'kunne ikke hente';
  /* Er projektet slettet, nytter det ikke at prøve igen hvert tiende sekund */
  if(cloudId&&!guestToken&&DOEDT_PROJEKT.test(besked)){ projektVaek(); return }
  presFejl=besked;
  presKlar=true;
  /* Virker det ikke, skal vi ikke blive ved med at banke på i samme takt.
     Først hvert minut, og til sidst holder vi op – ellers fylder det kun
     loggen på serveren og batteriet på telefonen. */
  presFejlTal++;
  if(presFejlTal===5&&presTimer){ clearInterval(presTimer); presTimer=setInterval(presMeld,60000) }
  if(presFejlTal>=25&&presTimer){ clearInterval(presTimer); presTimer=null }
  tegnHvemErInde();
 }
}
function startPres(){
 clearInterval(presTimer);
 presFejlTal=0;
 presMeld();
 presTimer=setInterval(presMeld,10000);
}


/* ── Skift projekt på telefonen ────────────────────────────────
   Projektvinduet er bygget til en mus med mapper, versioner og import. Ude
   på gulvet skal man bare skifte til et andet projekt – derfor en liste
   nedefra med de senest rettede øverst, og en vej videre til det fulde
   vindue, hvis man skal mere. */
async function mobilProjekter(){
  openSheet('Henter projekter …',[{ikon:'…',tekst:'Et øjeblik',gør:()=>{}}]);
  let liste=[];
  try{ liste=await cloudList()||[] }
  catch(e){
    openSheet('Projekter',[{ikon:'⚠',tekst:'Kunne ikke hente listen',under:e.message||'',gør:()=>{}}]);
    return;
  }
  const naar=t=>{
    const d=new Date(t); if(isNaN(d))return '';
    const m=Math.round((Date.now()-d.getTime())/60000);
    if(m<1)return 'lige nu'; if(m<60)return m+' min siden';
    if(m<1440)return Math.round(m/60)+' timer siden';
    return d.toLocaleDateString('da-DK',{day:'2-digit',month:'2-digit'});
  };
  const rk=liste.slice(0,12).map(p=>({
    ikon:p.id===cloudId?'●':'○',
    tekst:p.name||'(uden navn)',
    under:[p.folder||'', naar(p.updated_at), p.updated_by?'af '+p.updated_by:''].filter(Boolean).join(' · '),
    aktiv:p.id===cloudId,
    gør:()=>{
      if(p.id===cloudId)return;
      spoergGem('skifte projekt',async()=>{
        try{ await cloudOpen(p.id); setSync('åbnede '+(p.name||'')); mobilTitel(); }
        catch(e){ alert('Kunne ikke åbne projektet: '+(e.message||e)) }
      });
    }}));
  rk.push({skil:1});
  rk.push({ikon:'☁',tekst:'Alle projekter, mapper og versioner',under:'det fulde vindue',
    gør:()=>document.getElementById('bCloud').click()});
  rk.push({ikon:'＋',tekst:'Nyt projekt',gør:()=>document.getElementById('bNew').click()});
  openSheet('Skift projekt',rk);
}


/* Mindsk skriften, til teksten kan være i feltet. Mindste størrelse er 9px –
   derunder bliver det alligevel ulæseligt, og så klippes resten. */
function skrumpTekst(inp){
  if(!inp||!mobil) return;
  const start=14.5;
  inp.style.fontSize=start+'px';
  if(inp.scrollWidth<=inp.clientWidth+1) return;
  let fs=start, vagt=0;
  while(inp.scrollWidth>inp.clientWidth+1 && fs>8 && vagt++<28){
    fs-=0.5; inp.style.fontSize=fs+'px';
  }
}
function skrumpAlle(){
  if(!mobil) return;
  document.querySelectorAll('#plan .plabel').forEach(skrumpTekst);
}

/* ── Hvem er inde – på telefonen ───────────────────────────────
   På skrivebordet står navnene midt i hovedet. Der er ikke plads på en
   telefon, så vi viser et tal i topbjælken og navnene i et ark nedefra. */
function mobilHvem(){
  const mig=(meName()||'').toLowerCase(), nu=Date.now();
  return (presFolk||[]).filter(p=>{
    if(!p.who||p.who.toLowerCase()===mig)return false;
    const t=parseTS(p.at); return t && (nu-t.getTime())<60000;
  });
}
function opdaterMobilHvem(){
  const k=document.getElementById('mWho'), t=document.getElementById('mWhoTal');
  if(!k||!t)return;
  if(!cloudId&&!guestToken){ k.style.display='none'; return }
  k.style.display='';
  const andre=mobilHvem();
  if(presFejl){ t.textContent='⚠'; k.className='mbtn hvem advarsel';
    k.title='"Hvem er inde" kræver, at SQL\'en er kørt i databasen'; return }
  if(!andre.length){ t.textContent='●'; k.className='mbtn hvem alene';
    k.title='Ingen andre er inde i projektet lige nu'; return }
  t.textContent='●'+andre.length; k.className='mbtn hvem flere';
  k.title=andre.map(p=>p.who+' · '+(p.sted||'')).join('\n');
}
function visHvemMobil(){
  const andre=mobilHvem();
  if(presFejl){ alert('"Hvem er inde" virker ikke endnu:\n\n'+presFejl); return }
  const rk=andre.length
    ? andre.map(p=>({ikon:'●',tekst:p.who,under:(p.sted||'i projektet'),gør:()=>{}}))
    : [{ikon:'●',tekst:'Kun dig i projektet',under:'ingen andre er inde lige nu',gør:()=>{}}];
  openSheet('Hvem er inde', rk);
}

/* ================= autogem i browseren ================= */
const LS_DATA='signalflow:autosave', LS_CFG='signalflow:cloud';
let autoTimer=null, lastSaved=0;

function store(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

function setAuto(txt,warn){
 const n=document.getElementById('autoStatus');
 if(n){n.textContent=txt; n.className=warn?'warn':''}
}

/* Kaldes efter hver ændring. Skriver først når der har været ro i et sekund,
   så der ikke skrives ved hvert tastetryk. */
function autosave(){
 if(guestToken){if(typeof markDirty==='function')markDirty();return}
 clearTimeout(autoTimer);
 autoTimer=setTimeout(()=>{
  const nu=Date.now();
  const ok=store(LS_DATA, JSON.stringify({name:projectName,job:job,pages,plan:plan,blocks:blocks,ts:nu,cloudId:cloudId}));
  lokalTs=nu;                       // vores kopi er fra nu
  lastSaved=Date.now();
  setAuto(ok?'gemt '+new Date().toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'})
            :'kan ikke gemme lokalt', !ok);
 },900);
 if(typeof markDirty==='function'&&!applyingRemote)markDirty();
}
window.addEventListener('beforeunload',()=>{
 clearTimeout(autoTimer);
 /* Den samme kopi som autosave skriver – jobbets dage skal med her også,
    ellers tørrer den dem af hver gang siden lukkes eller genindlæses. */
 store(LS_DATA, JSON.stringify({name:projectName,job:job,pages,plan:plan,blocks:blocks,ts:Date.now(),cloudId:cloudId}));
});

/* Ved start: genoptag hvor du slap */
let lokalTs=0;          // hvornår den lokale kopi sidst blev gemt
function restoreAuto(){
 /* Peger adressen på et bestemt projekt, skal vi hente DET – ikke det
    man tilfældigvis lavede sidst på den her telefon. */
 const q=new URLSearchParams(location.search);
 if(q.get('p')||q.get('t'))return false;
 const raw=load(LS_DATA); if(!raw)return false;
 try{
  const d=JSON.parse(raw);
  if(!d.pages||!d.pages.length)return false;
  lokalTs=+d.ts||0;
  pages=sikrePageIds(d.pages); plan=d.plan||blankPlan(); ryddLuft(pages); ryddLuft(pages); blocks=d.blocks||blankBlocks(); projectName=d.name||projectName;
  /* En lokal kopi gemt før jobbets dage fandtes, har ingen – og så skal de
     dage, der står nu, blive stående i stedet for at blive ryddet. */
  fletJob(d);
  cloudId=d.cloudId||null;
  activePage=0; doc=pages[0];
  const when=new Date(d.ts||Date.now());
  setAuto('genoptaget '+when.toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'}));
  return true;
 }catch(e){return false}
}

/* Supabase viser adressen med /rest/v1/ bagpå. Vi sætter den selv på,
   så den fjernes her, uanset hvordan brugeren har indsat den. */
function baseUrl(u){
 return String(u||'').trim().replace(/\/+$/,'').replace(/\/rest\/v1$/i,'');
}

/* ---- login ---- */
const session=()=>{try{return JSON.parse(load(LS_SESSION)||'null')}catch(e){return null}};
const setSession=s=>{s?store(LS_SESSION,JSON.stringify(s)):localStorage.removeItem(LS_SESSION)};
const userName=()=>{const s=session();return s&&s.email?s.email:''};

async function authCall(grant,body){
 const c=cfg();
 if(!c.url||!c.key)throw new Error('Databasen er ikke sat op endnu.');
 let r;
 try{
  r=await fetch(baseUrl(c.url)+'/auth/v1/token?grant_type='+grant,{
   method:'POST',
   headers:{'apikey':c.key,'Content-Type':'application/json'},
   body:JSON.stringify(body)});
 }catch(e){throw new Error('Kunne ikke få forbindelse til serveren.')}
 const t=await r.text();
 let d={}; try{d=JSON.parse(t)}catch(e){}
 if(!r.ok){
  const m=(d.error_description||d.msg||d.message||'').toLowerCase();
  if(m.includes('invalid'))throw new Error('Forkert e-mail eller adgangskode.');
  if(m.includes('confirm'))throw new Error('Brugeren er ikke bekræftet endnu. Bekræft e-mailen, eller slå bekræftelse fra i Supabase.');
  throw new Error(d.error_description||d.msg||('Login mislykkedes ('+r.status+')'));
 }
 return d;
}
async function signIn(email,password){
 const d=await authCall('password',{email:email,password:password});
 setSession({access_token:d.access_token,refresh_token:d.refresh_token,
             email:(d.user&&d.user.email)||email});
 return true;
}
async function refreshSession(){
 const s=session(); if(!s||!s.refresh_token)return false;
 try{
  const d=await authCall('refresh_token',{refresh_token:s.refresh_token});
  setSession({access_token:d.access_token,refresh_token:d.refresh_token,email:s.email});
  return true;
 }catch(e){setSession(null);return false}
}
function signOut(){
 /* ── Serveren skal også vide det ──────────────────────────────────
    Logout ryddede før KUN op her på maskinen. Login-nøglen – både den
    korte og den lange, der kan hente en ny – blev liggende gyldig hos
    Supabase. Havde nogen kopieret dem ud af browseren, virkede de
    videre, selv om man havde trykket log ud.

    scope=local: kun DENNE browser logges ud. Arbejder man på to
    skærme, eller har man East Production åben på iPaden, bliver man
    ikke smidt ud der. Valgt bevidst 21.10.2026; 'global' ville lukke
    alle enheder og begge programmer på én gang.

    Kaldet ventes der IKKE på, og en fejl stopper ingenting: er nettet
    væk, skal den lokale oprydning nedenfor stadig ske. Det værste, der
    kan ske, er, at nøglen bliver liggende hos Supabase til den udløber
    af sig selv – og det var situationen før. */
 try{
  const s=session(), c=cfg();
  if(s&&s.access_token&&c.url&&c.key){
   fetch(baseUrl(c.url)+'/auth/v1/logout?scope=local',
     {method:'POST',
      headers:{'apikey':c.key,'Authorization':'Bearer '+s.access_token}})
    .catch(function(){});
  }
 }catch(e){}

 setSession(null); cloudId=null;
 /* den lokale kopi ryddes, så næste bruger af maskinen ikke kan se noget */
 try{localStorage.removeItem(LS_DATA)}catch(e){}
 pages=[blank()]; activePage=0; doc=pages[0]; plan=blankPlan(); blocks=null;
 projectName='Nyt projekt'; job=tomtJob(); lastSync=null; dirty=false;
 clearInterval(syncTimer);
 if(typeof lockOut==='function')lockOut();
}

async function sbFetch(path,opts,retried){
 const c=cfg();
 if(!c.url||!c.key)throw new Error('Databasen er ikke sat op endnu.');
 const s=session();
 if(!s)throw new Error('Du er ikke logget ind.');
 let r;
 try{
  /* Object.assign erstatter hele headers-objektet, hvis kaldet selv har et.
     Så røg apikey og login med – og svaret blev 401. Vi fletter dem i stedet. */
  const o=opts||{};
  const hoveder=Object.assign(
    {'apikey':c.key,'Authorization':'Bearer '+s.access_token,
     'Content-Type':'application/json','Prefer':'return=representation'},
    o.headers||{});
  r=await fetch(baseUrl(c.url)+'/rest/v1/'+path,
    Object.assign({},o,{headers:hoveder}));
 }catch(e){
  throw new Error('Kunne ikke få forbindelse. Tjek projekt-URL og at du er på nettet.');
 }
 if(r.status===401&&!retried){
  /* adgangen er udløbet – forny og prøv igen én gang */
  if(await refreshSession())return sbFetch(path,opts,true);
  if(typeof lockOut==='function')lockOut();
  throw new Error('Du er blevet logget ud. Log ind igen.');
 }
 if(r.status===401||r.status===403)
  throw new Error('Adgang nægtet. Tjek at din bruger har adgang i reglerne på tabellen.');
 if(r.status===404)
  throw new Error('Tabellen findes ikke. Kør SQL-koden i opsætningen.');
 if(!r.ok)throw new Error('Databasen svarede '+r.status+': '+(await r.text()).slice(0,140));
 const t=await r.text();
 return t?JSON.parse(t):null;
}

-- ===== Ryd ALLE adgangsregler først =====
-- Vigtigt, og lært den hårde vej: adgangsregler lægges sammen med ELLER.
-- Én gammel regel, der siger "alle må", slår fire nye, der siger "kun den
-- der er logget ind". Derfor kan man ikke lukke en tabel ved at tilføje
-- lukkede regler ved siden af de gamle.
--
-- "drop policy if exists" på navne, vi selv kender, er ikke nok. Tabellerne
-- her er år gamle, og der lå regler med navne som "Enable all access for
-- all users", oprettet dengang tabellen blev lavet. De skal væk, uanset hvad
-- de hedder. Blokken herunder slår dem op i databasen i stedet for at gætte.
--
-- Tabeller, der ikke findes endnu, springes over – de får deres regler
-- længere nede i filen og har ingen gamle at rydde.
do $$
declare
  t text;
  p text;
  n int := 0;
begin
  foreach t in array array[
    'signalflow_projects', 'signalflow_versions', 'signalflow_presence',
    'signalflow_shares',   'signalflow_vc_biblioteker',
    'signalflow_vc_containere', 'signalflow_lydplaner',
    'equipment', 'categories'
  ] loop
    if to_regclass('public.' || t) is null then
      continue;
    end if;
    for p in
      select pol.polname from pg_policy pol
       where pol.polrelid = to_regclass('public.' || t)
    loop
      execute format('drop policy %I on public.%I', p, t);
      n := n + 1;
    end loop;
  end loop;
  raise notice 'gamle adgangsregler fjernet: %', n;
end $$;

-- Slå en nøgle op: først i den nye tabel, ellers i den gamle kolonne
create or replace function sf_share_pid(tok uuid)
returns uuid language sql stable security definer set search_path = public as $$
  select coalesce(
    (select s.project_id from signalflow_shares s where s.token = tok),
    (select p.id from signalflow_projects p where p.share_token = tok)
  )
$$;

-- Lav – eller genbrug – linket til ét bestemt projekt
create or replace function sf_share_make(pid uuid, who text)
returns uuid language plpgsql security definer set search_path = public as $$
declare tok uuid;
begin
  if auth.uid() is null then
    raise exception 'Du skal være logget ind for at dele en plan.';
  end if;
  if not exists (select 1 from signalflow_projects where id = pid) then
    raise exception 'Projektet findes ikke.';
  end if;
  select s.token into tok from signalflow_shares s where s.project_id = pid;
  if tok is not null then return tok; end if;
  select p.share_token into tok from signalflow_projects p where p.id = pid;
  if tok is null then tok := gen_random_uuid(); end if;
  insert into signalflow_shares (token, project_id, created_by)
  values (tok, pid, coalesce(who,''))
  on conflict (project_id) do update set token = excluded.token
  returning signalflow_shares.token into tok;
  update signalflow_projects set share_token = tok where id = pid;
  return tok;
end $$;

-- Er der overhovedet udstyr i en plan? Bruges som værn nedenfor.
create or replace function sf_plan_tom(pl jsonb)
returns boolean language sql immutable set search_path = public as $$
  select not exists (
    select 1
      from jsonb_each(case when jsonb_typeof(pl)='object' then pl else '{}'::jsonb end) omr
      cross join lateral jsonb_array_elements(
        case when jsonb_typeof(omr.value->'devices')='array'
             then omr.value->'devices' else '[]'::jsonb end) d
  )
$$;

create or replace function sf_plan_set(tok uuid, newplan jsonb, who text)
returns timestamptz language plpgsql security definer set search_path = public as $$
declare ts timestamptz; pid uuid; gammel jsonb;
begin
  pid := sf_share_pid(tok);
  if pid is null then return null; end if;
  select p.data->'plan' into gammel from signalflow_projects p where p.id = pid;
  -- Et sidste værn: en gæst, der lige har mistet forbindelsen, kan nå at
  -- sende sin tomme startplan. Den må aldrig tørre en plan ud, der har
  -- noget i sig. Slettet udstyr bliver staaende med et sletningstidspunkt,
  -- saa en rigtig sletning bliver ikke stoppet her.
  if sf_plan_tom(newplan) and not sf_plan_tom(gammel) then
    select p.updated_at into ts from signalflow_projects p where p.id = pid;
    return ts;
  end if;
  update signalflow_projects
     set data = jsonb_set(coalesce(data,'{}'::jsonb), '{plan}', newplan, true),
         updated_by = coalesce(who,''), updated_at = now()
   where id = pid
   returning updated_at into ts;
  return ts;
end $$;

-- Gæster på et delelink har ikke login, så de melder sig gennem disse to.
-- ⚠  NAVNET HER ER SELVOPLYST, IKKE VERIFICERET IDENTITET.
--    Gæsten sender selv 'hvem', og who er primærnøglen. En gæst med
--    linket kan derfor skrive det samme navn som en kollega og
--    overskrive den kollegas linje i "hvem er inde nu". Det giver
--    ikke adgang til andet — tokenet afgør stadig hvilket projekt —
--    men visningen kan manipuleres, og den må ikke bruges som bevis
--    for, hvem der har rørt hvad. Det er ændringsloggen på hver
--    linje, der svarer på det.
--    Skal det lukkes, skal who være et tilfældigt gæste-id og navnet
--    et almindeligt felt. Det ændrer presence-modellen og står som
--    et åbent punkt.
--
--  Længderne: who er primærnøgle, og uden en grænse kunne en gæst
--  skrive vilkårligt lange navne hvert tiende sekund og fylde
--  tabellen. 80 og 120 tegn er rigeligt til initialer og et stednavn.
--  Kontroltegn ryddes: de kan ikke ses, og to navne, der ser ens ud,
--  men ikke er det, giver to linjer for samme person.
create or replace function sf_pres_set(tok uuid, hvem text, hvor text)
returns void language plpgsql security definer set search_path = public as $$
declare
  pid uuid;
  h   text;
  s   text;
begin
  pid := sf_share_pid(tok);
  if pid is null then return; end if;

  h := left(btrim(regexp_replace(coalesce(hvem,''), '[[:cntrl:]]', '', 'g')),  80);
  s := left(btrim(regexp_replace(coalesce(hvor,''), '[[:cntrl:]]', '', 'g')), 120);
  if h = '' then h := 'gæst'; end if;

  insert into signalflow_presence(project_id, who, sted, at)
  values (pid, h, nullif(s,''), now())
  on conflict (project_id, who) do update set sted = excluded.sted, at = now();
end $$;

create or replace function sf_pres_get(tok uuid)
returns table(who text, sted text, at timestamptz)
language sql stable security definer set search_path = public as $$
  select p.who, p.sted, p.at from signalflow_presence p
   where p.project_id = sf_share_pid(tok) and p.at > now() - interval '1 minute';
$$;

-- ═══════════════════════════════════════════════════════════════
--  TIL SIDST · RETTIGHEDERNE
--
--  Adgangsregler og PostgreSQL-rettigheder er to forskellige lag.
--  En regel, der kræver login, hjælper ikke, hvis rollen bagved
--  stadig har select på tabellen. Og en rolle med rettigheden kan
--  ikke nå noget, hvis der ikke også er en regel. Der skal være
--  begge.
--
--  ⚠  LÆS DENNE FØR DU KØRER FILEN I EN ANDEN DATABASE
--
--  Sætningerne "on all tables in schema public" rammer SAMTLIGE
--  tabeller i public — ikke kun SignalFlows. I vores opsætning er
--  det med vilje: SignalFlow og East Production deler database, og
--  begge kræver login overalt. Men kører nogen filen i en database,
--  hvor en anden løsning bevidst har anonym adgang til en tabel,
--  lukker den den løsning ned.
--
--  Står til SIDST med vilje: sætningerne rammer kun de tabeller,
--  der findes, når de kører. Stod de midt i filen, ville de
--  tabeller, der oprettes nedenfor, få rettighederne igen.
-- ═══════════════════════════════════════════════════════════════

-- ── Den, der ikke er logget ind, skal ingenting kunne ───────────
revoke all on all tables    in schema public from anon;
revoke all on all sequences in schema public from anon;

-- ── Den, der ER logget ind, skal kunne arbejde ──────────────────
--
--  Hvorfor det står her: filen tilbagekaldte før kun fra anon og
--  regnede med, at Supabase af sig selv havde givet authenticated
--  rettighederne. Det gør Supabase, men filen var dermed afhængig
--  af en standard, den ikke selv satte — og en prøve, der har den
--  standard bygget ind, beviser ingenting om filen. Nu sætter den
--  det selv.
--
--  Hvorfor det er bredt og ikke tabel for tabel: afgrænsningen
--  ligger i ADGANGSREGLERNE ovenfor, ikke her. Uden en tillladende
--  regel er en kommando spærret, uanset rettigheden — derfor kan
--  signalflow_versions ikke slettes i, selv med delete-rettighed:
--  den har kun en regel for select og insert. Skriver man
--  afgrænsningen begge steder, skal den vedligeholdes begge steder,
--  og den dag de to ikke passer sammen, er det reglerne, der
--  gælder. Så står der noget i filen, der ikke er sandt.
--
--  Og det ville give et forkert indtryk: alle, der er logget ind,
--  kan i dag alt. Det står som et åbent punkt i gennemgangen. Skal
--  der skelnes — fx så kun få kan slette udstyr — er det reglerne
--  ovenfor, der skal ændres, og så kan denne linje snævres ind
--  samtidig.
grant usage on schema public to authenticated;
grant select, insert, update, delete
  on all tables in schema public to authenticated;
grant usage, select on all sequences in schema public to authenticated;

-- ── Funktionerne ────────────────────────────────────────────────
--
--  PostgreSQL giver execute til PUBLIC af sig selv på hver ny
--  funktion, og anon er en del af PUBLIC. Rettigheden følger med,
--  hvis man ikke tager den — og et eftersyn, der kun spørger "må
--  anon kalde den?", svarer ja på alt og lyder beroligende.
--
--  Filen tog den før kun fra fire af dem. sf_plan_ts, sf_pres_set,
--  sf_pres_get, sf_touch og sf_vc_touch stod tilbage med nedarvet
--  PUBLIC. For de tre første var gæsteadgang tilsigtet, så det
--  virkede — men rettigheden var ikke givet, den fulgte med, og en
--  rettighed ingen har givet, er ikke til at forsvare.
--
--  Blokken herunder gætter ikke på navne: den tager PUBLIC fra
--  ALLE funktioner i public, der ikke tilhører en udvidelse.
--  Udvidelserne springes over gennem pg_depend — pg_trgm,
--  pgcrypto og uuid-ossp lægger deres egne funktioner i samme
--  skema, og tager man PUBLIC-rettigheden fra dem, holder
--  indekser og almindelige forespørgsler op med at virke.
--
--  ⚠  OG KUN SIGNALFLOWS EGNE. Denne blok tog 21.10.2026 kl. 23
--     rettigheden fra ALLE funktioner i public og gav kun
--     SignalFlows fem tilbage. East Productions fire
--     pakkeliste-funktioner blev liggende lukkede, og linket til en
--     pakkeliste holdt op med at virke, til de blev givet igen.
--
--     Derfor 'sf\_%' herunder: filen rører kun det, den selv har
--     lavet. Hvert program rydder op efter sig selv. Skal hele
--     databasen gennemgås — også funktioner, ingen af programmerne
--     ejer — er det funktioner_luk.sql, der gør det, og den kender
--     alle ni gæstefunktioner.
do $$
declare
  f record;
  n int := 0;
begin
  for f in
    select p.proname, pg_get_function_identity_arguments(p.oid) as args
      from pg_proc p
      join pg_namespace nn on nn.oid = p.pronamespace
     where nn.nspname = 'public'
       -- kun vores egne. 'sf\_' med escape, ellers er _ et jokertegn
       -- der matcher ét vilkårligt tegn — og så rammer den ep_pack også.
       and p.proname like 'sf\_%'
       and not exists (select 1 from pg_depend d
                        where d.objid = p.oid
                          and d.classid = 'pg_proc'::regclass
                          and d.deptype = 'e')
  loop
    execute format('revoke all on function public.%I(%s) from public',
                   f.proname, f.args);
    execute format('revoke all on function public.%I(%s) from anon',
                   f.proname, f.args);
    execute format('grant execute on function public.%I(%s) to authenticated',
                   f.proname, f.args);
    n := n + 1;
  end loop;
  raise notice 'SignalFlows egne funktioner: PUBLIC fjernet fra %', n;
end $$;

-- Og så DE FEM, gæsten skal kunne kalde — og kun de fem.
-- Gæstelinket går ikke gennem tabellerne, men gennem disse, der
-- hver især slår op gennem tokenet og kun kan nå det ene projekt,
-- nøglen hører til.
--
-- ⚠  LINKET ER ET PASSWORD. sf_plan_set kan SKRIVE. Den, der har
--    linket, kan rette planen uden at logge ind. Det er med vilje —
--    det er sådan det bruges — men det betyder, at et delt link
--    skal behandles som en adgangskode, og at det bør have udløb og
--    en knap til at trække det tilbage. Begge står som åbne punkter.
grant execute on function public.sf_plan_get(uuid)              to anon;
grant execute on function public.sf_plan_set(uuid, jsonb, text) to anon;
grant execute on function public.sf_plan_ts(uuid)               to anon;
grant execute on function public.sf_pres_get(uuid)              to anon;
grant execute on function public.sf_pres_set(uuid, text, text)  to anon;

-- Disse skal gæsten IKKE kunne kalde. sf_share_make laver et
-- gæstelink; den spørger selv om login, men nu er den dækket af to
-- spærringer i stedet for én. sf_share_pid og sf_plan_tom kaldes
-- kun af de andre funktioner. sf_touch og sf_vc_touch er
-- triggerfunktioner — de fyrer uanset rettigheden, for den tjekkes
-- når triggeren oprettes, ikke når den fyrer. Det er efterprøvet.
--   (de har allerede mistet PUBLIC i blokken ovenfor; her står kun,
--    at de ikke får anon tilbage)

-- ── Fremtidige tabeller ─────────────────────────────────────────
--  Sætningerne ovenfor rammer det, der findes NU. En tabel, der
--  oprettes i morgen, får Supabases standardrettigheder, og dem
--  har anon del i. Det kan ændres med
--
--    alter default privileges in schema public revoke all on tables from anon;
--
--  men den gælder kun objekter, der fremover oprettes af DEN ROLLE,
--  kommandoen køres som. Derfor står den ikke her: den skal
--  afstemmes med den rolle, der faktisk opretter tabellerne i
--  Supabase, og det skal gøres vidende. Find rollen med
--
--    select tableowner, count(*) from pg_tables
--     where schemaname='public' group by 1;
--
--  Indtil da er værnet princippet: enhver ny tabel får
--  adgangskontrol og fire regler i samme ændring, som tabellen
--  oprettes.`;

/* ── Jobbets dage ──────────────────────────────────────────────
   Udstyr er aldrig ledigt i sig selv – kun i forhold til en periode. Derfor
   har projektet en start og en slut. Det er dem, ledig/optaget regnes ud fra,
   og det er dem East Production booker på, når den henter udstyret herfra. */
function tomtJob(){ return {start:'',slut:'',sted:'',note:'',at:0,by:''} }
function setJob(d){ job=Object.assign(tomtJob(), (d&&d.job)||{}) }
const jobSat=j=>!!(j&&j.start&&j.slut);
/* Dagene er ÉN værdi for hele jobbet, men de kommer ind fra flere sider:
   vores egen maskine, serveren, en kollegas fane, en gammel version. Alt
   andet i appen flettes efter stempel – nyeste vinder – og dagene var det
   eneste, der bare blev overskrevet. Derfor forsvandt de: et objekt er
   sandt også når det er tomt, så en kopi gemt FØR nogen tastede dagene
   ind, tørrede dem af ved næste poll.
   Reglen her: en tom udgave vinder aldrig over en udfyldt, og en ældre
   vinder aldrig over en nyere. */
function fletJob(d){
 const deres=(d&&d.job)||null;
 if(!deres)return false;
 if(!jobSat(deres)&&jobSat(job))return false;
 if((+deres.at||0)<(+job.at||0))return false;
 const foer=job.start+'|'+job.slut+'|'+job.sted;
 setJob(d);
 return foer!==job.start+'|'+job.slut+'|'+job.sted;
}
const harJob=()=>!!(job.start&&job.slut);
/* East Production søger på projektets egne kolonner, så dagene står to
   steder. Er de væk inde i data – en kopi fra før dagene fandtes – så er
   kolonnerne den sidste, der stadig ved det. */
function jobFraRaekke(r){
 if(!r||harJob())return false;
 if(!r.job_start||!r.job_end)return false;
 job=Object.assign(tomtJob(),{start:r.job_start,slut:r.job_end,sted:r.job_sted||''});
 return true;
}
/* 'YYYY-MM-DDTHH:mm' – samme format som datetime-local, og det kan
   sammenlignes som almindelig tekst, fordi det går fra stort til småt. */
function jobDato(s2){
 if(!s2)return '';
 const d=new Date(s2);
 return isNaN(d)?String(s2).slice(0,16):
   d.toLocaleString('da-DK',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function jobTekst(){
 if(!harJob())return 'ingen datoer';
 return jobDato(job.start)+' – '+jobDato(job.slut)+(job.sted?' · '+job.sted:'');
}
/* Den korte form, til forklaringsboksen. Er det samme dag, er datoen nok
   én gang og så klokkeslættene – ellers de to dage. */
function jobKort(){
 if(!harJob())return '';
 const d=x=>{const t=new Date(x); return isNaN(t)?String(x).slice(0,10)
   :t.toLocaleDateString('da-DK',{day:'2-digit',month:'2-digit',year:'numeric'})};
 const k=x=>{const t=new Date(x); return isNaN(t)?''
   :t.toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'})};
 return dagAf(job.start)===dagAf(job.slut)
   ? d(job.start)+' · '+k(job.start)+'–'+k(job.slut)
   : d(job.start)+' – '+d(job.slut);
}
/* to perioder rører hinanden, når den ene begynder før den anden slutter */
const perioderKrydser=(a1,a2,b1,b2)=>!!(a1&&a2&&b1&&b2) && String(a1)<String(b2) && String(b1)<String(a2);

/* Kolonnerne job_start/job_end findes måske ikke i basen endnu. Vi spørger
   én gang og husker svaret – ellers ville en manglende kolonne vælte hver
   eneste gemning. */
let jobKol=null;
async function jobKolonner(){
 if(jobKol!==null)return jobKol;
 try{ await sbFetch('signalflow_projects?select=job_start&limit=1'); jobKol=true }
 catch(e){ jobKol=false }
 return jobKol;
}
async function jobFelter(){
 if(!(await jobKolonner()))return {};
 return {job_start:job.start||null, job_end:job.slut||null, job_sted:job.sted||null};
}

/* ── Udstyret på kortene ───────────────────────────────────────
   Et kamera er ikke ét stykke udstyr, men en stak: først en optik, så et
   kamerahus, så et stativ. Hver plads peger på en vare i det fælles lager.
   Lyd og video har ingen pladser endnu – de får dem ved at blive skrevet ind
   her, så virker resten af sig selv. */
const UDSTYR_PLADSER={
 kam:[{k:'optik', navn:'Optik',  kat:'optik',  tom:'Vælg optik'},
      {k:'krop',  navn:'Kamera', kat:'kamera', tom:'Vælg kamera'},
      {k:'stativ',navn:'Stativ', kat:'stativ', tom:'Vælg stativ'}],
 /* Lydkortet er typen – "WL rack". Boksen siger, hvilken af dem fra lageret
    det er, og om den er ledig i jobbets dage. Flere pladser kan skrives ind
    her, så følger bokse, vælger, ledighed, print og booking med af sig selv. */
 lyd:[{k:'enhed', navn:'Udstyr', kat:'', tom:'Vælg enhed', fraNavn:true}],
 video:[{k:'enhed', navn:'Udstyr', kat:'', tom:'Vælg enhed', fraNavn:true}],
 net:[{k:'enhed', navn:'Udstyr', kat:'', tom:'Vælg enhed', fraNavn:true}],
 freq:[]
};
const pladserFor=d2=>UDSTYR_PLADSER[d2]||[];
const pladsFind=(d2,k)=>pladserFor(d2).find(p=>p.k===k);
const udstyrPaa=(dv,k)=>{const v=((dv&&dv.udstyr)||{})[k]; return (v&&v.id)?v:null};
const udstyrTid=dv=>Math.max(0,...Object.keys((dv&&dv.udstyr)||{}).map(k=>dv.udstyr[k].at||0));

/* ── Er udstyret ledigt? ──────────────────────────────────────
   Bookingerne bor i East Productions egen jobs-tabel: hvert job har en
   periode og en liste over det udstyr, der er taget. Vi lægger det sammen
   for de job, der rører vores dage, og holder det op mod antallet på
   lageret. Oven i det tæller vi de andre SignalFlow-projekters kladder med,
   så to tegninger ikke griber efter den samme optik, før nogen af dem er
   hentet ind i East Production. */
const BOOK_TAB='signalflow_bookinger';
const dagAf=x=>String(x||'').slice(0,10);
/* Bookinger går på dage, og begge dage tæller med: et job 12.-14. og et job
   14.-16. deles om den 14. */
const dageKrydser=(a1,a2,b1,b2)=>!!(a1&&a2&&b1&&b2)
  && dagAf(a1)<=dagAf(b2) && dagAf(b1)<=dagAf(a2);

let epJobs=null, sfKladder=null, bookHentet=0, bookFejl='';
function bookingerRydCache(){ epJobs=null; sfKladder=null; bookHentet=0 }

/* East Production gemmer sit udstyr i items som [{name, qty}] og slår op på
   NAVNET – ikke på id. Vi gør præcis det samme, så de to programmer tæller
   det samme stykke udstyr. */
function jobUdstyr(j){
 const it=j&&j.items;
 if(!Array.isArray(it))return [];
 const tal=x=>{const n=parseInt(x,10); return isNaN(n)?1:Math.max(1,n)};
 return it.map(o=>typeof o==='string'?{navn:o,antal:1}
   :(o&&o.name?{navn:String(o.name),antal:tal(o.qty)}:null)).filter(Boolean);
}
const navnLig=(a2,b2)=>String(a2||'').trim().toLowerCase()===String(b2||'').trim().toLowerCase();

async function bookingerHent(force){
 if(epJobs&&!force&&Date.now()-bookHentet<30000)return;
 const fejl=[];
 try{ epJobs=await sbFetch('jobs?select=id,name,who,start_date,end_date,status,items') }
 catch(e){ epJobs=[]; fejl.push('jobs: '+(e.message||'')) }
 /* de andre SignalFlow-projekters kladder – tabellen findes måske ikke endnu */
 /* hentet_job_id skal med: det er den, der fortæller hvilket job i East
    Production der ER dette projekt. Uden den regner projektet sit eget
    udstyr som optaget af en fremmed, så snart det er hentet ind. */
 try{ sfKladder=await sbFetch(BOOK_TAB+'?select=project_id,project_name,job_start,job_end,equipment_id,equipment_name,qty,hentet_job_id') }
 catch(e){ sfKladder=[] }
 bookFejl=fejl.join(' · ');
 bookHentet=Date.now();
}

/* hvem har fat i det her udstyr i vores dage – og hvor meget */
/* Hvilke job i East Production er dette projekt?
   Når East Production henter bookingen ind, stempler den jobbets id på
   vores egne rækker i broen. Dem skal vi kende igen: ellers står projektet
   og melder sit eget udstyr optaget – af sig selv. */
function egneEpJob(){
 const mine={};
 /* 1. Stemplet. Det er det præcise: East Production skriver jobbets id på
       vores egne linjer i broen, når den henter dem ind. */
 if(cloudId){
  (sfKladder||[]).forEach(b=>{
   if(String(b.project_id)!==String(cloudId))return;
   if(b.hentet_job_id) mine[String(b.hentet_job_id)]='stempel';
  });
 }
 /* 2. Navn og dage. Stemplet kan mangle: adgangsreglerne kan have slået
       opdateringen fra, jobbet kan være oprettet i hånden dernede, eller
       East Production kan være en ældre udgave. Et job, der hedder det
       samme som projektet OG ligger i de samme dage, ER dette projekt.
       To produktioner med samme navn i samme dage findes ikke. */
 const navn=(projectName||'').trim().toLowerCase();
 if(navn && navn!=='nyt projekt' && harJob()){
  (epJobs||[]).forEach(j=>{
   if((j.name||'').trim().toLowerCase()!==navn)return;
   if(!dageKrydser(job.start,job.slut,j.start_date,j.end_date))return;
   if(!mine[String(j.id)]) mine[String(j.id)]='navn';
  });
 }
 return mine;
}
/* Hvad holder vores EGET job i East Production af den her? Det tæller ikke
   mod os – men man skal kunne se, at det er genkendt. Ellers sidder man og
   gætter på, om tallet er rigtigt. */
function egetTaget(eqId){
 if(!harJob()||!eqId)return null;
 const eq=(lagerRows||[]).find(e=>String(e.id)===String(eqId));
 const navn=eq?eq.name:'';
 if(!navn)return null;
 const mine=egneEpJob();
 let antal=0, jobnavn='', hvordan='';
 (epJobs||[]).forEach(j=>{
  if(!mine[String(j.id)])return;
  if(!dageKrydser(job.start,job.slut,j.start_date,j.end_date))return;
  jobUdstyr(j).forEach(u=>{ if(navnLig(u.navn,navn)){
   antal+=u.antal; jobnavn=j.name||''; hvordan=mine[String(j.id)]; } });
 });
 return antal ? {antal:antal, navn:jobnavn, hvordan:hvordan} : null;
}
function optagetAf(eqId){
 if(!harJob()||!eqId)return [];
 const eq=(lagerRows||[]).find(e=>String(e.id)===String(eqId));
 const navn=eq?eq.name:'';
 if(!navn)return [];
 const ud=[];
 const mineJob=egneEpJob();
 (epJobs||[]).forEach(j=>{
  /* Vores eget job i East Production tæller ikke mod os selv – det ER
     den her tegning, bare hentet ind. */
  if(mineJob[String(j.id)])return;
  if(!dageKrydser(job.start,job.slut,j.start_date,j.end_date))return;
  jobUdstyr(j).forEach(u=>{ if(navnLig(u.navn,navn))
   ud.push({navn:(j.name||'et job i East Production')
             +((j.status||'')==='tilbud'?' (tilbud)':''),
            antal:u.antal, fra:j.start_date, til:j.end_date}) });
 });
 (sfKladder||[]).forEach(b=>{
  if(String(b.project_id)===String(cloudId||'-'))return;
  /* Er bookingen hentet ind i East Production, ER den et job dernede – og
     det job er allerede talt med ovenfor. Uden den her linje tæller et
     andet projekts udstyr dobbelt: én gang som job, én gang som kladde. */
  if(b.hentet_job_id)return;
  if(!navnLig(b.equipment_name,navn))return;
  if(!dageKrydser(job.start,job.slut,b.job_start,b.job_end))return;
  ud.push({navn:(b.project_name||'et andet SignalFlow-projekt')+' (ikke hentet ind endnu)',
           antal:Math.max(1,parseInt(b.qty,10)||1), fra:b.job_start, til:b.job_end});
 });
 return ud;
}
function ledigStatus(eqId){
 if(!eqId)return {k:'tom',tekst:'',taget:0,antal:0};
 if(!harJob())return {k:'ukendt',tekst:'projektet har ingen dage endnu',taget:0,antal:0};
 if(epJobs===null)return {k:'ukendt',tekst:'henter bookinger …',taget:0,antal:0};
 const eq=(lagerRows||[]).find(e=>String(e.id)===String(eqId));
 const antal=Math.max(1,parseInt((eq&&eq.qty)||1,10)||1);
 const t=optagetAf(eqId);
 const taget=t.reduce((n,x)=>n+x.antal,0);
 const hvem=t.map(x=>'· '+x.navn+' ('+x.antal+' stk., '+dagAf(x.fra)+'–'+dagAf(x.til)+')').join('\n');
 if(bookFejl&&!t.length)return {k:'ukendt',tekst:bookFejl,taget:0,antal:antal};
 /* Er projektet hentet ind i East Production, står vores eget udstyr som
    booket dernede. Det tæller ikke mod os selv – men det skal stå, så man
    kan se at det ER set, i stedet for at tro at tallet er forkert. */
 const eget=egetTaget(eqId);
 const egetTekst = eget
   ? '\n· '+eget.antal+' stk. står på dette projekts egen booking i East '
     +'Production'+(eget.navn?' ("'+eget.navn+'")':'')+' – den tæller ikke med'
   : '';
 if(taget+1>antal)return {k:'optaget',taget:taget,antal:antal,
   tekst:'alle '+antal+' er taget i dine dage:\n'+hvem+egetTekst};
 if(taget)return {k:'presset',taget:taget,antal:antal,
   tekst:taget+' af '+antal+' er taget:\n'+hvem+egetTekst};
 return {k:'ledig',taget:0,antal:antal,
   tekst:'ledig · '+antal+' på lageret'+egetTekst};
}
const LEDIGORD={ledig:'ledig',presset:'næsten optaget',optaget:'optaget',ukendt:'ukendt',tom:''};

/* de rækker East Production skal kunne hente */
function bookingRaekker(){
 if(!cloudId||!harJob())return [];
 const ud=[], hvem=(cfg().who||userName().split('@')[0]||'');
 Object.keys(PLANDOMS).forEach(d2=>{
  const pl=pladserFor(d2); if(!pl.length)return;
  alive(planDevices(ensurePlan(),d2)).forEach(dv=>{
   pl.forEach(p=>{
    const v=udstyrPaa(dv,p.k); if(!v)return;
    ud.push({ref:cloudId+'|'+dv.id+'|'+p.k, project_id:cloudId, project_name:projectName,
      job_start:job.start, job_end:job.slut, job_sted:job.sted||'',
      dom:d2, dev_id:dv.id, dev_name:dv.name||'', plads:p.k, plads_navn:p.navn,
      equipment_id:v.id, equipment_name:v.navn, qty:1,
      updated_by:hvem, updated_at:new Date().toISOString()});
   });
  });
 });
 return ud;
}
/* Kaldes efter hver gemning. Må aldrig vælte gemningen – findes tabellen
   ikke endnu, går vi bare videre. */
async function bookingerSkriv(){
 if(!cloudId||!session())return;
 const r=bookingRaekker();
 try{
  if(r.length)
   await sbFetch(BOOK_TAB+'?on_conflict=ref',{method:'POST',
     headers:{'Prefer':'return=minimal,resolution=merge-duplicates'},
     body:JSON.stringify(r)});
  const beholdt=r.map(x=>'"'+encodeURIComponent(x.ref)+'"').join(',');
  await sbFetch(BOOK_TAB+'?project_id=eq.'+cloudId
    +(r.length?'&ref=not.in.('+beholdt+')':''),
    {method:'DELETE',headers:{'Prefer':'return=minimal'}});
  bookingerRydCache();
 }catch(e){ /* tabellen findes måske ikke endnu */ }
}

/* De tre bokse i kortets topbjælke. Prikken til venstre siger, om det er
   ledigt i jobbets dage; den stiplede kant viser den næste plads man mangler,
   så man pakker i rækkefølge: optik, kamera, stativ. */
/* Ét aftryk af bookingerne. Ændrer det sig ikke, er der heller ingen grund
   til at tegne planen om. */
function bookingAftryk(){
 return (epJobs||[]).map(j=>j.id+'|'+j.start_date+'|'+j.end_date+'|'+JSON.stringify(j.items||[])).join('¤')
  +'§'+(sfKladder||[]).map(b2=>b2.ref||(b2.project_id+b2.equipment_name)).join('¤');
}
let udstyrHenter=false, udstyrSidst=0;
function udstyrsDataSikret(){
 if(udstyrHenter)return;
 if(!session())return;
 const foerste = !lagerRows || epJobs===null;
 /* Bookingerne skal holdes friske. En kollega kan booke den sidste WL rack i
    East Production, mens planen står åben her – så skal prikken skifte af
    sig selv. Vi henter igen, når tallene er et halvt minut gamle, og tegner
    kun om, når der faktisk er noget nyt. Ellers ville optegningen kalde sig
    selv i ring. */
 if(!foerste && Date.now()-udstyrSidst<30000)return;
 udstyrHenter=true; udstyrSidst=Date.now();
 const foer=bookingAftryk();
 Promise.all([lagerList(), bookingerHent(true)])
  .then(()=>{
    udstyrHenter=false; udstyrSidst=Date.now();
    if((foerste||bookingAftryk()!==foer)&&view==='plan'&&pladserFor(planDom).length)drawPlan();
  })
  .catch(()=>{ udstyrHenter=false });
}

function saetUdstyr(devId,k,e){
 const dv=(dom().devices||[]).find(x=>x.id===devId);
 if(!dv)return;
 snap();
 dv.udstyr=Object.assign({},dv.udstyr||{});

 /* En ryddet plads bliver stående som en tom plads med et tidsstempel.
    Slettede vi den, ville kollegaens gamle valg vinde ved næste fletning. */
 dv.udstyr[k]=e?{id:String(e.id),navn:e.name||'',kat:e.category||'',by:hvem,at:Date.now()}
               :{id:'',navn:'',kat:'',by:hvem,at:Date.now()};
 dv.mt=Date.now();
 markDirty(); drawPlan();

/* Pladsens kategori bestemmer, hvad der er værd at vise først. Rammer
   kategorien intet, viser vi hele lageret – så sidder man aldrig fast,
   fordi kategorierne hedder noget andet end vi gættede på. */
function lagerForPlads(pp,q){
 const alle=lagerRows||[];
 const kat=(pp.kat||'').toLowerCase();
 const traeffer=e=>((e.category||'')+' '+(e.name||'')).toLowerCase().includes(kat);
 let r=kat?alle.filter(traeffer):alle.slice();
 const bredt=!!kat&&!r.length;
 if(bredt)r=alle.slice();
 if(q){const t=q.toLowerCase();
   r=r.filter(e=>((e.name||'')+' '+(e.category||'')+' '+(e.tv2_number||'')).toLowerCase().includes(t))}
 return {rows:r, bredt:bredt};
}
/* Pladser uden fast kategori åbner på kortets eget navn: står der "WL rack"
   på kortet, er WL rack 1, 2 og 3 det man skal se med det samme. */
function pladsStartSoeg(pp,dv){
 return (pp&&pp.fraNavn&&dv) ? String(dv.name||'').trim() : '';
}

   /* Lageret har ikke sin egen fane mere – navn, antal og resten styres i
      East Production. Men ind- og udgange findes kun her, så vejen derhen
      skal stadig være åben. */
   const ul=root.querySelector('[data-ulager]');
   if(ul)ul.onclick=()=>{closeModal(); setView('arch')};
   const listEl=root.querySelector('#ulist');

   const tegn=()=>{

        <span class="uvmeta">${esc(e.category||'')}${e.tv2_number?' · '+esc(e.tv2_number):''}</span>

          st.k==='ledig'?' <em>'+st.antal+' stk.</em>':''}</span>
      </button>`}).join('')
     +(rows.length>120?`<div class="ubredt">Viser de første 120 af ${rows.length} – søg for at finde resten.</div>`:'');
    listEl.querySelectorAll('[data-ueq]').forEach(b=>b.onclick=()=>{

/* "Oslo" → "Oslo (kopi)". Findes den allerede, tælles der op, så man kan
   lave flere uden at skulle finde på navne. */
function kopiNavn(navn, raekker){
  const findes = n => (raekker||[]).some(r => (r.name||'').toLowerCase() === n.toLowerCase());
  let n = navn + ' (kopi)';
  if(!findes(n)) return n;
  for(let i=2;i<200;i++){
    const k = navn + ' (kopi ' + i + ')';
    if(!findes(k)) return k;
  }
  return navn + ' (kopi ' + Date.now() + ')';
}

/* Hent projektet og læg en kopi ved siden af. Vi rører ikke det, der er
   åbent – hverken dets id eller dets indhold. */
async function cloudKopi(pid, nytNavn){
  const r = await sbFetch('signalflow_projects?id=eq.'+pid+'&select=name,folder,data');
  if(!r || !r.length) throw new Error('Projektet findes ikke længere.');
  const kilde = r[0];
  const data = JSON.parse(JSON.stringify(kilde.data || {}));
  data.name = nytNavn;                       // navnet står også inde i data
  const who = cfg().who || userName().split('@')[0] || '';
  const svar = await sbFetch('signalflow_projects?select=id', {method:'POST',
    body: JSON.stringify({name:nytNavn, folder:kilde.folder||null, data:data,
                          updated_by:who, updated_at:new Date().toISOString()})});
  if(!svar || !svar.length) throw new Error('Kopien blev ikke oprettet.');
  /* Første version, så historikken ikke starter tom */
  try{
    await sbFetch('signalflow_versions?select=id', {method:'POST',
      body: JSON.stringify({project_id:svar[0].id, data:data,
                            note:'kopi af "'+(kilde.name||'')+'"', created_by:who})});
  }catch(e){ console.warn('Kopiens første version blev ikke gemt:', e.message); }
  return svar[0].id;
}

/* PostgreSQL kan svare med og uden tidszone. Mangler den, er tiden UTC –
   uden dette ville alt se to timer gammelt ud her i dansk sommertid. */
function parseTS(v){
 if(!v)return null;
 if(typeof v==='number')return new Date(v);
 let t=String(v).trim().replace(' ','T');
 if(!/(Z|[+-]\d{2}:?\d{2})$/.test(t))t+='Z';
 const d=new Date(t);
 return isNaN(d)?new Date(v):d;
}
function tid(v){
 const d=parseTS(v)||new Date(v);
 return d.toLocaleString('da-DK',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}

     closeModal();

   let rows=[];

   const render=()=>{
    const q=(val(root,'q')||'').toLowerCase();

         <button class="mini" data-fnew="${esc(f)}" title="Gem det du arbejder i nu som en ny udgave i denne mappe">＋</button>
       </div>
       ${open?groups[f].map(r=>`
         <div class="prow ${r.id===cloudId?'here':''}" data-pid="${r.id}">
           <div class="pmain">
             <div class="pname">${esc(r.name)}${r.id===cloudId?' <span class="badge">åben</span>':''}</div>
             <div class="pmeta">${tid(r.updated_at)}${r.updated_by?' · '+esc(r.updated_by):''}</div>
           </div>
           <div class="pacts">
             <button class="mini" data-open="${r.id}" title="Åbn">Åbn</button>

             <button class="mini" data-ren="${r.id}" title="Omdøb / flyt">✎</button>
             <button class="mini" data-del="${r.id}" title="Slet">✕</button>
           </div>
         </div>
         ${openHistory===r.id?`<div class="hist" id="hist-${r.id}">Henter versioner …</div>`:''}
       `).join(''):''}
     </div>`;
    }).join('');

    listEl.querySelectorAll('[data-folder]').forEach(n=>n.onclick=()=>{
      const f=n.dataset.folder; openFolders[f]=openFolders[f]===false; render();
    });
    /* omdøb mappen – alle projekter i den flyttes med */
    listEl.querySelectorAll('[data-fren]').forEach(b=>b.onclick=async()=>{
      const gammel=b.dataset.fren;
      const nyt=prompt('Nyt navn på mappen:',gammel);
      if(nyt===null||!nyt.trim()||nyt===gammel)return;
      const ramte=rows.filter(r=>(r.folder||'')===gammel);
      try{
       for(const r of ramte)await cloudRename(r.id,r.name,nyt.trim());
       if(currentFolder===gammel)currentFolder=nyt.trim();
       refresh();
      }catch(e){alert(e.message)}
    });
    /* gem det åbne projekt som en ny udgave i mappen */
    listEl.querySelectorAll('[data-fnew]').forEach(b=>b.onclick=()=>{
      const f=b.dataset.fnew==='Uden mappe'?'':b.dataset.fnew;
      const nm=prompt('Navn på den nye udgave:', projectName+' v2');
      if(nm===null)return;
      const gammelNavn=projectName;
      projectName=nm.trim()||projectName;
      currentFolder=f;
      cloudSave(true,'ny udgave').then(()=>{closeModal();setSync('gemt som ny udgave')})
        .catch(e=>{projectName=gammelNavn;alert(e.message)});
    });
    listEl.querySelectorAll('[data-open]').forEach(n=>n.onclick=()=>{
      const pid=n.dataset.open;
      if(pid===cloudId)return closeModal();

        cloudOpen(pid).catch(e=>alert(e.message)));
    });
    listEl.querySelectorAll('[data-hist]').forEach(n=>n.onclick=()=>{
      openHistory=openHistory===n.dataset.hist?null:n.dataset.hist; render(); loadHist();
    });
    listEl.querySelectorAll('[data-ren]').forEach(n=>n.onclick=()=>{
      const r=rows.find(x=>x.id===n.dataset.ren);
      const nn=prompt('Projektets navn:',r.name); if(nn===null)return;
      const nf=prompt('Mappe (tom = ingen):',r.folder||''); if(nf===null)return;
      cloudRename(r.id,nn.trim()||r.name,nf.trim()).then(()=>{
        if(r.id===cloudId){projectName=nn.trim()||r.name;currentFolder=nf.trim();draw()}
        refresh();
      }).catch(e=>alert(e.message));
    });
    /* ── Lav en kopi ───────────────────────────────────────────
       Kopien bliver liggende i samme mappe med "(kopi)" bagefter, og det
       åbne projekt bliver stående – man skal ikke tvinges væk fra det, man
       sidder i, bare fordi man vil have en kopi at rode i. */
    listEl.querySelectorAll('[data-kopi]').forEach(n=>n.onclick=async()=>{
      const r=rows.find(x=>x.id===n.dataset.kopi); if(!r)return;
      const nyt=kopiNavn(r.name, rows);
      n.disabled=true; const gl=n.textContent; n.textContent='…';
      try{
        await cloudKopi(r.id, nyt);
        refresh();
      }catch(e){
        alert('Kunne ikke lave kopien.\n\n'+(e.message||e));
      }finally{ n.disabled=false; n.textContent=gl; }
    });
    listEl.querySelectorAll('[data-del]').forEach(n=>n.onclick=()=>{
      const r=rows.find(x=>x.id===n.dataset.del);
      if(!confirm('Slet "'+r.name+'" og alle dets versioner? Det kan ikke fortrydes.'))return;
      cloudDelete(r.id).then(refresh).catch(e=>alert(e.message));
    });

    const dl2=root.querySelector('#folderList');
    if(dl2)dl2.innerHTML=[...new Set(rows.map(r=>r.folder).filter(Boolean))]
      .map(f=>`<option value="${esc(f)}">`).join('');
   };

   const loadHist=()=>{
    if(!openHistory)return;
    const box=listEl.querySelector('#hist-'+openHistory);
    if(!box)return;
    cloudVersions(openHistory).then(vs=>{
     if(!vs.length){box.innerHTML='<div class="vempty">Ingen tidligere versioner endnu.</div>';return}
     box.innerHTML=vs.map((v,i)=>`<div class="vrow">
        <span class="vnum">${vs.length-i}</span>
        <span class="vnote">${esc(v.note||'(ingen beskrivelse)')}</span>
        <span class="vmeta">${tid(v.created_at)}${v.created_by?' · '+esc(v.created_by):''}</span>
        <button class="mini" data-rest="${v.id}" title="Hent denne version ind i stedet for den nuværende">Gendan</button>
      </div>`).join('');
     box.querySelectorAll('[data-rest]').forEach(n=>n.onclick=()=>{
       const vid=n.dataset.rest;
       closeModal();
       spoergGem('hente en tidligere udgave ind',()=>{
         if(!confirm('Hent denne version ind? Det du har åbent nu bliver erstattet.'))return;
         cloudRestore(vid).catch(e=>alert(e.message));
       });
     });
    }).catch(e=>{box.innerHTML='<div class="vempty">'+esc(e.message)+'</div>'});
   };

   const refresh=()=>cloudList().then(r=>{rows=r;render();loadHist()})
     .catch(e=>{listEl.innerHTML='<div class="msub" style="padding:10px;color:var(--video);text-transform:none;letter-spacing:0">'+esc(e.message)+'</div>'});
   refresh();

   root.querySelector('[name="q"]').oninput=render;
   root.querySelector('[data-csave]').onclick=function(){
     this.textContent='Gemmer …';
     currentFolder=val(root,'folder').trim();
     cloudSave(false,val(root,'note')).then(()=>{closeModal();setAuto('gemt i databasen')})
       .catch(e=>{alert(e.message);this.textContent='Prøv igen'});
   };
   const nb=root.querySelector('[data-cnew]');
   if(nb)nb.onclick=()=>{
     currentFolder=val(root,'folder').trim();
     cloudSave(true,val(root,'note')).then(()=>{closeModal();setAuto('gemt som nyt projekt')})
       .catch(e=>alert(e.message));
   };
 });
}

/* ================= lager =================
   Samme equipment-tabel som lagerprogrammet (East Production). Vi rører kun
   de felter der findes i forvejen, og lægger SignalFlows tekniske detaljer i
   'tech'. Egne felter ligger i 'custom_fields' – præcis som i lagerprogrammet,
   så begge programmer kan læse og skrive det samme udstyr. */
let lagerRows=null, lagerCats=[];

const techOf=e=>{
 const t=e&&e.tech;
 if(!t)return {ins:[],outs:[],conIn:'',conOut:''};
 return {ins:t.ins||[], outs:t.outs||[], conIn:t.conIn||'', conOut:t.conOut||''};
};
/* skriver en værdi ind i custom_fields, så lagerprogrammet også kan se den */
function cfSet(e,label,value){
 e.custom_fields=Array.isArray(e.custom_fields)?e.custom_fields.slice():[];
 const i=e.custom_fields.findIndex(x=>(x.label||'').toLowerCase()===label.toLowerCase());
 if(value===''||value==null){ if(i>=0)e.custom_fields.splice(i,1); return }
 if(i>=0)e.custom_fields[i]={label:e.custom_fields[i].label,value:String(value)};
 else e.custom_fields.push({label:label,value:String(value)});
}

async function lagerList(force){
 if(lagerRows&&!force)return lagerRows;
 lagerRows=await sbFetch('equipment?select=*&order=category.asc,name.asc');
 return lagerRows;
}
async function lagerCategories(){
 try{ lagerCats=await sbFetch('categories?select=*&order=sort_order.asc,name.asc') }
 catch(e){ lagerCats=[] }
 return lagerCats;
}
/* ── Kanalerne tilbage på lageret ─────────────────────────────
   Før oprettede denne knap et NYT stykke udstyr på lageret, med navnet man
   lige skrev i et prompt-felt. Med én bruger gik det; med flere endte det
   med dubletter – tre "Rio 1608-D" fordi tre kolleger havde trykket hver
   sin gang, og ingen af dem vidste det.

   Lageret oprettes ét sted: i lagerprogrammet. Herfra kan man KUN skrive
   kanalerne på noget, der findes i forvejen. Navn, antal, kategori,
   serienummer og billede bliver ikke rørt – kun tech og de to felter, der
   fortæller hvor mange ind- og udgange der er. */
function lagerKanalTekst(n){
 return n ? (n.ins.length+' ind / '+n.outs.length+' ud') : 'ingen kanaler';
}
async function lagerSaveFromDevice(dv){
 if(!dv)return;
 const ins=alive(dv.ins), outs=alive(dv.outs);
 const tech={ins:ins.map(p=>({n:p.n,label:p.label,type:''})),
             outs:outs.map(p=>({n:p.n,label:p.label,type:''})),conIn:'',conOut:''};
 let rows=[];
 let hentefejl='';
 try{ rows=await lagerList(true)||[] }
 catch(e){ hentefejl=e.message||String(e) }

 const navn=(dv.name||'').trim().toLowerCase();
 const eksakt=rows.filter(r=>(r.name||'').trim().toLowerCase()===navn);
 let valgt = eksakt.length===1 ? eksakt[0].id : null;

 const linje=r=>{
  const t=techOf(r);
  const aendrer = t.ins.length!==ins.length || t.outs.length!==outs.length;
  return `<div class="arow lagvalg ${valgt===r.id?'valgt':''}" data-lagv="${r.id}">
    <span class="apic">${r.image_url?`<img src="${esc(r.image_url)}">`:'<span class="anoimg">—</span>'}</span>
    <span class="amain"><b>${esc(r.name||'')}</b>
      <em>${esc(r.category||'')}${r.qty?' · '+r.qty+' stk':''} · ${lagerKanalTekst(t)}${
        aendrer?' → <strong>'+ins.length+' ind / '+outs.length+' ud</strong>':' · uændret'}</em></span>
  </div>`;
 };
 const tegn=root=>{
  const box=root.querySelector('#lagList');
  const q=(root.querySelector('[name="q"]').value||'').trim().toLowerCase();
  const vis2=rows.filter(r=>!q||((r.name||'')+' '+(r.category||'')).toLowerCase().indexOf(q)>=0);
  box.innerHTML = vis2.length ? vis2.map(linje).join('')
    : `<div class="msub" style="padding:10px;text-transform:none;letter-spacing:0;line-height:1.6">
        ${rows.length?'Intet på lageret hedder noget i den retning.':'Lageret er tomt.'}<br>
        Udstyr oprettes i lagerprogrammet – ikke herfra.</div>`;
  box.querySelectorAll('[data-lagv]').forEach(n=>n.onclick=()=>{
   valgt = (valgt===n.dataset.lagv) ? null : n.dataset.lagv;
   tegn(root);
  });
  const g=root.querySelector('[data-lagok]');
  if(g)g.disabled=!valgt;
 };

 openModal('Skriv kanalerne på lageret',
  (dv.name||'kortet')+' · '+ins.length+' ind / '+outs.length+' ud',
  `${hentefejl?`<div class="msub" style="color:var(--video);text-transform:none;letter-spacing:0">
      Kunne ikke hente lageret: ${esc(hentefejl)}</div>`:''}
   <div class="msub" style="text-transform:none;letter-spacing:0;font-size:11.5px;line-height:1.6;margin-bottom:10px">
     Der bliver <b>ikke oprettet noget nyt</b> på lageret herfra – så undgår vi
     dubletter, når flere arbejder i det samme. Vælg det stykke udstyr,
     kortet svarer til: kun <b>antallet af kanaler</b> og deres tekster bliver
     skrevet over. Navn, antal og kategori står, som de står.
   </div>
   <div class="mf"><input type="text" name="q" placeholder="Søg i lageret …"
     value="${esc(dv.name||'')}"></div>
   <div id="lagList" class="chklist" style="max-height:260px">Henter …</div>
   <div class="mrow">
     <button class="btn go" data-lagok="1" disabled>Skriv kanalerne</button>
     <button class="btn" data-lagaab="1">Åbn lageret</button>
     <button class="btn" data-cancel="1">Luk</button>
   </div>`,
  root=>{
   tegn(root);
   root.querySelector('[name="q"]').oninput=()=>tegn(root);
   root.querySelector('[data-cancel]').onclick=closeModal;
   root.querySelector('[data-lagaab]').onclick=()=>{closeModal();setView('arch')};
   root.querySelector('[data-lagok]').onclick=async function(){
    const r=rows.find(x=>x.id===valgt);
    if(!r)return;
    this.disabled=true; this.textContent='Skriver …';
    /* custom_fields skrives med cfSet, så andre felter på varen bliver
       stående – ellers ville vi rydde dem, kollegerne har skrevet. */
    const kopi=Object.assign({},r);
    cfSet(kopi,'Inputs',ins.length?ins.length:'');
    cfSet(kopi,'Outputs',outs.length?outs.length:'');
    try{
     await sbFetch('equipment?id=eq.'+encodeURIComponent(r.id)+'&select=id',
       {method:'PATCH',body:JSON.stringify({tech:tech,
         custom_fields:(kopi.custom_fields||[]).filter(f=>(f.label||'').trim()||(f.value||'').trim())})});
     lagerRows=null; setSync('kanalerne skrevet på '+(r.name||'lageret'));
     closeModal();
    }catch(e){
     this.disabled=false; this.textContent='Skriv kanalerne';
     alert('Kunne ikke skrive på lageret: '+(e.message||e));
    }
   };
  });
}

   cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
   cb(cv.toDataURL('image/png'));
  };
  im.src=rd.result;
 };
 rd.readAsDataURL(f);
}
