       return `<button class="grpvalg" data-vcbaab="${r.id}">
         <span class="grpnavn">${esc(r.navn)}</span>
         <span class="grpsti">${n===null?'':n+' containere'}${
           r.note?' · '+esc(r.note):''}</span>
         ${r.opdateret_at?`<span class="grptal">rettet ${esc(
            new Date(r.opdateret_at).toLocaleDateString('da-DK'))}${
            r.opdateret_af?' af '+esc(r.opdateret_af):''}</span>`:''}
       </button>`}).join('')}</div>`
   : (VCB.fejl?'':`<div class="imp-tom">Der er ingen biblioteker endnu.<br>
       Opret ét pr. vogn – fx <b>Remote 2</b> – og læs routerens regneark ind i det.</div>`))
  +`<div class="mrow" style="margin-top:12px">
      <button class="btn go" data-vcbnyt="1">+ Nyt bibliotek</button>
      <button class="btn" data-annul="1">Luk</button>
    </div>`;
 }
 const bib=bibs.find(x=>x.id===VCB.valgt)||{navn:''};
 if(VCB.cont===null)return '<div class="hint">Henter containerne …</div>';
 const vist=vcbFiltreret();
 const har=vcbIProjektet();
 const valgt=vist.filter(c=>VCB.valg.has(c.id)).length;
 return fejl+`<div class="vcbtop">
   <button class="btn" data-vcbtilbage="1">‹ Alle biblioteker</button>
   <b>${esc(bib.navn)}</b>
   <span class="vcsvar">${(VCB.cont||[]).length} containere</span>
 </div>
 <div class="vcbar" style="margin:10px 0">
   <input class="vcsoeg" id="vcbSoeg" value="${esc(VCB.soeg)}" autocomplete="off"
     placeholder="Søg nummer, navn eller lydspor…">
   <select id="vcbRet" class="${VCB.ret?'paa':''}">
     <option value="">Ind og ud</option>
     <option value="ind" ${VCB.ret==='ind'?'selected':''}>Kun ind</option>
     <option value="ud" ${VCB.ret==='ud'?'selected':''}>Kun ud</option>
   </select>
   <button class="sharebtn" data-vcballe="1">${valgt===vist.length&&vist.length?'Fravælg alle viste':'Vælg alle viste'}</button>
   <span class="vcsvar">${vist.length} vist · ${VCB.valg.size} valgt</span>
 </div>
 <div class="vcbcont">${vist.length?vist.map(c=>{
   const iProj=har.has((c.retning||'ind')+'|'+String(c.nr||'').trim().toLowerCase());
   const spor=(c.spor||[]).filter(Boolean);
   return `<label class="vcbrad ${VCB.valg.has(c.id)?'on':''} ${iProj?'iproj':''}">
     <input type="checkbox" data-vcbvalg="${c.id}" ${VCB.valg.has(c.id)?'checked':''}
       ${iProj?'disabled':''}>
     <span class="vcbret ${c.retning||'ind'}">${(c.retning||'ind')==='ind'?'IND':'UD'}</span>
     <span class="vcbnr">${esc(c.nr||'')}</span>
     <span class="vcbnavn">${esc(c.navn||'uden navn')}</span>
     <span class="vcbspor">${spor.length?spor.length+' spor':''}</span>
     ${iProj?'<span class="vcbhar">ligger i projektet</span>':''}
   </label>`}).join('')
  :'<div class="imp-tom">Ingen containere rammer søgningen.</div>'}</div>
 <div class="mrow" style="margin-top:12px">
   <button class="btn go" data-vcbind2="1" ${VCB.valg.size?'':'disabled'}>Hent ${
     VCB.valg.size||''} ind i projektet</button>
   <button class="btn" data-vcbimp="1">⤒ Læs regneark ind</button>
   <button class="btn" data-vcbslet="1">Slet biblioteket</button>
   <button class="btn" data-annul="1">Luk</button>
 </div>`;
}
function vcbTegn(){
 const r=document.getElementById('vcbKrop');
 if(!r)return;
 r.innerHTML=vcbKrop();
 vcbBind(r);
}
function vcbBind(r){
 const k=(s,f)=>r.querySelectorAll(s).forEach(f);
 k('[data-annul]',b=>b.onclick=closeModal);
 k('[data-vcbaab]',b=>b.onclick=async()=>{
   VCB.valgt=b.dataset.vcbaab; VCB.valg=new Set(); VCB.soeg=''; VCB.ret='';
   vcbTegn();
   await vcbContHent(VCB.valgt);
   vcbTegn();
 });
 k('[data-vcbtilbage]',b=>b.onclick=()=>{ VCB.valgt=null; VCB.cont=null; vcbTegn() });
 k('[data-vcbnyt]',b=>b.onclick=vcbNyt);
 const s=r.querySelector('#vcbSoeg');
 if(s)s.oninput=()=>{ const pos=s.selectionStart; VCB.soeg=s.value; vcbTegn();
   const n=document.getElementById('vcbSoeg');
   if(n){ n.focus(); try{ n.setSelectionRange(pos,pos) }catch(e){} } };
 const rt=r.querySelector('#vcbRet');
 if(rt)rt.onchange=()=>{ VCB.ret=rt.value; vcbTegn() };
 k('[data-vcbvalg]',b=>b.onchange=()=>{
   if(b.checked)VCB.valg.add(b.dataset.vcbvalg); else VCB.valg.delete(b.dataset.vcbvalg);
   vcbTegn();
 });
 k('[data-vcballe]',b=>b.onclick=()=>{
   const vist=vcbFiltreret();
   const har=vcbIProjektet();
   const kan=vist.filter(c=>!har.has((c.retning||'ind')+'|'+String(c.nr||'').trim().toLowerCase()));
   const alle=kan.length&&kan.every(c=>VCB.valg.has(c.id));
   kan.forEach(c=>{ if(alle)VCB.valg.delete(c.id); else VCB.valg.add(c.id) });
   vcbTegn();
 });
 k('[data-vcbind2]',b=>b.onclick=vcbHentInd);
 k('[data-vcbimp]',b=>b.onclick=()=>vcbImportAaben(VCB.valgt));
 k('[data-vcbslet]',b=>b.onclick=vcbSletBib);
}
function vcbAaben(){
 openModal('Bibliotek over containere',
  'de faste containere pr. vogn – læst ind én gang og hentet ind her',
  `<div id="vcbKrop"><div class="hint">Henter …</div></div>`,
  async root=>{
   VCB.henter=true;
   VCB.valg=new Set();          // et gammelt udvalg skal ikke hænge ved
   vcbTegn();
   await vcbHent();
   /* Står man med et bibliotek åbent fra sidst, kommer man tilbage til det –
      men containerne hentes forfra, så en kollegas rettelse er med. Er
      biblioteket slettet i mellemtiden, falder vi tilbage til listen. */
   if(VCB.valgt && !(VCB.liste||[]).some(x=>x.id===VCB.valgt)){ VCB.valgt=null; VCB.cont=null }
   if(VCB.valgt)await vcbContHent(VCB.valgt);
   VCB.henter=false;
   vcbTegn();
  });
}
async function vcbNyt(){
 const navn=prompt('Hvad hedder vognen eller systemet?\n(fx Remote 2 eller DNK47)','');
 if(navn===null)return;
 const n=navn.trim();
 if(!n)return;
 try{
  await sbFetch(VCB_TAB,{method:'POST',body:JSON.stringify({navn:n,opdateret_af:meName()})});
  await vcbHent(); vcbTegn();
 }catch(e){
  alert(/duplicate|unique/i.test(e.message||'')
    ? 'Der findes allerede et bibliotek, der heder "'+n+'".'
    : 'Kunne ikke oprette biblioteket: '+(e.message||e));
 }
}
async function vcbSletBib(){
 const bib=(VCB.liste||[]).find(x=>x.id===VCB.valgt);
 if(!bib)return;
 if(!confirm('Slet biblioteket "'+bib.navn+'" og alle dets containere?\n'
   +'De containere, der allerede er hentet ind i projekter, bliver ikke rørt.'))return;
 try{
  await sbFetch(VCB_TAB+'?id=eq.'+encodeURIComponent(bib.id),{method:'DELETE'});
  VCB.valgt=null; VCB.cont=null;
  await vcbHent(); vcbTegn();
 }catch(e){ alert('Kunne ikke slette: '+(e.message||e)) }
}

/* ── Hent ind i projektet ─────────────────────────────────────── */
function vcbHentInd(){
 const bib=(VCB.liste||[]).find(x=>x.id===VCB.valgt);
 const valgte=(VCB.cont||[]).filter(c=>VCB.valg.has(c.id));
 if(!valgte.length)return;
 const har=vcbIProjektet();
 snap();
 let n=0, sprunget=0;
 valgte.forEach(c=>{
  const noegle=(c.retning||'ind')+'|'+String(c.nr||'').trim().toLowerCase();
  if(har.has(noegle)){ sprunget++; return }
  har.add(noegle);
  vcOpret(c.retning==='ud'?'ud':'ind',
    {nr:c.nr, navn:c.navn||'', spor:(c.spor||[]), bib:(bib?bib.navn:'')});
  n++;
 });
 autosave(); closeModal();
 /* Hentede man 200 containere, skal listen ikke stå foldet ud – så kan man
    ikke se noget. De lægger sig sammenfoldede. */
 drawPlan();
 if(n||sprunget)
  alert(n+' container'+(n===1?'':'e')+' hentet ind i projektet.'
    +(sprunget?'\n'+sprunget+' blev sprunget over – de ligger der allerede.':''));
}

/* ── Regneark ind i biblioteket ───────────────────────────────
   Routerens egen liste. Kolonnerne genkendes på overskrifterne, for ingen
   to routere skriver dem i samme rækkefølge. Sporene kan både stå som
   "Spor 1 … Spor 16", "Ch 1 …", "Audio 1 …" eller bare "1 … 16". */
function vcbSoejler(hoved){
 const p={spor:[]};
 (hoved||[]).forEach((h,i)=>{
  const t=String(h||'').trim().toLowerCase().replace(/\./g,'');
  if(!t)return;
  const m=/^(?:spor|ch|kanal|channel|audio|lyd|track)\s*(\d{1,2})$/.exec(t)
        || /^(\d{1,2})$/.exec(t);
  if(m){ const n=+m[1]; if(n>=1&&n<=VC_SPOR){ p.spor[n-1]=i; return } }
  if(p.nr===undefined && /^(nr|nummer|container|container\s*nr|id|no)$/.test(t)){p.nr=i;return}
  if(p.navn===undefined && /^(navn|name|label|beskrivelse|signal|titel)$/.test(t)){p.navn=i;return}
  if(p.ret===undefined && /^(vej|retning|type|side|in\/out|dir|direction)$/.test(t)){p.ret=i;return}
 });
 return p;
}
const VCB_UD=/^(ud|out|output|dst|destination|modtager)/i;
function vcbLaesGitter(gitter){
 const raekker=(gitter||[]).filter(r=>r&&r.some(c=>String(c||'').trim()));
 if(raekker.length<2)return {fejl:'Der er ingen rækker at læse. Første række skal være overskrifter.'};
 const p=vcbSoejler(raekker[0]);
 if(p.nr===undefined)
  return {fejl:'Kunne ikke finde en kolonne med containerens nummer. '
    +'Kald den Nr eller Container, og lad første række være overskrifter.'};
 const ud=[];
 const set=new Set();
 let dub=0;
 raekker.slice(1).forEach(r=>{
  const nr=String(r[p.nr]==null?'':r[p.nr]).trim();
  if(!nr)return;
  const ret=(p.ret!==undefined && VCB_UD.test(String(r[p.ret]||'')))?'ud':'ind';
  const noegle=ret+'|'+nr.toLowerCase();
  if(set.has(noegle)){ dub++; return }
  set.add(noegle);
  const spor=[];
  for(let i=0;i<VC_SPOR;i++){
   const j=p.spor[i];
   spor.push(j===undefined?'':String(r[j]==null?'':r[j]).trim());
  }
  /* Tomme spor i enden skæres af – de fylder bare i databasen. */
  while(spor.length&&!spor[spor.length-1])spor.pop();
  ud.push({nr:nr, navn:p.navn===undefined?'':String(r[p.navn]==null?'':r[p.navn]).trim(),
           retning:ret, spor:spor});
 });
 if(!ud.length)return {fejl:'Der var ingen rækker med et containernummer.'};
 return {liste:ud, dub:dub, sporSoejler:p.spor.filter(x=>x!==undefined).length,
         harNavn:p.navn!==undefined, harRet:p.ret!==undefined};
}
function vcbImportAaben(bibId){
 const bib=(VCB.liste||[]).find(x=>x.id===bibId);
 if(!bib)return;
 let fundet=null;
 const html=`
  <div class="imp-hjaelp" style="font-size:12px;color:var(--dim);line-height:1.6;margin-bottom:10px">
    Vælg routerens <b>csv</b>- eller <b>Excel</b>-fil, eller sæt rækkerne ind fra et regneark.
    Første række skal være overskrifter. Kolonnerne genkendes på navnene:
    <em>Nr</em> (eller Container), <em>Navn</em>, <em>Vej</em> (Ind/Ud) og
    <em>Spor 1 … Spor ${VC_SPOR}</em> – de må også hedde <em>Ch 1</em>, <em>Audio 1</em> eller bare <em>1</em>.
    Findes et nummer allerede i biblioteket, bliver det rettet – ikke lagt til to gange.
  </div>
  <div class="mf"><label>Fil</label><input type="file" id="vciFil"></div>
  <div class="mf"><label>… eller sæt ind fra Excel</label>
    <textarea id="vciTekst" rows="3" placeholder="Sæt rækkerne ind her"></textarea></div>
  <div id="vciVis"></div>
  <div class="mrow">
    <button class="btn go" id="vciOk" disabled>Læs ind i ${esc(bib.navn)}</button>
    <button class="btn" data-cancel="1">Annullér</button>
  </div>`;
 openModal('Læs containere ind','til biblioteket '+bib.navn,html,root=>{
  root.querySelector('[data-cancel]').onclick=()=>{ vcbAaben() };
  const vis=root.querySelector('#vciVis');
  const brug=g=>{
   const r=vcbLaesGitter(g);
   if(r.fejl){ vis.innerHTML='<div class="imp-tom">'+esc(r.fejl)+'</div>';
     root.querySelector('#vciOk').disabled=true; fundet=null; return }
   fundet=r.liste;
   const ind=r.liste.filter(x=>x.retning==='ind').length;
   const medSpor=r.liste.filter(x=>x.spor.some(Boolean)).length;
   vis.innerHTML=`<div class="imp-status"><b>${r.liste.length}</b> containere · `
     +`${ind} ind, ${r.liste.length-ind} ud · <b>${medSpor}</b> med lydspor`
     +(r.sporSoejler?` · ${r.sporSoejler} sporkolonner fundet`
        :' · <span class="imp-mangler">ingen sporkolonner fundet</span>')
     +(r.harRet?'':' · <span class="imp-mangler">ingen Vej-kolonne – alle læses som IND</span>')
     +(r.dub?` · <span class="imp-mangler">${r.dub} dubletter i arket sprunget over</span>`:'')
     +`</div>
     <div class="dio-liste">${r.liste.slice(0,40).map(x=>`<div class="dio-side">
       <b>${x.retning==='ind'?'IND':'UD'} ${esc(x.nr)} · ${esc(x.navn||'uden navn')}</b>
       <span>${x.spor.filter(Boolean).length} spor${
         x.spor.filter(Boolean).length?' · '+esc(x.spor.filter(Boolean).slice(0,4).join(', ')):''}</span>
     </div>`).join('')}${r.liste.length>40
       ?`<div class="dio-side"><b>… og ${r.liste.length-40} mere</b></div>`:''}</div>`;
   root.querySelector('#vciOk').disabled=false;
  };
  root.querySelector('#vciFil').onchange=async function(){
   const f=this.files&&this.files[0]; if(!f)return;
   vis.innerHTML='<div class="hint">Læser filen …</div>';
   try{
    if(/\.xlsx?$/i.test(f.name)) brug(await xlsxLaes(await f.arrayBuffer()));
    else brug(kiDelTekst(await kiFilTekst(f)));
   }catch(e){ vis.innerHTML='<div class="imp-tom">'+esc(e.message||String(e))+'</div>' }
  };
  root.querySelector('#vciTekst').addEventListener('input',function(){
   if(this.value.trim().length>8) brug(kiDelTekst(this.value));
  });
  root.querySelector('#vciOk').onclick=async function(){
   if(!fundet)return;
   this.disabled=true; this.textContent='Læser ind …';
   try{
    await vcbSkriv(bibId, fundet);
    vis.innerHTML='<div class="imp-status">'+fundet.length+' containere lagt i biblioteket.</div>';
    await vcbHent();
    VCB.valgt=bibId;
    await vcbContHent(bibId);
    vcbAaben();
   }catch(e){
    this.disabled=false; this.textContent='Læs ind i '+bib.navn;
    vis.innerHTML='<div class="imp-tom">'+esc(e.message||String(e))+'</div>';
   }
  };
 });
}
/* Skrives i bidder: et ark med 600 rækker i ét kald bliver afvist af
   serveren, og så har man ingenting. Går en bid galt, siger vi hvilken. */
async function vcbSkriv(bibId, liste){
 const stk=150;
 for(let i=0;i<liste.length;i+=stk){
  const bid=liste.slice(i,i+stk).map((x,j)=>({
    bibliotek_id:bibId, nr:x.nr, navn:x.navn||null,
    retning:x.retning, spor:x.spor, sort:i+j,
    opdateret_af:meName()}));
  try{
   await sbFetch(VCC_TAB+'?on_conflict=bibliotek_id,nr,retning',
     {method:'POST', headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify(bid)});
  }catch(e){
   throw new Error('Linje '+(i+1)+'–'+(i+bid.length)+' kunne ikke lægges ind: '
     +(e.message||e));
  }
 }
 try{
  await sbFetch(VCB_TAB+'?id=eq.'+encodeURIComponent(bibId),
    {method:'PATCH', headers:{'Prefer':'return=minimal'},
     body:JSON.stringify({opdateret_af:meName(), opdateret_at:new Date().toISOString()})});
 }catch(e){ /* tidsstemplet er pynt – containerne er inde */ }
}

/* ── Frekvensplan for trådløse mikrofoner ──────────────────────
   Samme datamodel som resten af planen: et kort er et system (rack,
   kuffert, sæt), og hver linje er en frekvens. Fordi linjerne ligger i det
   samme felt som de øvrige planer, flettes de også automatisk, når to
   retter samtidig. Linjen har blot nogle flere felter. */
const FREQTYPER=['Håndholdt','Bodypack','IEM','Reserve','Talkback','Kamera'];
function freqRad(dv,p,i){
  const kl=[p.label?'set':'', fresh(p)?'fresh':'', (p.label&&p.patched&&p.checked)?'ok':''].join(' ');
  return `<div class="port freq ${kl}" data-port="${dv.id}|ins|${p.id}">
    <input class="pnum" value="${esc(p.n)}" data-pnum="${dv.id}|ins|${p.id}" title="Kanal eller nummer på senderen">
    <input class="pfreq" value="${esc(p.freq||'')}" placeholder="MHz" inputmode="decimal"
           data-pfreq="${dv.id}|ins|${p.id}" title="Frekvens i MHz">
    ${planLabelFelt('freq',dv,p,'ins')}
    <input class="pfreqt" value="${esc(p.ftype||'')}" list="freqtyper" placeholder="type"
           data-pftype="${dv.id}|ins|${p.id}" title="Håndholdt, bodypack, IEM …">
    ${p.label?`
     <label class="tick" title="Sat op${p.pby?' · af '+esc(p.pby):''}">
       <input type="checkbox" data-tick="${dv.id}|ins|${p.id}|patched" ${p.patched?'checked':''}></label>
     <label class="tick t2" title="Afprøvet${p.cby?' · af '+esc(p.cby):''}">
       <input type="checkbox" data-tick="${dv.id}|ins|${p.id}|checked" ${p.checked?'checked':''}></label>`
     :`<span class="tickgap"></span><span class="tickgap"></span>`}
    <span class="pby" title="${p.by?esc(p.by)+' · '+new Date(p.at).toLocaleString('da-DK'):''}">${p.by?esc(p.by):''}</span>
    <button class="mini rowmenu" data-pmenu="${dv.id}|ins|${p.id}" title="Muligheder for denne linje">⋯</button>
    <button class="mini grip" data-pgrip="${dv.id}|ins|${p.id}" title="Træk for at flytte linjen">⠿</button>
    <button class="mini" data-pins="${dv.id}|ins|${p.id}" title="Indsæt en linje ovenover">⤒</button>
    <button class="mini" data-pdel="${dv.id}|ins|${p.id}" title="Slet linjen">✕</button>
  </div>`;
}
function freqListe(dv){
  const alle=ports(dv,'ins');
  const {vis:arr, skjult}=synligePorte(dv,'ins');
  const ibrug=alle.filter(p=>p.freq).length;
  /* to sendere på samme frekvens er en fejl, man skal opdage med det samme */
  const tael={}; alle.forEach(p=>{ const f=(p.freq||'').trim(); if(f) tael[f]=(tael[f]||0)+1; });
  const dubletter=Object.keys(tael).filter(f=>tael[f]>1);
  return `<div class="portcol ins freqcol">
    <div class="portitle">Frekvenser <span>${ibrug}/${alle.length}</span></div>
    ${dubletter.length?`<div class="freqadvarsel" title="Samme frekvens er brugt flere gange på dette system">
       ⚠ ${dubletter.join(', ')} står mere end én gang</div>`:''}
    <div class="porthead freqhead"><span class="ph-n">Nr</span><span class="ph-f">MHz</span>
      <span class="ph-l">Bruger / position</span><span class="ph-t">Type</span>
      <span class="ph-c" title="Sat op">S</span><span class="ph-c" title="Afprøvet">A</span>
      <span class="ph-by"></span><span class="ph-x"></span></div>
    ${arr.map((p,i)=>freqRad(dv,p,i)).join('')}
    ${foldRest(dv,skjult)}
    <button class="addrow" data-padd="${dv.id}|ins" title="Tilføj en frekvenslinje">+ frekvens</button>
  </div>`;
}


/* ── Kameraets fire kanaler ────────────────────────────────────
   Et kamera har 1 og 2 som mic/line og 3 og 4 som AES. Bruges AES-parret,
   optager det kredsløbet fra kanal 2 – så udgår 2, og man har kanal 1
   mic/line plus 3 og 4 på AES. Planen viser det, så ingen booker en kanal,
   der ikke findes. */
/* Hver linje bærer selv sin type. Gamle kort uden typen falder tilbage på
   den gamle regel: 1 og 2 er mic/line, 3 og 4 er AES. */
const KAM_AES=n=>/^(3|4|aes)/i.test((n||'').toString().trim());
function kamType(p){ return p.kamtype || (KAM_AES(p.n)?'aes':'mic') }
function kamAesIBrug(dv){
  return ports(dv,'ins').some(p=>kamType(p)==='aes' && (p.label||'').trim());
}
function kamRad(dv,p,udgaaet){
  const aes=kamType(p)==='aes';
  const kl=[p.label?'set':'', fresh(p)?'fresh':'', (p.label&&p.patched&&p.checked)?'ok':'',
            udgaaet?'udgaaet':''].join(' ');
  return `<div class="port kam ${kl}" data-port="${dv.id}|ins|${p.id}"
      ${udgaaet?'title="Udgår, fordi AES-parret er i brug på kanal 3 og 4"':''}>
    <input class="pnum" value="${esc(p.n)}" data-pnum="${dv.id}|ins|${p.id}" title="Kanalnummer">
    <button class="kamtype ${aes?'aes':''}" data-kamtype="${dv.id}|ins|${p.id}"
      title="Klik for at skifte mellem mic/line og AES">${aes?'AES':'mic/line'}</button>
    ${planLabelFelt('kam',dv,p,'ins',
        {ph:(udgaaet?'udgår – AES bruger kanal 2':''), disabled:udgaaet})}
    ${p.label&&!udgaaet?`
     <label class="tick" title="Patchet${p.pby?' · af '+esc(p.pby):''}">
       <input type="checkbox" data-tick="${dv.id}|ins|${p.id}|patched" ${p.patched?'checked':''}></label>
     <label class="tick t2" title="Tjekket${p.cby?' · af '+esc(p.cby):''}">
       <input type="checkbox" data-tick="${dv.id}|ins|${p.id}|checked" ${p.checked?'checked':''}></label>`
     :`<span class="tickgap"></span><span class="tickgap"></span>`}
    <span class="pby">${p.by?esc(p.by):''}</span>
    <button class="mini rowmenu" data-pmenu="${dv.id}|ins|${p.id}" title="Muligheder for denne linje">⋯</button>
    <button class="mini" data-pdel="${dv.id}|ins|${p.id}" title="Slet linjen">✕</button>
  </div>`;
}
function kamListe(dv){
  const alle=ports(dv,'ins');
  const {vis:arr, skjult}=synligePorte(dv,'ins');
  const aes=kamAesIBrug(dv);
  const ibrug=alle.filter(p=>p.label&&!(aes&&kamType(p)==='mic'&&(p.n||'').trim()==='2')).length;
  return `<div class="portcol ins kamcol">
    <div class="portitle">Lydkanaler <span>${ibrug}/${
      aes&&alle.some(p=>kamType(p)==='mic'&&(p.n||'').trim()==='2') ? alle.length-1 : alle.length}</span></div>
    ${aes&&alle.some(p=>kamType(p)==='mic'&&(p.n||'').trim()==='2')
      ? `<div class="kamnote">AES er i brug – kanal 2 udgår</div>` : ''}
    ${arr.map(p=>kamRad(dv,p, aes && kamType(p)==='mic' && (p.n||'').trim()==='2')).join('')}
    ${foldRest(dv,skjult)}
    <button class="addrow" data-padd="${dv.id}|ins" title="Tilføj en kanal">+ kanal</button>
  </div>`;
}



/* ── Stil kortene op ───────────────────────────────────────────
   Tre kolonner ved siden af hinanden betyder, at man skal rulle både ned og
   til siden. Én kolonne giver overblik på en skærm og på en telefon. */
function planStilOp(kolonner){
  const ds=alive(dom().devices||[]);
  if(!ds.length) return;
  const maal=d=>{
    const n=document.querySelector('[data-dev="'+d.id+'"]');
    return n?{b:n.offsetWidth,h:n.offsetHeight}:{b:CARDW,h:260};
  };
  snap();
  /* behold den rækkefølge kortene står i nu – øverst til venstre først */
  const sorteret=ds.slice().sort((a,b)=>(a.y||0)-(b.y||0) || (a.x||0)-(b.x||0));
  let x=20, y=20, raekkeH=0, i=0;
  sorteret.forEach(function(d){
    const m=maal(d);
    if(kolonner===1){ d.x=20; d.y=y; y+=m.h+28; return; }
    if(i && i%kolonner===0){ x=20; y+=raekkeH+28; raekkeH=0; }
    d.x=x; d.y=y; x+=m.b+40; raekkeH=Math.max(raekkeH,m.h); i++;
  });
  markDirty(); drawPlan();
  setSync(kolonner===1?'kortene står i én kolonne':'kortene står i '+kolonner+' kolonner');
}

/* ── Fold tomme linjer væk ─────────────────────────────────────
   Et kort med 19 kanaler, hvor fire er i brug, er svært at overskue. Foldes
   kortet, vises kun de linjer der har et signal – resten er der stadig og
   kan foldes ud igen. Valget gemmes lokalt, så det ikke ændrer noget for
   kollegerne. */
const LS_FOLD='signalflow:planfold';
let planFold=new Set();
try{ planFold=new Set(JSON.parse(load(LS_FOLD)||'[]')) }catch(e){}
function gemFold(){ try{ store(LS_FOLD, JSON.stringify([...planFold])) }catch(e){} }
function erFoldet(dv){ return planFold.has(dv.id) }
function brugt(p){ return !!((p.label||'').trim() || (p.freq||'').trim()) }
/* de linjer der skal vises på et foldet kort */
function synligePorte(dv,side){
  const arr=ports(dv,side);
  if(!erFoldet(dv)) return {vis:arr, skjult:0};
  const vis=arr.filter(brugt);
  return {vis: vis.length?vis:arr.slice(0,1), skjult: arr.length-(vis.length||1)};
}
function foldKnap(dv){
  const f=erFoldet(dv);
  const tomme=['ins','outs'].reduce((s,side)=>s+ports(dv,side).filter(p=>!brugt(p)).length,0);
  if(!f && tomme<3) return '';                 // ingen grund til at folde
  return `<button class="mini foldknap ${f?'on':''}" data-dfold="${dv.id}"
    title="${f?'Vis alle linjer igen':'Skjul de '+tomme+' tomme linjer'}">${f?'⊞':'⊟'}</button>`;
}
function foldRest(dv,skjult){
  if(!skjult) return '';
  return `<button class="addrow foldrest" data-dfold="${dv.id}"
    title="Vis alle linjer">+ ${skjult} tomme linjer skjult</button>`;
}

/* Knappen i videolinjen. Den fylder én plads i knaprækken – lydkanalerne
   skubber IKKE linjerne fra hinanden, for de åbner i en rude ved siden af
   kortet. Tallet står på knappen, så man kan se hvilke signaler der er
   beskrevet lyd på, uden at åbne noget. */
function audKnap(dv,side,p){
 if(planDom!=='video')return '';
 /* Pladsen er lige bred på hver linje – også de tomme – så P og T i
    overskriften bliver stående præcis over hakkene. */
 /* teksten kan komme fra tegningen – så er der også et signal på linjen */
 if(!p.label && !(side==='ins'&&indFor('video',dv.id,p.id)))
  return '<span class="audslot"></span>';
 const noegle=audNoegle(dv,side,p);
 const skrevet=audSkrevet(p), antal=audListe(p).length;
 return `<span class="audslot"><button class="mini audbtn ${skrevet?'har':''} ${audAaben===noegle?'on':''}"
   data-audtoggle="${noegle}"
   title="Lydkanaler i dette videosignal – ${skrevet} af ${antal} beskrevet">♪${skrevet||''}</button></span>`;
}

/* Lydkanalerne folder ud UNDER videolinjen, rykket ind, så man kan se at de
   hører til den. Knappen til at åbne dem sidder oppe i linjen selv – ikke i
   et bånd for sig, for så ville hver eneste linje få en ekstra linje under
   sig, også dem uden lyd. */
function audListeBlok(dv,side,p){
 if(planDom!=='video')return '';
 if(!p.label && !(side==='ins'&&indFor('video',dv.id,p.id)))return '';
 const noegle=audNoegle(dv,side,p);
 if(audAaben!==noegle)return '';
 return audBlokKrop(dv,side,p);
}
/* Selve rækkerne. De står for sig, fordi video-containerne bruger præcis
   de samme felter – og flere ad gangen. Videosignalerne i planen åbner ét
   ad gangen (audAaben), containerne foldes ud hver for sig. Felternes navne
   er de samme, så bindPlan binder dem begge steder uden at vide forskel. */
function audBlokKrop(dv,side,p){
 const noegle=audNoegle(dv,side,p);
 const liste=audListe(p);
 const grps=portGrps(p).map(g=>grpFind(g)).filter(Boolean);
 return `<div class="audlist ${grps.length?'bundet':''}">
   ${grps.length?`<div class="audbind on" title="Teksten herovre er din egen. Står feltet tomt, viser den hvad der står i tegningen – tryk mellemrum eller enter for at hente den over.">
     <span class="bindikon">⚯</span>
     <span class="bindtekst">${esc(grps.map(f=>grpNavn(f.g.id)).join(', '))}</span></div>`:''}
   ${liste.map((a,ai)=>`
     <div class="aud ${a.label?'set':''} ${fresh(a)?'fresh':''}"
          ${fresh(a)?`style="--ret:${retFarveNu[a.by||'?']||RET_FARVER[0]}"`:''}>
       ${(()=>{const sp=spoegelsePlan(planDom,dv,p,a.id,ai);
         return sp?`<span class="audmaerke" title="${esc('Hænger sammen med '+sp.fra
           +' – teksten der er: '+sp.tekst)}">⚯</span>`:''})()}
       <input class="audn" value="${esc(a.n)}" data-audn="${noegle}|${a.id}"
              title="Navn eller nummer på lydkanalen">
       ${(()=>{
         /* Feltet er ALTID til at skrive i. Er det tomt, og står der noget
            i tegningen, vises det som skygge – og mellemrum eller enter
            henter det over. */
         const sp=spoegelsePlan(planDom,dv,p,a.id,ai);
         return `<input class="audl${(!a.label&&sp)?' harspoeg':''}" value="${esc(a.label)}"
              list="lbls" placeholder="${sp?esc(sp.tekst):'—'}"
              title="${sp&&!a.label?esc('Står i '+sp.fra+': '+sp.tekst+' — mellemrum eller enter henter den over')
                      :esc(a.label)}"
              ${sp?`data-spoeg="${esc(sp.tekst)}"`:''}
              data-audl="${noegle}|${a.id}">`})()}
       ${a.label?`
        <label class="tick" title="Patchet${a.pby?' · sat af '+esc(a.pby):''}">
          <input type="checkbox" data-audtick="${noegle}|${a.id}|patched" ${a.patched?'checked':''}></label>
        <label class="tick t2" title="Tjekket${a.cby?' · sat af '+esc(a.cby):''}">
          <input type="checkbox" data-audtick="${noegle}|${a.id}|checked" ${a.checked?'checked':''}></label>`
        :`<span class="tickgap"></span><span class="tickgap"></span>`}
       <span class="pby" title="${a.by?esc(a.by)+' · '+new Date(a.at).toLocaleString('da-DK'):''}">${a.by?esc(a.by):''}</span>
     </div>`).join('')}
   <button class="add audadd" data-audadd="${noegle}" title="Giv signalet en lydkanal mere">+ lydkanal</button>
 </div>`;
}

function portList(dv,side,title){
 const alle=ports(dv,side);
 const {vis:arr, skjult}=synligePorte(dv,side);
 const n=alle.filter(p=>p.label).length;
 return `<div class="portcol ${side}">
   <div class="portitle">${title} <span>${n}/${alle.length}</span></div>
   <div class="porthead"><span class="ph-n">Nr</span><span class="ph-l">Signal</span>

  if(e.key!==' '&&e.key!=='Enter')return false;
  if((inp.value||'').length)return false;          // kun i et tomt felt
  const sp=inp.dataset.spoeg;

  return true;

/* ── Plads til de udfoldede lydkanaler ────────────────────────
   Kortene ligger frit, hvor man har stillet dem. Folder man lydkanalerne ud
   under et videosignal, vokser kortet – og uden hjælp lægger det sig oven i
   kortet nedenunder. Vi skubber de kort, der står under det, ned så længe
   listen er åben.

   Det sker KUN på skærmen, med transform. Ingen x og y bliver rettet, så
   der bliver ikke noget at gemme, sende til kollegerne eller fortryde – og
   lukker man listen igen, står alt præcis hvor det stod. */
function skubForLydliste(el2){
 el2=el2||document.getElementById('plan');
 if(!el2)return;
 el2.querySelectorAll('.dev.skubbet').forEach(n=>{
  n.style.transform=''; n.classList.remove('skubbet');
 });
 const canvas=el2.querySelector('#devcanvas');
 if(canvas)canvas.style.paddingBottom='';
 const liste=el2.querySelector('.audlist');
 if(!liste)return;
 const kort=liste.closest('.dev');
 if(!kort)return;
 /* præcis det, listen lægger til kortets højde */
 const cs=getComputedStyle(liste);
 const delta=liste.offsetHeight
   +(parseFloat(cs.marginTop)||0)+(parseFloat(cs.marginBottom)||0);
 if(delta<=0)return;
 const r=kort.getBoundingClientRect();
 const bundFoer=r.bottom-delta;          // hvor kortet sluttede, før listen kom
 el2.querySelectorAll('.dev').forEach(n=>{
  if(n===kort)return;
  const q=n.getBoundingClientRect();
  if(q.top<bundFoer-1)return;                       // står ovenfor – rører det ikke
  if(q.right<=r.left+1||q.left>=r.right-1)return;   // står ved siden af
  n.style.transform='translateY('+delta+'px)';
  n.classList.add('skubbet');
 });
 /* og plads til at rulle ned til det nederste kort */
 if(canvas)canvas.style.paddingBottom=delta+'px';
}

/* ---- kortene ligger hvor du lægger dem ---- */
function bindDevDrag(el2){
 const canvas=el2.querySelector('#devcanvas');
 el2.querySelectorAll('[data-dragdev]').forEach(h2=>{
  h2.onmousedown=e=>{
   e.preventDefault();
   const dv=dom().devices.find(x=>x.id===h2.dataset.dragdev);
   const card=h2.closest('.dev');
   const cr=card.getBoundingClientRect(), wr=canvas.getBoundingClientRect();
   const gx=e.clientX-cr.left, gy=e.clientY-cr.top;
   card.classList.add('moving');
   snap();
   const move=ev=>{
    /* først den rå position, så vi kan se om den flugter med noget */
    const rx=Math.max(0,ev.clientX-gx-wr.left), ry=Math.max(0,ev.clientY-gy-wr.top);
    card.style.left=rx+'px'; card.style.top=ry+'px';
    const g=planSnap?showGuides(card,canvas,'.dev'):{x:null,y:null};
    if(!planSnap)return;
    /* en flugt vinder over gitteret */
    card.style.left=Math.max(0,Math.round(g.x!==null?g.x:Math.round(rx/GRID)*GRID))+'px';
    card.style.top =Math.max(0,Math.round(g.y!==null?g.y:Math.round(ry/GRID)*GRID))+'px';
   };
   const up=()=>{
    document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
    card.classList.remove('moving');
    clearGuides(canvas);
    dv.x=Math.round(parseFloat(card.style.left)||0);
    dv.y=Math.round(parseFloat(card.style.top)||0);
    dv.mt=Date.now(); autosave();
   };
   document.addEventListener('mousemove',move);
   document.addEventListener('mouseup',up);
  };
 });
 /* træk i hjørnet for at gøre kortet bredere */
 el2.querySelectorAll('[data-devrs]').forEach(hn=>hn.onmousedown=e=>{
  e.preventDefault(); e.stopPropagation();
  const dv=dom().devices.find(x=>x.id===hn.dataset.devrs);
  const card=hn.closest('.dev');
  const x0=e.clientX, w0=card.getBoundingClientRect().width;
  snap();
  const move=ev=>{
   const w=planSnap?Math.round((w0+(ev.clientX-x0))/GRID)*GRID:(w0+(ev.clientX-x0));
   card.style.width=Math.max(340,w)+'px';
   showGuides(card,el2.querySelector('#devcanvas'),'.dev');
  };
  const up=()=>{document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
    clearGuides(el2.querySelector('#devcanvas'));
    dv.w=Math.round(parseFloat(card.style.width)||CARDW); dv.mt=Date.now(); autosave()};
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
 });
}

function planLink(tok,pid){
 const u=location.origin+location.pathname;
 const q=['view=plan','only=1','dom='+planDom];
 if(tok){
  q.push('t='+tok);
  /* Projektets id kommer med som kvittering. Gæsten tjekker at nøglen
     faktisk åbner DET projekt – ellers siger den fra i stedet for at vise
     en plan fra et andet projekt. */
  if(pid||cloudId)q.push('p='+(pid||cloudId));
 }else if(cloudId)q.push('p='+cloudId);
 return u+'?'+q.join('&');
}
/* Laver en nøgle til projektet første gang der deles, og genbruger den siden.
   Nøglen ligger i signalflow_shares med en fremmednøgle til projektet, så den
   kun kan forsvinde sammen med projektet selv. Er den nye SQL ikke kørt endnu,
   falder vi tilbage til den gamle kolonne, så delingen stadig virker. */
async function shareToken(){
 if(!cloudId)throw new Error('Gem projektet i databasen først – et delelink hører til ét bestemt projekt.');
 let tok=null;
 try{
  const svar=await sbFetch('rpc/sf_share_make',
    {method:'POST',body:JSON.stringify({pid:cloudId,who:meName()})});
  tok=Array.isArray(svar)?(svar[0]&&(svar[0].sf_share_make||svar[0])):svar;
  if(tok&&typeof tok==='object')tok=null;
 }catch(e){ tok=null; }          // funktionen findes ikke endnu
 if(!tok){
  const r=await sbFetch('signalflow_projects?id=eq.'+cloudId+'&select=share_token');
  tok=(r&&r.length&&r[0].share_token)||null;
  if(!tok){
   tok=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));
   await sbFetch('signalflow_projects?id=eq.'+cloudId,
     {method:'PATCH',body:JSON.stringify({share_token:tok})});
  }
 }
 /* Prøv linket af, FØR det bliver sendt videre. Et dødt link opdager man
    ellers først, når kollegaen står med det. */
 let raekker=null;
 try{ raekker=await rpc('sf_plan_get',{tok:tok}) }catch(e){ raekker=null }
 if(raekker&&!raekker.length)
  throw new Error('Linket virker ikke i databasen endnu.\n\nKør SQL-opsætningen igen: menuen → "Vis SQL".');
 if(raekker&&raekker.length&&raekker[0].id&&raekker[0].id!==cloudId)
  throw new Error('Nøglen åbner et andet projekt end det, der er åbent.\n\nKør SQL-opsætningen igen: menuen → "Vis SQL".');
 return tok;
}
function copyLink(link,btn){
 const done=()=>{const t=btn.textContent;btn.textContent='Kopieret ✓';setTimeout(()=>{btn.textContent=t},1600)};
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(link).then(done).catch(()=>prompt('Kopiér linket:',link));
 }else prompt('Kopiér linket:',link);
}

function applyUrl(){
 const q=new URLSearchParams(location.search);
 if(q.get('dom')&&PLANDOMS[q.get('dom')])planDom=q.get('dom');
 if(q.get('only')==='1')document.body.classList.add('onlyplan');
 const wantPlan=q.get('view')==='plan'||q.get('only')==='1';
 const pid=q.get('p');
 if(pid){
  if(!session()){
   pendingOpen=pid; pendingPlan=wantPlan;
   if(wantPlan)setView('plan');
   return;
  }
  cloudOpen(pid).then(()=>{if(wantPlan)setView('plan')})
    .catch(e=>{if(wantPlan)setView('plan');setSync(e.message,true)});
  return;
 }
 if(wantPlan)setView('plan');
}

   const n=document.getElementById('archq');if(n){n.focus();n.setSelectionRange(pos,pos)}};
 const cf=el2.querySelector('#archcat');
 if(cf)cf.onchange=()=>{lagCat=cf.value;drawArchive()};
 el2.querySelectorAll('[data-asel]').forEach(n=>n.onclick=()=>{
   if(lagDirty&&!confirm('Du har ikke gemt dine ændringer. Skift alligevel?'))return;
   lagSel=n.dataset.asel; lagDirty=false; drawArchive();
 });
 const nb=el2.querySelector('#archnew');
 if(nb)nb.onclick=async()=>{
   try{
    const r=await sbFetch('equipment?select=id',{method:'POST',body:JSON.stringify(
      {name:'Nyt udstyr',category:lagCat||(lagerCats[0]&&lagerCats[0].name)||'Udstyr',qty:1,
       tech:{ins:[],outs:[],conIn:'',conOut:''},custom_fields:[]})});
    lagerRows=await lagerList(true); lagSel=r[0].id; lagDirty=false; drawArchive();
   }catch(e){alert(e.message)}

 const tech=()=>{cur.tech=cur.tech||{ins:[],outs:[],conIn:'',conOut:''};

   const a=tech()[side];

   while(a.length>want)a.pop();

 el2.querySelectorAll('[data-aet]').forEach(inp=>inp.oninput=()=>{

 el2.querySelectorAll('[data-aeadd]').forEach(b=>b.onclick=()=>{

   a.push({n:String(a.length+1),label:'',type:''}); mark(); drawArchive()});
 el2.querySelectorAll('[data-aedel]').forEach(b=>b.onclick=()=>{

 el2.querySelectorAll('[data-aeup]').forEach(b=>b.onclick=()=>{

 /* egne felter – samme format som lagerprogrammet: {label, value} */
 const cfa=el2.querySelector('#ae-cfadd');
 if(cfa)cfa.onclick=()=>{cur.custom_fields=(cur.custom_fields||[]).concat([{label:'',value:''}]);mark();drawArchive()};

/* ================= mobiludgave =================
   På en telefon er der ikke plads til rækker af små knapper. I stedet får
   hver linje én ⋯-knap, der åbner et ark nedefra med de samme muligheder. */
let mobil=false;
const LS_MODE='signalflow:mode';

/* Hvilken slags skærm sidder vi ved?
   Bredden alene er ikke nok: et lille browservindue på en Mac er stadig en
   computer, og en iPad i landskab er stadig en berøringsskærm. Derfor kigger
   vi på både pegeredskab, berøring og bredde. */
function skaermType(){
 let grov=false, kanHover=true;
 try{
  grov = matchMedia('(pointer:coarse)').matches;
  kanHover = matchMedia('(hover:hover)').matches;
 }catch(e){}
 const beroering = grov || (navigator.maxTouchPoints||0)>1;
 const b=innerWidth;

 /* Slår man "Vis computerudgave" til i Safari, påstår telefonen at den er
    980 pixels bred og har en mus. Skærmens fysiske mål ændrer sig derimod
    ikke – og en iPhone er stadig en iPhone. Derfor spørger vi om apparatet
    først og om vinduet bagefter. */
 const ua=navigator.userAgent||'';
 const haandholdt =
   /iPhone|iPod/.test(ua) ||
   /iPad/.test(ua) ||
   (navigator.platform==='MacIntel' && (navigator.maxTouchPoints||0)>1) ||  // iPad der kalder sig Mac
   /Android|Mobile|Windows Phone/i.test(ua);
 let kortSide=9999;
 try{
  const sk=screen||{};
  kortSide=Math.min(sk.width||9999, sk.height||9999);
  /* nogle browsere angiver skærmen i punkter, andre i pixels */
  if(devicePixelRatio>1 && kortSide>1400) kortSide=Math.round(kortSide/devicePixelRatio);
 }catch(e){}
 if(haandholdt && kortSide<=1100) return 'telefon';

 if(beroering&&!kanHover&&b<=920)return 'telefon';   // telefon eller tablet i hånden
 if(b<=620)return 'telefon';                          // meget smalt vindue
 return 'computer';
}
/* Et fingeraftryk af skærmen. Skifter det – fx fordi projektet åbnes på en
   anden maskine – gælder et tidligere valg ikke længere, og vi vælger selv. */
function skaermAftryk(){
 const b=innerWidth;
 const trin = b<=620?'s' : b<=1024?'m' : 'l';
 return skaermType()+':'+trin;
}


/* ── Besked om Safaris computerudgave ──────────────────────────
   Er "Vis computerudgave" slået til, påstår telefonen at den er 980 pixels
   bred. Vi viser mobiludgaven alligevel, men alt bliver skaleret lille –
   derfor en linje om hvordan man slår det fra. Den kan lukkes for altid. */
function tjekComputerudgave(){
  try{
    if(localStorage.getItem('signalflow:skjulcu')==='1') return;
  }catch(e){}
  if(skaermType()!=='telefon' || innerWidth<=700) return;
  if(document.getElementById('cubesked')) return;
  const d=document.createElement('div');
  d.id='cubesked';
  d.innerHTML='Safari viser siden i <b>computerudgave</b>, så alt bliver småt. '
    +'Tryk på <b>aA</b> i adresselinjen → <b>Vis mobilwebsted</b>.'
    +'<button id="culuk" title="Skjul denne besked">✕</button>';
  document.body.appendChild(d);
  d.querySelector('#culuk').onclick=()=>{
    d.remove();
    try{ localStorage.setItem('signalflow:skjulcu','1') }catch(e){}
  };
}

function setMode(m,gem){
 mobil=m;
 document.body.classList.toggle('mobile',m);
 if(gem)try{localStorage.setItem(LS_MODE,JSON.stringify({aftryk:skaermAftryk(),valg:m?'mobil':'desktop'}))}catch(e){}
 const b=document.getElementById('bMode');
 if(b){b.textContent=m?'🖥':'📱';
   b.title=(m?'Skift til skrivebordsudgaven':'Skift til mobiludgaven')
     +' · programmet har selv valgt '+(skaermType()==='telefon'?'mobil':'skrivebord')
     +' ud fra skærmen'}
 document.querySelectorAll('#mnav button').forEach(n=>

function flytKanal(g,i,ret){
 const j=i+ret;
 if(j<0||j>=g.channels.length)return;
 snap();
 const numre=g.channels.map(c=>c.nr);
 const [f]=g.channels.splice(i,1);
 g.channels.splice(j,0,f);
 g.channels.forEach((c,k)=>{c.nr=numre[k]});
 draw();
}

function bindInVaelg(gid,chid){
 const f=grpFind(gid);
 const g=f&&f.g;
 const ch=g&&(g.channels||[]).find(x=>x.id===chid);
 if(!ch)return;
 const p=ensurePlan();
 const lag=ch.layer||'lyd';
 /* Målene samles i bunker – ét stykke udstyr ad gangen, og under video én
    bunke pr. videosignal. Ellers bliver listen uoverskuelig: et rack med 16
    input og et kryds med otte lydkanaler pr. signal løber hurtigt op.
    En VIDEOkanal peger på selve videoinputtet; en LYDkanal peger på et
    lydinput, et kameraspor, en frekvens – eller en lydkanal inde i et
    videosignal. */
 const bunker=[];
 const find=n=>bunker.find(b=>b.noegle===n);
 Object.keys(PLANDOMS).forEach(d2=>{
  if(lag==='video' && d2!=='video')return;
  if(lag==='lyd'   && d2==='net')return;
  ((p[d2]||{}).devices||[]).forEach(dv=>{
   if(dv.del)return;
   alive(dv.ins).forEach(port=>{
    if(d2==='video'&&lag==='video'){
     /* videoen selv: inputlinjen på krydset */
     const n=d2+'|'+dv.id;
     let b=find(n);
     if(!b)bunker.push(b={noegle:n, hoved:(dv.name||''), omr:PLANDOMS[d2], maal:[]});
     b.maal.push({dom:d2, dev:dv.id, port:port.id,
       linje:'Input '+(port.n||'')+(port.label?' · '+port.label:'')});
    }else if(d2==='video'){
     if(!port.label)return;
     const n=d2+'|'+dv.id+'|'+port.id;
     let b=find(n);
     if(!b)bunker.push(b={noegle:n, hoved:(dv.name||'')+' · '+(port.label||port.n||''),
                          omr:PLANDOMS[d2], maal:[]});
     audListe(port).forEach(a=>b.maal.push({
       dom:d2, dev:dv.id, port:port.id, aud:a.id,
       linje:a.n+(a.label?' · '+a.label:'')}));
    }else{
     const n=d2+'|'+dv.id;
     let b=find(n);
     if(!b)bunker.push(b={noegle:n, hoved:(dv.name||''), omr:PLANDOMS[d2], maal:[]});
     /* kameraplanen og frekvensplanen har kanaler, ikke "input" */
     const ord = (d2==='kam'||d2==='freq') ? 'Kanal ' : 'Input ';
     let ekstra='';
     if(d2==='kam'){
      /* Er AES i brug på kameraet, udgår kanal 2 – og så kan der heller
         ikke bindes til den. Ellers ville man pege på en plads, der ikke
         findes i virkeligheden. */
      if(kamAesIBrug(dv) && kamType(port)==='mic' && (port.n||'').trim()==='2')return;
      ekstra=' · '+(kamType(port)==='aes'?'AES':'mic/line');
     }
     if(d2==='freq'&&port.freq)ekstra=' · '+port.freq+' MHz';
     b.maal.push({dom:d2, dev:dv.id, port:port.id,
       linje:ord+(port.n||'')+(port.label?' · '+port.label:'')+ekstra});
    }
   });
  });
 });
 const idx=indIndeks();
 bunker.forEach(b=>{
  b.taget=b.maal.filter(m=>(idx[indNoegle(m)]||[]).length).length;
  b.min=b.maal.some(m=>(idx[indNoegle(m)]||[]).some(t=>t.ch.id===ch.id));
 });
 /* Den bunke kanalen allerede peger ind i, står åben fra start */
 let aaben=(bunker.find(b=>b.min)||{}).noegle||null;
 const nu=ch.ind?indNoegle(ch.ind):'';

 let soeg='';
 const tegn=root=>{
  const ud=root.querySelector('#bindListe');
  if(!bunker.length){
   ud.innerHTML='<div class="msub" style="text-transform:none;letter-spacing:0;line-height:1.6">'
    +'Der er ingen inputlinjer i planen endnu.<br>Læg udstyr ind under Plan først.</div>';
   return;
  }
  /* Med et kryds fuldt af signaler bliver listen lang. Søgningen kigger både
     på bunkens navn og på linjerne inde i den, så "extern 5" og "kommentator"
     begge finder vej. En bunke der er fundet ved sine linjer, åbnes. */
  const q=soeg.trim().toLowerCase();
  const passer=b=>!q || b.hoved.toLowerCase().includes(q)
    || b.omr.toLowerCase().includes(q) || b.maal.some(m=>m.linje.toLowerCase().includes(q));
  const vis=bunker.filter(passer);
  if(!vis.length){
   ud.innerHTML='<div class="msub" style="text-transform:none;letter-spacing:0;padding:10px">'
     +'Intet i planen matcher "'+esc(soeg)+'".</div>';
   return;
  }
  ud.innerHTML=vis.map(b=>{
   const aab = aaben===b.noegle
     || (!!q && !b.hoved.toLowerCase().includes(q) && b.maal.some(m=>m.linje.toLowerCase().includes(q)));
   return `<div class="bunke ${aab?'on':''}">
     <button class="bunkehoved" data-bunke="${esc(b.noegle)}">
       <span class="bunkepil">${aab?'▾':'▸'}</span>
       <span class="bunkenavn">${esc(b.hoved)}</span>
       <span class="bunkeomr">${esc(b.omr)}</span>
       <span class="bunketal">${b.maal.length}${b.taget?' · '+b.taget+' bundet':''}</span>
     </button>
     ${aab?`<div class="bunkeliste">${b.maal.map(m=>{
       const n=indNoegle(m), alle=idx[n]||[], minEgen=alle.some(t=>t.ch.id===ch.id);
       /* Pladsen er ikke "optaget" længere – den kan bruges af flere. Men
          man skal kunne se hvem der ellers hænger på den, inden man vælger. */
       const andre=alle.filter(t=>t.ch.id!==ch.id);
       return `<button class="grpvalg ${minEgen?'on':''}" data-maal="${esc(JSON.stringify(m))}">
         <span class="grpnavn">${esc(m.linje)}</span>
         ${minEgen?`<span class="grptal">bundet til denne kanal</span>`:''}
         ${andre.length?`<span class="grptal">${andre.length===1?'bruges også af ':'bruges også af '+andre.length+': '}${
            esc(andre.slice(0,3).map(t=>(t.ch.nr||'')+' '+(t.ch.label||'')+' i '+(t.g.label||'')).join(', '))
            }${andre.length>3?' …':''}</span>`:''}
       </button>`}).join('')}</div>`:''}
   </div>`;
  }).join('');
  ud.querySelectorAll('[data-bunke]').forEach(n=>n.onclick=()=>{
   aaben = aaben===n.dataset.bunke ? null : n.dataset.bunke;   // én ad gangen
   tegn(root);
  });
  ud.querySelectorAll('[data-maal]').forEach(b=>b.onclick=()=>{
   const m=JSON.parse(b.dataset.maal);
   snap();
   /* Ingen spørger mere, og ingen bliver sluppet: det samme input må gerne
      gå til flere kanaler. Trykker man på den, kanalen allerede peger på,
      slipper man den – så er det samme knap begge veje. */
   const alt = ch.ind && indNoegle(ch.ind)===indNoegle(m);
   if(alt) delete ch.ind;
   else { ch.ind={dom:m.dom, dev:m.dev, port:m.port}; if(m.aud)ch.ind.aud=m.aud; }
   indNulstil(); closeModal(); draw();
  });
 };

 openModal(lag==='video'?'Hvor kommer videoen fra?':'Hvor kommer kanalen fra?',
   (ch.nr||'')+' · '+(ch.label||'uden tekst')+' – vælg det input i planen, signalet kommer fra',
  `<div class="mf"><input type="text" name="bsoeg" placeholder="Søg i planen – fx extern 5 eller kommentator"></div>
   <div id="bindListe" class="grpliste"></div>
   <div class="msub" style="text-transform:none;letter-spacing:0;font-size:11.5px;line-height:1.6;margin-top:12px">
      Teksten skrives fra tegningen til planen. Den kan ikke rettes i
      planen – der er kun ét sted at skrive den.
    </div>
    <div class="mrow" style="margin-top:12px">
      ${nu?`<button class="btn" data-loes="1">Løsn bindingen</button>`:''}
      <button class="btn" data-annul="1">Fortryd</button>
    </div>`,
  root=>{
   tegn(root);
   const sf=root.querySelector('[name="bsoeg"]');
   if(sf)sf.oninput=()=>{soeg=sf.value; tegn(root)};
   const l=root.querySelector('[data-loes]');
   if(l)l.onclick=()=>{snap(); delete ch.ind; indNulstil(); closeModal(); draw()};
   const a=root.querySelector('[data-annul]');
   if(a)a.onclick=closeModal;
  });
}

/* Vælg hvilket videooutput gruppens lyd ligger på */
function bindUdVaelg(gid){
 const f=grpFind(gid); const g=f&&f.g;
 if(!g)return;
 const p=ensurePlan();
 /* Pilens retning bestemmer, hvilken side der kan vælges fra. */
 const sider=grpSider(g);
 const maal=[];
 ((p.video||{}).devices||[]).forEach(dv=>{
  if(dv.del)return;
  sider.forEach(side=>{
   alive(dv[side]).forEach(o=>{ if(o.label)maal.push({dom:'video',dev:dv.id,port:o.id,side:side,
     hoved:dv.name||'', linje:SIDENAVN[side]+' '+(o.n||'')+' · '+o.label,
     grps:portGrps(o)}) });
  });
 });
 /* Video containerne er også et sted, en gruppe kan ligge: det er jo
    containeren, der bærer signalet gennem routeren. De står for sig i
    listen, så man kan se forskel på en plan-linje og en container. */
 ((p.vc||{}).devices||[]).forEach(dv=>{
  if(dv.del)return;
  const o=vcPort(dv); if(!o)return;
  const side=vcPortSide(dv);
  if(sider.indexOf(side)<0)return;
  maal.push({dom:'vc',dev:dv.id,port:o.id,side:side,
    hoved:'Video container'+(dv.bib?' · '+dv.bib:''),
    linje:(vcRetning(dv)==='ind'?'Ind':'Ud')+' '+(dv.nr||'')+' · '+(dv.name||'uden navn'),
    grps:portGrps(o)});
 });
 const nu=udFor(gid);
 /* Er gruppen bundet på den anden side – fx fordi pilen er vendt om bagefter
    – skjuler vi det ikke. Den står øverst, så man kan se den og slippe den. */
 const anden = nu && sider.indexOf(nu.side)<0 ? nu : null;
 const ordet = sider.length>1?'videosignal':(sider[0]==='ins'?'videoinput':'videooutput');
 const krop = (anden?`<div class="bindanden">
      <b>Bundet den anden vej</b>
      <span>Gruppens lyd ligger på ${esc((anden.dv.name||'')+' · '+SIDENAVN[anden.side].toLowerCase()
        +' '+(anden.port.n||'')+' '+(anden.port.label||''))}.
      Pilen peger nu ${(g.dir==='rtl')?'den anden vej':'ud mod modtageren'},
      så den hører til på ${sider[0]==='ins'?'inputsiden':'outputsiden'}.</span>
    </div>`:'')
  + (maal.length
  ? `<div class="grpliste">${maal.map(m=>`
      <button class="grpvalg ${m.grps.indexOf(gid)>=0?'on':''}" data-ud="${m.dom}|${m.dev}|${m.side}|${m.port}">
        <span class="grpnavn">${esc(m.linje)}</span>
        <span class="grpsti">${esc(m.hoved)}${m.dom==='vc'?'':' · Video'}</span>
        ${m.grps.indexOf(gid)>=0?`<span class="grptal">gruppen ligger her</span>`:''}
        ${(()=>{const andre=m.grps.filter(x=>x!==gid);
          return andre.length?`<span class="grptal">bruges også af ${
            esc(andre.map(x=>grpNavn(x)).join(', '))}</span>`:''})()}
      </button>`).join('')}</div>`
  : `<div class="msub" style="text-transform:none;letter-spacing:0;line-height:1.6">
       Der er ingen ${esc(ordet)} med signal på endnu, og ingen video containere.<br>
       Læg et kryds ind under Plan › Video, eller opret en container under
       Plan › Video containere.</div>`);
 openModal('Hvor ligger gruppens lyd?',
  (g.label||g.feed||'gruppen')+' – '+(g.dir==='rtl'?'pilen er vendt om, så vælg et videoinput i planen'
    :g.dir==='both'?'signalet går begge veje – vælg input eller output i planen'
    :'vælg et videooutput i planen'),
  krop+`<div class="msub" style="text-transform:none;letter-spacing:0;font-size:11.5px;line-height:1.6;margin-top:12px">
      Gruppens lydkanaler bliver ${sider[0]==='ins'?'inputtets':'outputtets'} lydkanaler.
      Her går det begge veje: retter du teksten det ene sted, står den begge steder.
    </div>
    <div class="mrow" style="margin-top:12px">
      ${nu?`<button class="btn" data-loes="1">Løsn bindingen</button>`:''}
      <button class="btn" data-annul="1">Fortryd</button>
    </div>`,
  root=>{
   root.querySelectorAll('[data-ud]').forEach(b=>b.onclick=()=>{
    const [d2,did,side,pid]=b.dataset.ud.split('|');
    const dv=((ensurePlan()[d2]||{}).devices||[]).find(x=>x.id===did);
    const port=dv&&(dv[side]||[]).find(x=>x.id===pid);
    if(!port)return;
    snap();
    /* Ingen advarsel og ingen flytning: en port må bære flere grupper, og
       en gruppe må ligge flere steder. Trykker man på et sted, gruppen
       allerede ligger, slipper man netop det sted. */
    const liste=portGrps(port);
    const i=liste.indexOf(gid);
    if(i>=0) liste.splice(i,1); else liste.push(gid);
    portSatGrps(port, liste); touch(port);
    closeModal(); draw();
   });
   const l=root.querySelector('[data-loes]');
   /* Løsn: gruppen slippes ALLE de steder, den ligger. */
   if(l)l.onclick=()=>{snap();
     udAlleFor(gid).forEach(u=>{ portSatGrps(u.port, portGrps(u.port).filter(x=>x!==gid)); touch(u.port) });
     closeModal(); draw()};
   const a=root.querySelector('[data-annul]');
   if(a)a.onclick=closeModal;
  });
}

/* ── Arkiv over sporplaner ─────────────────────────────────────
   En sporplan er den række kanaler en gruppe har på ét lag: lydsporplanen er
   "Ch. 1 Kamera-mic V, Ch. 2 Kamera-mic H …", intercomsporplanen er
   "4W 1 Prod, 4W 2 Kamera …". De samme opstillinger går igen fra produktion
   til produktion, så de gemmes i arkivet og hentes ind på en ny gruppe.

   Arkivet ligger i databasen, så kollegerne har de samme planer. Er tabellen
   ikke oprettet endnu, falder vi tilbage til denne maskine alene – så kan man
   bruge det med det samme, og det siger selv til, at SQL'en mangler. */
const SPORLAG={
 lyd:      {navn:'lydsporplan',       Navn:'Lydsporplan',       hvad:'lydkanaler'},
 intercom: {navn:'intercomsporplan',  Navn:'Intercomsporplan',  hvad:'intercomkanaler'}
};
const LS_SPOR='signalflow:sporplaner';
let sporArkivLokalt=false;           // kører vi på reserven?
function sporplanerLokalt(){
 try{ return JSON.parse(load(LS_SPOR)||'[]') }catch(e){ return [] }
}
async function sporplanerHent(lag){
 try{
  const r=await sbFetch('signalflow_lydplaner?select=id,name,note,type,kanaler,created_by,updated_at'
    +'&type=eq.'+lag+'&order=name.asc');
  sporArkivLokalt=false;
  return r||[];
 }catch(e){
  sporArkivLokalt=true;
  return sporplanerLokalt().filter(x=>(x.type||'lyd')===lag)
    .sort((a,b)=>(a.name||'').localeCompare(b.name||'','da'));
 }
}
async function sporplanGem(lag,navn,note,kanaler){
 const who=meName()==='?'?'':meName();
 const nu=new Date().toISOString();
 if(!sporArkivLokalt){
  try{
   /* findes navnet på det samme lag i forvejen, rettes den i stedet */
   const fandtes=await sbFetch('signalflow_lydplaner?select=id&type=eq.'+lag
     +'&name=eq.'+encodeURIComponent(navn));
   if(fandtes&&fandtes.length){
    await sbFetch('signalflow_lydplaner?id=eq.'+fandtes[0].id,{method:'PATCH',
      body:JSON.stringify({note:note,kanaler:kanaler,created_by:who,updated_at:nu})});
   }else{
    await sbFetch('signalflow_lydplaner',{method:'POST',
      body:JSON.stringify({name:navn,note:note,type:lag,kanaler:kanaler,created_by:who,updated_at:nu})});
   }
   return 'db';
  }catch(e){ sporArkivLokalt=true; }
 }
 const liste=sporplanerLokalt().filter(x=>
   !((x.type||'lyd')===lag && (x.name||'').toLowerCase()===navn.toLowerCase()));
 liste.push({id:'l'+Date.now(),name:navn,note:note,type:lag,kanaler:kanaler,created_by:who,updated_at:nu});
 store(LS_SPOR,JSON.stringify(liste));
 return 'lokal';
}
async function sporplanSlet(pid){
 if(!sporArkivLokalt){
  try{ await sbFetch('signalflow_lydplaner?id=eq.'+pid,{method:'DELETE'}); return }
  catch(e){ sporArkivLokalt=true; }
 }
 store(LS_SPOR,JSON.stringify(sporplanerLokalt().filter(x=>x.id!==pid)));
}

/* Gem gruppens kanaler på ét lag i arkivet */
function gemSporplan(g,lag){
 const L=SPORLAG[lag];
 const kanaler=grpLag(g,lag).map(c=>({nr:c.nr||'',label:c.label||''}));
 if(!kanaler.length)return alert('Gruppen har ingen '+L.hvad+' at gemme.');
 openModal('Gem som '+L.navn, kanaler.length+' '+L.hvad+' fra "'+(g.label||g.feed||'gruppen')+'"',
  `<div class="mf"><label>Navn på planen</label>
     <input type="text" name="navn" value="${esc(g.label||g.feed||'')}" placeholder="fx Kamera med kommentator"></div>
   <div class="mf"><label>Note (valgfri)</label>
     <input type="text" name="note" placeholder="hvornår bruges den?"></div>
   <div class="lydvis">${kanaler.map(k=>
     `<span><em>${esc(k.nr)}</em>${esc(k.label||'—')}</span>`).join('')}</div>
   <div id="lydMsg" class="msub" style="text-transform:none;letter-spacing:0;min-height:15px"></div>
   <div class="mrow"><button class="btn go" data-ok="1" style="width:100%">Gem i arkivet</button></div>`,
  root=>{
   const navn=root.querySelector('[name="navn"]'), note=root.querySelector('[name="note"]');
   const msg=root.querySelector('#lydMsg');
   root.querySelector('[data-ok]').onclick=async function(){

    if(n.length<2){msg.textContent='Giv planen et navn først.';navn.focus();return}
    this.textContent='Gemmer …'; this.disabled=true;
    try{
     const hvor=await sporplanGem(lag,n,note.value.trim(),kanaler);
     closeModal();
     if(hvor==='lokal')alert('Planen er gemt på denne maskine.\n\nFor at dele den med kollegerne skal SQL\'en for signalflow_lydplaner køres i databasen.');
    }catch(e){ this.textContent='Gem i arkivet'; this.disabled=false; msg.textContent=e.message }
   };
  });
}

/* Hent en sporplan ind på gruppen */
/* ── Arkivet som et sted ──────────────────────────────────────
   En ♪ ude i en gruppelinje er en handling, ikke et bibliotek. Her er
   arkivet som noget man kan åbne og kigge i: begge lag, hvad der står i
   hver plan, hvem der lavede den, og vejen videre til at hente den ind. */
/* Lagersiden har ikke længere sin egen fane. Åbner man den fra en
   udstyrsboks, skal der være en tydelig vej tilbage. */
function lagerTilbage(){
 return `<button class="sharebtn" data-lagerretur="1"
   title="Tilbage til planen">← Tilbage til planen</button>`;
}

 lag=lag||'lyd';

 openModal('Sporplaner', 'Gemte opstillinger, der kan hentes ind på en gruppe', `
  <div class="arkfaner">${fane('lyd')}${fane('intercom')}</div>
  <div id="arkListe" class="grpliste"><div class="msub">henter …</div></div>
  <div class="msub" style="text-transform:none;letter-spacing:0;font-size:11.5px;line-height:1.6;margin-top:12px">
    Du henter og gemmer en sporplan <b>på en gruppe</b> i tegningen:
    tryk <b>♪ Sporplan</b> ude ved gruppens navn. Her kan du se, hvad arkivet
    indeholder, og rydde op i det.
  </div>
  <div class="mrow"><button class="btn" data-arkluk="1">Luk</button></div>`,
  async root=>{
   root.querySelector('[data-arkluk]').onclick=closeModal;
   root.querySelectorAll('[data-arkfane]').forEach(n=>n.onclick=()=>{
     closeModal(); setTimeout(()=>openSporarkiv(n.dataset.arkfane),40);
   });
   const ud=root.querySelector('#arkListe');
   const L=SPORLAG[lag];
   let liste=[];
   try{ liste=await sporplanerHent(lag) }
   catch(e){ ud.innerHTML='<div class="msub">'+esc(e.message||'Kunne ikke hente arkivet.')+'</div>'; return }
   if(!liste.length){
    ud.innerHTML='<div class="msub" style="text-transform:none;letter-spacing:0;line-height:1.6">'
     +'Arkivet er tomt for '+esc(L.navn)+'er.<br>'
     +'Åbn en gruppe i tegningen, tryk <b>♪ Sporplan</b> og gem dens '+esc(L.hvad)+'.</div>';
   } else {
    ud.innerHTML=liste.map(x=>{
     const k=x.kanaler||[];
     return `<div class="grpvalg lydvalg arkrk">
       <span class="grpnavn">${esc(x.name)}</span>
       <span class="grpsti">${k.length} ${k.length===1?'kanal':'kanaler'}${x.note?' · '+esc(x.note):''}${x.created_by?' · '+esc(x.created_by):''}</span>
       <span class="grptal">${k.map(c=>esc(c.nr?c.nr+' '+(c.label||''):(c.label||''))).join(' · ')}</span>
       <button class="mini lydslet" data-slet="${x.id}" title="Fjern planen fra arkivet">✕</button>
     </div>`;
    }).join('');
    ud.querySelectorAll('[data-slet]').forEach(n=>n.onclick=async ev=>{
     ev.stopPropagation();
     const pl=liste.find(x=>x.id===n.dataset.slet);
     if(!pl||!confirm('Fjern "'+pl.name+'" fra arkivet?'))return;
     await sporplanSlet(pl.id);
     closeModal(); setTimeout(()=>openSporarkiv(lag),40);

   }
   if(sporArkivLokalt)
    ud.insertAdjacentHTML('beforeend','<div class="msub" style="text-transform:none;letter-spacing:0;margin-top:8px">'
      +'Arkivet ligger kun på denne maskine – kør SQL\'en for at dele det med kollegerne.</div>');
  });
}

function hentSporplan(g,lag){
 const L=SPORLAG[lag];
 openModal('Hent '+L.navn,'Henter ind på "'+(g.label||g.feed||'gruppen')+'"',
  `<div id="lydListe" class="grpliste"><div class="msub">henter …</div></div>
   <div class="msub" style="text-transform:none;letter-spacing:0;font-size:11.5px;line-height:1.6;margin-top:12px">
     Planen erstatter gruppens ${esc(L.hvad)}. De andre signaltyper i gruppen bliver hvor de er.
   </div>`,
  async root=>{
   const ud=root.querySelector('#lydListe');
   let liste=[];
   try{ liste=await sporplanerHent(lag) }catch(e){ ud.innerHTML='<div class="msub">'+esc(e.message)+'</div>'; return }
   if(!liste.length){
    ud.innerHTML='<div class="msub" style="text-transform:none;letter-spacing:0;line-height:1.6">'
     +'Der er ingen '+esc(L.navn)+'er i arkivet endnu.<br>'
     +'Gem en gruppes '+esc(L.hvad)+' som '+esc(L.navn)+', så står den her næste gang.</div>';
    return;
   }
   ud.innerHTML=liste.map(x=>{
    const k=x.kanaler||[];
    return `<div class="grpvalg lydvalg" data-lyd="${x.id}">
      <span class="grpnavn">${esc(x.name)}</span>
      <span class="grpsti">${k.length} ${k.length===1?'kanal':'kanaler'}${x.note?' · '+esc(x.note):''}${x.created_by?' · '+esc(x.created_by):''}</span>
      <span class="grptal">${k.slice(0,4).map(c=>esc(c.label||c.nr)).join(' · ')}${k.length>4?' …':''}</span>
      <button class="mini lydslet" data-slet="${x.id}" title="Fjern planen fra arkivet">✕</button>
    </div>`;
   }).join('')+(sporArkivLokalt?'<div class="msub" style="text-transform:none;letter-spacing:0;margin-top:8px">Arkivet ligger kun på denne maskine – kør SQL\'en for at dele det.</div>':'');
   ud.querySelectorAll('[data-lyd]').forEach(n=>n.onclick=ev=>{
    if(ev.target.closest('[data-slet]'))return;
    const plan=liste.find(x=>x.id===n.dataset.lyd);
    if(!plan)return;
    const harTekst=grpLag(g,lag).some(c=>c.label);
    if(harTekst&&!confirm('Gruppen har allerede tekst på sine '+L.hvad+'.\n\nErstat dem med "'+plan.name+'"?'))return;
    snap();
    saetKanaler(g,lag,plan.kanaler||[]);
    closeModal(); draw();
   });
   ud.querySelectorAll('[data-slet]').forEach(n=>n.onclick=async ev=>{
    ev.stopPropagation();
    const plan=liste.find(x=>x.id===n.dataset.slet);
    if(!plan||!confirm('Fjern "'+plan.name+'" fra arkivet?'))return;
    await sporplanSlet(plan.id);
    hentSporplan(g,lag);
   });
  });
}

/* Læg en plans kanaler ind på ét lag i gruppen. De andre signaltyper står
   uberørt, og rækkefølgen holdes: lyden lander der hvor lyden stod. */
function saetKanaler(g,lag,kanaler){
 const gamle=grpLag(g,lag);
 const foerste=gamle.length?g.channels.indexOf(gamle[0]):g.channels.length;
 const nye=kanaler.map(k=>({id:id(),nr:k.nr||'',label:k.label||'',layer:lag}));
 g.channels=g.channels.filter(c=>(c.layer||'lyd')!==lag);
 g.channels.splice(Math.min(foerste,g.channels.length),0,...nye);
}

/* ---- linjemenu i planen ---- */
function sheetPort(ref){
 const [did,side,pid]=ref.split('|');
 const dv=dom().devices.find(x=>x.id===did);
 const p=dv&&dv[side].find(x=>x.id===pid);
 if(!p)return;
 const synlige=ports(dv,side), j=synlige.indexOf(p);
 /* På telefonen er knapperne i linjen skjult – lydkanalerne åbnes herfra */
 const lyd = (planDom==='video'&&p.label) ? [{ikon:'♪',tekst:'Lydkanaler',
   vaerdi:audSkrevet(p)+'/'+audListe(p).length,

function flytPort(dv,side,i,ret){
 const synlige=ports(dv,side);
 const j=i+ret;
 if(j<0||j>=synlige.length)return;
 snap();
 const numre=synlige.map(p=>p.n);
 const a=synlige[i], b2=synlige[j];
 const ia=dv[side].indexOf(a);
 dv[side].splice(ia,1);
 dv[side].splice(dv[side].indexOf(b2)+(ret>0?1:0),0,a);
 ports(dv,side).forEach((p,k)=>{p.n=numre[k]});
 drawPlan();
}

/* ================= gæsteadgang til planen =================
   Et delelink bærer en nøgle. Med den kan man se og rette planen for
   ét projekt – men intet andet. Hverken tegninger, blokdiagrammer eller
   de øvrige projekter kan nås med nøglen. */
let guestToken=null, guestPush=null, guestSync=null;
/* Hvilket projekt linket siger, det hører til. Står der noget andet i svaret
   fra databasen, viser vi IKKE planen – så er der noget galt i opsætningen,
   og en gæst skal aldrig få et projekt, linket ikke gav adgang til. */
let guestPid=null;
/* Var planen tom, dengang vi hentede den? Kun så må vi gemme en tom plan. */
let guestPlanVarTom=true;
/* Gæsten må først gemme, når planen er hentet. Ellers kunne et delelink nå at
   skrive en tom plan op i databasen, inden data var kommet ned. */
let guestReady=false;

async function rpc(fn,body){
 const c=cfg();
 if(!c.url||!c.key)throw new Error('Databasen er ikke sat op.');
 let r;
 try{
  r=await fetch(baseUrl(c.url)+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{'apikey':c.key,'Authorization':'Bearer '+c.key,'Content-Type':'application/json'},
    body:JSON.stringify(body)});
 }catch(e){throw new Error('Ingen forbindelse til serveren.')}
 if(!r.ok)throw new Error('Serveren svarede '+r.status);
 const t=await r.text();
 return t?JSON.parse(t):null;
}

let guestTsVirker=true;
async function guestPull(){
 if(!guestToken)return;
 /* Spørg først om ét tidsstempel. Er der ikke sket noget, henter vi ikke
    planen igen. Før hentede gæsten hele planen hvert sjette sekund – også
    når intet var ændret. */
 if(guestTsVirker&&lastSync&&plan){
  try{
   const t=await rpc('sf_plan_ts',{tok:guestToken});
   const ts=Array.isArray(t)?(t[0]&&(t[0].ts||t[0].sf_plan_ts)):t;
   if(ts&&ts===lastSync){guestReady=true;setSync('opdateret');return}
  }catch(e){ guestTsVirker=false; }   // findes funktionen ikke, gør vi som før
 }
 let rows;
 try{ rows=await rpc('sf_plan_get',{tok:guestToken}) }
 catch(e){ setSync(e.message,true); return }
 if(!rows||!rows.length){
  /* Nøglen findes ikke længere. Et link holder, så længe projektet gør –
     så er projektet slettet. */
  clearInterval(guestSync); guestSync=null;
  guestReady=false;
  setSync('projektet findes ikke længere',true);
  guestBesked('Projektet er slettet','Linket hørte til ét bestemt projekt, og det findes ikke længere i databasen. Bed om et nyt link.');
  return;
 }
 const row=rows[0];
 /* Linket bar projektets id med. Svarer databasen med et andet projekt, er
    opsætningen gal – og så er det bedre at sige fra end at vise en plan,
    linket ikke gav adgang til. */
 if(guestPid && row.id && row.id!==guestPid){
  clearInterval(guestSync); guestSync=null;
  guestReady=false;
  setSync('linket passer ikke til projektet',true);
  guestBesked('Linket passer ikke','Nøglen i linket åbner et andet projekt end det, linket blev lavet til. Bed om et nyt link.');
  return;
 }
 if(row.id)guestPid=guestPid||row.id;      // første svar binder linket fast
 guestPlanVarTom=planTom(row.plan);
 guestReady=true;                          // FØRST her: nu har vi serverens plan
 projectName=row.name||'Plan';
 if(row.updated_at===lastSync&&plan)return;
 const foc=focusedRef();
 const aktivRef=(foc&&foc.dataset.plabel)||(skriverSelv(skriver.ref)?skriver.ref:null);
 const keep=aktivRef?{ref:aktivRef,
                      val:(foc&&foc.dataset.plabel===aktivRef)?foc.value:skriver.val,
                      felt:document.querySelector('[data-plabel="'+CSS.escape(aktivRef)+'"]'),
                      skriver:skriverSelv(aktivRef)}:null;
 plan=mergePlan(plan||blankPlan(), row.plan||blankPlan());
 if(keep){
  const [did,side,pid]=keep.ref.split('|');
  const dv=(planDevices(plan,planDom)||[]).find(x=>x.id===did);
  const p=dv&&dv[side].find(x=>x.id===pid);
  if(p){
   if(keep.skriver){
    /* Vores egen igangværende tekst vinder – og den skal stemples som den
       nyeste, ellers ville kollegaens ældre rettelse vinde ved næste gem. */
    p.label=keep.val; p.at=Date.now(); p.by=meName();
    dirty=true;
   }else if(keep.felt&&keep.felt.value!==(p.label||''))keep.felt.value=p.label||'';
  }
 }
 lastSync=row.updated_at;
 setSync('opdateret');
 if(document.getElementById('plan').innerHTML)syncPlanDOM(); else drawPlan();
}
/* Er der overhovedet udstyr i en plan? Bruges som sikring: en tom plan må
   aldrig skrives op over en plan, der har noget i sig. Slettet udstyr bliver
   stående med et sletningstidspunkt, så listen bliver ikke tom af en sletning –
   den er kun tom, hvis vi aldrig har fået noget. */
function planTom(p){
 if(!p)return true;
 return !Object.keys(p).some(k=>(((p[k]||{}).devices)||[]).length);
}
function guestSave(){

    og så blev projektets plan tørret ud. */
 if(!guestReady)return;          // planen er ikke hentet endnu
 if(!lastSync)return;            // vi har aldrig set serverens udgave
 if(planTom(ensurePlan())&&!guestPlanVarTom)return;
 clearTimeout(guestPush);

  try{

 },1500);

/* ================= samtidig redigering =================
   Hvert par sekunder spørger vi databasen, om nogen har gemt noget nyere.
   Er der det, flettes deres ændringer ind i vores – linje for linje, hvor den
   nyeste rettelse vinder. Derfor kan to personer rette hver sin stagebox
   samtidig uden at slette for hinanden. */
let lastSync=null;      // serverens tidsstempel vi sidst har set
/* Vi må ALDRIG sende noget op, før vi har set hvad der står på serveren.
   Ellers kan en telefon med en gammel kopi overskrive et delt projekt. */
let hentetFoerst=false;
let pushTimer=null, syncTimer=null, dirty=false;

function planDevices(pl,k){return (pl&&pl[k]&&pl[k].devices)||[]}

/* Tegningens sider flettes side for side: den nyeste udgave af HVER side
   vinder. Så mister man ikke sit arbejde, fordi en kollega rettede på en
   anden side og gemte lige efter. */
function mergePages(mine,theirs){
 sikrePageIds(mine); sikrePageIds(theirs);
 if(!theirs||!theirs.length)return (mine&&mine.length)?mine:(theirs||[]);
 if(!mine||!mine.length)return theirs;
 const set={}, order=[], uden=[];
 /* En side uden id kan vi ikke parre – den beholdes som den er, aldrig smides væk. */
 mine.forEach(p=>{
  if(!p)return;
  if(!p.id){uden.push(p);return}
  set[p.id]=p; order.push(p.id);
 });
 theirs.forEach(p=>{
  if(!p||!p.id)return;
  if(!set[p.id]){set[p.id]=p;order.push(p.id);return}
  if((p.mt||0)>(set[p.id].mt||0))set[p.id]=p;     // deres udgave er nyere
 });
 const ud=uden.concat(order.map(i=>set[i]));
 return ud.length?ud:(mine||theirs||[]);          // aldrig et tomt resultat
}

function mergePlan(mine,theirs){
 if(!theirs)return mine;
 if(!mine)return theirs;
 const out={};
 Object.keys(PLANDOMS).forEach(k=>{
  const a=planDevices(mine,k), b=planDevices(theirs,k);
  const byId={}; const order=[];
  const put=d=>{if(!byId[d.id]){byId[d.id]=JSON.parse(JSON.stringify(d));order.push(d.id)}
                else byId[d.id]=mergeDev(byId[d.id],d)};
  a.forEach(put); b.forEach(put);
  out[k]={devices:order.map(i=>byId[i])};
 });
 return out;
}
/* Lydkanalerne i ét videosignal, flettet kanal for kanal. Hver kanal har sit
   eget tidsstempel, så to kan skrive i hver sin kanal samtidig. */
function mergeAud(a,b){
 if(!a&&!b)return null;
 if(!a||!a.length)return b||null;
 if(!b||!b.length)return a;
 const byId={}, order=[];
 (a||[]).forEach(x=>{byId[x.id]=x;order.push(x.id)});
 (b||[]).forEach(x=>{
  if(!byId[x.id]){byId[x.id]=x;order.push(x.id)}
  else if(Math.max(x.at||0,x.del||0) > Math.max(byId[x.id].at||0,byId[x.id].del||0))byId[x.id]=x;
 });
 return order.map(i=>byId[i]).sort((x,y)=>(audNr(x.id)||999)-(audNr(y.id)||999));
}
function mergeDev(a,b){
 const d=JSON.parse(JSON.stringify(a));
 /* en sletning står ved magt, medmindre den anden side har rettet bagefter */
 const adel=a.del||0, bdel=b.del||0, del=Math.max(adel,bdel);
 d.del = del && del >= Math.max(newestTouch(a),newestTouch(b)) ? del : 0;
 if((b.mt||0)>(a.mt||0)){d.name=b.name;d.place=b.place;d.mt=b.mt}
 /* Udstyrspladserne flettes hver for sig, så to godt kan vælge optik og
    stativ på det samme kort samtidig. */
 {
  const ua=a.udstyr||{}, ub=b.udstyr||{}, u={};
  Object.keys(ua).concat(Object.keys(ub)).forEach(k=>{
   const x=ua[k], y=ub[k];
   u[k] = !x?y : !y?x : ((y.at||0)>(x.at||0)?y:x);
  });
  if(Object.keys(u).length)d.udstyr=u;
 }
 ['ins','outs'].forEach(side=>{
  const byId={}; const order=[];
  (a[side]||[]).forEach(p=>{byId[p.id]=p;order.push(p.id)});
  (b[side]||[]).forEach(p=>{
   if(!byId[p.id]){byId[p.id]=p;order.push(p.id)}
   else{
    const cur=byId[p.id];
    /* Linjen selv: den nyeste vinder, som den altid har gjort. Men
       lydkanalerne inde i linjen flettes hver for sig – ellers ville den
       der rettede videolinjens navn tørre kollegaens otte lydkanaler ud. */
    const vinder = Math.max(p.at||0,p.del||0) > Math.max(cur.at||0,cur.del||0) ? p : cur;
    const aud = mergeAud(cur.aud, p.aud);
    byId[p.id] = aud ? Object.assign({}, vinder, {aud:aud}) : vinder;
   }
  });
  d[side]=order.map(i=>byId[i]);
 });
 return d;
}

let pollN=0;
async function pull(){
 if(!cloudId||!session())return;
 applyingRemote=true;
