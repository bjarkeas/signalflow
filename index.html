<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignalFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101319; --panel:#171c24; --panel2:#1f2630; --line:#2b3542;
  --text:#e9eef5; --dim:#8d9aab; --faint:#5c6878;
  --video:#ff5252; --lyd:#ffb648; --intercom:#3fd99c; --net:#5ea3ff;
  --ink:#1d1d1d; --paper:#fbfaf6;
  --fd:'Barlow Condensed',sans-serif; --fb:'IBM Plex Sans',system-ui,sans-serif; --fm:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--fb)}
button{font:inherit}

#app{display:grid;grid-template-rows:54px 42px 1fr;grid-template-columns:1fr 290px;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-family:var(--fd);font-weight:700;font-size:20px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.logo em{font-style:normal;color:var(--lyd)}
#crumbs{display:flex;align-items:center;gap:5px;font-family:var(--fm);font-size:12px;color:var(--dim);flex:1;min-width:0;overflow:hidden;white-space:nowrap}
#crumbs button{background:none;border:none;color:var(--dim);cursor:pointer;padding:4px 6px;border-radius:5px;font:inherit}
#crumbs button:hover{color:var(--text);background:var(--panel2)}

#crumbs .here{color:var(--text)}
#crumbs .projname{color:var(--text);font-weight:600}
#autoStatus{font-family:var(--fm);font-size:10px;color:var(--faint);white-space:nowrap;min-width:96px;text-align:right}
#autoStatus.warn{color:var(--lyd)}
#crumbs .projname:hover{background:var(--panel2);color:var(--lyd)}
#crumbs .sep{color:var(--faint)}

.bus{display:flex;gap:5px}
.busbtn{position:relative;font-family:var(--fd);font-weight:600;font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--panel2);color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:7px 12px 7px 21px;cursor:pointer;transition:.12s}
.busbtn::before{content:'';position:absolute;left:8px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:var(--d);opacity:.3;transition:.12s}
.busbtn.on{color:var(--text);border-color:var(--d)}
.busbtn.on::before{opacity:1;box-shadow:0 0 8px var(--d)}
.busbtn[data-l=video]{--d:var(--video)} .busbtn[data-l=lyd]{--d:var(--lyd)}
.busbtn[data-l=intercom]{--d:var(--intercom)} .busbtn[data-l=net]{--d:var(--net)}
.busbtn[data-l=backup]{--d:#b18cff}
.hbtn{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.hbtn:hover{color:var(--text);border-color:var(--faint)}
.hbtn:disabled{opacity:.4;cursor:default}

#stage{grid-row:3;position:relative;overflow:auto;background:#0b0e13;padding:26px}
#side{grid-row:3;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px}

#tabbar{grid-row:2;grid-column:1/3;display:flex;align-items:flex-end;gap:2px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 14px;overflow-x:auto}
.tab{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-bottom:none;border-radius:7px 7px 0 0;padding:7px 8px 7px 13px;cursor:pointer;color:var(--dim);white-space:nowrap;margin-bottom:-1px}
.tab.on{background:var(--paper);color:#1d1d1d;border-color:var(--paper)}
.tab .tname{font-size:12.5px;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.tab.on .tname{cursor:text}
.tab .tx{border:none;background:none;color:inherit;opacity:.45;cursor:pointer;font-size:11px;padding:1px 3px;border-radius:3px;line-height:1}
.tab .tx:hover{opacity:1;background:rgba(0,0,0,.15)}
.tabadd{background:none;border:none;color:var(--dim);cursor:pointer;padding:7px 10px;font-size:15px;margin-bottom:2px}
.tabadd:hover{color:var(--text)}
.tabedit{font:12.5px var(--fb);border:1.5px solid #0a5bd3;border-radius:4px;padding:0 4px;max-width:190px}
#sheet{background:var(--paper);color:var(--ink);margin:0 auto;box-shadow:0 10px 40px rgba(0,0,0,.5);border-radius:3px;width:100%;max-width:1340px;min-width:900px;min-height:560px;padding:26px 30px 60px;transform-origin:top center}

/* ---- ark ---- */
.sheettitle{font-family:var(--fd);font-weight:700;font-size:25px;letter-spacing:.04em;text-align:center;padding:6px 0 4px;color:#2a2a2a}
.sheetsub{font-family:var(--fm);font-size:11px;text-align:center;color:#8a8a8a;margin-bottom:20px}
.section{display:grid;grid-template-columns:190px 1fr 210px;gap:0;margin-bottom:26px;align-items:stretch}
.srcbox,.dstbox{border-radius:3px;padding:11px 12px;position:relative}
.srcbox{background:#e9c440;border:1px solid #bd9a2c}
.dstbox{background:#6d8764;border:1px solid #4c6245;color:#f3f7f1}
.boxname{font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:.05em;line-height:1.2;overflow-wrap:anywhere;word-break:break-word}
.srcbox .boxname{color:#2b2417}
.boxsub{font-family:var(--fm);font-size:9.5px;opacity:.65;margin-top:3px}
.rows{padding:4px 14px;min-width:0;position:relative}

.grp{position:relative;padding:2px 0 2px 0;margin-bottom:9px}
.grp.sel{background:#eef4ff;box-shadow:0 0 0 1px #b9d0f5;border-radius:4px}
.grp.hidden{display:none}
.feed{display:flex;align-items:center;gap:0;min-height:19px;flex-wrap:wrap;row-gap:1px}
.lbl{font-size:11.5px;white-space:nowrap;cursor:text;padding:1px 3px;border-radius:3px}
.lbl:hover{background:#e6eefc;outline:1px solid #b9d0f5}
.feed .lbl{font-weight:600}
.wire{flex:1 1 24px;height:0;border-top:1.8px solid currentColor;margin:0 6px;min-width:20px;position:relative}
.grp.backup .wire{border-top-style:dashed}
.ch.cbackup .wire{border-top-style:dashed}
.ch:not(.cbackup) .wire{border-top-style:solid}
.dirbtn{font-size:12px;font-weight:600}
.chb{font-family:var(--fm);font-size:8px;font-weight:500;background:#b18cff;color:#fff;border-radius:3px;padding:0 3px;margin-right:5px;line-height:1.5}
.cloud{font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:#5c5c5c;background:var(--paper);border:1px solid #b4b4b4;border-radius:14px;padding:1px 13px;cursor:text;white-space:nowrap}
.cloud:hover{border-color:#0a5bd3;color:#0a5bd3}
.ch{display:flex;align-items:center;min-height:17px;padding-left:14px;color:#3a3a3a;flex-wrap:wrap;row-gap:1px}
.ch .wire{border-top-width:1.1px;border-top-color:currentColor}
.ch .wire{border-top-color:currentColor}
.dot{width:7px;height:7px;border-radius:50%;flex:none;margin-right:7px;cursor:pointer;border:1px solid rgba(0,0,0,.25)}
.ch .lbl{font-size:11px;white-space:normal;overflow-wrap:anywhere}
.chnr{font-family:var(--fm);font-size:10.5px;min-width:44px;cursor:text;padding:1px 3px;border-radius:3px}
.chnr:hover{background:#e6eefc}


/* ---- link direkte til kanalplanen ---- */
function planLink(onlyPlan){
 const u=location.origin+location.pathname;
 const q=['view=plan'];
 if(cloudId)q.push('p='+cloudId);
 q.push('dom='+planDom);
 if(onlyPlan)q.push('only=1');
 return u+'?'+q.join('&');
}
function copyLink(onlyPlan,btn){
 const link=planLink(onlyPlan);
 const done=()=>{const t=btn.textContent;btn.textContent='Kopieret ✓';setTimeout(()=>btn.textContent=t,1600)};
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(link).then(done).catch(()=>prompt('Kopiér linket:',link));
 }else prompt('Kopiér linket:',link);
}

/* ---- åbn efter det der står i adressen ---- */
function applyUrl(){
 const q=new URLSearchParams(location.search);
 if(q.get('dom')&&PLANDOMS[q.get('dom')])planDom=q.get('dom');
 if(q.get('only')==='1')document.body.classList.add('onlyplan');
 const wantPlan=q.get('view')==='plan'||q.get('only')==='1';
 const pid=q.get('p');
 if(pid){
  if(!session()){
   /* linket kræver login – log ind og fortsæt derefter til projektet */
   pendingOpen=pid; pendingPlan=wantPlan;
   if(wantPlan)setView('plan');
   openLogin();
   return;
  }
  cloudOpen(pid).then(()=>{if(wantPlan)setView('plan')})
    .catch(e=>{if(wantPlan)setView('plan');setSync(e.message,true)});
  return;
 }
 if(wantPlan)setView('plan');
}
let pendingOpen=null, pendingPlan=false;

/* ---- skift mellem tegning og kanalplan ---- */
.viewsw{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.vbtn{background:none;border:none;color:var(--dim);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.vbtn.on{background:var(--panel2);color:var(--text)}
#plan{display:none}
body.planview #sheet,body.planview #tabbar{display:none}
body.planview #side,body.planview .bus,body.planview #bFoldAll{display:none}
body.planview #stage{grid-column:1/3}
body.planview #crumbs{flex:0 1 auto;max-width:230px}
body.planview #plan{display:block}
body.planview #stage{background:#0b0e13;padding:16px}

/* ---- kanalplan ---- */
.planbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.domtabs{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.domtab{background:none;border:none;color:var(--dim);border-radius:7px;padding:7px 16px;cursor:pointer;font-size:13px}
.domtab.on{background:var(--panel2);color:var(--text);font-weight:600}
.planadd{margin-left:auto}
.planadd select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer}
.newsbadge{background:rgba(63,217,156,.13);border:1px solid var(--intercom);color:var(--intercom);
 border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer}
.newsbadge:hover{background:rgba(63,217,156,.22)}
.sharebtn{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:8px;
 padding:8px 12px;cursor:pointer;font-size:12px;white-space:nowrap}
.sharebtn:hover{color:var(--text);border-color:var(--faint)}
/* kun kanalplanen – til dem der får et link */
body.onlyplan .viewsw,body.onlyplan #tabbar,body.onlyplan .bus,
body.onlyplan #bFoldAll,body.onlyplan #bNew{display:none}
.whobox{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit;width:130px}
.whotag{font-family:var(--fm);font-size:10.5px;color:var(--dim);border:1px solid var(--line);
 border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.whotag:hover{color:var(--text);border-color:var(--faint)}
.planempty{color:var(--dim);text-align:center;padding:60px 20px;line-height:1.7}

.devgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(470px,1fr));gap:14px;align-items:start}
.dev{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.devhead{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.devnames{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.devname{background:none;border:none;color:var(--text);font-family:var(--fd);font-weight:700;font-size:16px;
 letter-spacing:.04em;padding:2px 4px;border-radius:5px;width:100%}
.devplace{background:none;border:none;color:var(--dim);font-family:var(--fm);font-size:10px;padding:1px 4px;border-radius:5px;width:100%}
.devname:hover,.devplace:hover,.devname:focus,.devplace:focus{background:var(--bg);outline:none}
.devmeta{font-family:var(--fm);font-size:10px;color:var(--faint);white-space:nowrap}
.devacts{display:flex;gap:3px}
.devacts .mini{opacity:.5}
.dev:hover .devacts .mini{opacity:1}

.ports{display:grid;grid-template-columns:1fr 1fr;gap:0}
.portcol{padding:9px 10px 11px;min-width:0}
.portcol.ins{border-right:1px solid var(--line)}
.portitle{font-family:var(--fd);font-weight:600;font-size:12px;letter-spacing:.09em;text-transform:uppercase;
 color:var(--dim);padding:2px 2px 7px;display:flex;justify-content:space-between}
.portitle span{font-family:var(--fm);font-size:9.5px;color:var(--faint);letter-spacing:0}
.port{display:flex;align-items:center;gap:5px;padding:2px 0;position:relative;min-width:0}
.pnum{width:34px;flex:none;background:var(--bg);border:1px solid var(--line);color:var(--dim);
 border-radius:5px;padding:5px 4px;font:11px var(--fm);text-align:center}
.plabel{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);
 border-radius:5px;padding:5px 7px;font:12px var(--fb)}
.plabel:focus,.pnum:focus{outline:none;border-color:var(--intercom)}
.port.set .plabel{border-color:#2f4a3d;background:#141c18}
.port.fresh .plabel{border-color:var(--lyd);box-shadow:0 0 0 1px rgba(255,182,72,.28)}
.port.fresh::before{content:'';position:absolute;left:-6px;top:50%;transform:translateY(-50%);
 width:5px;height:5px;border-radius:50%;background:var(--lyd)}
.pby{font-family:var(--fm);font-size:8.5px;color:var(--faint);white-space:nowrap;max-width:74px;overflow:hidden;text-overflow:ellipsis}
.port .mini{opacity:0}
.port:hover .mini{opacity:.7}
.portcol .add{color:var(--dim);margin-top:5px}
.portcol .add:hover{color:var(--intercom);background:none}

/* ---- iPhone og andre små skærme ---- */
@media (max-width:820px){
 #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
 #side{display:none}
 header{flex-wrap:wrap;height:auto;padding:8px 10px;gap:8px}
 .logo{font-size:17px}
 #crumbs{order:5;width:100%;font-size:11px}
 .bus{order:6;width:100%;overflow-x:auto}
 .busbtn{padding:6px 9px 6px 18px;font-size:12px}
 .hbtn{padding:6px 9px;font-size:12px}
 #autoStatus{min-width:0}
 body.planview #stage{padding:10px}
 .devgrid{grid-template-columns:1fr}
 .ports{grid-template-columns:1fr}
 .portcol.ins{border-right:none;border-bottom:1px solid var(--line)}
 .plabel{font-size:16px;padding:9px 8px}   /* 16px hindrer at iPhone zoomer ind */
 .pnum{font-size:14px;padding:9px 4px;width:42px}
 .domtab{padding:9px 14px}
 .planadd{margin-left:0;width:100%}
 .planadd select{width:100%;padding:11px}
 .pby{max-width:60px}
 .mbox{max-width:100%;padding:14px}
}

/* --- frit placerede elementer på arket --- */
#sheet{position:relative}
.fitem{position:absolute;z-index:3;min-width:90px}
.fitem.sel{outline:2px solid #0a5bd3;outline-offset:2px}
.fdrag{cursor:move}
.fitem.dragging{position:fixed!important;margin:0;z-index:999;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.drophere{outline:2px dashed #0a5bd3;outline-offset:-3px;background-image:linear-gradient(rgba(10,91,211,.07),rgba(10,91,211,.07))}
.anchortag{position:absolute;top:-9px;left:8px;font-family:var(--fm);font-size:8px;letter-spacing:.05em;text-transform:uppercase;background:#0a5bd3;color:#fff;padding:1px 5px;border-radius:7px;opacity:0}
.fitem:hover .anchortag{opacity:.9}
.ftext{padding:7px 10px;border-radius:4px;line-height:1.45;overflow-wrap:anywhere}
.flegend{background:#fff;border:1px solid #cfcfcf;border-radius:5px;padding:10px 12px 11px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.flegend h4{font-family:var(--fd);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#2a2a2a;margin-bottom:8px;cursor:move}
.lrow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#333;padding:2px 0}
.lsym{font-size:15px;line-height:1;width:19px;text-align:center;flex:none}
.lcount{font-family:var(--fm);font-size:11px;font-weight:500;min-width:22px;text-align:right;color:#111}
.lname{flex:1}
.ltot{border-top:1px solid #e0e0e0;margin-top:7px;padding-top:6px;font-family:var(--fm);font-size:10.5px;color:#777;display:flex;justify-content:space-between}
/* håndtag til at trække i størrelsen */
.rs{position:absolute;right:-4px;bottom:-4px;width:13px;height:13px;border:1px solid #0a5bd3;background:#fff;border-radius:3px;cursor:nwse-resize;opacity:0;z-index:7}
.rs.edge{right:-5px;top:0;bottom:18px;height:auto;width:9px;border-radius:2px;cursor:ew-resize;z-index:5}
.rs.edge.left{left:-5px;right:auto}
.srcbox:hover .rs,.dstbox:hover .rs,.fitem:hover .rs{opacity:.85}
.fitools{position:absolute;top:-11px;right:0;display:flex;gap:3px;opacity:0;z-index:6}
.fitem:hover .fitools{opacity:1}
.fitools .mini{opacity:1;background:#fff;border:1px solid #d6d6d6;border-radius:4px;color:#555}
/* tekstlinjer inde i afsender-/modtagerboksene */
.boxlines{margin-top:7px;display:flex;flex-direction:column;gap:2px}
.boxline{font-size:11px;line-height:1.35;opacity:.92;cursor:text;padding:1px 3px;border-radius:3px;overflow-wrap:anywhere}
.boxline:hover{background:rgba(255,255,255,.28)}
.boxadd{font-size:10px;opacity:.55;background:none;border:none;color:inherit;cursor:pointer;padding:2px 3px;margin-top:3px;text-align:left}
.boxadd:hover{opacity:1}

.faded{opacity:.13}
.secgone{font-family:var(--fm);font-size:10.5px;color:#b3b3b3;border:1px dashed #ddd;border-radius:4px;padding:6px 10px;margin-bottom:10px;text-align:center}

/* pilens retning */
.wire::after{content:'';position:absolute;top:-4.5px;width:0;height:0;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.wire:not(.rtl)::after{right:-1px;border-left:4.5px solid currentColor}
.wire.rtl::after{left:-1px;border-right:4.5px solid currentColor}
.wire.both::before{content:'';position:absolute;top:-4.5px;left:-1px;width:0;height:0;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;border-right:4.5px solid currentColor}
.endtag{font-family:var(--fm);font-size:9.5px;letter-spacing:.04em;padding:1px 5px;border:1px solid currentColor;border-radius:9px;white-space:nowrap;cursor:text;opacity:.85;margin:0 2px}
.endtag:hover{opacity:1;background:rgba(10,91,211,.09)}
.endtag.sm{font-size:8.5px;padding:0 4px;border-radius:8px}
.endtag.ghost{opacity:0;border-style:dashed}
.ch:hover .endtag.ghost{opacity:.45}
.grp:hover .endtag.ghost{opacity:.4}

/* sammenklapning – skjules på skærm, foldes ALTID ud ved print */
.grp.collapsed .ch,.grp.collapsed .grpfoot{display:none}
.caret{opacity:1!important;color:#8d8d8d;margin-right:2px;font-size:10px}
.chcount{font-family:var(--fm);font-size:9.5px;color:#9a9a9a;margin-left:9px;white-space:nowrap}
.grpfoot{padding-left:14px}

/* fokus-visning */
.focusbar{background:#eef4ff;border:1px solid #b9d0f5;border-radius:5px;padding:7px 12px;margin-bottom:16px;font-size:12px;color:#24486f;text-align:center}
.focusbar b{font-weight:600}

/* modalvindue */
#modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(6,9,13,.66);display:none;align-items:center;justify-content:center;z-index:99;padding:24px}
#modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:11px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:18px 20px 20px}
.mbox h3{font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.mbox .msub{font-family:var(--fm);font-size:10px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase;margin-bottom:16px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mgrid.one{grid-template-columns:1fr}
.mf label{display:block;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.mf input[type=text],.mf input[type=number],.mf select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 8px;font:inherit}
.mf input[type=color]{width:100%;height:34px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px;cursor:pointer}
.msec{font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:18px 0 9px;padding-top:13px;border-top:1px solid var(--line)}
.mrow{display:flex;gap:8px;margin-top:18px}
.mrow .btn{margin:0}
.chk{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:5px;cursor:pointer;font-size:12px}
.chk:hover{background:var(--panel2)}
.chk input{accent-color:var(--intercom)}
.chklist{max-height:210px;overflow-y:auto;border:1px solid var(--line);border-radius:7px;padding:5px;background:var(--bg)}
/* projektmodul */
.folderhead{display:flex;align-items:center;gap:7px;font-family:var(--fd);font-weight:600;font-size:13px;
 letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:7px 6px 5px;cursor:pointer}
.folderhead:hover{color:var(--text)}
.caretf{font-size:9px;width:9px}
.folderhead .cnt{margin-left:auto;font-family:var(--fm);font-size:9.5px;color:var(--faint)}
.prow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px}
.prow:hover{background:var(--panel2)}
.prow.here{background:var(--panel2);box-shadow:inset 2px 0 0 var(--intercom)}
.pmain{flex:1;min-width:0}
.pname{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-family:var(--fm);font-size:9.5px;color:var(--faint);margin-top:1px}
.badge{font-family:var(--fm);font-size:8px;background:var(--intercom);color:#0b0e13;border-radius:6px;padding:1px 5px;vertical-align:1px}
.pacts{display:flex;gap:3px;opacity:0}
.prow:hover .pacts,.prow.here .pacts{opacity:1}
.pacts .mini{opacity:1;font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:2px 6px}
.hist{margin:2px 0 8px 22px;border-left:2px solid var(--line);padding-left:10px}
.vrow{display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:11.5px}
.vrow:hover{background:var(--panel2);border-radius:5px}
.vnum{font-family:var(--fm);font-size:9.5px;color:var(--faint);min-width:18px}
.vnote{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.vmeta{font-family:var(--fm);font-size:9.5px;color:var(--faint);white-space:nowrap}
.vrow .mini{opacity:1;border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-size:10.5px}
.vempty{font-family:var(--fm);font-size:10.5px;color:var(--faint);padding:5px 2px}
.swatches{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.sw{width:22px;height:22px;border-radius:5px;border:1px solid rgba(255,255,255,.16);cursor:pointer}
.sw:hover{transform:scale(1.12)}
.tools{display:flex;gap:4px;align-items:center;margin-left:8px}
.mini{border:none;background:none;color:#a2a2a2;cursor:pointer;font-size:12px;padding:1px 4px;border-radius:3px;line-height:1;opacity:0}
.grp:hover .mini,.ch:hover .mini,.section:hover .mini{opacity:1}
.mini:hover{background:#e3e3e3;color:#111}
.add{font-family:var(--fm);font-size:10.5px;color:#8d8d8d;background:none;border:none;cursor:pointer;padding:2px 5px;border-radius:3px}
.add:hover{color:#15703f;background:#e8f5ee}
.drill{font-family:var(--fm);font-size:9.5px;color:#2f7a52;background:none;border:none;cursor:pointer;padding:1px 4px;border-radius:3px}
.drill:hover{text-decoration:underline}
.dstbox .drill{color:#e2ecdd}
.empty{text-align:center;color:#9a9a9a;padding:50px 0;font-size:13px}

/* ---- inspektor ---- */
#side{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px}
#side h2{font-family:var(--fd);font-weight:600;font-size:16px;letter-spacing:.05em;text-transform:uppercase}
#side .sub{font-family:var(--fm);font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin:2px 0 14px}
.f{margin-bottom:11px}
.f label{display:block;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.f input,.f select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 8px;font:inherit}
.f input:focus,.f select:focus{outline:none;border-color:var(--dim)}
.btn{display:block;width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:8px;cursor:pointer;margin-bottom:7px}
.btn:hover{border-color:var(--faint)}
.btn.go{border-color:var(--intercom);color:var(--intercom)}
.btn.del{color:var(--video)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.row2 .btn{margin:0}
.hint{color:var(--dim);font-size:12px;line-height:1.65}
.hint kbd{font-family:var(--fm);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:10.5px}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}

/* eksport-container: usynlig på skærmen, det eneste der printes */
#printroot{display:none}
.psheet{position:relative;background:#fff;padding:26px 30px 6mm;page-break-after:always;break-after:page}
.psheet:last-child{page-break-after:auto;break-after:auto}
.planprint .pph{font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase;
 color:#333;margin:16px 0 8px;border-bottom:1.5px solid #999;padding-bottom:3px}
.planprint .ppdev{break-inside:avoid;page-break-inside:avoid;margin-bottom:12px;border:1px solid #d4d4d4;border-radius:4px}
.planprint .ppname{font-family:var(--fd);font-weight:700;font-size:14px;background:#eee;padding:5px 9px;color:#222}
.planprint .ppcols{display:grid;grid-template-columns:1fr 1fr}
.planprint .ppcol{padding:6px 9px 8px}
.planprint .ppcol:first-child{border-right:1px solid #e0e0e0}
.planprint .ppt{font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#777;padding-bottom:3px}
.planprint .ppr{display:flex;gap:8px;font-size:11px;line-height:1.55;border-bottom:1px dotted #e2e2e2}
.planprint .ppn{font-family:var(--fm);font-size:10px;color:#888;min-width:22px}
.planprint .ppl{color:#111}
.pfoot{font-family:var(--fm);font-size:8.5px;color:#999;text-align:center;padding-top:6px;border-top:1px solid #e2e2e2;margin-top:10px}

@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  /* tving browseren til at printe baggrundsfarver på boksene */
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  #app,#modal{display:none!important}
  #printroot{display:block!important}
  /* alt interaktivt væk */
  .mini,.add,.drill,.focusbar,.chcount,.grpfoot,.secgone,.rs,.fitools,.boxadd,.endtag.ghost{display:none!important}
  /* sammenklappede grupper foldes altid ud på papir */
  .grp.collapsed .ch{display:flex!important}
  .grp{page-break-inside:avoid;break-inside:avoid}
  .section{page-break-inside:avoid;break-inside:avoid}
  .faded{opacity:.28}
}

let projectName='Oslo · Remote 2';

/* Den "sheet" der vises: enten sidens rod, eller (drillet ind) en gruppes underark.
   Titlen på en underside er ALTID gruppens eget navn – ét sted at rette den. */
const sheet=()=> path.length? path[path.length-1].sub : doc;
const sheetTitle=()=> path.length? path[path.length-1].label : doc.title;
function setSheetTitle(v){ if(path.length) path[path.length-1].label=v; else doc.title=v; }

function snap(){undoStack.push(JSON.stringify({pages,plan:plan,activePage,path:path.map(p=>p.id)}));if(undoStack.length>60)undoStack.shift();document.getElementById('bUndo').disabled=false}
function undo(){
 if(!undoStack.length)return;
 const st=JSON.parse(undoStack.pop());
 pages=st.pages; if(st.plan)plan=st.plan; activePage=st.activePage; doc=pages[activePage];
 path=[]; let sh=doc;
 st.path.forEach(gid=>{for(const sc of sh.sections){const g=sc.groups.find(x=>x.id===gid);if(g&&g.sub){path.push(g);sh=g.sub;break}}});
 sel=null; focus=null; document.getElementById('bUndo').disabled=!undoStack.length;
 if(view==='plan')drawPlan(); else draw();
}
function findGrp(gid){for(const sc of sheet().sections){const g=sc.groups.find(x=>x.id===gid);if(g)return[g,sc]}return[null,null]}

/* ---- sider (faner) ---- */
function addPage(){snap();pages.push(newSheet('Ny side '+(pages.length+1)));switchPage(pages.length-1)}
function switchPage(i){activePage=i;doc=pages[i];path=[];sel=null;focus=null;draw()}
function delPage(i){
 if(pages.length<=1)return;
 if(!confirm('Slet siden "'+pages[i].title+'"? Det kan ikke fortrydes.'))return;
 snap();pages.splice(i,1);
 if(activePage>=pages.length)activePage=pages.length-1;
 doc=pages[activePage];path=[];sel=null;draw();
}
function movePage(i,d){const j=i+d;if(j<0||j>=pages.length)return;snap();const[p]=pages.splice(i,1);pages.splice(j,0,p);activePage=j;draw()}

/* ================= tegn ================= */

/* stil-hjælpere: alt er valgfrit, tomt = standardudseende */

function draw(keepSide){

 let h=`<div class="sheettitle" data-e="title">${esc(title)}</div>

 if(focus){

 if(!sh.sections.length){

 }

 sh.sections.forEach(sc=>{
  if(focus&&focus.t==='sec'&&focus.id!==sc.id)return;

  const st=SS(sc);
  const anyVis=!sc.groups.length||sc.groups.some(g=>vis(g.layer,g.role));
  if(!anyVis){h+=`<div class="secgone" data-sec="${sc.id}">${esc(sc.src)} → ${esc(sc.dst)} · ${sc.groups.length} linjer skjult af filter</div>`;return}

  const dstS=`background:${px(st.dstBg,'#6d8764')};border-color:${px(st.dstBd,'#4c6245')};color:${px(st.dstFg,'#f3f7f1')};margin-left:${px(st.dstDX,0)}px;min-height:${px(st.dstH,0)}px`;

  const gridS=`grid-template-columns:${px(st.srcW,190)}px 1fr ${px(st.dstW,210)}px`;

    .map(i=>itemHTML(i)).join('');

  h+=`<div class="section" data-sec="${sc.id}" style="${gridS}">
    <div class="srcbox" style="${srcS}">
      <div class="boxname lbl" data-e="src" data-id="${sc.id}" style="${nameS};color:inherit">${esc(sc.src)}</div>
      <div class="boxsub">${sc.groups.length} grupper</div>
      <div class="boxlines">${lines(sc.srcLines,'src')}</div>
      <button class="boxadd" data-boxadd="${sc.id}|src">+ tekst</button>
      <span class="tools">
        <button class="mini" data-secedit="${sc.id}" title="Rediger sektion" style="color:inherit">✎</button>
        <button class="mini" data-seccopy="${sc.id}" title="Kopiér sektion" style="color:inherit">⧉</button>
        <button class="mini" data-secfocus="${sc.id}" title="Vis kun denne sektion" style="color:inherit">⤢</button>
      </span>
      ${held('src')}
      <span class="rs" data-rs="src|${sc.id}" title="Træk for at ændre størrelse"></span>
      <span class="rs edge" data-rs="srcin|${sc.id}" title="Træk boksen ind mod midten"></span>
    </div>
    <div class="rows">`;

  sc.groups.forEach(g=>{
   if(focus&&focus.t==='grp'&&focus.id!==g.id)return;
   const gv=vis(g.layer,g.role);
   if(!gv){return}
   const gs=GS(g);

       <span class="tools">
         <button class="mini" data-gedit="${g.id}" title="Rediger gruppe">✎</button>
         <button class="mini" data-gcopy="${g.id}" title="Kopiér">⧉</button>
         <button class="mini" data-gfocus="${g.id}" title="Vis kun denne gruppe">⤢</button>

         <button class="mini" data-delg="${g.id}" title="Slet gruppe">✕</button>
       </span>
     </div>`;

   g.channels.forEach(ch=>{
    const crole=ch.role||g.role;          // tom = følger gruppen
    const cdir=ch.dir||g.dir||'ltr';
    const cw=cdir==='both'?'both':(cdir==='rtl'?'rtl':'');
    const dirIcon={ltr:'→',rtl:'←',both:'↔'}[cdir];
    const dirNext={ltr:'venstre',rtl:'begge veje',both:'højre'}[cdir];
    const cv=vis(ch.layer,crole);
    const chC=px(gs.chColor,'#3a3a3a'), chS=px(gs.chSize,11);
    h+=`<div class="ch ${crole==='backup'?'cbackup':''} ${cv?'':'faded'}" style="color:${chC}">
      <span class="dot" style="background:${DOT[ch.layer]}" data-cyc="${g.id}|${ch.id}" title="${LAYERS[ch.layer]} – klik for at skifte"></span>
      <span class="chnr" data-e="chnr" data-id="${g.id}|${ch.id}" style="font-size:${chS-0.5}px">${esc(ch.nr)}</span>
      ${crole==='backup'?'<span class="chb" title="Backup-linje">B</span>':''}
      <span class="lbl" data-e="chlabel" data-id="${g.id}|${ch.id}" style="font-size:${chS}px">${esc(ch.label||'…')}</span>
      <span class="endtag sm ${ch.tx?'':'ghost'}" data-e="chtx" data-id="${g.id}|${ch.id}">${esc(ch.tx||'TX')}</span>
      <span class="wire ${cw}"></span>
      <span class="endtag sm ${ch.rx?'':'ghost'}" data-e="chrx" data-id="${g.id}|${ch.id}">${esc(ch.rx||'RX')}</span>
      <span class="tools">
        <button class="mini dirbtn" data-cdir="${g.id}|${ch.id}" title="Retning: ${cdir==='ltr'?'mod modtager':cdir==='rtl'?'retur':'begge veje'} – klik for ${dirNext}">${dirIcon}</button>

        <button class="mini" data-delc="${g.id}|${ch.id}" title="Slet kanal">✕</button>

   });

 /* frit placerede elementer ovenpå arket (låste er tegnet inde i boksene) */
 (sh.items||[]).filter(i=>!i.anchor).forEach(it=>{ h+=itemHTML(it,false) });

 el.innerHTML=h;

/* Lad afsender-/modtagerbokse vokse, så de altid omslutter de bokse der er låst i dem.
   Kaldes efter hver tegning, så også print og eksport får de rigtige højder med. */
function fitBoxes(){
 el.querySelectorAll('.srcbox,.dstbox,.rows').forEach(c=>{
  let need=0;
  c.querySelectorAll(':scope > .fitem').forEach(n=>{
   need=Math.max(need, n.offsetTop + n.offsetHeight);
  });

document.getElementById('tabbar').addEventListener('click',ev=>{
 const tab=ev.target.closest('[data-tab]');

 if(del){ev.preventDefault();delPage(+del.dataset.tabdel);return}
 // klik på tab-navn: rediger hvis active, ellers switch
 if(nm){
   const i=+nm.dataset.tabname;
   if(i===activePage){ev.preventDefault();editTabName(nm,i);return}

});

/* gør en hex-farve mørkere/lysere */
function shade(hex,amt){
 const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||'');
 if(!m)return hex;
 const f=n=>Math.max(0,Math.min(255,parseInt(n,16)+amt)).toString(16).padStart(2,'0');
 return '#'+f(m[1])+f(m[2])+f(m[3]);
}

   tekst, og hver linje husker hvem der har rettet den og hvornår. */
const PLANDOMS={lyd:'Lyd',video:'Video',net:'Netværk'};
let planDom='lyd';
let plan=null;          // {lyd:{devices:[]},video:{...},net:{...}}

const DEVICES={
 lyd:[

  {t:'Komm rack',         i:12, o:12},
  {t:'AETA',              i:2,  o:2},
  {t:'Lydmixer',          i:32, o:16}
 ],
 video:[

  {t:'MN5 IN/OUT rack',   i:12, o:12},

  {t:'Aviwest',           i:2,  o:2},

 net:[

function blankPlan(){
 const p={};
 Object.keys(PLANDOMS).forEach(k=>p[k]={devices:[]});
 return p;
}
function ensurePlan(){ if(!plan)plan=blankPlan();
 Object.keys(PLANDOMS).forEach(k=>{if(!plan[k])plan[k]={devices:[]}}); return plan }
const dom=()=>ensurePlan()[planDom];

function mkPorts(n,pre){
 const a=[];
 for(let i=1;i<=n;i++)a.push({id:id(),n:String(i),label:'',by:'',at:0});
 return a;
}
function addDevice(tpl){
 snap();
 const d={id:id(),type:tpl.t,name:tpl.t,place:'',
   ins:mkPorts(tpl.i),outs:mkPorts(tpl.o)};
 dom().devices.push(d); drawPlan();
}

/* alle tekster der har været brugt før – bruges som forslag i felterne */
function usedLabels(){
 const set=new Set();
 Object.keys(PLANDOMS).forEach(k=>(ensurePlan()[k].devices||[]).forEach(d=>{
  d.ins.concat(d.outs).forEach(p=>{if(p.label)set.add(p.label)});
 }));
 /* signalflowets kanalnavne er også gode forslag */
 pages.forEach(pg=>pg.sections.forEach(sc=>sc.groups.forEach(g=>
   g.channels.forEach(c=>{if(c.label)set.add(c.label)}))));
 return [...set].sort((a,b)=>a.localeCompare(b,'da'));
}

/* ---- hvem har rettet hvad, og hvad er nyt siden sidst ---- */
const seenKey=()=>'signalflow:seen:'+(cloudId||'lokal');
/* Når et projekt gemmes i databasen første gang, skifter nøglen fra "lokal" til
   projektets id. Uden dette ville alt pludselig se ulæst ud igen. */
function migrateSeen(){
 if(!cloudId)return;
 const k='signalflow:seen:'+cloudId, lokal=load('signalflow:seen:lokal');
 if(!load(k)&&lokal)store(k,lokal);
}
const lastSeen=()=>{const v=load(seenKey());return v?+v:0};
function markSeen(){store(seenKey(),String(Date.now()));drawPlan()}
function newCount(){
 const t=lastSeen(); if(!t)return 0;
 let n=0;
 Object.keys(PLANDOMS).forEach(k=>(ensurePlan()[k].devices||[]).forEach(d=>{
  d.ins.concat(d.outs).forEach(p=>{if(p.at&&p.at>t&&p.by!==meName())n++});
 }));
 return n;
}
const meName=()=>cfg().who||userName().split('@')[0]||'?';
const hasName=()=>meName()!=='?';
function touch(p){p.by=hasName()?meName():'';p.at=Date.now()}
function fresh(p){const t=lastSeen();return t&&p.at&&p.at>t&&p.by!==meName()}
function ago(ms){
 if(!ms)return '';
 const s=Math.round((Date.now()-ms)/1000);
 if(s<60)return 'lige nu';
 if(s<3600)return Math.round(s/60)+' min siden';
 if(s<86400)return Math.round(s/3600)+' t siden';
 return new Date(ms).toLocaleDateString('da-DK',{day:'2-digit',month:'2-digit'});
}

       <input class="pnum" value="${esc(p.n)}" data-pnum="${dv.id}|${side}|${p.id}">

function bindPlan(){
 const el2=document.getElementById('plan');
 const find=(ref)=>{
  const [did,side,pid]=ref.split('|');
  const dv=dom().devices.find(x=>x.id===did);
  if(!dv)return [null,null];
  return [dv, dv[side].find(p=>p.id===pid), side];
 };

 el2.querySelectorAll('[data-dom]').forEach(b=>b.onclick=()=>{planDom=b.dataset.dom;drawPlan()});
 const seen=el2.querySelector('[data-seen]'); if(seen)seen.onclick=markSeen;
 const wb=el2.querySelector('#whoBox');
 if(wb)wb.onchange=()=>{const c=cfg();setCfg({url:c.url,key:c.key,who:wb.value.trim()});drawPlan()};
 const wt=el2.querySelector('.whotag');
 if(wt)wt.onclick=()=>{const v=prompt('Dine initialer:',meName());
   if(v!==null){const c=cfg();setCfg({url:c.url,key:c.key,who:v.trim()});drawPlan()}};

 const rf=el2.querySelector('[data-refresh]');
 if(rf)rf.onclick=function(){this.textContent='↻ Henter …';
   pull().then(()=>{this.textContent='↻ Opdatér'}).catch(()=>{this.textContent='↻ Opdatér'})};
 const sh2=el2.querySelector('[data-share]');
 if(sh2)sh2.onclick=function(){
   if(!cloudId){alert('Gem projektet i databasen først, så linket peger på noget.');return}
   copyLink(true,this);
 };
 const pick=el2.querySelector('#devPick');
 if(pick)pick.onchange=()=>{
  const v=pick.value; pick.value='';
  if(v==='')return;
  if(v==='custom'){
   const t=prompt('Hvad hedder udstyret?','Nyt udstyr'); if(t===null)return;
   const i=parseInt(prompt('Hvor mange inputs?','8'),10); if(isNaN(i))return;
   const o=parseInt(prompt('Hvor mange outputs?','4'),10); if(isNaN(o))return;
   addDevice({t:t||'Nyt udstyr',i:Math.max(0,i),o:Math.max(0,o)});
  }else addDevice(DEVICES[planDom][+v]);
 };

 el2.querySelectorAll('[data-dname]').forEach(inp=>{
  inp.onchange=()=>{const dv=dom().devices.find(x=>x.id===inp.dataset.dname);
   if(dv){snap();dv.name=inp.value;autosave()}};
 });
 el2.querySelectorAll('[data-dplace]').forEach(inp=>{
  inp.onchange=()=>{const dv=dom().devices.find(x=>x.id===inp.dataset.dplace);
   if(dv){snap();dv.place=inp.value;autosave()}};
 });
 el2.querySelectorAll('[data-ddel]').forEach(b=>b.onclick=()=>{
  const dv=dom().devices.find(x=>x.id===b.dataset.ddel);
  if(!confirm('Slet "'+dv.name+'" med alle linjer?'))return;
  snap(); dom().devices=dom().devices.filter(x=>x.id!==dv.id); drawPlan();
 });
 el2.querySelectorAll('[data-ddup]').forEach(b=>b.onclick=()=>{
  snap();
  const dv=dom().devices.find(x=>x.id===b.dataset.ddup);
  const c=JSON.parse(JSON.stringify(dv)); c.id=id(); c.name=dv.name+' (kopi)';
  c.ins.forEach(p=>p.id=id()); c.outs.forEach(p=>p.id=id());
  dom().devices.splice(dom().devices.indexOf(dv)+1,0,c); drawPlan();
 });

 el2.querySelectorAll('[data-plabel]').forEach(inp=>{
  const commit=()=>{
   const [dv,p]=find(inp.dataset.plabel);
   if(!p||p.label===inp.value)return;
   snap(); p.label=inp.value; touch(p); autosave();
   const row=inp.closest('.port');
   row.classList.toggle('set',!!p.label);
   row.querySelector('.pby').textContent=p.by+' · '+ago(p.at);
   const col=inp.closest('.portcol');
   const arr=col.querySelectorAll('.port'), n=col.querySelectorAll('.port.set').length;
   col.querySelector('.portitle span').textContent=n+'/'+arr.length;
  };
  inp.onchange=commit;
  inp.onkeydown=e=>{
   if(e.key==='Enter'){e.preventDefault();commit();
    const all=[...el2.querySelectorAll('.plabel')];
    const nx=all[all.indexOf(inp)+1]; if(nx){nx.focus();nx.select()}}
  };
 });
 el2.querySelectorAll('[data-pnum]').forEach(inp=>{
  inp.onchange=()=>{const [dv,p]=find(inp.dataset.pnum);
   if(p){snap();p.n=inp.value;touch(p);autosave()}};
 });
 el2.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{
  const [dv,p,side]=find(b.dataset.pdel);
  snap(); dv[side]=dv[side].filter(x=>x.id!==p.id); drawPlan();
 });
 el2.querySelectorAll('[data-padd]').forEach(b=>b.onclick=()=>{
  const [did,side]=b.dataset.padd.split('|');
  const dv=dom().devices.find(x=>x.id===did);
  snap();
  dv[side].push({id:id(),n:String(dv[side].length+1),label:'',by:'',at:0});
  drawPlan();

}

/* ================= samtidig redigering =================
   Hvert par sekunder spørger vi databasen, om nogen har gemt noget nyere.
   Er der det, flettes deres ændringer ind i vores – linje for linje, hvor den
   nyeste rettelse vinder. Derfor kan to personer rette hver sin stagebox
   samtidig uden at slette for hinanden. */
let lastSync=null;      // serverens tidsstempel vi sidst har set
let pushTimer=null, syncTimer=null, dirty=false;

function planDevices(pl,k){return (pl&&pl[k]&&pl[k].devices)||[]}

function mergePlan(mine,theirs){
 if(!theirs)return mine;
 if(!mine)return theirs;
 const out={};
 Object.keys(PLANDOMS).forEach(k=>{
  const a=planDevices(mine,k), b=planDevices(theirs,k);
  const byId={}; const order=[];
  const put=d=>{if(!byId[d.id]){byId[d.id]=JSON.parse(JSON.stringify(d));order.push(d.id)}
                else byId[d.id]=mergeDev(byId[d.id],d)};
  a.forEach(put); b.forEach(put);
  out[k]={devices:order.map(i=>byId[i])};
 });
 return out;
}
function mergeDev(a,b){
 const d=JSON.parse(JSON.stringify(a));
 /* navn og placering: den der er rettet sidst på en linje bruges som pejling */
 if((b.at||0)>(a.at||0)){d.name=b.name;d.place=b.place}
 ['ins','outs'].forEach(side=>{
  const byId={}; const order=[];
  (a[side]||[]).forEach(p=>{byId[p.id]=p;order.push(p.id)});
  (b[side]||[]).forEach(p=>{
   if(!byId[p.id]){byId[p.id]=p;order.push(p.id)}
   else if((p.at||0)>(byId[p.id].at||0))byId[p.id]=p;   // nyeste rettelse vinder
  });
  d[side]=order.map(i=>byId[i]);
 });
 return d;
}

let pollN=0;
async function pull(){
 if(!cloudId||!session())return;
 let r;
 try{ r=await sbFetch('signalflow_projects?id=eq.'+cloudId+'&select=updated_at,updated_by'); }
 catch(e){ setSync('ingen forbindelse',true); return; }
 if(!r||!r.length)return;
 const t=r[0].updated_at;
 pollN++;
 /* Står tidsstemplet stille (fx hvis triggeren ikke er kørt), henter vi alligevel
    hele projektet en gang imellem og sammenligner indholdet. */
 const forced = (pollN%4===0);
 if(lastSync&&t===lastSync&&!forced){setSync('opdateret');return}
 const full=await sbFetch('signalflow_projects?id=eq.'+cloudId+'&select=name,data,updated_at,updated_by');
 if(lastSync&&t===lastSync&&forced){
  const same=JSON.stringify((full[0].data||{}).plan||null)===JSON.stringify(ensurePlan());
  if(same){setSync('opdateret');return}
 }
 if(!lastSync){lastSync=t;setSync('opdateret');
  const d0=full[0].data||{};
  plan=mergePlan(ensurePlan(),d0.plan);
  if(view==='plan')drawPlan();
  return;}
 const d=full[0].data||{};
 plan=mergePlan(ensurePlan(),d.plan);
 if(!dirty&&d.pages)pages=d.pages;          // tegningen tages kun hvis vi ikke selv har rettet
 if(!dirty&&d.name)projectName=d.name;
 if(activePage>=pages.length)activePage=0;
 doc=pages[activePage];
 lastSync=full[0].updated_at;
 setSync('opdateret · '+(full[0].updated_by||'')); 
 autosave();
 if(view==='plan')drawPlan(); else draw();
 if(dirty)push();                            // send vores egne rettelser videre
}

function push(){
 clearTimeout(pushTimer);
 pushTimer=setTimeout(async()=>{
  if(!cloudId||!session()||!dirty)return;
  try{
   setSync('gemmer …');
   await cloudSaveQuiet();
   dirty=false;
   setSync('gemt');
  }catch(e){ setSync('kunne ikke gemme',true) }
 },1800);
}
async function cloudSaveQuiet(){
 const who=cfg().who||userName().split('@')[0]||'';
 const r=await sbFetch('signalflow_projects?id=eq.'+cloudId,
   {method:'PATCH',body:JSON.stringify({name:projectName,data:snapshot(),updated_by:who,updated_at:new Date().toISOString()})});
 if(r&&r.length&&r[0].updated_at)lastSync=r[0].updated_at;
}

function setSync(txt,warn){
 const n=document.getElementById('autoStatus');
 if(!n)return;
 const d0=parseTS(lastSync); const t=d0?d0.toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'}):'';
 n.textContent=cloudId?(txt+(t?' '+t:'')):txt;
 n.className=warn?'warn':'';
 n.title=cloudId?('Delt projekt · sidst gemt på serveren '+(d0?d0.toLocaleString('da-DK'):'—')) 
                :'Gemt lokalt i denne browser';
}

/* Supabase viser adressen med /rest/v1/ bagpå. Vi sætter den selv på,
   så den fjernes her, uanset hvordan brugeren har indsat den. */
function baseUrl(u){
 return String(u||'').trim().replace(/\/+$/,'').replace(/\/rest\/v1$/i,'');
}

/* ---- login ---- */
const session=()=>{try{return JSON.parse(load(LS_SESSION)||'null')}catch(e){return null}};
const setSession=s=>{s?store(LS_SESSION,JSON.stringify(s)):localStorage.removeItem(LS_SESSION)};
const userName=()=>{const s=session();return s&&s.email?s.email:''};

async function authCall(grant,body){
 const c=cfg();
 if(!c.url||!c.key)throw new Error('Databasen er ikke sat op endnu.');
 let r;
 try{
  r=await fetch(baseUrl(c.url)+'/auth/v1/token?grant_type='+grant,{
   method:'POST',
   headers:{'apikey':c.key,'Content-Type':'application/json'},
   body:JSON.stringify(body)});
 }catch(e){throw new Error('Kunne ikke få forbindelse til serveren.')}
 const t=await r.text();
 let d={}; try{d=JSON.parse(t)}catch(e){}
 if(!r.ok){
  const m=(d.error_description||d.msg||d.message||'').toLowerCase();
  if(m.includes('invalid'))throw new Error('Forkert e-mail eller adgangskode.');
  if(m.includes('confirm'))throw new Error('Brugeren er ikke bekræftet endnu. Bekræft e-mailen, eller slå bekræftelse fra i Supabase.');
  throw new Error(d.error_description||d.msg||('Login mislykkedes ('+r.status+')'));
 }
 return d;
}
async function signIn(email,password){
 const d=await authCall('password',{email:email,password:password});
 setSession({access_token:d.access_token,refresh_token:d.refresh_token,
             email:(d.user&&d.user.email)||email});
 return true;
}
async function refreshSession(){
 const s=session(); if(!s||!s.refresh_token)return false;
 try{
  const d=await authCall('refresh_token',{refresh_token:s.refresh_token});
  setSession({access_token:d.access_token,refresh_token:d.refresh_token,email:s.email});
  return true;
 }catch(e){setSession(null);return false}
}
function signOut(){
 setSession(null); cloudId=null;
}

async function sbFetch(path,opts,retried){
 const c=cfg();
 if(!c.url||!c.key)throw new Error('Databasen er ikke sat op endnu.');
 const s=session();
 if(!s)throw new Error('Du er ikke logget ind.');
 let r;
 try{
  r=await fetch(baseUrl(c.url)+'/rest/v1/'+path,Object.assign({
    headers:{'apikey':c.key,'Authorization':'Bearer '+s.access_token,
             'Content-Type':'application/json','Prefer':'return=representation'}
  },opts||{}));
 }catch(e){
  throw new Error('Kunne ikke få forbindelse. Tjek projekt-URL og at du er på nettet.');
 }
 if(r.status===401&&!retried){
  /* adgangen er udløbet – forny og prøv igen én gang */
  if(await refreshSession())return sbFetch(path,opts,true);
  throw new Error('Du er blevet logget ud. Log ind igen.');
 }
 if(r.status===401||r.status===403)
  throw new Error('Adgang nægtet. Tjek at din bruger har adgang i reglerne på tabellen.');
 if(r.status===404)
  throw new Error('Tabellen findes ikke. Kør SQL-koden i opsætningen.');
 if(!r.ok)throw new Error('Databasen svarede '+r.status+': '+(await r.text()).slice(0,140));
 const t=await r.text();
 return t?JSON.parse(t):null;
}

create trigger sf_touch_t before update on signalflow_projects

create policy "p_ret"   on signalflow_projects for update using (auth.uid() is not null);

drop policy if exists "v_laes" on signalflow_versions;

/* PostgreSQL kan svare med og uden tidszone. Mangler den, er tiden UTC –
   uden dette ville alt se to timer gammelt ud her i dansk sommertid. */
function parseTS(v){
 if(!v)return null;
 if(typeof v==='number')return new Date(v);
 let t=String(v).trim().replace(' ','T');
 if(!/(Z|[+-]\d{2}:?\d{2})$/.test(t))t+='Z';
 const d=new Date(t);
 return isNaN(d)?new Date(v):d;
}
function tid(v){
 const d=parseTS(v)||new Date(v);
 return d.toLocaleString('da-DK',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}

 const sP=activePage,sD=doc,sPath=path,sSel=sel,sFocus=focus,sOn=new Set(on),sB=backupOn;
 if(allLayers){on=new Set(['video','lyd','intercom','net']);backupOn=true}
 activePage=pi;doc=pages[pi];path=[];sel=null;focus=null;
 draw(true);
 const html=el.innerHTML;
 activePage=sP;doc=sD;path=sPath;sel=sSel;focus=sFocus;on=sOn;backupOn=sB;
 draw(true);
 return html;
}

const PAPER={A4:{p:210,l:297},A3:{p:297,l:420},Letter:{p:215.9,l:279.4},Tabloid:{p:279.4,l:431.8}};
function exportPDF(o){
 const idx = o.scope==='all' ? pages.map((_,i)=>i) : [activePage];
 /* Lås arkets bredde til den, elementerne er placeret efter, og skalér hele arket
    ned til papiret. Ellers ombrydes indholdet, mens de frie bokse bliver liggende. */
 const W = el.clientWidth || 1340;
 const mm = (PAPER[o.paper]||PAPER.A4)[o.orient==='landscape'?'l':'p'];
 const avail = (mm - 2*o.margin) * 96/25.4;
 const k = Math.min(1, avail / W);
 const stamp = new Date().toLocaleDateString('da-DK',{day:'2-digit',month:'2-digit',year:'numeric'});
 document.getElementById('printroot').innerHTML = idx.map(i=>
   `<div class="psheet">${renderPageHTML(i,o.allLayers)}
      <div class="pfoot">${esc(pages[i].title)} · side ${idx.indexOf(i)+1} af ${idx.length} · udskrevet ${stamp}</div>
    </div>`).join('');
 document.getElementById('pagestyle').textContent =
   `@page{size:${o.paper} ${o.orient};margin:${o.margin}mm}
    @media print{#printroot{width:${W}px;zoom:${k.toFixed(4)}}
                 .psheet{width:${W}px}}`;
 closeModal();
 setTimeout(()=>{
   window.print();
   setTimeout(()=>{document.getElementById('printroot').innerHTML=''},600);
 },120);
}

/* CSV med semikolon og BOM, så dansk Excel åbner det korrekt */
function exportCSV(o){
 const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 const rows=[['Side','Afsender','Modtager','Feed/TX','Gruppe','Transport','Signaltype','Rolle','Retning','Kanal','Kanaltekst','Kanaltype']];
 const idx = o.scope==='all' ? pages.map((_,i)=>i) : [activePage];
 idx.forEach(pi=>{
  const walk=(sh,prefix)=>{
   sh.sections.forEach(sc=>sc.groups.forEach(g=>{
    if(!o.allLayers&&!vis(g.layer,g.role))return;
    const dtxt=v=>({ltr:'frem',rtl:'retur',both:'begge veje'})[v||'ltr'];
    const base=[prefix,sc.src,sc.dst,g.feed||'',g.label,g.transport||'',LAYERS[g.layer]||g.layer,g.role];
    if(!g.channels.length)rows.push(base.concat([dtxt(g.dir),'','','']));
    g.channels.forEach(ch=>rows.push(base.concat([dtxt(ch.dir||g.dir),ch.nr,ch.label||'',LAYERS[ch.layer]||ch.layer])));
    if(o.subs&&g.sub)walk(g.sub,prefix+' › '+g.label);
   }));
  };
  walk(pages[pi],pages[pi].title);
 });
 dl('\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n'),
    fileName('csv',o.scope!=='all'),'text/csv;charset=utf-8');
 closeModal();
}

/* ---- eksport til draw.io (ren mxGraph-XML, kan redigeres videre) ---- */
function exportDrawio(o){
 const idx = o.scope==='all' ? pages.map((_,i)=>i) : [activePage];
 const X=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'&#10;');
 const SHEETW=1500, M=40;

 const diagrams = idx.map((pi,n)=>{
  const sh=pages[pi];
  const cells=[]; let uid=2;
  const id2=()=>'n'+(uid++);
  const V=(val,style,x,y,w,h)=>{cells.push(
    `<mxCell id="${id2()}" value="${X(val)}" style="${style}" vertex="1" parent="1">`
   +`<mxGeometry x="${Math.round(x)}" y="${Math.round(y)}" width="${Math.round(w)}" height="${Math.round(h)}" as="geometry"/></mxCell>`)};
  const E=(val,style,x1,y1,x2,y2)=>{cells.push(
    `<mxCell id="${id2()}" value="${X(val)}" style="${style}" edge="1" parent="1">`
   +`<mxGeometry relative="1" as="geometry">`
   +`<mxPoint x="${Math.round(x1)}" y="${Math.round(y1)}" as="sourcePoint"/>`
   +`<mxPoint x="${Math.round(x2)}" y="${Math.round(y2)}" as="targetPoint"/></mxGeometry></mxCell>`)};

  let y=M;
  V(sh.title,'text;html=1;fontSize=22;fontStyle=1;align=center;verticalAlign=middle;',
    M,y,SHEETW-2*M,34);
  y+=54;

  sh.sections.forEach(sc=>{
   const st=sc.style||{};
   const srcW=+(st.srcW||190), dstW=+(st.dstW||210);
   const rowsX=M+srcW+30, dstX=SHEETW-M-dstW, rowsW=dstX-30-rowsX;
   const feedW=120, nameW=250;
   const lineA=rowsX+feedW, lineB=rowsX+rowsW-nameW;
   const cloudW=110, cloudX=(lineA+lineB)/2-cloudW/2;

   const secTop=y; let ry=y+14;

   sc.groups.forEach(g=>{
    const col=(g.style&&g.style.lineColor)||{video:'#c62828',lyd:'#9a6500',intercom:'#1e7a55',net:'#1e56b0'}[g.layer]||'#333';
    const dash=g.role==='backup'?'dashed=1;':'';
    const sA=g.dir==='rtl'||g.dir==='both'?'startArrow=classic;startFill=1;':'startArrow=none;';
    const eA=g.dir==='rtl'?'endArrow=none;':'endArrow=classic;endFill=1;';
    const est=`html=1;${dash}${sA}${eA}strokeColor=${col};strokeWidth=1.6;`;

    V((g.feed||'')+(g.role==='backup'?' · BACKUP':''),
      `text;html=1;fontSize=11;fontStyle=1;align=left;verticalAlign=middle;fontColor=${col};`,
      rowsX,ry-9,feedW-6,18);
    E('',est,lineA,ry,cloudX,ry);
    V(g.transport||'—',
      'rounded=1;arcSize=50;html=1;fontSize=10;fontStyle=1;fillColor=#ffffff;strokeColor=#b4b4b4;fontColor=#5c5c5c;',
      cloudX,ry-11,cloudW,22);
    E('',est,cloudX+cloudW,ry,lineB,ry);
    V(g.label,`text;html=1;fontSize=11;fontStyle=1;align=left;verticalAlign=middle;fontColor=${col};`,
      lineB+8,ry-9,nameW,18);
    if(g.tx)V(g.tx,'text;html=1;fontSize=8;align=center;verticalAlign=middle;fontColor=#666666;',lineA+2,ry-16,54,12);
    if(g.rx)V(g.rx,'text;html=1;fontSize=8;align=center;verticalAlign=middle;fontColor=#666666;',lineB-56,ry-16,54,12);
    ry+=20;

    g.channels.forEach(ch=>{
     const crole=ch.role||g.role;
     const cdash=crole==='backup'?'dashed=1;':'';
     const cdot={video:'#ff5252',lyd:'#ffb648',intercom:'#3fd99c',net:'#5ea3ff'}[ch.layer]||'#999';
     V('','ellipse;html=1;fillColor='+cdot+';strokeColor=none;',rowsX+16,ry-4,8,8);
     V((ch.nr||'')+'  '+(ch.label||''),
       'text;html=1;fontSize=10;align=left;verticalAlign=middle;fontColor=#3a3a3a;',
       rowsX+30,ry-8,250,16);
     const cd=ch.dir||g.dir||'ltr';
     E('',`html=1;${cdash}${cd==='rtl'||cd==='both'?'startArrow=classic;startFill=1;':'startArrow=none;'}`
        +`${cd==='rtl'?'endArrow=none;':'endArrow=classic;endFill=1;'}strokeColor=#3a3a3a;strokeWidth=1;`,
       rowsX+290,ry,lineB,ry);
     ry+=16;
    });
    ry+=10;
   });

   const secH=Math.max(ry-secTop+10, 90);
   const boxS=(fill,stroke,font)=>`rounded=1;arcSize=4;html=1;whiteSpace=wrap;verticalAlign=top;align=left;`
     +`fontSize=14;fontStyle=1;spacing=8;fillColor=${fill};strokeColor=${stroke};fontColor=${font};`;
   const srcLines=(sc.srcLines||[]).map(l=>l.t).join('\n');
   const dstLines=(sc.dstLines||[]).map(l=>l.t).join('\n');
   V(sc.src+(srcLines?'\n\n'+srcLines:''),
     boxS(st.srcBg||'#e9c440', st.srcBd||'#bd9a2c', st.srcFg||'#2b2417'), M,secTop,srcW,secH);
   V(sc.dst+(dstLines?'\n\n'+dstLines:''),
     boxS(st.dstBg||'#6d8764', st.dstBd||'#4c6245', st.dstFg||'#f3f7f1'), dstX,secTop,dstW,secH);

   /* bokse der er låst fast i denne sektion – stables i den boks de hører til */
   ['src','dst'].forEach(side=>{
    let iy=secTop+42;
    (sh.items||[]).filter(i=>i.anchor&&i.anchor.sec===sc.id&&i.anchor.side===side).forEach(it=>{
     const w=Math.min(it.w||240, (side==='src'?srcW:dstW)-24);
     const h=itemH(it);
     V(itemText(it),
       'rounded=1;arcSize=6;html=1;whiteSpace=wrap;verticalAlign=top;align=left;fontSize=10;'
      +'fillColor=#ffffff;strokeColor=#cfcfcf;spacing=7;',
       (side==='src'?M:dstX)+12, iy, w, h);
     iy+=h+10;
    });
   });
   y=secTop+secH+26;
  });

  /* frit placerede bokse */
  const scale=(SHEETW-2*M)/Math.max(600,(el.clientWidth||1340));
  (sh.items||[]).filter(i=>!i.anchor).forEach(it=>{
   V(itemText(it),
     'rounded=1;arcSize=6;html=1;whiteSpace=wrap;verticalAlign=top;align=left;fontSize=10;'
    +(it.type==='text'?'fillColor=none;strokeColor=none;':'fillColor=#ffffff;strokeColor=#cfcfcf;')+'spacing=7;',
     M+(it.x||0)*scale, M+40+(it.y||0)*scale, (it.w||240), itemH(it));
  });

  return `<diagram name="${X(sh.title)}" id="d${n+1}">`
   +`<mxGraphModel dx="1200" dy="800" grid="0" gridSize="10" guides="1" tooltips="1" connect="1" `
   +`arrows="1" fold="1" page="1" pageScale="1" pageWidth="1600" pageHeight="1200" math="0" shadow="0">`
   +`<root><mxCell id="0"/><mxCell id="1" parent="0"/>${cells.join('')}</root>`
   +`</mxGraphModel></diagram>`;
 }).join('');

 dl(`<mxfile host="SignalFlow" type="device">${diagrams}</mxfile>`,
    fileName('drawio',o.scope!=='all'),'application/xml');
 closeModal();
}
/* hjælpere til bokse i draw.io */
function itemText(it){
 if(it.type==='text')return it.text||'';
 const rows=(it.rows||[]).map(r=>`${r.sym||'●'}  ${r.label||''}${(r.count===''||r.count==null)?'':'   '+r.count}`);
 const tot=(it.rows||[]).reduce((a,r)=>a+(+r.count||0),0);
 return [it.title||'Forklaring',''].concat(rows)
   .concat(it.showTotal!==false?['','I alt   '+tot]:[]).join('\n');
}
function itemH(it){
 if(it.type==='text')return Math.max(26,(String(it.text||'').split('\n').length)*16+14);
 return 34+(it.rows||[]).length*15+(it.showTotal!==false?20:0);
}

function planRows(){

 Object.keys(PLANDOMS).forEach(k=>(ensurePlan()[k].devices||[]).forEach(d=>{
  [['ins','Input'],['outs','Output']].forEach(([side,txt])=>{
   d[side].forEach(p=>rows.push([PLANDOMS[k],d.name,d.place||'',txt,p.n,p.label||'',p.by||'',
     p.at?new Date(p.at).toLocaleString('da-DK'):'']));
  });
 }));
 return rows;
}

     it.size=+val(root,'size')||13; it.w=+val(root,'w')||260;
     it.align=val(root,'align'); it.bold=val(root,'bold')==='1';
     it.color=val(root,'color');
     it.bg=root.querySelector('[name="nobg"]').checked?'none':val(root,'bg');
     it.border=root.querySelector('[name="border"]').checked;
     closeModal(); draw();
   };
 });
}

function editLegend(iid){
 const it=findItem(iid); if(!it)return;
 const row=(r,i)=>`<div class="lrowedit" data-i="${i}" style="display:grid;grid-template-columns:64px 46px 1fr 62px 28px;gap:6px;margin-bottom:6px;align-items:center">
   <select name="sym${i}" style="background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px;font-size:15px">
     ${SYMBOLS.map(sm=>`<option ${sm===r.sym?'selected':''}>${sm}</option>`).join('')}
   </select>
   <input type="color" name="col${i}" value="${px(r.color,'#333333')}" style="width:100%;height:32px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px">
   <input type="text" name="lab${i}" value="${esc(r.label||'')}" placeholder="Position" style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 7px;font:inherit">
   <input type="number" name="cnt${i}" value="${r.count===''||r.count==null?'':r.count}" min="0" style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 7px;font:inherit">
   <button class="mini" data-rmrow="${i}" style="opacity:1;color:var(--video)">✕</button>
 </div>`;
 openModal('Symbolforklaring','Bemanding og positioner',`
  <div class="mgrid">
    <div class="mf"><label>Overskrift</label><input type="text" name="title" value="${esc(it.title||'')}"></div>
    <div class="mf"><label>Bredde (px)</label><input type="number" name="w" min="140" max="800" step="10" value="${px(it.w,250)}"></div>
  </div>
  <div class="msec">Linjer</div>
  <div style="display:grid;grid-template-columns:64px 46px 1fr 62px 28px;gap:6px;margin-bottom:6px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em">
    <span>Symbol</span><span>Farve</span><span>Position</span><span>Antal</span><span></span>
  </div>
  <div id="rows">${(it.rows||[]).map(row).join('')}</div>
  <button class="btn" data-addrow="1" style="margin-top:8px">+ Tilføj linje</button>
  <div class="mgrid one" style="margin-top:10px">
    <label class="chk"><input type="checkbox" name="tot" ${it.showTotal!==false?'checked':''}> Vis samlet antal nederst</label>
  </div>
  <div class="msec">Placering</div>
  ${anchorField(it)}
  <div class="mrow">
    <button class="btn go" data-ok="1">Gem</button>
    <button class="btn" data-cancel="1">Annullér</button>
  </div>`,root=>{
   const read=()=>[...root.querySelectorAll('.lrowedit')].map(d=>{
     const i=d.dataset.i;
     return {sym:val(root,'sym'+i),color:val(root,'col'+i),label:val(root,'lab'+i),
             count:val(root,'cnt'+i)===''?'':+val(root,'cnt'+i)};
   });
   const rerender=rows=>{
     it.rows=rows;
     const box=root.querySelector('#rows');
     box.innerHTML=rows.map(row).join('');
     bindRows();
   };
   const bindRows=()=>root.querySelectorAll('[data-rmrow]').forEach(b=>b.onclick=()=>{
     const rows=read(); rows.splice(+b.dataset.rmrow,1); rerender(rows);
   });
   bindRows();
   const un=root.querySelector('[data-unanchor]');
   if(un)un.onclick=()=>{snap();unanchor(it);closeModal();draw()};
   root.querySelector('[data-addrow]').onclick=()=>{
     const rows=read(); rows.push({sym:'●',color:'#333333',label:'',count:1}); rerender(rows);
   };
   root.querySelector('[data-cancel]').onclick=closeModal;
   root.querySelector('[data-ok]').onclick=()=>{
     snap();
     it.title=val(root,'title'); it.w=+val(root,'w')||250;
     it.rows=read(); it.showTotal=root.querySelector('[name="tot"]').checked;
     closeModal(); draw();
   };
 });
}

/* ---- træk og skalér ---- */
let dragState=null;
document.getElementById('sheet').addEventListener('mousedown',ev=>{
 const rs=ev.target.closest('[data-rs]');
 if(rs){
  ev.preventDefault();
  const [kind,ref]=rs.dataset.rs.split('|');
  const sc=sheet().sections.find(s=>s.id===ref);
  const it=kind==='item'?findItem(ref):null;
  const st=sc?SS(sc):null;
  dragState={mode:'resize',kind,ref,sc,it,st,x0:ev.clientX,y0:ev.clientY,
    w0:it?it.w:(st?px(kind.startsWith('src')?st.srcW:st.dstW,kind.startsWith('src')?190:210):0),
    h0:st?px(kind==='src'?st.srcH:st.dstH,0):0,
    dx0:st?px(kind==='srcin'?st.srcDX:st.dstDX,0):0,
    el:rs.parentElement};
  snap(); document.body.style.userSelect='none';
  return;
 }
 const dh=ev.target.closest('.fdrag');
 if(dh){
  const node=dh.closest('.fitem');
  if(!node)return;
  const it=findItem(node.dataset.item);
  if(!it)return;
  if(ev.target.closest('.mini')||ev.target.closest('.rs'))return;
  ev.preventDefault();
  const r=node.getBoundingClientRect();
  dragState={mode:'move',it,el:node,
    gx:ev.clientX-r.left, gy:ev.clientY-r.top, w:r.width};
  node.classList.add('dragging');
  node.style.width=r.width+'px';
  node.style.left=r.left+'px';
  node.style.top=r.top+'px';
  sel={t:'item',id:it.id};
  snap(); document.body.style.userSelect='none';
 }
});

/* find den boks der ligger under punktet – ellers arket selv */
function dropTarget(x,y){
 const boxes=[];
 el.querySelectorAll('.section').forEach(secEl=>{
  const sec=secEl.dataset.sec;
  const add=(sel2,side)=>{const c=secEl.querySelector(sel2); if(c)boxes.push({c,sec,side})};
  add('.srcbox','src'); add('.dstbox','dst'); add('.rows','rows');
 });
 for(const b of boxes){
  const r=b.c.getBoundingClientRect();
  if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return b;
 }
 return null;
}
function highlightDrop(t){
 el.querySelectorAll('.drophere').forEach(n=>n.classList.remove('drophere'));
 if(t)t.c.classList.add('drophere');
}

document.addEventListener('mousemove',ev=>{
 if(!dragState)return;
 const dx=ev.clientX-dragState.x0, dy=ev.clientY-dragState.y0;
 const d=dragState;
 if(d.mode==='move'){
  d.el.style.left=(ev.clientX-d.gx)+'px';
  d.el.style.top =(ev.clientY-d.gy)+'px';
  highlightDrop(dropTarget(ev.clientX-d.gx+14, ev.clientY-d.gy+12));
 } else if(d.kind==='item'){
  d.el.style.width=Math.max(90,d.w0+dx)+'px';
 } else if(d.kind==='srcin'){
  d.el.style.marginRight=Math.max(0,d.dx0-dx)+'px';
 } else if(d.kind==='dstin'){
  d.el.style.marginLeft=Math.max(0,d.dx0+dx)+'px';
 } else {
  const w=Math.max(90,d.w0+(d.kind==='src'?dx:-dx));
  const h=Math.max(0,d.h0+dy);
  const sec=d.el.closest('.section');
  const st=SS(d.sc);
  sec.style.gridTemplateColumns=`${d.kind==='src'?w:px(st.srcW,190)}px 1fr ${d.kind==='dst'?w:px(st.dstW,210)}px`;
  d.el.style.minHeight=h+'px';
  d.wNow=w; d.hNow=h;
 }
});
document.addEventListener('mouseup',()=>{
 const d=dragState; if(!d)return;
 dragState=null; document.body.style.userSelect='';
 if(d.mode==='move'){
  const r=d.el.getBoundingClientRect();
  const t=dropTarget(r.left+14, r.top+12);
  highlightDrop(null);
  if(t){
   const cr=t.c.getBoundingClientRect();
   const maxX=Math.max(0, t.c.clientWidth - r.width - 6);
   d.it.anchor={sec:t.sec, side:t.side,
     dx:Math.min(maxX, Math.max(6, Math.round(r.left-cr.left-t.c.clientLeft))),
     dy:Math.max(6, Math.round(r.top -cr.top -t.c.clientTop))};
  }else{
   const sr=el.getBoundingClientRect();
   delete d.it.anchor;
   d.it.x=Math.max(0,Math.round(r.left-sr.left-el.clientLeft));
   d.it.y=Math.max(0,Math.round(r.top -sr.top -el.clientTop));
  }
 } else if(d.kind==='item'){
  let w=parseFloat(d.el.style.width)||d.w0;
  if(d.it.anchor){
   const c=d.el.parentElement;
   if(c)w=Math.min(w, c.clientWidth - d.it.anchor.dx - 6);
  }
  d.it.w=Math.max(90,w);
 } else if(d.kind==='srcin'){
  SS(d.sc).srcDX=parseFloat(d.el.style.marginRight)||0;
 } else if(d.kind==='dstin'){
  SS(d.sc).dstDX=parseFloat(d.el.style.marginLeft)||0;
 } else {
  const st=SS(d.sc);
  if(d.kind==='src'){st.srcW=d.wNow;st.srcH=d.hNow}else{st.dstW=d.wNow;st.dstH=d.hNow}
 }
 draw();
});

/* ================= handlinger ================= */
function addSec(){snap();sheet().sections.push(newSection('Modtager '+(sheet().sections.length+1),sheet().sections[0]?sheet().sections[0].src:'Afsender'));draw()}
function move(gid,d){snap();const[g,sc]=findGrp(gid);const i=sc.groups.indexOf(g),j=i+d;if(j<0||j>=sc.groups.length)return;sc.groups.splice(i,1);sc.groups.splice(j,0,g);draw()}
function drill(gid){const[g]=findGrp(gid);if(!g)return;if(!g.sub){snap();g.sub=newSheet(g.label);g.sub.sections.push(newSection('Modtager',g.label))}path.push(g);sel=null;draw();document.getElementById('stage').scrollTop=0}

/* inline redigering */
let editing=null;

/* Afslut en igangværende redigering uden at tegne om. Kaldes før enhver anden
   handling, så et felt aldrig kan blive hængende og spærre for videre skrivning. */
function commitEdit(save){
 if(!editing)return;
 const kind=editing.kind, ref=editing.ref, inp=editing.inp;
 editing=null;
 if(!inp||!inp.isConnected)return;          // feltet er allerede fjernet – glem det
 if(save!==false){
  const v=inp.value;
  if(v!==getVal(kind,ref)){snap();setVal(kind,ref,v)}
 }
}

function startEdit(node){
 commitEdit(true);                          // gem det forrige felt i stedet for at blokere
 const kind=node.dataset.e, ref=node.dataset.id;
 const cur=getVal(kind,ref);
 const inp=document.createElement('input');
 inp.id='inlineEdit';
 inp.value=cur;
 inp.style.cssText='font:inherit;color:#111;background:#fff;border:1.5px solid #0a5bd3;'
  +'border-radius:3px;padding:0 4px;min-width:80px;width:'+Math.max(90,cur.length*8+24)+'px';
 editing={kind:kind,ref:ref,inp:inp};
 node.replaceWith(inp); inp.focus(); inp.select();

 const finish=function(save){
  if(!editing||editing.inp!==inp)return;
  commitEdit(save);
  draw();
 };
 inp.onkeydown=function(e){
  if(e.key==='Enter'){e.preventDefault();finish(true)}
  else if(e.key==='Escape'){e.preventDefault();finish(false)}
  else if(e.key==='Tab'){e.preventDefault();commitEdit(true);draw();focusNext(kind,ref,e.shiftKey)}
  e.stopPropagation();
 };
 inp.onblur=function(){finish(true)};
}

/* Tab springer videre til næste tekst af samme slags – hurtigt når man skriver
   mange kanaler i træk. Shift+Tab går tilbage. */
function focusNext(kind,ref,back){
 const all=[].slice.call(el.querySelectorAll('[data-e="'+kind+'"]'));
 let i=-1;
 for(let j=0;j<all.length;j++){if(all[j].dataset.id===ref){i=j;break}}
 const next=all[i+(back?-1:1)];
 if(next)startEdit(next);
}
function getVal(k,r){
 if(k==='title')return sheetTitle();
 if(k==='src'){const sc=sheet().sections.find(s=>s.id===r);return sc?sc.src:''}
 if(k==='dst'){const sc=sheet().sections.find(s=>s.id===r);return sc?sc.dst:''}
 if(k==='srcline'||k==='dstline'){const[sid,lid]=String(r).split('|');
   const sc=sheet().sections.find(s=>s.id===sid);if(!sc)return '';
   const L=(k==='srcline'?sc.srcLines:sc.dstLines)||[];const o=L.find(l=>l.id===lid);return o?o.t:''}
 const [gid,cid]=String(r).split('|'); const [g]=findGrp(gid); if(!g)return '';
 if(k==='feed')return g.feed; if(k==='glabel')return g.label; if(k==='transport')return g.transport;
 if(k==='tx')return g.tx||''; if(k==='rx')return g.rx||'';
 if(k==='chtx'||k==='chrx'){const c2=g.channels.find(c=>c.id===cid);return c2?(k==='chtx'?c2.tx:c2.rx)||'':''}
 const ch=g.channels.find(c=>c.id===cid); if(!ch)return '';
 return k==='chnr'?ch.nr:ch.label;
}
function setVal(k,r,v){
 if(k==='title'){setSheetTitle(v);return}
 if(k==='src'){const sc=sheet().sections.find(s=>s.id===r);if(sc)sc.src=v;return}
 if(k==='dst'){const sc=sheet().sections.find(s=>s.id===r);if(sc)sc.dst=v;return}
 if(k==='srcline'||k==='dstline'){const[sid,lid]=String(r).split('|');
   const sc=sheet().sections.find(s=>s.id===sid);if(!sc)return;
   const L=(k==='srcline'?sc.srcLines:sc.dstLines)||[];const o=L.find(l=>l.id===lid);
   if(!o)return;
   if(v.trim()==='')  {  // tom tekst fjerner linjen
     if(k==='srcline')sc.srcLines=L.filter(l=>l.id!==lid); else sc.dstLines=L.filter(l=>l.id!==lid);
   } else o.t=v;
   return}
 const [gid,cid]=String(r).split('|'); const [g]=findGrp(gid); if(!g)return;
 if(k==='feed'){g.feed=v;return} if(k==='glabel'){g.label=v;return} if(k==='transport'){g.transport=v;return}
 if(k==='tx'){g.tx=v;return} if(k==='rx'){g.rx=v;return}
 if(k==='chtx'||k==='chrx'){const c2=g.channels.find(c=>c.id===cid);
   if(c2){if(k==='chtx')c2.tx=v; else c2.rx=v} return}
 const ch=g.channels.find(c=>c.id===cid); if(!ch)return;
 if(k==='chnr')ch.nr=v; else ch.label=v;
}

/* klik på arket */
el.addEventListener('click',ev=>{
 const t=ev.target;
 if(editing&&t!==editing.inp)commitEdit(true);   // gem det åbne felt før alt andet
 const d=k=>t.closest('['+k+']');
 let n;
 if(n=d('data-addsec')){addSec();return}
 if(n=d('data-addgrp')){snap();const sc=sheet().sections.find(s=>s.id===n.dataset.addgrp);const g=newGroup('Kilde '+(sc.groups.length+1));g.feed='TX '+(sc.groups.length+1);g.channels=[newCh(1)];sc.groups.push(g);sel={t:'grp',id:g.id};draw();return}
 if(n=d('data-addch')){snap();const[g]=findGrp(n.dataset.addch);g.channels.push(newCh(g.channels.length+1));draw();return}
 if(n=d('data-delg')){snap();const[g,sc]=findGrp(n.dataset.delg);sc.groups=sc.groups.filter(x=>x!==g);sel=null;draw();return}
 if(n=d('data-cdir')){snap();const[gid,cid]=n.dataset.cdir.split('|');const[g]=findGrp(gid);
   const c=g.channels.find(x=>x.id===cid);
   const order=['ltr','rtl','both'];
   c.dir=order[(order.indexOf(c.dir||g.dir||'ltr')+1)%3];
   draw();return}
 if(n=d('data-crole')){snap();const[gid,cid]=n.dataset.crole.split('|');const[g]=findGrp(gid);
   const c=g.channels.find(x=>x.id===cid);
   c.role=(c.role||g.role)==='backup'?'primær':'backup';
   draw();return}
 if(n=d('data-delc')){snap();const[gid,cid]=n.dataset.delc.split('|');const[g]=findGrp(gid);g.channels=g.channels.filter(c=>c.id!==cid);draw();return}
 if(n=d('data-delsec')){snap();sheet().sections=sheet().sections.filter(s=>s.id!==n.dataset.delsec);draw();return}
 if(n=d('data-up')){move(n.dataset.up,-1);return}
 if(n=d('data-down')){move(n.dataset.down,1);return}
 if(n=d('data-dup')){snap();const[g,sc]=findGrp(n.dataset.dup);const cp=JSON.parse(JSON.stringify(g));cp.id=id();cp.channels.forEach(c=>c.id=id());sc.groups.splice(sc.groups.indexOf(g)+1,0,cp);draw();return}
 if(n=d('data-drill')){drill(n.dataset.drill);return}
 if(n=d('data-secedit')){editSection(n.dataset.secedit);return}
 if(n=d('data-gedit')){editGroup(n.dataset.gedit);return}
 if(n=d('data-seccopy')){copySection(n.dataset.seccopy);return}
 if(n=d('data-gcopy')){copyGroup(n.dataset.gcopy);return}
 if(n=d('data-secfocus')){focus={t:'sec',id:n.dataset.secfocus};sel=null;draw();return}
 if(n=d('data-gfocus')){focus={t:'grp',id:n.dataset.gfocus};sel=null;draw();return}
 if(n=d('data-unfocus')){focus=null;draw();return}
 if(n=d('data-addtext')){addText();return}
 if(n=d('data-addlegend')){addLegend();return}
 if(n=d('data-iedit')){const it=findItem(n.dataset.iedit);it&&(it.type==='text'?editText(it.id):editLegend(it.id));return}
 if(n=d('data-idel')){snap();sheet().items=items().filter(i=>i.id!==n.dataset.idel);sel=null;draw();return}
 if(n=d('data-idup')){snap();const o=findItem(n.dataset.idup);const c=JSON.parse(JSON.stringify(o));c.id=id();c.x+=24;c.y+=24;items().push(c);draw();return}
 if(n=d('data-boxadd')){const[sid,side]=n.dataset.boxadd.split('|');snap();
   const sc=sheet().sections.find(x=>x.id===sid);const k=side+'Lines';
   (sc[k]||(sc[k]=[])).push({id:id(),t:'Ny tekst'});draw();return}
 if(n=d('data-fold')){const[g]=findGrp(n.dataset.fold);g.collapsed=!g.collapsed;draw();return}
 if(n=d('data-cyc')){snap();const[gid,cid]=n.dataset.cyc.split('|');const[g]=findGrp(gid);const ch=g.channels.find(c=>c.id===cid);const ks=Object.keys(LAYERS);ch.layer=ks[(ks.indexOf(ch.layer)+1)%ks.length];draw();return}
 if(n=d('data-e')){startEdit(n);return}
 const fit=t.closest('[data-item]');
 if(fit){const it=findItem(fit.dataset.item);if(it){sel={t:'item',id:it.id};draw();return}}
 const gr=t.closest('[data-grp]');
 sel=gr?{t:'grp',id:gr.dataset.grp}:null;
 draw();
});

/* lag-knapper */
document.querySelectorAll('.busbtn').forEach(b=>b.onclick=()=>{
 const l=b.dataset.l;
 if(l==='backup'){backupOn=!backupOn;b.classList.toggle('on',backupOn)}
 else{on.has(l)?on.delete(l):on.add(l);b.classList.toggle('on',on.has(l))}
 draw();
});

/* tastatur */
document.addEventListener('keydown',e=>{
 /* I kanalplanen står markøren næsten altid i et felt, så fortryd skal
    virke alligevel – ellers kan man ikke fortryde en linje man lige rettede. */
 if(view==='plan'&&(e.ctrlKey||e.metaKey)&&e.key==='z'){
  e.preventDefault(); if(document.activeElement)document.activeElement.blur(); undo(); return;
 }
 if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')return;
 if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}
 if((e.ctrlKey||e.metaKey)&&e.key==='p'){e.preventDefault();openExport()}
 if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();openExport()}
 if(e.key==='Escape'){sel=null;draw()}
});

/* gem / åbn / print */
document.getElementById('bUndo').onclick=undo;
document.getElementById('bUndo').disabled=true;
document.getElementById('bExport').onclick=openExport;
document.getElementById('bCloud').onclick=openCloud;
document.getElementById('bFoldAll').onclick=()=>{
 const gs=[];sheet().sections.forEach(sc=>sc.groups.forEach(g=>gs.push(g)));
 const anyOpen=gs.some(g=>!g.collapsed);
 snap(); gs.forEach(g=>g.collapsed=anyOpen); draw();
};
document.getElementById('bNew').onclick=()=>{if(confirm('Start forfra med ét tomt projekt? Alle sider slettes.')){snap();pages=[blank()];activePage=0;doc=pages[0];path=[];sel=null;cloudId=null;projectName='Nyt projekt';draw()}};
document.getElementById('bSave').onclick=()=>{
 const project=snapshot();
 const b=new Blob([JSON.stringify(project,null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);
 a.download=fileName('json');a.click();
};
document.getElementById('bOpen').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
   try{
     const data=JSON.parse(r.result);
     pages = Array.isArray(data.pages)&&data.pages.length ? data.pages : [data];
     plan = data.plan||blankPlan();  // ældre filer var ét ark uden 'pages'
     projectName = data.name || (f.name||'').replace(/\.json$/i,'').replace(/_/g,' ') || 'Projekt';
     activePage=0; doc=pages[0]; path=[]; sel=null; undoStack=[];
     document.getElementById('bUndo').disabled=true;
     draw();
   }catch(err){alert('Kunne ikke læse filen: '+err.message)}
 };
 r.readAsText(f); e.target.value='';
};

if(restoreAuto()){/* genoptaget fra autogem */}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
ensurePlan();
draw();
applyUrl();
startSync();
</script>
