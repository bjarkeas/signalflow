<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignalFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101319; --panel:#171c24; --panel2:#1f2630; --line:#2b3542;
  --text:#e9eef5; --dim:#8d9aab; --faint:#5c6878;
  --video:#ff5252; --lyd:#ffb648; --intercom:#3fd99c; --net:#5ea3ff;
  --ink:#1d1d1d; --paper:#fbfaf6;
  --fd:'Barlow Condensed',sans-serif; --fb:'IBM Plex Sans',system-ui,sans-serif; --fm:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--fb)}
button{font:inherit}

#app{display:grid;grid-template-rows:54px 42px 1fr;grid-template-columns:1fr 290px;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);position:relative}
.logo{font-family:var(--fd);font-weight:700;font-size:20px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.logo em{font-style:normal;color:var(--lyd)}
#crumbs{display:flex;align-items:center;gap:5px;font-family:var(--fm);font-size:12px;color:var(--dim);flex:1;min-width:0;overflow:hidden;white-space:nowrap}
#crumbs button{background:none;border:none;color:var(--dim);cursor:pointer;padding:4px 6px;border-radius:5px;font:inherit}
#crumbs button:hover{color:var(--text);background:var(--panel2)}

#crumbs .here{color:var(--text)}
#crumbs .projname{color:var(--text);font-weight:600}
#autoStatus{font-family:var(--fm);font-size:10px;color:var(--faint);white-space:nowrap;min-width:96px;text-align:right}
#autoStatus.warn{color:var(--lyd)}
#crumbs .projname:hover{background:var(--panel2);color:var(--lyd)}
#crumbs .sep{color:var(--faint)}

.bus{display:flex;gap:5px}
.busbtn{position:relative;font-family:var(--fd);font-weight:600;font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--panel2);color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:7px 12px 7px 21px;cursor:pointer;transition:.12s}
.busbtn::before{content:'';position:absolute;left:8px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:var(--d);opacity:.3;transition:.12s}
.busbtn.on{color:var(--text);border-color:var(--d)}
.busbtn.on::before{opacity:1;box-shadow:0 0 8px var(--d)}
.busbtn[data-l=video]{--d:var(--video)} .busbtn[data-l=lyd]{--d:var(--lyd)}
.busbtn[data-l=intercom]{--d:var(--intercom)} .busbtn[data-l=net]{--d:var(--net)}
.busbtn[data-l=backup]{--d:#b18cff}
.hbtn{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.hbtn:hover{color:var(--text);border-color:var(--faint)}
.hbtn:disabled{opacity:.4;cursor:default}

#stage{grid-row:3;position:relative;overflow:auto;background:#0b0e13;padding:26px}
#side{grid-row:3;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px}

#tabbar{grid-row:2;grid-column:1/3;display:flex;align-items:flex-end;gap:2px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 14px;overflow-x:auto}
.tab{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-bottom:none;border-radius:7px 7px 0 0;padding:7px 8px 7px 13px;cursor:pointer;color:var(--dim);white-space:nowrap;margin-bottom:-1px}
.tab.on{background:var(--paper);color:#1d1d1d;border-color:var(--paper)}
.tab .tname{font-size:12.5px;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.tab.on .tname{cursor:text}
.tab .tx{border:none;background:none;color:inherit;opacity:.45;cursor:pointer;font-size:11px;padding:1px 3px;border-radius:3px;line-height:1}
.tab .tx:hover{opacity:1;background:rgba(0,0,0,.15)}
.tabadd{background:none;border:none;color:var(--dim);cursor:pointer;padding:7px 10px;font-size:15px;margin-bottom:2px}
.tabadd:hover{color:var(--text)}
.tabedit{font:12.5px var(--fb);border:1.5px solid #0a5bd3;border-radius:4px;padding:0 4px;max-width:190px}
#sheet{background:var(--paper);color:var(--ink);margin:0 auto;box-shadow:0 10px 40px rgba(0,0,0,.5);border-radius:3px;width:100%;max-width:1340px;min-width:900px;min-height:560px;padding:26px 30px 60px;transform-origin:top center}

/* ---- ark ---- */
.sheettitle{font-family:var(--fd);font-weight:700;font-size:25px;letter-spacing:.04em;text-align:center;padding:6px 0 4px;color:#2a2a2a}
.sheetsub{font-family:var(--fm);font-size:11px;text-align:center;color:#8a8a8a;margin-bottom:20px}
.section{display:grid;grid-template-columns:190px 1fr 210px;gap:0;margin-bottom:26px;align-items:stretch}
.srcbox,.dstbox{border-radius:3px;padding:11px 12px;position:relative}
.srcbox{background:#e9c440;border:1px solid #bd9a2c}
.dstbox{background:#6d8764;border:1px solid #4c6245;color:#f3f7f1}
.boxname{font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:.05em;line-height:1.2;overflow-wrap:anywhere;word-break:break-word}
.srcbox .boxname{color:#2b2417}
.boxsub{font-family:var(--fm);font-size:9.5px;opacity:.65;margin-top:3px}
.rows{padding:4px 14px;min-width:0;position:relative}

.grp{position:relative;padding:2px 0 2px 0;margin-bottom:9px}
.grp.sel{background:#eef4ff;box-shadow:0 0 0 1px #b9d0f5;border-radius:4px}
.grp.hidden{display:none}
.feed{display:flex;align-items:center;gap:0;min-height:19px;flex-wrap:wrap;row-gap:1px}
.lbl{font-size:11.5px;white-space:nowrap;cursor:text;padding:1px 3px;border-radius:3px}
.lbl:hover{background:#e6eefc;outline:1px solid #b9d0f5}
.feed .lbl{font-weight:600}
.wire{flex:1 1 24px;height:0;border-top:1.8px solid currentColor;margin:0 6px;min-width:20px;position:relative}
.grp.backup .wire{border-top-style:dashed}
.ch.cbackup .wire{border-top-style:dashed}
.ch:not(.cbackup) .wire{border-top-style:solid}
.dirbtn{font-size:12px;font-weight:600}
.chb{font-family:var(--fm);font-size:8px;font-weight:500;background:#b18cff;color:#fff;border-radius:3px;padding:0 3px;margin-right:5px;line-height:1.5}
.cloud{font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:#5c5c5c;background:var(--paper);border:1px solid #b4b4b4;border-radius:14px;padding:1px 13px;cursor:text;white-space:nowrap}
.cloud:hover{border-color:#0a5bd3;color:#0a5bd3}
.ch{display:flex;align-items:center;min-height:17px;padding-left:14px;color:#3a3a3a;flex-wrap:wrap;row-gap:1px}
.ch .wire{border-top-width:1.1px;border-top-color:currentColor}
.ch .wire{border-top-color:currentColor}
.dot{width:7px;height:7px;border-radius:50%;flex:none;margin-right:7px;cursor:pointer;border:1px solid rgba(0,0,0,.25)}
.ch .lbl{font-size:11px;white-space:normal;overflow-wrap:anywhere}
.chnr{font-family:var(--fm);font-size:10.5px;min-width:44px;cursor:text;padding:1px 3px;border-radius:3px}
.chnr:hover{background:#e6eefc}





/* ---- skift mellem tegning og kanalplan ---- */
.viewsw{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.vbtn{background:none;border:none;color:var(--dim);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.vbtn.on{background:var(--panel2);color:var(--text)}
#plan{display:none}
body.planview #sheet,body.planview #tabbar{display:none}
body.planview #side,body.planview .bus,body.planview #bFoldAll{display:none}
body.planview #stage{grid-column:1/3}
body.planview #crumbs{flex:0 1 auto;max-width:230px}
body.planview #plan{display:block}
body.planview #stage{background:#0b0e13;padding:16px}



/* ---- låseskærm ---- */
#gate{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9998;background:var(--bg);
 display:flex;align-items:center;justify-content:center;padding:24px}
body.unlocked #gate{display:none}
body:not(.unlocked) #app{filter:blur(7px);pointer-events:none;user-select:none}
.gatebox{width:100%;max-width:340px;display:flex;flex-direction:column;gap:9px}
.gatelogo{font-family:var(--fd);font-weight:700;font-size:30px;letter-spacing:.09em;text-transform:uppercase;text-align:center}
.gatelogo em{font-style:normal;color:var(--lyd)}
.gatesub{font-family:var(--fm);font-size:11px;color:var(--dim);text-align:center;margin-bottom:12px}
#gate input{background:var(--panel);border:1px solid var(--line);color:var(--text);
 border-radius:8px;padding:12px 12px;font:16px var(--fb)}
#gate input:focus{outline:none;border-color:var(--intercom)}
.gatebtn{background:var(--panel2);border:1px solid var(--intercom);color:var(--intercom);
 border-radius:8px;padding:12px;cursor:pointer;font:15px var(--fb);margin-top:4px}
.gatebtn:hover{background:rgba(63,217,156,.13)}
#gMsg{color:var(--video);font-size:12px;min-height:16px;text-align:center}
.gatefoot{font-family:var(--fm);font-size:10px;color:var(--faint);text-align:center;margin-top:14px;line-height:1.6}



/* flytte-håndtag på linjerne */
.grip{cursor:grab}
.grip:active{cursor:grabbing}
.rowmoving{opacity:.45}
.rowmark{height:2px;background:var(--intercom);border-radius:2px;margin:1px 0;
 box-shadow:0 0 6px var(--intercom);pointer-events:none}
.port [data-pgrip]{display:none;position:absolute;right:102px;top:50%;transform:translateY(-50%);z-index:2}
.port:hover [data-pgrip]{display:block}


/* flytning af faner */
.tabmark{width:2px;align-self:stretch;background:var(--intercom);border-radius:2px;margin:6px 1px;
 box-shadow:0 0 6px var(--intercom);pointer-events:none;flex:none}
.tabmoving{opacity:.45}
.tab,.btab{cursor:grab}
.tab:active,.btab:active{cursor:grabbing}


/* ================= mobiludgaven ================= */
#mbar,#mnav,#sheetwrap{display:none}
.modeswitch{font-size:15px;padding:6px 10px}

body.mobile #app{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding-top:52px;padding-bottom:62px}
body.mobile header,body.mobile #side,body.mobile #tabbar,body.mobile .viewsw,
body.mobile .bus,body.mobile #crumbs{display:none}
body.mobile #stage{grid-column:1/-1;padding:10px 10px 16px}

/* topbjælke */
body.mobile #mbar{display:flex;position:fixed;top:0;left:0;right:0;height:52px;z-index:900;
 align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.mbtn{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;
 padding:9px 12px;font-size:15px;cursor:pointer;flex:none}
.mtitle{flex:1;min-width:0;background:none;border:none;color:var(--text);text-align:left;
 display:flex;flex-direction:column;gap:1px;cursor:pointer;padding:2px 0}
.mtitle b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtitle span{font-family:var(--fm);font-size:10.5px;color:var(--intercom);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mSave{border-color:var(--intercom);color:var(--intercom);font-size:13px}
#mMode{font-size:15px;padding:9px 10px}

/* bundnavigation */
body.mobile #mnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;
 z-index:900;background:var(--panel);border-top:1px solid var(--line);
 padding-bottom:env(safe-area-inset-bottom,0)}
#mnav button{background:none;border:none;color:var(--faint);padding:9px 4px 10px;cursor:pointer;
 display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-family:var(--fm)}
#mnav button span{font-size:17px;line-height:1}
#mnav button.on{color:var(--intercom)}

/* ark nedefra */
#sheetwrap{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1200;background:rgba(0,0,0,.55);
 align-items:flex-end;justify-content:center}
#sheetwrap.on{display:flex}
#sheetbox{width:100%;max-width:520px;max-height:82vh;overflow-y:auto;background:var(--panel);
 border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:none;padding:8px 10px 14px;
 animation:opad .16s ease-out}
@keyframes opad{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
.shandle{width:38px;height:4px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.shead{font-family:var(--fd);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
 color:var(--dim);padding:2px 8px 10px}
.sitem{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;color:var(--text);
 padding:13px 10px;border-radius:10px;cursor:pointer;text-align:left;font-size:15px}
.sitem:active{background:var(--panel2)}
.sitem.aktiv{color:var(--intercom)}
.sitem.fare{color:var(--video)}
.sitem.luk{color:var(--dim);justify-content:center;margin-top:4px}
.sico{width:22px;text-align:center;font-size:15px;flex:none;opacity:.85}
.stxt{flex:1;min-width:0;display:flex;flex-direction:column}
.stxt em{font-style:normal;font-family:var(--fm);font-size:10.5px;color:var(--faint);margin-top:2px}
.sval{font-family:var(--fm);font-size:11px;color:var(--faint);white-space:nowrap}
.ssplit{height:1px;background:var(--line);margin:6px 10px}

/* ⋯-knapperne findes kun på mobil */
.rowmenu{display:none!important}
body.mobile .rowmenu{display:inline-block!important;position:static!important;opacity:1!important;
 font-size:17px;padding:6px 10px;line-height:1}
/* på mobil er der kun ⋯ – resten ligger i arket */
body.mobile .tools .mini:not(.rowmenu),
body.mobile .port [data-pdel],body.mobile .port [data-pins],body.mobile .port [data-pgrip],
body.mobile .port .pby,body.mobile .fitools,
body.mobile .dev .devacts .mini:not(.rowmenu),body.mobile .draghandle,
body.mobile .dev .rs,body.mobile .endtag,body.mobile .rs,
body.mobile .boxadd,body.mobile .secmini{display:none!important}

/* arket fylder skærmens bredde */
body.mobile #sheet,body.mobile .sheet{width:auto!important;min-width:0!important;zoom:1!important;
 transform:none!important;overflow:visible}
body.mobile #stage{overflow-x:hidden}

/* tegningen på mobil: en sektion pr. kort, stablet */
body.mobile .sheet,body.mobile .psheet{padding:12px 10px;border-radius:12px}
body.mobile .section{display:block!important;margin-bottom:14px}
body.mobile .srcbox,body.mobile .dstbox{width:auto!important;margin:0 0 8px!important;min-height:0!important}
body.mobile .rows{padding:2px 0!important;margin:0!important}
body.mobile .dstbox{margin-top:8px!important}
/* gruppehovedet på mobil: ▾ 4W [INTERNET] ↔ ⋯  og navnet på linjen under */
body.mobile .feed{flex-wrap:wrap;gap:8px;align-items:center;padding:8px 2px 6px}
body.mobile .feed .caret{order:0}
body.mobile .feed .lbl[data-e="feed"]{order:1;font-size:15px}
body.mobile .feed .cloudtag{display:inline-flex;order:2;font-size:11px;padding:3px 10px}
body.mobile .feed .dirmark{order:3}
body.mobile .feed .tools{order:4;margin-left:auto}
body.mobile .feed .lbl[data-e="glabel"]{order:5;flex:1 1 100%;font-size:15px;margin-top:2px}
body.mobile .chcount{order:6;flex:1 1 100%;font-size:11px}
body.mobile .feed .wire,body.mobile .cloudtag{display:none}
body.mobile .feed .lbl[data-e="glabel"]{flex:1 1 100%;font-size:14px}
body.mobile .ch{padding:11px 4px;border-bottom:1px solid var(--line);gap:10px;align-items:center}
body.mobile .ch .tools{margin-left:auto}
body.mobile .add{padding:11px 8px;font-size:13px}
body.mobile .ch .wire{display:none}
body.mobile .ch .chb{font-size:12px;min-width:44px}
body.mobile .ch .lbl{font-size:15px;flex:1}
body.mobile .grp{margin-bottom:12px}
body.mobile .sheettitle{font-size:19px}

/* kanalplan og lager på mobil */
body.mobile .devcanvas{width:auto!important;height:auto!important}
body.mobile .dev{position:relative!important;left:auto!important;top:auto!important;
 width:auto!important;margin:0 0 12px}
body.mobile .ports{grid-template-columns:1fr!important}
body.mobile .plabel{font-size:16px;padding:10px 9px}
body.mobile .pnum{font-size:13px;padding:10px 3px;width:42px}
body.mobile .tick input{width:22px;height:22px}
body.mobile .planbar{gap:7px}
body.mobile .planbar .sharebtn{flex:1 1 auto;padding:10px 8px;font-size:12.5px}
/* på mobil ligger disse i ☰-menuen i stedet */
body.mobile .planbar [data-save],body.mobile .planbar [data-imp],
body.mobile .planbar [data-share],body.mobile .planbar [data-ppdf],
body.mobile .planbar [data-pcsv],body.mobile .planbar .whotag,
body.mobile .planbar .whobox{display:none}
body.mobile .planadd{width:100%;margin-left:0}
body.mobile .planadd .sharebtn{width:100%;padding:12px}
body.mobile .btools .btool:not([data-badd="link"]):not([data-badd="snap"]){display:none}
body.mobile .btools{gap:6px}
body.mobile .btool{flex:1;padding:11px 6px}
body.mobile .domtabs{width:100%}
body.mobile .domtab{flex:1;padding:10px 4px}
body.mobile .archwrap{grid-template-columns:1fr}
body.mobile .aeports,body.mobile .aegrid{grid-template-columns:1fr}
body.mobile .architems{max-height:320px}

/* blokdiagram på mobil: hele fladen skaleres ned så den kan ses */
body.mobile .canvaswrap{overflow:auto;-webkit-overflow-scrolling:touch}
body.mobile .btools{width:100%;gap:5px}
body.mobile .btool{flex:1 1 30%;text-align:center;padding:10px 4px;font-size:12px}
body.mobile .btabs{width:100%;overflow-x:auto}


/* retningspil – erstatter stregen, når der ikke er plads til den */
.dirmark{display:none;font-size:15px;line-height:1;color:var(--dim);flex:none;width:20px;text-align:center}
body.mobile .dirmark{display:inline-block}
body.mobile .ch .dirmark{color:#555}
body.mobile .feed .dirmark{color:inherit;font-size:17px}
/* Symbolforklaringer ligger i vejen på en telefon – men intercom-paneler skal
   med, for dem har man netop brug for at kunne slå op i, når man står ude. */
body.mobile .fitem.flegend{display:none!important}
body.mobile .fitem.ftext{display:none!important}
body.mobile .fitem.fpanel{position:relative!important;left:auto!important;top:auto!important;
 width:auto!important;max-width:100%;margin:10px 0}
body.mobile .fpanel .pnet{gap:3px 10px}


/* grafisk intercom-panel */
.fpanel{background:#1a1a1a;border:1px solid #3a3a3a;border-radius:7px;padding:0;
 box-shadow:0 2px 8px rgba(0,0,0,.18)}
.fpanel .phead{display:flex;align-items:baseline;gap:9px;padding:8px 11px 7px;background:#242424;
 border-bottom:1px solid #3a3a3a;border-radius:6px 6px 0 0}
.fpanel .pname{font-family:var(--fd);font-weight:700;font-size:13px;letter-spacing:.06em;
 text-transform:uppercase;color:#f2f2f2;cursor:move}
.fpanel .paddr{margin-left:auto;font-family:var(--fm);font-size:10px;color:#9aa4b0;white-space:nowrap}
.fpanel .pkeys{padding:8px;display:flex;flex-direction:column;gap:6px}
.prow2{display:flex;gap:6px}
.pkey{flex:1;min-width:0;background:var(--kc,#2e2e2e);border:1px solid #4a4a4a;border-radius:4px;
 color:#fff;font:11px/1.2 var(--fb);padding:9px 3px 8px;cursor:pointer;height:42px;
 display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.pkey span{display:block;max-height:100%;overflow:hidden;overflow-wrap:anywhere}
.pkey:hover{border-color:#8fb7ff}
.pkedit{width:100%;min-width:0;background:#fff;color:#111;border:1.5px solid #0a5bd3;border-radius:3px;
 padding:2px 4px;font:11px var(--fb);text-align:center}
.pkey.tom{background:#242424;border-style:dashed;border-color:#454545}
.fpanel .pnote{padding:0 11px 9px;font-family:var(--fm);font-size:10px;color:#9aa4b0}
/* redigering */
.pkrow{display:flex;align-items:center;gap:7px;padding:3px 2px}
.pknum{width:22px;text-align:center;font-family:var(--fm);font-size:10px;color:var(--faint)}
.pktxt{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);
 border-radius:6px;padding:7px 8px;font:12.5px var(--fb)}
.pkcol{width:34px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg);
 padding:2px;cursor:pointer}
@media print{
 .fpanel{background:#fff;border-color:#bbb;box-shadow:none}
 .fpanel .phead{background:#f0f0f0;border-color:#ccc}
 .fpanel .pname{color:#111}
 .fpanel .paddr{color:#444}
 .fpanel .pkey{color:#fff}
 .fpanel .pkey.tom{background:#fafafa;border-color:#ccc}
 .fpanel .pnote{color:#444}
}

#side .sub{font-family:var(--fm);font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin:2px 0 14px}
.f{margin-bottom:11px}
.f label{display:block;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.f input,.f select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 8px;font:inherit}
.f input:focus,.f select:focus{outline:none;border-color:var(--dim)}
.btn{display:block;width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:8px;cursor:pointer;margin-bottom:7px}
.btn:hover{border-color:var(--faint)}
.btn.go{border-color:var(--intercom);color:var(--intercom)}
.btn.del{color:var(--video)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.row2 .btn{margin:0}
.hint{color:var(--dim);font-size:12px;line-height:1.65}
.hint kbd{font-family:var(--fm);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:10.5px}
/* Ét symbol pr. linje med god luft – så kan man overskue dem uden at læse. */
.symliste{margin:8px 0 14px}
.symliste>div{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px}
.symliste .ikon{flex:0 0 auto;width:26px;height:24px;display:flex;align-items:center;
 justify-content:center;font-family:var(--fb);font-size:13px;line-height:1;
 color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:5px}
.symliste>div>span:last-child{padding-top:3px}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}

/* eksport-container: usynlig på skærmen, det eneste der printes */
#printroot{display:none}
/* Sideskift lægges FØR hvert ark undtagen det første. Beder man om et skift
   efter det sidste, laver Safari en tom side til sidst. */
.psheet{position:relative;background:#fff;padding:26px 30px 6mm;
 page-break-before:always;break-before:page;page-break-after:auto;break-after:auto}
.psheet:first-child{page-break-before:auto;break-before:auto}
.planprint .pph{font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase;
 color:#333;margin:16px 0 8px;border-bottom:1.5px solid #999;padding-bottom:3px}
.planprint .ppdev{break-inside:avoid;page-break-inside:avoid;margin-bottom:12px;border:1px solid #d4d4d4;border-radius:4px}
.planprint .ppname{font-family:var(--fd);font-weight:700;font-size:14px;background:#eee;padding:5px 9px;color:#222}
.planprint .ppcols{display:grid;grid-template-columns:1fr 1fr}
.planprint .ppcol{padding:6px 9px 8px}
.planprint .ppcol:first-child{border-right:1px solid #e0e0e0}
.planprint .ppt{font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#777;padding-bottom:3px}
.planprint .ppr{display:flex;align-items:center;gap:8px;font-size:11px;line-height:1.7;border-bottom:1px dotted #e2e2e2}
.planprint .ppl{flex:1}
.planprint .ppb{width:14px;text-align:center;color:#555;font-size:10px}
.planprint .ppk{float:right;letter-spacing:.28em;color:#999}
.planprint .ppn{font-family:var(--fm);font-size:10px;color:#888;min-width:22px}
.planprint .ppl{color:#111}
.pfoot{font-family:var(--fm);font-size:8.5px;color:#999;text-align:center;padding-top:6px;border-top:1px solid #e2e2e2;margin-top:10px}

@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  /* tving browseren til at printe baggrundsfarver på boksene */
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  #app,#modal{display:none!important}
  #printroot{display:block!important}
  /* alt interaktivt væk */
  .mini,.add,.drill,.focusbar,.chcount,.grpfoot,.secgone,.rs,.fitools,.boxadd,.endtag.ghost{display:none!important}
  /* sammenklappede grupper foldes altid ud på papir */
  .grp.collapsed .ch{display:flex!important}
  /* Knapperne fylder intet på papir, så lad stregerne løbe helt frem
     til modtagerboksen i stedet for at stoppe midt i luften. */
  .rows{padding-right:2px}
  .ch{margin-right:var(--dxr,0px)}   /* kun kanallinjerne forlænges – gruppenavnet bliver stående */
  .tools{margin-left:0;display:none!important}
  .grp{page-break-inside:avoid;break-inside:avoid}
  .section{page-break-inside:avoid;break-inside:avoid}
  .faded{opacity:.28}
}

<script>
window.onerror=function(m,src,line,col){
  var d=document.createElement('div');
  d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#7f1d1d;color:#fff;'
    +'font:13px/1.5 monospace;padding:14px 18px;white-space:pre-wrap';
  d.textContent='SignalFlow kunne ikke starte:\n'+m+'\nlinje '+line+':'+col
    +'\n\nVis denne tekst til udvikleren.';
  (document.body||document.documentElement).appendChild(d);
};

/* ================= forklaringer =================
   Browserens egen boble kommer langsomt og kan ikke læses ordentligt.
   Den her overtager alle title-tekster og viser dem hurtigt ved musen. */
(function(){
 let box=null, timer=null, cur=null;
 const make=()=>{
  if(box)return box;
  box=document.createElement('div');
  box.id='tipbox';
  document.body.appendChild(box);
  return box;
 };
 const show=(el,x,y)=>{
  const t=el.getAttribute('data-tip'); if(!t)return;
  const b=make();
  b.textContent=t;
  b.style.display='block';
  const r=b.getBoundingClientRect();
  let left=x+14, top=y+18;
  if(left+r.width>innerWidth-8)left=innerWidth-r.width-8;
  if(top+r.height>innerHeight-8)top=y-r.height-12;
  b.style.left=Math.max(8,left)+'px';
  b.style.top=Math.max(8,top)+'px';
 };
 const hide=()=>{clearTimeout(timer); if(box)box.style.display='none'; cur=null};
 document.addEventListener('mouseover',e=>{
  const el=e.target.closest('[title],[data-tip]');
  if(!el){hide();return}
  if(el.hasAttribute('title')){        // flyt teksten væk fra browseren
   el.setAttribute('data-tip',el.getAttribute('title'));
   el.removeAttribute('title');
  }
  if(el===cur)return;
  cur=el; clearTimeout(timer);
  const x=e.clientX, y=e.clientY;
  timer=setTimeout(()=>show(el,x,y),260);
 });
 document.addEventListener('mouseout',e=>{
  if(cur&&!cur.contains(e.relatedTarget))hide();
 });
 document.addEventListener('mousedown',hide);
 document.addEventListener('scroll',hide,true);
 window.addEventListener('blur',hide);
})();

/* ================= model ================= */
const LAYERS={video:'Video',lyd:'Lyd',intercom:'Intercom',net:'Net'};
const COL={video:'#c62828',lyd:'#9a6500',intercom:'#1e7a55',net:'#1e56b0'};
const DOT={video:'#ff5252',lyd:'#ffb648',intercom:'#3fd99c',net:'#5ea3ff'};
const TRANSPORTS=['EPL','Internet','SAT','GC Fiber','Fiber','Trådløs','Kabel','—'];
let seq=1; const id=()=>'x'+(seq++)+Date.now().toString(36).slice(-3);

const newSheet=(title='Nyt ark')=>({id:id(),title,sections:[]});

/* Ældre projekter har sider uden id. Uden id kan to maskiner ikke se, at det
   er den SAMME side – og så kan en rettelse gå tabt ved fletning. Vi giver dem
   et fast id ud fra pladsen, så begge maskiner når frem til det samme. */
function sikrePageIds(liste){
 (liste||[]).forEach((p,i)=>{ if(p&&!p.id)p.id='side'+(i+1) });
 return liste;
}
const newSection=(dst='Modtager',src='Afsender')=>({id:id(),src,dst,groups:[]});
const newGroup=(label='Ny kilde')=>({id:id(),label,feed:'TX 1',layer:'video',transport:'EPL',role:'primær',channels:[],sub:null});

/* ---- flyt en linje op eller ned ved at trække i den ----
   Numrene bliver på deres plads: det er teksten der flytter sig, ligesom når
   man flytter et signal til et andet stik. */
function dragRow(e, grip, rowSel, listeAf, felt, efter){
 e.preventDefault(); e.stopPropagation();
 const row=grip.closest(rowSel);
 const holder=row.parentElement;
 const raekker=[...holder.querySelectorAll(rowSel)];
 const fra=raekker.indexOf(row);
 row.classList.add('rowmoving');
 const mark=document.createElement('div');
 mark.className='rowmark';
 let til=fra;
 const vis=y=>{
  til=raekker.length;
  for(let i=0;i<raekker.length;i++){
   const r=raekker[i].getBoundingClientRect();
   if(y < r.top+r.height/2){til=i;break}
  }
  if(til<raekker.length)holder.insertBefore(mark,raekker[til]);
  else holder.appendChild(mark);
 };
 vis(e.clientY);
 const move=ev=>vis(ev.clientY);
 const up=()=>{
  document.removeEventListener('mousemove',move);
  document.removeEventListener('mouseup',up);
  mark.remove(); row.classList.remove('rowmoving');
  let ny=til>fra?til-1:til;
  if(ny===fra||ny<0)return;
  snap();
  const liste=listeAf();
  const numre=liste.map(x=>x[felt]);        // numrene hører til pladsen
  const [flyt]=liste.splice(fra,1);
  liste.splice(ny,0,flyt);
  liste.forEach((x,i)=>{x[felt]=numre[i]});
  efter();
 };
 document.addEventListener('mousemove',move);
 document.addEventListener('mouseup',up);
}

const newCh=(n)=>({id:id(),nr:'Ch. '+n,label:'',layer:'lyd'});

/* Ryk numrene én op eller ned fra et bestemt sted.
   Vi tæller ikke om fra toppen: mange grupper springer med vilje – fx fra
   Ch. 8 til Ch. 11 – og de spring skal bevares. */
/* Tegningen kalder nummeret "nr", kanalplanen kalder det "n" – derfor feltnavnet.
   Mønsteret tager det SIDSTE tal i teksten, så både "Ch. 3" og "4W2" virker. */
const NRM=/^(.*?)(\d+)(\D*)$/;
function skubNumre(liste,fra,retning,felt){
 const f=felt||'nr';
 for(let i=fra;i<liste.length;i++){
  const m=String(liste[i][f]||'').match(NRM);
  if(!m)continue;                                   // "TBA" og lignende står
  liste[i][f]=m[1]+(parseInt(m[2],10)+retning)+m[3];
 }
}
/* Find det nummer en ny linje skal have på den plads den lægger sig ind på */
function nyttNr(liste,i,felt){
 const f=felt||'nr';
 const efter=liste[i];
 const m=efter&&String(efter[f]||'').match(NRM);
 if(m)return m[1]+parseInt(m[2],10)+m[3];
 const foer=liste[i-1];
 const m2=foer&&String(foer[f]||'').match(NRM);
 if(m2)return m2[1]+(parseInt(m2[2],10)+1)+m2[3];
 return '';
}

/* helt tomt projekt */
function blank(){
 const s=newSheet('Nyt projekt');
 const sec=newSection('MCR / Afv. A','Remote 2');
 const g=newGroup('Kilde 1');
 g.channels=[newCh(1),newCh(2)];
 sec.groups.push(g); s.sections.push(sec);
 return s;
}


/* Ingen produktionsdata ligger i filen. Alt hentes fra databasen efter login,
   så hverken tegninger, kanalplaner eller bemanding kan læses af udenforstående. */
function oslo(){return [blank()]}

let projectName='Nyt projekt';
let pages=oslo();
let activePage=0;
let doc=pages[activePage];
let path=[];                       // [{group}] for drill-down – lokal til den aktive side
let sel=null;                      // {t:'grp'|'sec', id}
let on=new Set(['video','lyd','intercom','net']);
let backupOn=true;
let undoStack=[];
let focus=null;                    // {t:'sec'|'grp', id} – vis kun én ting

/* Den "sheet" der vises: enten sidens rod, eller (drillet ind) en gruppes underark.
   Titlen på en underside er ALTID gruppens eget navn – ét sted at rette den. */
const sheet=()=> path.length? path[path.length-1].sub : doc;
const sheetTitle=()=> path.length? path[path.length-1].label : doc.title;
function setSheetTitle(v){ if(path.length) path[path.length-1].label=v; else doc.title=v; }

let sidenRettet=null, blokRettet=null;
function snap(){
 /* Sikkerhedsnet: alle ændringer af arket går gennem snap(). Er arket låst,
    stopper vi handlingen her – også ad veje, låsen ellers ikke kender. */
 if(!laasUndtagelse && view==='flow' && typeof arkLaast==='function' && arkLaast()){
  if(typeof laasBesked==='function') laasBesked();
  throw new Error('Arket er låst');
 }
 sidenRettet=activePage; blokRettet=(view==='blocks')?blockPage:null; undoStack.push(JSON.stringify({pages,plan:plan,blocks:blocks,activePage,path:path.map(p=>p.id)}));if(undoStack.length>60)undoStack.shift();document.getElementById('bUndo').disabled=false}
function undo(){
 if(!undoStack.length)return;
 const st=JSON.parse(undoStack.pop());
 pages=st.pages; if(st.plan)plan=st.plan; if(st.blocks)blocks=st.blocks; activePage=st.activePage; doc=pages[activePage];
 path=[]; let sh=doc;
 st.path.forEach(gid=>{for(const sc of sh.sections){const g=sc.groups.find(x=>x.id===gid);if(g&&g.sub){path.push(g);sh=g.sub;break}}});
 sel=null; focus=null; document.getElementById('bUndo').disabled=!undoStack.length;
 if(view==='plan')drawPlan(); else draw();
}
function findGrp(gid){for(const sc of sheet().sections){const g=sc.groups.find(x=>x.id===gid);if(g)return[g,sc]}return[null,null]}

/* ---- sider (faner) ---- */
function addPage(){snap();pages.push(newSheet('Ny side '+(pages.length+1)));switchPage(pages.length-1)}
function switchPage(i){activePage=i;doc=pages[i];path=[];sel=null;focus=null;draw()}
function delPage(i){
 if(pages.length<=1)return;
 if(!confirm('Slet siden "'+pages[i].title+'"? Det kan ikke fortrydes.'))return;
 snap();pages.splice(i,1);
 if(activePage>=pages.length)activePage=pages.length-1;
 doc=pages[activePage];path=[];sel=null;draw();
}

/* ================= tegn ================= */
const el=document.getElementById('sheet');
const esc=s=>String(s===null||s===undefined?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const vis=(layer,role)=> on.has(layer)&&(backupOn||role!=='backup');

/* stil-hjælpere: alt er valgfrit, tomt = standardudseende */
const SS=sc=>sc.style||(sc.style={});

/* Luften mellem boks og signaler kommer af, at man har trukket i boksens
   inderkant. En smule luft kan være tilsigtet – men et stort spring er
   næsten altid et fejlgreb. Derfor rydder programmet selv op i det. */
const MAXLUFT=120;
function ryddLuft(sider){
 let rettet=0;
 (sider||pages||[]).forEach(sh=>{
  const gennemgå=ark=>{
   (ark.sections||[]).forEach(sc=>{
    const st=sc.style; if(!st)return;
    if(+st.srcDX>MAXLUFT){st.srcDX=0;rettet++}
    if(+st.dstDX>MAXLUFT){st.dstDX=0;rettet++}
    (sc.groups||[]).forEach(g=>{ if(g.sub)gennemgå(g.sub) });   // også underark
   });
  };
  gennemgå(sh);
 });
 return rettet;
}
const GS=g=>g.style||(g.style={});
const px=(v,d)=>(v==null||v==='')?d:v;

function draw(keepSide){
 if(editing&&editing.inp&&!editing.inp.isConnected)editing=null;  // feltet blev fjernet ved sidste tegning
 /* Et låst ark vises uden redigeringsknapper og med et banner øverst */
 const laastNu = typeof arkLaast==='function' && arkLaast();
 document.body.classList.toggle('arklaast', !!laastNu && view==='flow');
 const lb=document.getElementById('laasbanner');
 if(lb){
  lb.innerHTML = laastNu
   ? '🔒 <b>'+esc(laasTekst(pages[activePage]))+'</b> · arket kan ikke rettes. Klik på hængelåsen for at låse op.'
   : '';
  lb.classList.toggle('on', !!laastNu);
 }
 if(laastNu){ editing=null; }
 const sh=sheet(); const title=sheetTitle();
 let h=`<div class="sheettitle" data-e="title">${esc(title)}</div>
        <div class="sheetsub">${path.length?'Underark · '+path.map(p=>esc(p.label)).join(' › '):'Signalflow'}</div>`;

 if(focus){
  const what = focus.t==='sec'
    ? (sh.sections.find(s=>s.id===focus.id)||{}).dst
    : (findGrp(focus.id)[0]||{}).label;
  h+=`<div class="focusbar">Viser kun <b>${esc(what||'')}</b> · resten er skjult
       <button class="add" data-unfocus="1" title="Vis alle sektioner igen">vis hele arket</button></div>`;
 }

 if(!sh.sections.length){
  h+=`<div class="empty">Tomt ark.<br><button class="add" data-addsec="1" title="Ny sektion: en afsender, et spor med signaler og en modtager">+ tilføj sektion</button></div>`;
 }

 sh.sections.forEach(sc=>{
  if(focus&&focus.t==='sec'&&focus.id!==sc.id)return;
  if(focus&&focus.t==='grp'&&!sc.groups.some(g=>g.id===focus.id))return;

  const st=SS(sc);
  const anyVis=!sc.groups.length||sc.groups.some(g=>vis(g.layer,g.role));
  if(!anyVis){h+=`<div class="secgone" data-sec="${sc.id}">${esc(sc.src)} → ${esc(sc.dst)} · ${sc.groups.length} linjer skjult af filter</div>`;return}

  const srcS=`background:${px(st.srcBg,'#e9c440')};border-color:${px(st.srcBd,'#bd9a2c')};color:${px(st.srcFg,'#2b2417')};margin-right:${px(st.srcDX,0)}px;min-height:${px(st.srcH,0)}px`;
  const dstS=`background:${px(st.dstBg,'#6d8764')};border-color:${px(st.dstBd,'#4c6245')};color:${px(st.dstFg,'#f3f7f1')};margin-left:${px(st.dstDX,0)}px;min-height:${px(st.dstH,0)}px`;
  const nameS=`font-size:${px(st.boxSize,16)}px`;
  const gridS=`grid-template-columns:${px(st.srcW,190)}px 1fr ${px(st.dstW,210)}px`;

  const lines=(arr,side)=>(arr||[]).map(l=>
    `<div class="boxline" data-e="${side}line" data-id="${sc.id}|${l.id}">${esc(l.t||'…')}</div>`).join('');
  const held=side=>(sh.items||[]).filter(i=>i.anchor&&i.anchor.sec===sc.id&&i.anchor.side===side)
    .map(i=>itemHTML(i)).join('');

  h+=`<div class="section" data-sec="${sc.id}" style="${gridS}">

/* Lad afsender-/modtagerbokse vokse, så de altid omslutter de bokse der er låst i dem.
   Kaldes efter hver tegning, så også print og eksport får de rigtige højder med. */
function fitBoxes(){
 el.querySelectorAll('.srcbox,.dstbox,.rows').forEach(c=>{
  let need=0;
  c.querySelectorAll(':scope > .fitem').forEach(n=>{
   need=Math.max(need, n.offsetTop + n.offsetHeight);
  });
  if(!need)return;
  const cur=parseFloat(c.style.minHeight)||0;
  c.style.minHeight=Math.max(cur, need+12)+'px';
 });
}


/* ---- flyt faner ved at trække i dem ----
   Man skal kunne klikke på en fane uden at flytte den, derfor går den først
   i træk-tilstand, når musen har bevæget sig et stykke. */
let faneFlyttet=false;
function dragTab(e, tab, tabSel, listeAf, aktivIndex, saetAktiv, efter){
 if(e.button!==0)return;
 const holder=tab.parentElement;
 const start=e.clientX;
 let aktiv=false, til=-1, mark=null;
 const faner=()=>[...holder.querySelectorAll(tabSel)];
 const vis=x=>{
  const f=faner().filter(t=>t!==tab);
  til=f.length;
  for(let i=0;i<f.length;i++){
   const r=f[i].getBoundingClientRect();
   if(x < r.left+r.width/2){til=i;break}
  }
  if(!mark){mark=document.createElement('div');mark.className='tabmark'}
  if(til<f.length)holder.insertBefore(mark,f[til]); else holder.insertBefore(mark,tab.nextSibling);
 };
 const move=ev=>{
  if(!aktiv){
   if(Math.abs(ev.clientX-start)<5)return;        // stadig et klik
   aktiv=true; faneFlyttet=true; tab.classList.add('tabmoving');
  }
  ev.preventDefault(); vis(ev.clientX);
 };
 const up=ev=>{
  document.removeEventListener('mousemove',move);
  document.removeEventListener('mouseup',up);
  if(mark)mark.remove();
  tab.classList.remove('tabmoving');
  if(!aktiv){faneFlyttet=false;return}
  const liste=listeAf();
  const fra=[...holder.querySelectorAll(tabSel)].indexOf(tab);
  if(fra<0||til<0||til===fra){faneFlyttet=false;efter();return}
  snap();
  const aktivSide=liste[aktivIndex()];            // husk hvilken side der er åben
  const [flyt]=liste.splice(fra,1);
  liste.splice(til,0,flyt);
  saetAktiv(Math.max(0,liste.indexOf(aktivSide)));
  efter();
  setTimeout(()=>{faneFlyttet=false},50);
 };
 document.addEventListener('mousemove',move);
 document.addEventListener('mouseup',up);
}

function renderTabs(){
 const tb=document.getElementById('tabbar');
 let h=pages.map((p,i)=>`<div class="tab ${i===activePage?'on':''}" data-tab="${i}">
   ${p.laast?`<span class="tlaas" title="${esc(laasTekst(p))}">🔒</span>`:''}
   <span class="tname" data-tabname="${i}" title="${p.laast?esc(laasTekst(p))+' · klik for at skifte side':'Klik for at skifte side · klik igen for at omdøbe · træk for at flytte fanen'}">${esc(p.title)}</span>
   ${pages.length>1&&!p.laast?`<button class="tx" data-tabdel="${i}" title="Slet side">✕</button>`:''}
 </div>`).join('');
 h+=`<button class="tabadd" data-tabadd="1" title="Tilføj en ny side til tegningen">+</button>`;
 const pa=pages[activePage]||{};
 h+=`<button class="laasknap ${pa.laast?'laast':''}" data-laas="1"
      title="${pa.laast?esc(laasTekst(pa))+' – klik for at låse op':'Lås arket, så det ikke kan rettes ved et uheld'}">
      ${pa.laast?'🔒 Låst':'🔓 Lås arket'}</button>`;
 tb.innerHTML=h;
 tb.querySelector('[data-tabadd]').onclick=addPage;
 tb.querySelector('[data-laas]').onclick=skiftLaas;
 tb.querySelectorAll('[data-tab]').forEach(t=>t.addEventListener('mousedown',ev=>{
   if(ev.target.closest('[data-tabdel]'))return;
   dragTab(ev,t,'[data-tab]',()=>pages,()=>activePage,i=>{activePage=i;doc=pages[i]},
     ()=>{path=[];sel=null;focus=null;draw()});
 }));
}

/* tab bar event delegation */
document.getElementById('tabbar').addEventListener('click',ev=>{
 if(faneFlyttet){faneFlyttet=false;return}
 const tab=ev.target.closest('[data-tab]');
 const del=ev.target.closest('[data-tabdel]');
 let nm=ev.target.closest('[data-tabname]');
 /* et låst ark må ikke omdøbes – et klik skifter bare side */
 if(nm && arkLaast(+nm.dataset.tabname)) nm=null;
 
 if(del){ev.preventDefault();delPage(+del.dataset.tabdel);return}
 // klik på tab-navn: rediger hvis active, ellers switch
 if(nm){
   const i=+nm.dataset.tabname;
   if(i===activePage){ev.preventDefault();editTabName(nm,i);return}
   // else fall through to tab switch
 }
 if(tab){ev.preventDefault();switchPage(+tab.dataset.tab)}
});

function editTabName(node,i){
 const inp=document.createElement('input');
 inp.className='tabedit'; inp.value=pages[i].title;
 node.replaceWith(inp); inp.focus(); inp.select();
 const done=save=>{if(save){snap();pages[i].title=inp.value||'Side '+(i+1)}draw()};
 inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();done(true)}if(e.key==='Escape'){e.preventDefault();done(false)}e.stopPropagation()};
 inp.onblur=()=>done(true);
}

/* tegn arket, men lad højrepanelet stå urørt (bevarer markør og indtastning) */
function drawKeep(){draw(true)}

/* tekstfelt i højrepanelet: ét undo-snapshot pr. indtastning, ikke pr. bogstav */
function bindText(inp,apply){
 let fresh=true;
 inp.onfocus=()=>{fresh=true};
 inp.oninput=e=>{if(fresh){snap();fresh=false}apply(e.target.value);drawKeep()};
}

/* ================= modalvinduer ================= */
const mEl=document.getElementById('modal');
function closeModal(){mEl.classList.remove('on');mEl.innerHTML=''}
function openModal(title,sub,body,onMount){
 mEl.innerHTML=`<div class="mbox"><h3>${esc(title)}</h3><div class="msub">${esc(sub)}</div>${body}</div>`;
 mEl.classList.add('on');
 if(onMount)onMount(mEl);
 const first=mEl.querySelector('input,select');if(first)first.focus();
}
/* Vinduet må KUN lukke, når man både trykker og slipper på den mørke baggrund.
   Ellers lukker det, når man markerer tekst i et felt og kommer til at slippe
   musen uden for vinduet – og så var arbejdet tabt. */
let trykStartedeUdenfor=false;
/* Hvor startede museklikket? Bruges til at kende forskel på et rigtigt klik
   og et træk, der bare endte et andet sted – fx når man markerer tekst. */
let trykStart=null;
document.addEventListener('mousedown',e=>{trykStart=e.target},true);
mEl.addEventListener('mousedown',ev=>{trykStartedeUdenfor = ev.target===mEl});
mEl.addEventListener('click',ev=>{
 if(ev.target===mEl && trykStartedeUdenfor && mEl.dataset.locked!=='1')closeModal();
 trykStartedeUdenfor=false;
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&mEl.classList.contains('on')&&mEl.dataset.locked!=='1'){closeModal()}},true);

function colorField(label,name,val,pal){

/* gør en hex-farve mørkere/lysere */
function shade(hex,amt){
 const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||'');
 if(!m)return hex;
 const f=n=>Math.max(0,Math.min(255,parseInt(n,16)+amt)).toString(16).padStart(2,'0');
 return '#'+f(m[1])+f(m[2])+f(m[3]);
}

/* ---- kopiering ---- */
function reId(sh){sh.sections.forEach(s=>{s.id=id();s.groups.forEach(g=>{g.id=id();g.channels.forEach(c=>c.id=id());if(g.sub)reId(g.sub)})})}
function cloneGroup(g){const c=JSON.parse(JSON.stringify(g));c.id=id();c.channels.forEach(ch=>ch.id=id());if(c.sub)reId(c.sub);return c}
function cloneSection(sc){const c=JSON.parse(JSON.stringify(sc));c.id=id();c.groups=c.groups.map(g=>cloneGroup(g));return c}

/* alle sektioner på tværs af sider, til målvælgeren */
function allSectionTargets(){
 const out=[];
 pages.forEach((p,pi)=>p.sections.forEach(sc=>out.push({pi,sc,label:p.title+' › '+sc.src+' → '+sc.dst})));

}
function allGroupTargets(){

 return out;
}

  </div>`,root=>{
   root.querySelector('[data-cancel]').onclick=closeModal;

/* ================= blokdiagram =================
   Kasser (fx Studie, TV Compound), udstyr og stik indeni, streger imellem,
   plus frie tekster og overskrifter. Tænkt til at forklare et setup for en
   kollega der ikke kender opsætningen – derfor billeder og tydelige numre. */
let blocks=null, blockPage=0, linkFrom=null, blockTool=null;
/* Gitter og hjælpelinjer, så kasser og symboler kan stilles lige op. */
let snapOn=true;
const GRID=10;
const snapTo=v=>snapOn?Math.round(v/GRID)*GRID:Math.round(v);

function ago(ms){
 if(!ms)return '';
 const s=Math.round((Date.now()-ms)/1000);
 if(s<60)return 'lige nu';
 if(s<3600)return Math.round(s/60)+' min siden';
 if(s<86400)return Math.round(s/3600)+' t siden';
 return new Date(ms).toLocaleDateString('da-DK',{day:'2-digit',month:'2-digit'});
}

/* stregerne tegnes ovenpå, ud fra hvor kasserne faktisk står */
function drawLinks(){
 const svg=document.getElementById('blinks');
 const wrap=document.getElementById('bcanvas');
 if(!svg||!wrap)return;
 const wr=wrap.getBoundingClientRect();
 const pos=nid=>{
  const e=wrap.querySelector('[data-bn="'+CSS.escape(nid)+'"]');
  if(!e)return null;
  const r=e.getBoundingClientRect();
  return {x:r.left-wr.left+r.width/2, y:r.top-wr.top+r.height/2,
          w:r.width, h:r.height, l:r.left-wr.left, t:r.top-wr.top};
 };
 /* mødepunkt på kanten, så stregen ikke går ind over kassen */
 const edge=(a,b)=>{
  const dx=b.x-a.x, dy=b.y-a.y;
  if(!dx&&!dy)return {x:a.x,y:a.y};
  const sx=dx?(a.w/2)/Math.abs(dx):Infinity, sy=dy?(a.h/2)/Math.abs(dy):Infinity;
  const s=Math.min(sx,sy);
  return {x:a.x+dx*s, y:a.y+dy*s};
 };
 let out=`<defs>${Object.keys(LINKSTYLE).map(k=>
   `<marker id="ar-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="${LINKSTYLE[k].c}"/></marker>
    <marker id="ars-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="${LINKSTYLE[k].c}"/></marker>`).join('')}</defs>`;
 bp().links.forEach(L=>{
  const a=pos(L.from), b=pos(L.to);
  if(!a||!b)return;
  const st=LINKSTYLE[L.style]||LINKSTYLE.fiber;
  const p1=edge(a,b), p2=edge(b,a);
  const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
  out+=`<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}"
     stroke="${st.c}" stroke-width="2.4" ${L.dash?'stroke-dasharray="7 5"':''}
     marker-end="url(#ar-${L.style||'fiber'})" ${L.both?`marker-start="url(#ars-${L.style||'fiber'})"`:''}
     class="blink" data-bl="${L.id}"/>`;
  if(L.label)out+=`<g class="bllabel" data-bl="${L.id}">
     <rect x="${mx-L.label.length*3.6-7}" y="${my-11}" width="${L.label.length*7.2+14}" height="21" rx="5"
       fill="#0b0e13" stroke="${st.c}" stroke-width="1"/>
     <text x="${mx}" y="${my+4}" text-anchor="middle" fill="#e9eef5" font-size="11.5">${esc(L.label)}</text></g>`;
 });
 svg.innerHTML=out;
 svg.querySelectorAll('[data-bl]').forEach(n=>n.onclick=e=>{e.stopPropagation();editLink(n.dataset.bl)});
}



/* ---- hjælpelinjer: vis når det man trækker flugter med noget andet ---- */
function showGuides(card,canvas,vaelg){
 clearGuides(canvas);
 const r=card.getBoundingClientRect(), wr=canvas.getBoundingClientRect();
 const me={l:r.left-wr.left, r:r.right-wr.left, cx:r.left-wr.left+r.width/2,
           t:r.top-wr.top, b:r.bottom-wr.top, cy:r.top-wr.top+r.height/2};
 const T=8;                                   // hvor tæt på det skal være
 let snapX=null, snapY=null;
 canvas.querySelectorAll(vaelg||'.bnode').forEach(o=>{
  if(o===card||card.contains(o))return;
  const q=o.getBoundingClientRect();
  const it={l:q.left-wr.left, r:q.right-wr.left, cx:q.left-wr.left+q.width/2,
            t:q.top-wr.top, b:q.bottom-wr.top, cy:q.top-wr.top+q.height/2};
  [['l','l'],['l','r'],['r','l'],['r','r'],['cx','cx']].forEach(([a,b])=>{
   if(Math.abs(me[a]-it[b])<=T){ guide(canvas,'v',it[b]); if(snapX===null)snapX=it[b]-(me[a]-me.l) }
  });
  [['t','t'],['t','b'],['b','t'],['b','b'],['cy','cy']].forEach(([a,b])=>{
   if(Math.abs(me[a]-it[b])<=T){ guide(canvas,'h',it[b]); if(snapY===null)snapY=it[b]-(me[a]-me.t) }
  });
 });
 return {x:snapX,y:snapY};
}
function guide(canvas,retning,pos){
 const d=document.createElement('div');
 d.className='guide '+retning;
 if(retning==='v')d.style.left=pos+'px'; else d.style.top=pos+'px';
 canvas.appendChild(d);
}

    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();done(true)}
                      if(e.key==='Escape'){e.preventDefault();done(false)}e.stopPropagation()};
    inp.onblur=()=>done(true);
    return;
   }
   blockPage=i;linkFrom=null;drawBlocks();
 });
 const bd=el2.querySelector('[data-bpdel]');
 if(bd)bd.onclick=()=>{

 const pa=el2.querySelector('[data-bpadd]');

 el2.querySelectorAll('[data-badd]').forEach(b=>b.onclick=()=>{

 el2.querySelectorAll('[data-bdel]').forEach(b=>b.onclick=e=>{e.stopPropagation();

 el2.querySelectorAll('[data-bdup]').forEach(b=>b.onclick=e=>{e.stopPropagation();

 /* dobbeltklik-fri redigering: klik direkte på teksten */
 el2.querySelectorAll('[data-btext]').forEach(t=>t.onclick=e=>{

 });
 el2.querySelectorAll('[data-brs]').forEach(hn=>hn.addEventListener('mousedown',e=>{
  e.preventDefault(); e.stopPropagation();
  const n=bnode(hn.dataset.brs);
  const r=hn.parentElement.getBoundingClientRect();
  bresize={n:n,el:hn.parentElement,x0:e.clientX,y0:e.clientY,w0:r.width,h0:r.height};
  snap(); document.body.style.userSelect='none';
 }));
 if(canvas)canvas.onclick=e=>{if(e.target===canvas&&blockTool==='link'){linkFrom=null;drawBlocks()}};

let bdrag=null, bresize=null;
document.addEventListener('mousemove',e=>{
 if(bdrag){
  const wrap=document.getElementById('bcanvas');
  const host=bdrag.n.parent?wrap.querySelector('[data-bn="'+CSS.escape(bdrag.n.parent)+'"]'):wrap;
  const hr=host.getBoundingClientRect();
  const rx=Math.max(0,e.clientX-bdrag.gx-hr.left), ry=Math.max(0,e.clientY-bdrag.gy-hr.top);
  bdrag.el.style.left=rx+'px'; bdrag.el.style.top=ry+'px';
  /* flugter den med noget? så vis en linje – en flugt vinder over gitteret */
  const s2=snapOn?showGuides(bdrag.el,wrap):{x:null,y:null};
  if(snapOn){
   bdrag.el.style.left=Math.max(0,Math.round(s2.x!==null?s2.x:Math.round(rx/GRID)*GRID))+'px';
   bdrag.el.style.top =Math.max(0,Math.round(s2.y!==null?s2.y:Math.round(ry/GRID)*GRID))+'px';
  }
  drawLinks();
 } else if(bresize){
  bresize.el.style.width=Math.max(120,snapTo(bresize.w0+(e.clientX-bresize.x0)))+'px';
  bresize.el.style.height=Math.max(90,snapTo(bresize.h0+(e.clientY-bresize.y0)))+'px';
  showGuides(bresize.el,document.getElementById('bcanvas'));
  drawLinks();
 }
});
document.addEventListener('mouseup',e=>{
 if(bdrag){
  const n=bdrag.n, el3=bdrag.el;
  el3.classList.remove('bdragging');
  clearGuides(document.getElementById('bcanvas'));
  n.x=parseFloat(el3.style.left)||0; n.y=parseFloat(el3.style.top)||0;
  /* slippes udstyret oven i en kasse, hører det til den kasse */
  if(n.t!=='box'){
   const wrap=document.getElementById('bcanvas');
   const r=el3.getBoundingClientRect();
   let target=null;
   bp().nodes.filter(b=>b.t==='box').forEach(b=>{
    const be=wrap.querySelector('[data-bn="'+CSS.escape(b.id)+'"]');
    if(!be)return;
    const br=be.getBoundingClientRect();
    if(r.left+14>br.left&&r.left+14<br.right&&r.top+10>br.top&&r.top+10<br.bottom)target=b.id;
   });
   if(target!==(n.parent||null)){
    const wr=wrap.getBoundingClientRect();
    if(target){
     const be=wrap.querySelector('[data-bn="'+CSS.escape(target)+'"]').getBoundingClientRect();
     n.parent=target; n.x=Math.max(6,r.left-be.left); n.y=Math.max(30,r.top-be.top);
    }else{ delete n.parent; n.x=Math.max(0,r.left-wr.left); n.y=Math.max(0,r.top-wr.top) }
   }
  }
  bdrag=null; document.body.style.userSelect=''; drawBlocks();
 } else if(bresize){
  clearGuides(document.getElementById('bcanvas'));
  bresize.n.w=parseFloat(bresize.el.style.width)||bresize.n.w;
  bresize.n.h=parseFloat(bresize.el.style.height)||bresize.n.h;
  bresize=null; document.body.style.userSelect=''; drawBlocks();
 }
});




/* ================= symboler =================
   Tegneværktøj til blokdiagrammet – ikke lagervarer. De indbyggede ligger i
   programmet, og dine egne gemmes i projektet, så kollegerne ser dem også. */
function ownSyms(){ const b=ensureBlocks(); b.imgs=b.imgs||{}; return b.imgs }

function openSymbols(){
 const own=ownSyms();
 openModal('Symboler','Til blokdiagrammet – klik for at sætte ind',`
  <div class="dropzone" id="symdrop">
    <div class="dzicon">＋</div>
    <div class="dztxt"><b>Træk et billede herind</b><span>eller klik for at vælge en fil</span></div>
    <input type="file" id="symfile" accept="image/*" hidden>
  </div>
  <div id="symnew"></div>

  ${Object.keys(own).length?`
   <div class="msec">Dine symboler</div>
   <div class="picks">
    ${Object.keys(own).map(k=>`<button class="pick" data-own="${k}">
       <img src="${own[k].src}"><span>${esc(own[k].n)}</span>
       <b class="mini" data-rmsym="${k}" title="Fjern fra symbolerne">✕</b></button>`).join('')}
   </div>`:''}

  <div class="msec">Stik</div>
  <div class="picks">
   ${Object.keys(IMGLIB).map(k=>`<button class="pick" data-img="${k}">
      <img src="${IMGLIB[k].src}"><span>${esc(IMGLIB[k].n)}</span></button>`).join('')}
  </div>

  <div class="msec">Tegnede symboler</div>
  <div class="picks sym">
   ${Object.keys(SYMLIB).map(k=>`<button class="pick" data-sym="${k}">
      <span class="bsym">${SYMLIB[k]}</span><span>${k}</span></button>`).join('')}
  </div>

  <div class="mrow"><button class="btn" data-cancel="1">Luk</button></div>`,root=>{
   root.querySelector('[data-cancel]').onclick=closeModal;
   root.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>{
     addItem('img',b.dataset.img,IMGLIB[b.dataset.img].n); closeModal()});
   root.querySelectorAll('[data-sym]').forEach(b=>b.onclick=()=>{
     addItem('sym',b.dataset.sym,b.dataset.sym.charAt(0).toUpperCase()+b.dataset.sym.slice(1)); closeModal()});
   root.querySelectorAll('[data-own]').forEach(b=>b.onclick=e=>{
     if(e.target.dataset.rmsym)return;
     const k=b.dataset.own; addItem('own',own[k].src,own[k].n); closeModal()});
   root.querySelectorAll('[data-rmsym]').forEach(b=>b.onclick=e=>{
     e.stopPropagation();
     if(!confirm('Fjern symbolet fra projektet?'))return;
     snap(); delete ownSyms()[b.dataset.rmsym]; closeModal(); openSymbols();
   });

   /* træk et billede ind, giv det et navn, og det ligger i symbolerne */
   const dz=root.querySelector('#symdrop'), fi=root.querySelector('#symfile');
   const box=root.querySelector('#symnew');
   const tag=src=>{
    box.innerHTML=`<div class="symnew">
      <img src="${src}">
      <input type="text" id="symname" placeholder="Hvad hedder symbolet?" autocomplete="off">
      <button class="btn go" id="symsave" style="width:auto;margin:0">Gem symbol</button>
      <button class="btn" id="symdrop2" style="width:auto;margin:0">Fortryd</button>
    </div>`;
    const nm=box.querySelector('#symname'); nm.focus();
    const gem=()=>{
     const n=nm.value.trim(); if(!n){nm.focus();return}
     snap();
     const k=id(); ownSyms()[k]={n:n,src:src};
     autosave(); closeModal(); openSymbols();
    };
    box.querySelector('#symsave').onclick=gem;
    nm.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();gem()}};
    box.querySelector('#symdrop2').onclick=()=>{box.innerHTML=''};
   };
   dz.onclick=()=>fi.click();
   fi.onchange=()=>{const f=fi.files[0]; if(f)readImage(f,tag)};
   ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{
     e.preventDefault(); e.stopPropagation(); dz.classList.add('over')}));
   ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{
     e.preventDefault(); e.stopPropagation(); dz.classList.remove('over')}));
   dz.addEventListener('drop',e=>{
     const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
     if(f&&/^image\//.test(f.type))readImage(f,tag);
   });
 });
}

/* ---- importér mellem kanalplan og blokdiagram ----
   target='blocks': hent det der står i kanalplanen ind på diagrammet.
   target='plan'  : hent det der står på diagrammet ind i kanalplanen. */
function importItems(target){
 const tilBlok=target!=='plan';
 const kilder=[];
 if(tilBlok){
  Object.keys(PLANDOMS).forEach(k=>alive((ensurePlan()[k]||{}).devices||[]).forEach(d=>{
   kilder.push({key:'p:'+k+':'+d.id, name:d.name,
     sub:PLANDOMS[k]+(d.place?' · '+d.place:'')+' · '+alive(d.ins).length+'/'+alive(d.outs).length});
  }));
 }else{
  (ensureBlocks().pages||[]).forEach((pg,pi)=>(pg.nodes||[]).filter(n=>n.t==='item').forEach(n=>{
   kilder.push({key:'b:'+pi+':'+n.id, name:n.label, sub:pg.title, img:n.src||null});
  }));
 }
 openModal('Importér udstyr',
   tilBlok?'Fra kanalplanen og arkivet':'Fra blokdiagrammet og arkivet',`
  <div class="mf"><input type="text" name="impq" placeholder="Søg i udstyr …" autocomplete="off"></div>
  <div class="msec">${tilBlok?'Brugt i kanalplanen':'Står på blokdiagrammet'}</div>
  <div id="impSrc" class="chklist" style="max-height:180px">
   ${kilder.length?kilder.map(r=>`<label class="chk">
     <input type="checkbox" data-imp="${r.key}">
     ${r.img?`<img src="${r.img}" style="width:26px;height:20px;object-fit:contain">`:''}
     <b>${esc(r.name||'(uden navn)')}</b>
     <span style="margin-left:auto;font-family:var(--fm);font-size:9.5px;color:var(--faint)">${esc(r.sub||'')}</span>
    </label>`).join('')
    :`<div class="msub" style="padding:9px;text-transform:none;letter-spacing:0">Der er ikke noget at hente ${tilBlok?'i kanalplanen':'på blokdiagrammet'} endnu.</div>`}
  </div>
  <div class="msec">Arkivet</div>
  <div id="impArch" class="chklist" style="max-height:180px">Henter …</div>
  <div class="mrow">
    <button class="btn go" data-ok="1">Importér</button>
    <button class="btn" data-cancel="1">Annullér</button>
  </div>`,root=>{
   let arch=[];
   lagerList().then(r=>{
    arch=r||[];
    const box=root.querySelector('#impArch');
    box.innerHTML=arch.length?arch.map(r2=>`<label class="chk">
      <input type="checkbox" data-imp="a:${r2.id}">
      ${r2.img?`<img src="${r2.img}" style="width:26px;height:20px;object-fit:contain">`:''}
      <b>${esc(r2.name)}</b>
      <span style="margin-left:auto;font-family:var(--fm);font-size:9.5px;color:var(--faint)">
        ${esc(PLANDOMS[r2.domain]||r2.domain||'')}</span></label>`).join('')
     :'<div class="msub" style="padding:9px;text-transform:none;letter-spacing:0">Arkivet er tomt.</div>';
    filtrer();
   }).catch(e=>{root.querySelector('#impArch').innerHTML=
     '<div class="msub" style="padding:9px;color:var(--video)">'+esc(e.message)+'</div>'});

   /* søg i begge lister på én gang */
   const soeg=root.querySelector('[name="impq"]');
   const filtrer=()=>{
    const q=(soeg.value||'').toLowerCase();
    let synligeA=0, synligeB=0;
    root.querySelectorAll('#impSrc .chk, #impArch .chk').forEach(l=>{
     const t=l.textContent.toLowerCase();
     const vis=!q||t.includes(q);
     l.style.display=vis?'':'none';
     if(vis){ if(l.closest('#impSrc'))synligeA++; else synligeB++ }
    });
    const tom=(boks,n)=>{
     const b2=root.querySelector(boks); if(!b2)return;
     let m=b2.querySelector('.intet');
     if(!n&&q){ if(!m){m=document.createElement('div');m.className='msub intet';
       m.style.cssText='padding:9px;text-transform:none;letter-spacing:0';
       m.textContent='Ingen match.';b2.appendChild(m)} }
     else if(m)m.remove();
    };
    tom('#impSrc',synligeA); tom('#impArch',synligeB);
   };
   soeg.oninput=filtrer;
   setTimeout(()=>soeg.focus(),120);

   root.querySelector('[data-cancel]').onclick=closeModal;
   root.querySelector('[data-ok]').onclick=()=>{
    const picked=[...root.querySelectorAll('[data-imp]:checked')].map(c=>c.dataset.imp);
    if(!picked.length)return closeModal();
    snap();
    picked.forEach(k=>{
     const arkiv = k.startsWith('a:') ? arch.find(x=>x.id===k.slice(2)) : null;
     if(tilBlok){
      /* ind på diagrammet som en kasse med billede eller symbol */
      let navn='Udstyr', img=null;
      if(arkiv){navn=arkiv.name; img=arkiv.img}
      else{
       const [,dm,did]=k.split(':');
       const d=((ensurePlan()[dm]||{}).devices||[]).find(x=>x.id===did);
       if(!d)return; navn=d.name;
      }
      const s0=freeSpot(130,120);
      const n={id:id(),t:'item',x:s0.x,y:s0.y,w:120,label:navn};
      if(img)n.src=img; else n.sym='rack';
      if(lastBox){n.parent=lastBox;n.x=18;n.y=46+bp().nodes.filter(x=>x.parent===lastBox).length*126}
      bp().nodes.push(n);
     }else{
      /* ind i kanalplanen som et kort */
      if(arkiv){dom().devices.push(lagerToDevice(arkiv));return}
      const [,pi,nid]=k.split(':');
      const pg=(ensureBlocks().pages||[])[+pi];
      const n=pg&&(pg.nodes||[]).find(x=>x.id===nid);
      if(!n)return;
      dom().devices.push({id:id(),type:n.label,name:n.label||'Udstyr',place:pg.title||'',mt:Date.now(),
        ins:[{id:id(),n:'1',label:'',by:'',at:0}],outs:[{id:id(),n:'1',label:'',by:'',at:0}]});
     }
    });
    closeModal();
    if(tilBlok)drawBlocks(); else drawPlan();
   };
 });
}

 openModal('Tilføj udstyr eller stik','Vælg et billede, et symbol – eller læg dit eget ind',`

  <div class="msec">Symboler</div>

   ${Object.keys(SYMLIB).map(k=>`<button class="pick" data-sym="${k}">

  </div>
  <div class="msec">Dit eget billede</div>
  <div class="mf">
    <input type="file" id="imgUp" accept="image/*">
    <div class="msub" style="text-transform:none;letter-spacing:0;font-size:11.5px;margin-top:6px">
      Billedet gemmes i projektet, så kollegerne ser det samme. Det skaleres automatisk ned.
    </div>
  </div>
  <div class="mrow"><button class="btn" data-cancel="1">Luk</button></div>`,root=>{
   root.querySelector('[data-cancel]').onclick=closeModal;
   root.querySelectorAll('[data-own]').forEach(b=>b.onclick=e=>{
     if(e.target.dataset.rmimg)return;
     const k=b.dataset.own; addItem('own',own[k].src,own[k].n); closeModal()});
   root.querySelectorAll('[data-rmimg]').forEach(b=>b.onclick=e=>{
     e.stopPropagation(); snap(); delete ensureBlocks().imgs[b.dataset.rmimg]; closeModal(); pickItem()});
   root.querySelector('#imgUp').onchange=e=>{
     const f=e.target.files[0]; if(!f)return;
     const rd=new FileReader();
     rd.onload=()=>{
      const im=new Image();
      im.onload=()=>{
       const max=260, sc=Math.min(1,max/Math.max(im.width,im.height));
       const cv=document.createElement('canvas');
       cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
       cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
       const src=cv.toDataURL('image/png');
       const nm=(f.name||'Billede').replace(/\.[^.]+$/,'');
       snap();
       ensureBlocks().imgs=ensureBlocks().imgs||{};
       const k=id(); ensureBlocks().imgs[k]={n:nm,src:src};
       addItem('own',src,nm); closeModal();
      };
      im.src=rd.result;
     };
     rd.readAsDataURL(f);
   };
 });
}

/* ---- udskriv blokdiagrammet ---- */
function printBlocks(){
 const c=document.getElementById('bcanvas');
 if(!c)return;
 const w=Math.max(c.scrollWidth,900), hgt=Math.max(c.scrollHeight,600);
 const padPx=8*96/25.4;
 const sideB=420*96/25.4, sideH=297*96/25.4;     // A3 liggende
 /* Skalér så hele diagrammet er der – både i bredden og højden. Vi bruger
    transform frem for zoom, fordi Safari ikke regner zoom med ved print. */
 const k=Math.max(0.2,Math.min((sideB-2*padPx)/w,(sideH-2*padPx-26)/hgt,1.8));
 const bredde=w*k, hoejde=hgt*k;
 document.getElementById('printroot').innerHTML=
  `<div class="psheet blockprint" style="width:${sideB}px;height:${(sideH-2).toFixed(0)}px">
     <div class="sheettitle">${esc(projectName)} · ${esc(bp().title)}</div>
     <div class="pfit" style="width:${bredde}px;height:${hoejde}px;overflow:hidden;
          margin:0 auto">
       <div class="pfitin" style="width:${w}px;height:${hgt}px;transform:scale(${k.toFixed(4)});transform-origin:top left">
         <div class="bcanvas printed" style="width:${w}px;height:${hgt}px">${c.innerHTML}</div>
       </div>
     </div>
   </div>`;
 document.getElementById('pagestyle').textContent=
  `@page{size:A3 landscape;margin:0}
   @media print{
     html,body{margin:0!important;padding:0!important}
     #printroot{width:${sideB}px;margin:0}
     .psheet{padding:${padPx}px;box-sizing:border-box;overflow:hidden;margin:0;
             break-inside:avoid;page-break-inside:avoid;
             break-before:page;page-break-before:always;
             break-after:auto;page-break-after:auto}
     .psheet:first-child{break-before:auto;page-break-before:auto}
   }`;
 const navn=projectName+' – Blokdiagram – '+bp().title;
 setTimeout(()=>udskriv(navn),150);
}

/* ---- tegn kanalplanen ---- */
const CARDW=760;
/* Ret op: gitter og hjælpelinjer, så kortene kan stilles lige op. */
let planSnap=true;
const labelled=(dv,side)=>ports(dv,side).filter(p=>p.label);
const devDone=dv=>{
 const all=labelled(dv,'ins').concat(labelled(dv,'outs'));
 return all.length>0 && all.every(p=>p.patched&&p.checked);
};

function drawPlan(){
 if(!lastSeen())store(seenKey(),String(Date.now()));
 const el2=document.getElementById('plan');
 const nyt=newCount();
 const labels=usedLabels();

 let h=`<div class="planbar">
   <div class="domtabs">${Object.keys(PLANDOMS).map(k=>
     `<button class="domtab ${k===planDom?'on':''}" data-dom="${k}" title="${PLANDOMS[k]}-planen – hvert område har sit eget udstyr">${PLANDOMS[k]}</button>`).join('')}</div>
   ${guestToken?'':`<button class="sharebtn left" data-imp="1" title="Hent udstyr der allerede er brugt på blokdiagrammet">⤒ Importér</button>`}
   ${nyt?`<button class="newsbadge" data-seen="1">${nyt} ${nyt===1?'ny ændring':'nye ændringer'} siden sidst · markér som set</button>`:''}
   ${meName()==='?'?`<input class="whobox" id="whoBox" placeholder="Dine initialer" title="Vises ud for de linjer du retter">`:
     `<span class="whotag" title="Dine initialer – klik for at rette">${esc(meName())}</span>`}
   <button class="sharebtn save" data-save="1" title="Gem i databasen nu, så kollegerne kan se det">Gem</button>
   <button class="sharebtn" data-refresh="1" title="Hent kollegernes ændringer nu">↻ Opdatér</button>
   <button class="sharebtn" data-share="1" title="Kopiér et link der åbner denne plan">Del link</button>
   <button class="sharebtn" data-ppdf="1" title="Print ${PLANDOMS[planDom]}-planen eller gem den som PDF">↧ PDF</button>
   <button class="sharebtn" data-pcsv="1" title="Hent ${PLANDOMS[planDom]}-planen som regneark til Excel">↧ CSV</button>
   <button class="sharebtn ${planSnap?'on':''}" data-psnap="1" title="Lås til gitter: kortene falder på plads i lige rækker, og der vises hjælpelinjer når de flugter">⊞ Ret op</button>
   ${guestToken?'':`
     <div class="planadd">
       <button class="sharebtn save" data-arch="1" title="Hent udstyr fra lageret">+ Udstyr</button>
     </div>`}
 </div>`;

 const list=devs();
 if(!list.length){
  h+=`<div class="planempty">Ingen ${PLANDOMS[planDom].toLowerCase()}-udstyr endnu.<br>
      Vælg et stykke udstyr i menuen ovenfor for at komme i gang.</div>`;
 }


 /* Kort uden plads får en, så de ikke lander oven i hinanden.
    Højden gættes ud fra antal linjer, så stakken bliver pæn fra start. */
 const estH=d=>74+Math.max(ports(d,'ins').length,ports(d,'outs').length)*30+46;
 const colY=[20,20,20];
 list.forEach(d=>{
  if(typeof d.x==='number'&&typeof d.y==='number'){
   const c=Math.min(2,Math.max(0,Math.round((d.x-20)/(CARDW+40))));
   colY[c]=Math.max(colY[c], d.y+estH(d)+24);
   return;
  }
  let c=0; for(let i=1;i<3;i++)if(colY[i]<colY[c])c=i;
  d.x=20+c*(CARDW+40); d.y=colY[c]; colY[c]+=estH(d)+24;
 });
 h+=`<div class="devcanvas ${planSnap?'snap':''}" id="devcanvas">`;
 list.forEach(dv=>{
  const lab=labelled(dv,'ins').concat(labelled(dv,'outs'));
  const np=lab.filter(p=>p.patched).length, nc=lab.filter(p=>p.checked).length;
  const done=devDone(dv);
  h+=`<div class="dev ${(dv.w||CARDW)<580?'narrow':''}" data-dev="${dv.id}" style="left:${dv.x}px;top:${dv.y}px;width:${dv.w||CARDW}px">
    <div class="devhead">
      <span class="draghandle" data-dragdev="${dv.id}" title="Træk for at flytte kortet">⠿</span>
      <div class="devnames">
        <input class="devname" value="${esc(dv.name)}" data-dname="${dv.id}" placeholder="Navn på udstyr">
        <input class="devplace" value="${esc(dv.place||'')}" data-dplace="${dv.id}" placeholder="Placering, fx Studie">
      </div>
      <div class="devmeta">
        <button class="pt p ${lab.length&&np===lab.length?'lit':''}" data-dall="${dv.id}|patched"
          title="Patchet – ${np} af ${lab.length}. Klik for at sætte alle">P<em>${np}/${lab.length}</em></button>
        <button class="pt t ${lab.length&&nc===lab.length?'lit':''}" data-dall="${dv.id}|checked"
          title="Tjekket – ${nc} af ${lab.length}. Klik for at sætte alle">T<em>${nc}/${lab.length}</em></button>
      </div>
      <div class="devacts">
        <button class="mini rowmenu" data-kortmenu="${dv.id}" title="Muligheder for kortet">⋯</button>
        ${guestToken?'':`<button class="mini" data-darch="${dv.id}" title="Læg dette udstyr på lageret">⤓</button>`}
        <button class="mini" data-ddup="${dv.id}" title="Lav en kopi af hele kortet">⧉</button>
        <button class="mini" data-ddel="${dv.id}" title="Slet kortet og alle dets linjer">✕</button>
      </div>
    </div>
    <div class="ports ${(ports(dv,'ins').length&&ports(dv,'outs').length)?'':'enkelt'}">
      ${ports(dv,'ins').length?portList(dv,'ins','Input'):''}
      ${ports(dv,'outs').length?portList(dv,'outs','Output'):''}
      ${(!ports(dv,'ins').length&&!ports(dv,'outs').length)?
        `<div class="ingenlinjer">Ingen linjer endnu
           <button class="add" data-padd="${dv.id}|ins">+ input</button>
           <button class="add" data-padd="${dv.id}|outs">+ output</button>
         </div>`
       /* Mangler den ene side helt, skal der stadig være en vej til at
          oprette den første linje – ellers sidder man fast. */
       :(!ports(dv,'outs').length?
        `<div class="startside"><button class="add" data-padd="${dv.id}|outs"
            title="Giv kortet et output">+ output</button></div>`
       :(!ports(dv,'ins').length?
        `<div class="startside"><button class="add" data-padd="${dv.id}|ins"
            title="Giv kortet et input">+ input</button></div>`:''))}
    </div>
    <span class="rs" data-devrs="${dv.id}" title="Træk for at gøre kortet bredere eller smallere"></span>
  </div>`;
 });
 h+=`</div>
  <datalist id="lbls">${labels.map(l=>`<option value="${esc(l)}">`).join('')}</datalist>`;

 el2.innerHTML=h;
 bindPlan();
 if(typeof mobilTitel==='function')mobilTitel();
 if(typeof autosave==='function')autosave();
}

function ptBadges(card,dv){

 const np=lab.filter(x=>x.patched).length, nc=lab.filter(x=>x.checked).length;
 const set=(sel,n,txt)=>{
  const b=card.querySelector(sel); if(!b)return;
  b.classList.toggle('lit',lab.length>0&&n===lab.length);

  b.title=(txt==='P'?'Patchet':'Tjekket')+' – '+n+' af '+lab.length+'. Klik for at sætte alle';
 };
 set('.pt.p',np,'P'); set('.pt.t',nc,'T');
}

 el2.querySelectorAll('[data-pins]').forEach(b=>b.onclick=()=>{

    if(f){f.focus();f.select()}},60);

 el2.querySelectorAll('[data-padd]').forEach(b=>b.onclick=()=>{

 bindDevDrag(el2);

/* ---- kortene ligger hvor du lægger dem ---- */
function bindDevDrag(el2){
 const canvas=el2.querySelector('#devcanvas');
 el2.querySelectorAll('[data-dragdev]').forEach(h2=>{
  h2.onmousedown=e=>{
   e.preventDefault();
   const dv=dom().devices.find(x=>x.id===h2.dataset.dragdev);
   const card=h2.closest('.dev');
   const cr=card.getBoundingClientRect(), wr=canvas.getBoundingClientRect();
   const gx=e.clientX-cr.left, gy=e.clientY-cr.top;
   card.classList.add('moving');
   snap();
   const move=ev=>{
    /* først den rå position, så vi kan se om den flugter med noget */
    const rx=Math.max(0,ev.clientX-gx-wr.left), ry=Math.max(0,ev.clientY-gy-wr.top);
    card.style.left=rx+'px'; card.style.top=ry+'px';
    const g=planSnap?showGuides(card,canvas,'.dev'):{x:null,y:null};
    if(!planSnap)return;
    /* en flugt vinder over gitteret */
    card.style.left=Math.max(0,Math.round(g.x!==null?g.x:Math.round(rx/GRID)*GRID))+'px';
    card.style.top =Math.max(0,Math.round(g.y!==null?g.y:Math.round(ry/GRID)*GRID))+'px';
   };
   const up=()=>{
    document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
    card.classList.remove('moving');
    clearGuides(canvas);
    dv.x=Math.round(parseFloat(card.style.left)||0);
    dv.y=Math.round(parseFloat(card.style.top)||0);
    dv.mt=Date.now(); autosave();
   };
   document.addEventListener('mousemove',move);
   document.addEventListener('mouseup',up);
  };
 });
 /* træk i hjørnet for at gøre kortet bredere */
 el2.querySelectorAll('[data-devrs]').forEach(hn=>hn.onmousedown=e=>{
  e.preventDefault(); e.stopPropagation();
  const dv=dom().devices.find(x=>x.id===hn.dataset.devrs);
  const card=hn.closest('.dev');
  const x0=e.clientX, w0=card.getBoundingClientRect().width;
  snap();
  const move=ev=>{
   const w=planSnap?Math.round((w0+(ev.clientX-x0))/GRID)*GRID:(w0+(ev.clientX-x0));
   card.style.width=Math.max(340,w)+'px';
   showGuides(card,el2.querySelector('#devcanvas'),'.dev');
  };
  const up=()=>{document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
    clearGuides(el2.querySelector('#devcanvas'));
    dv.w=Math.round(parseFloat(card.style.width)||CARDW); dv.mt=Date.now(); autosave()};
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
 });
}


/* ---- link direkte til kanalplanen ---- */
let pendingOpen=null, pendingPlan=false;

function planLink(tok){
 const u=location.origin+location.pathname;
 const q=['view=plan','only=1','dom='+planDom];
 if(tok)q.push('t='+tok); else if(cloudId)q.push('p='+cloudId);
 return u+'?'+q.join('&');
}
/* Laver en nøgle til projektet første gang der deles, og genbruger den siden. */
async function shareToken(){
 const r=await sbFetch('signalflow_projects?id=eq.'+cloudId+'&select=share_token');
 if(r&&r.length&&r[0].share_token)return r[0].share_token;
 const tok=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));
 await sbFetch('signalflow_projects?id=eq.'+cloudId,
   {method:'PATCH',body:JSON.stringify({share_token:tok})});
 return tok;
}
function copyLink(link,btn){
 const done=()=>{const t=btn.textContent;btn.textContent='Kopieret ✓';setTimeout(()=>{btn.textContent=t},1600)};
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(link).then(done).catch(()=>prompt('Kopiér linket:',link));
 }else prompt('Kopiér linket:',link);
}

/* ---- åbn efter det der står i adressen ---- */
function applyUrl(){
 const q=new URLSearchParams(location.search);
 if(q.get('dom')&&PLANDOMS[q.get('dom')])planDom=q.get('dom');
 if(q.get('only')==='1')document.body.classList.add('onlyplan');
 const wantPlan=q.get('view')==='plan'||q.get('only')==='1';
 const pid=q.get('p');
 if(pid){
  if(!session()){
   pendingOpen=pid; pendingPlan=wantPlan;
   if(wantPlan)setView('plan');
   return;
  }
  cloudOpen(pid).then(()=>{if(wantPlan)setView('plan')})
    .catch(e=>{if(wantPlan)setView('plan');setSync(e.message,true)});
  return;
 }
 if(wantPlan)setView('plan');
}

/* ================= mobiludgave =================
   På en telefon er der ikke plads til rækker af små knapper. I stedet får
   hver linje én ⋯-knap, der åbner et ark nedefra med de samme muligheder. */
let mobil=false;
const LS_MODE='signalflow:mode';

/* Hvilken slags skærm sidder vi ved?
   Bredden alene er ikke nok: et lille browservindue på en Mac er stadig en
   computer, og en iPad i landskab er stadig en berøringsskærm. Derfor kigger
   vi på både pegeredskab, berøring og bredde. */
function skaermType(){
 let grov=false, kanHover=true;
 try{
  grov = matchMedia('(pointer:coarse)').matches;
  kanHover = matchMedia('(hover:hover)').matches;
 }catch(e){}
 const beroering = grov || (navigator.maxTouchPoints||0)>1;
 const b=innerWidth;
 if(beroering&&!kanHover&&b<=920)return 'telefon';   // telefon eller tablet i hånden
 if(b<=620)return 'telefon';                          // meget smalt vindue
 return 'computer';
}
/* Et fingeraftryk af skærmen. Skifter det – fx fordi projektet åbnes på en
   anden maskine – gælder et tidligere valg ikke længere, og vi vælger selv. */
function skaermAftryk(){
 const b=innerWidth;
 const trin = b<=620?'s' : b<=1024?'m' : 'l';
 return skaermType()+':'+trin;
}

function setMode(m,gem){
 mobil=m;
 document.body.classList.toggle('mobile',m);
 if(gem)try{localStorage.setItem(LS_MODE,JSON.stringify({aftryk:skaermAftryk(),valg:m?'mobil':'desktop'}))}catch(e){}
 const b=document.getElementById('bMode');
 if(b){b.textContent=m?'🖥':'📱';
   b.title=(m?'Skift til skrivebordsudgaven':'Skift til mobiludgaven')
     +' · programmet har selv valgt '+(skaermType()==='telefon'?'mobil':'skrivebord')
     +' ud fra skærmen'}
 document.querySelectorAll('#mnav button').forEach(n=>
   n.classList.toggle('on',n.dataset.view===view));
 mobilTitel();
 if(view==='plan')drawPlan(); else if(view==='blocks')drawBlocks();
 else if(view==='arch')drawArchive(); else draw();
}
function gemtValg(){
 try{
  const r=localStorage.getItem(LS_MODE);
  if(!r)return null;
  if(r==='mobil'||r==='desktop')return null;        // gammelt format uden aftryk
  const o=JSON.parse(r);
  return o&&o.aftryk===skaermAftryk() ? o.valg : null;
 }catch(e){return null}
}
function vaelgUdgave(){
 aftrykNu=skaermAftryk();
 const g=gemtValg();
 setMode(g ? g==='mobil' : skaermType()==='telefon', false);
}
/* Skifter skærmen karakter – vindue trukket smalt, telefon drejet – så vurderes
   det forfra, medmindre man selv har valgt noget for netop den skærm. */
let aftrykNu=null, sizeTimer=null;
addEventListener('resize',()=>{
 clearTimeout(sizeTimer);
 sizeTimer=setTimeout(()=>{
  const nyt=skaermAftryk();
  if(nyt===aftrykNu)return;
  aftrykNu=nyt;
  const g=gemtValg();
  const skal = g ? g==='mobil' : skaermType()==='telefon';
  if(skal!==mobil)setMode(skal,false);
 },250);
});

function mobilTitel(){
 const t=document.getElementById('mTitle');
 if(!t)return;
 const side = view==='flow' ? (pages[activePage]||{}).title
   : view==='plan' ? PLANDOMS[planDom]
   : view==='blocks' ? (bp()||{}).title : 'Alt udstyr';

function flytPort(dv,side,i,ret){
 const synlige=ports(dv,side);
 const j=i+ret;
 if(j<0||j>=synlige.length)return;
 snap();
 const numre=synlige.map(p=>p.n);
 const a=synlige[i], b2=synlige[j];
 const ia=dv[side].indexOf(a);
 dv[side].splice(ia,1);
 dv[side].splice(dv[side].indexOf(b2)+(ret>0?1:0),0,a);
 ports(dv,side).forEach((p,k)=>{p.n=numre[k]});
 drawPlan();
}
