<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignalFlow</title>

<!-- ══════════════════════════════════════════════════════════════
     HVEM MÅ DENNE SIDE TALE MED?

     Linjen herunder håndhæves af browseren. connect-src siger, at
     siden KUN må tale med vores eget Supabase-projekt. Skulle nogen
     få sprøjtet kode ind i siden, kan den kode ikke sende noget ud
     af huset.

     default-src 'none': alt andet er forbudt, med mindre det står
     nævnt. 'unsafe-inline' er nødvendig, fordi hele programmet ER
     én fil – koden og stilene står i siden selv. Den tillader IKKE
     kode udefra.

     SKIFTER DATABASEN ADRESSE: ret den i connect-src herunder OG
     ved SUPABASE_URL længere nede. Begge steder.
     ══════════════════════════════════════════════════════════════ -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  connect-src 'self' https://oqfwegzondrsvdbneury.supabase.co;
  script-src 'self' 'unsafe-inline';
  style-src  'self' 'unsafe-inline';
  img-src    'self' data: blob:;
  media-src  'self' data: blob:;
  font-src   'self' data:;
  worker-src 'self' blob:;
  form-action 'none';
  base-uri 'none'">
<!-- frame-ancestors står IKKE her: den virker kun som HTTP-header, ikke i
     et meta-mærke, og browseren skriver en advarsel i konsollen hvis man
     prøver. Den hører til i serverens opsætning, sammen med de øvrige
     sikkerhedsheadere – se server_headers.txt i sikkerhedsbilagene. -->

<!-- Der hentes INTET fra internettet. Her stod før et link til Google
     Fonts, som gav et kald til Google ved hvert eneste sideopslag med
     brugerens IP. Skrifterne er skiftet til dem, maskinen har i forvejen
     (se --fd/--fb/--fm nedenfor).

     VIL I HAVE DE OPRINDELIGE SKRIFTER TILBAGE: hent woff2-filerne, læg
     dem ind som base64 i en @font-face herinde i filen, og ret de tre
     variabler. Så bevares udseendet UDEN at hente noget. -->
<style>
:root{
  --bg:#101319; --panel:#171c24; --panel2:#1f2630; --line:#2b3542;
  --text:#e9eef5; --dim:#8d9aab; --faint:#5c6878;
  --video:#ff5252; --lyd:#ffb648; --intercom:#3fd99c; --net:#5ea3ff;
  --ink:#1d1d1d; --paper:#fbfaf6;
  /* Skrifter maskinen har i forvejen – intet hentes. Den smalle først i
     --fd, så overskrifternes bredde holder sig tæt på den gamle: tegningen
     regner på tekstbredder, og bredere skrift ville sprænge kasserne. */
  --fd:'Arial Narrow','Helvetica Neue Condensed','Liberation Sans Narrow',
       system-ui,-apple-system,'Segoe UI',sans-serif;
  --fb:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --fm:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--fb)}
button{font:inherit}

#app{display:grid;grid-template-rows:54px 42px 1fr;grid-template-columns:1fr 290px;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);position:relative}
.logo{font-family:var(--fd);font-weight:700;font-size:20px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.logo em{font-style:normal;color:var(--lyd)}
#crumbs{display:flex;align-items:center;gap:5px;font-family:var(--fm);font-size:12px;color:var(--dim);flex:1;min-width:0;overflow:hidden;white-space:nowrap}
#crumbs button{background:none;border:none;color:var(--dim);cursor:pointer;padding:4px 6px;border-radius:5px;font:inherit}
#crumbs button:hover{color:var(--text);background:var(--panel2)}

#crumbs .here{color:var(--text)}
#crumbs .projname{color:var(--text);font-weight:600}
#autoStatus{font-family:var(--fm);font-size:10px;color:var(--faint);white-space:nowrap;min-width:96px;text-align:right}
#autoStatus.warn{color:var(--lyd)}
#crumbs .projname:hover{background:var(--panel2);color:var(--lyd)}
#crumbs .sep{color:var(--faint)}

.bus{display:flex;gap:5px}
.busbtn{position:relative;font-family:var(--fd);font-weight:600;font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--panel2);color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:7px 12px 7px 21px;cursor:pointer;transition:.12s}
.busbtn::before{content:'';position:absolute;left:8px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:var(--d);opacity:.3;transition:.12s}
.busbtn.on{color:var(--text);border-color:var(--d)}
.busbtn.on::before{opacity:1;box-shadow:0 0 8px var(--d)}
.busbtn[data-l=video]{--d:var(--video)} .busbtn[data-l=lyd]{--d:var(--lyd)}
.busbtn[data-l=intercom]{--d:var(--intercom)} .busbtn[data-l=net]{--d:var(--net)}
.busbtn[data-l=backup]{--d:#b18cff}
.hbtn{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.hbtn:hover{color:var(--text);border-color:var(--faint)}
.hbtn:disabled{opacity:.4;cursor:default}

#stage{grid-row:3;position:relative;overflow:auto;background:#0b0e13;padding:26px}
#side{grid-row:3;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px}

#tabbar{grid-row:2;grid-column:1/3;display:flex;align-items:flex-end;gap:2px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 14px;overflow-x:auto}
.tab{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-bottom:none;border-radius:7px 7px 0 0;padding:7px 8px 7px 13px;cursor:pointer;color:var(--dim);white-space:nowrap;margin-bottom:-1px}
.tab.on{background:var(--paper);color:#1d1d1d;border-color:var(--paper)}
.tab .tname{font-size:12.5px;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.tab.on .tname{cursor:text}
.tab .tx{border:none;background:none;color:inherit;opacity:.45;cursor:pointer;font-size:11px;padding:1px 3px;border-radius:3px;line-height:1}
.tab .tx:hover{opacity:1;background:rgba(0,0,0,.15)}
.tabadd{background:none;border:none;color:var(--dim);cursor:pointer;padding:7px 10px;font-size:15px;margin-bottom:2px}
.tabadd:hover{color:var(--text)}
.tabedit{font:12.5px var(--fb);border:1.5px solid #0a5bd3;border-radius:4px;padding:0 4px;max-width:190px}
#sheet{background:var(--paper);color:var(--ink);margin:0 auto;box-shadow:0 10px 40px rgba(0,0,0,.5);border-radius:3px;width:100%;max-width:1340px;min-width:900px;min-height:560px;padding:26px 30px 60px;transform-origin:top center}

/* ---- ark ---- */
.sheettitle{font-family:var(--fd);font-weight:700;font-size:25px;letter-spacing:.04em;text-align:center;padding:6px 0 4px;color:#2a2a2a}
.sheetsub{font-family:var(--fm);font-size:11px;text-align:center;color:#8a8a8a;margin-bottom:20px}
.section{display:grid;grid-template-columns:190px 1fr 210px;gap:0;margin-bottom:26px;align-items:stretch}
.srcbox,.dstbox{border-radius:3px;padding:11px 12px;position:relative}
.srcbox{background:#e9c440;border:1px solid #bd9a2c}
.dstbox{background:#6d8764;border:1px solid #4c6245;color:#f3f7f1}
.boxname{font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:.05em;line-height:1.2;overflow-wrap:anywhere;word-break:break-word}
.srcbox .boxname{color:#2b2417}
.boxsub{font-family:var(--fm);font-size:9.5px;opacity:.65;margin-top:3px}
.rows{padding:4px 14px;min-width:0;position:relative}

.grp{position:relative;padding:2px 0 2px 0;margin-bottom:9px}
.grp.sel{background:#eef4ff;box-shadow:0 0 0 1px #b9d0f5;border-radius:4px}
.grp.hidden{display:none}
.feed{display:flex;align-items:center;gap:0;min-height:19px;flex-wrap:wrap;row-gap:1px}
.lbl{font-size:11.5px;white-space:nowrap;cursor:text;padding:1px 3px;border-radius:3px}
.lbl:hover{background:#e6eefc;outline:1px solid #b9d0f5}
.feed .lbl{font-weight:600}
.wire{flex:1 1 24px;height:0;border-top:1.8px solid currentColor;margin:0 6px;min-width:20px;position:relative}
.grp.backup .wire{border-top-style:dashed}
.ch.cbackup .wire{border-top-style:dashed}
.ch:not(.cbackup) .wire{border-top-style:solid}
.dirbtn{font-size:12px;font-weight:600}
.chb{font-family:var(--fm);font-size:8px;font-weight:500;background:#b18cff;color:#fff;border-radius:3px;padding:0 3px;margin-right:5px;line-height:1.5}
.cloud{font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:#5c5c5c;background:var(--paper);border:1px solid #b4b4b4;border-radius:14px;padding:1px 13px;cursor:text;white-space:nowrap}
.cloud:hover{border-color:#0a5bd3;color:#0a5bd3}
.ch{display:flex;align-items:center;min-height:17px;padding-left:14px;color:#3a3a3a;flex-wrap:wrap;row-gap:1px}
.ch .wire{border-top-width:1.1px;border-top-color:currentColor}
.ch .wire{border-top-color:currentColor}
.dot{width:7px;height:7px;border-radius:50%;flex:none;margin-right:7px;cursor:pointer;border:1px solid rgba(0,0,0,.25)}
.ch .lbl{font-size:11px;white-space:normal;overflow-wrap:anywhere}
.chnr{font-family:var(--fm);font-size:10.5px;min-width:44px;cursor:text;padding:1px 3px;border-radius:3px}
.chnr:hover{background:#e6eefc}





/* ---- skift mellem tegning og plan ---- */
.viewsw{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.vbtn{background:none;border:none;color:var(--dim);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.vbtn.on{background:var(--panel2);color:var(--text)}
#plan{display:none}
body.planview #sheet,body.planview #tabbar{display:none}
body.planview .bus,body.planview #bFoldAll{display:none}
body.planview #stage{grid-column:1/2}
body.planview #crumbs{flex:0 1 auto;max-width:230px}
body.planview #plan{display:block}
body.planview #stage{background:#0b0e13;padding:16px}



/* ---- låseskærm ---- */
#gate{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9998;background:var(--bg);
 display:flex;align-items:center;justify-content:center;padding:24px}
body.unlocked #gate{display:none}
body:not(.unlocked) #app{filter:blur(7px);pointer-events:none;user-select:none}
.gatebox{width:100%;max-width:340px;display:flex;flex-direction:column;gap:9px}
.gatelogo{font-family:var(--fd);font-weight:700;font-size:30px;letter-spacing:.09em;text-transform:uppercase;text-align:center}
.gatelogo em{font-style:normal;color:var(--lyd)}
.gatesub{font-family:var(--fm);font-size:11px;color:var(--dim);text-align:center;margin-bottom:12px}
#gate input{background:var(--panel);border:1px solid var(--line);color:var(--text);
 border-radius:8px;padding:12px 12px;font:16px var(--fb)}
#gate input:focus{outline:none;border-color:var(--intercom)}
.gatebtn{background:var(--panel2);border:1px solid var(--intercom);color:var(--intercom);
 border-radius:8px;padding:12px;cursor:pointer;font:15px var(--fb);margin-top:4px}
.gatebtn:hover{background:rgba(63,217,156,.13)}
#gMsg{color:var(--video);font-size:12px;min-height:16px;text-align:center}
.gatefoot{font-family:var(--fm);font-size:10px;color:var(--faint);text-align:center;margin-top:14px;line-height:1.6}



/* flytte-håndtag på linjerne */
.grip{cursor:grab}
.grip:active{cursor:grabbing}
.rowmoving{opacity:.45}
.rowmark{height:2px;background:var(--intercom);border-radius:2px;margin:1px 0;
 box-shadow:0 0 6px var(--intercom);pointer-events:none}
.port [data-pgrip]{display:none;position:absolute;right:calc(102px + var(--hoej));top:50%;transform:translateY(-50%);z-index:2}
.port:hover [data-pgrip]{display:block}


/* flytning af faner */
.tabmark{width:2px;align-self:stretch;background:var(--intercom);border-radius:2px;margin:6px 1px;
 box-shadow:0 0 6px var(--intercom);pointer-events:none;flex:none}
.tabmoving{opacity:.45}
.tab,.btab{cursor:grab}
.tab:active,.btab:active{cursor:grabbing}


/* ================= mobiludgaven ================= */
#mbar,#mnav,#sheetwrap{display:none}
.modeswitch{font-size:15px;padding:6px 10px}

body.mobile #app{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding-top:52px;padding-bottom:62px}
body.mobile header,body.mobile #side,body.mobile .viewsw,
body.mobile .bus,body.mobile #crumbs{display:none}
/* Fanebladene skal kunne ses – man skifter side hele tiden på en opsætning */
body.mobile #tabbar{display:flex;position:fixed;top:52px;left:0;right:0;z-index:880;
 gap:6px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line);
 overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
body.mobile #tabbar::-webkit-scrollbar{display:none}
body.mobile.planview #tabbar,body.mobile.blockview #tabbar,body.mobile.archview #tabbar{display:none}
body.mobile #tabbar .tab{flex:0 0 auto;padding:9px 14px;font-size:14px;border-radius:9px;
 background:var(--bg);border:1px solid var(--line);color:var(--dim);max-width:none}
body.mobile #tabbar .tab.on{background:var(--panel2);color:var(--text);border-color:var(--dim);font-weight:600}
body.mobile #tabbar .tab .tx{display:none}
body.mobile #tabbar .tabadd{flex:0 0 auto;padding:9px 14px;font-size:16px}
body.mobile #tabbar .laasknap{flex:0 0 auto;margin-left:0}
/* arket begynder under fanebladene */
body.mobile #app{padding-top:52px}
body.mobile:not(.planview):not(.blockview):not(.archview) #app{padding-top:100px}
/* På telefonen er der ikke plads til en bjælke – hængelåsen i topbjælken
   siger det samme, og et tryk på den låser op. */
body.mobile #laasbanner{display:none!important}
/* Arket ligger i tredje gitterrække på skrivebordet (under topbjælke og
   faner). På mobilen findes de rækker ikke – uden det her får man et stort
   tomt bånd øverst i plan og blokdiagram. */
body.mobile #stage{grid-column:1/-1;grid-row:1/-1;padding:10px 10px 16px}

/* topbjælke */
body.mobile #mbar{display:flex;position:fixed;top:0;left:0;right:0;height:52px;z-index:900;
 align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.mbtn{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;
 padding:9px 12px;font-size:15px;cursor:pointer;flex:none}
.mtitle{flex:1;min-width:0;background:none;border:none;color:var(--text);text-align:left;
 display:flex;flex-direction:column;gap:1px;cursor:pointer;padding:2px 0}
.mtitle b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtitle span{font-family:var(--fm);font-size:10.5px;color:var(--intercom);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mSave{border-color:var(--intercom);color:var(--intercom);font-size:13px}
#mMode{font-size:15px;padding:9px 10px}

/* bundnavigation */
body.mobile #mnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;
 z-index:900;background:var(--panel);border-top:1px solid var(--line);
 padding-bottom:env(safe-area-inset-bottom,0)}
#mnav button{background:none;border:none;color:var(--faint);padding:9px 4px 10px;cursor:pointer;
 display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-family:var(--fm)}
#mnav button span{font-size:17px;line-height:1}
#mnav button.on{color:var(--intercom)}

/* ark nedefra */
#sheetwrap{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1200;background:rgba(0,0,0,.55);
 align-items:flex-end;justify-content:center}
#sheetwrap.on{display:flex}
#sheetbox{width:100%;max-width:520px;max-height:82vh;overflow-y:auto;background:var(--panel);
 border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:none;padding:8px 10px 14px;
 animation:opad .16s ease-out}
@keyframes opad{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
.shandle{width:38px;height:4px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.shead{font-family:var(--fd);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
 color:var(--dim);padding:2px 8px 10px}
.sitem{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;color:var(--text);
 padding:13px 10px;border-radius:10px;cursor:pointer;text-align:left;font-size:15px}
.sitem:active{background:var(--panel2)}
.sitem.aktiv{color:var(--intercom)}
.sitem.fare{color:var(--video)}
.sitem.luk{color:var(--dim);justify-content:center;margin-top:4px}
.sico{width:22px;text-align:center;font-size:15px;flex:none;opacity:.85}
.stxt{flex:1;min-width:0;display:flex;flex-direction:column}
.stxt em{font-style:normal;font-family:var(--fm);font-size:10.5px;color:var(--faint);margin-top:2px}
.sval{font-family:var(--fm);font-size:11px;color:var(--faint);white-space:nowrap}
.ssplit{height:1px;background:var(--line);margin:6px 10px}

/* ⋯-knapperne findes kun på mobil */
.rowmenu{display:none!important}
body.mobile .rowmenu{display:inline-block!important;position:static!important;opacity:1!important;
 font-size:17px;padding:6px 10px;line-height:1}
/* på mobil er der kun ⋯ – resten ligger i arket */
body.mobile .tools .mini:not(.rowmenu),
body.mobile .port [data-pdel],body.mobile .port [data-pins],body.mobile .port [data-pgrip],
body.mobile .port .pby,body.mobile .fitools,
body.mobile .dev .devacts .mini:not(.rowmenu),body.mobile .draghandle,
body.mobile .dev .rs,body.mobile .endtag,body.mobile .rs,
body.mobile .boxadd,body.mobile .secmini{display:none!important}

/* arket fylder skærmens bredde */
body.mobile #sheet,body.mobile .sheet{width:auto!important;min-width:0!important;zoom:1!important;
 transform:none!important;overflow:visible}
body.mobile #stage{overflow-x:hidden}

/* tegningen på mobil: en sektion pr. kort, stablet */
body.mobile .sheet,body.mobile .psheet{padding:12px 10px;border-radius:12px}
body.mobile .section{display:block!important;margin-bottom:14px}
body.mobile .srcbox,body.mobile .dstbox{width:auto!important;margin:0 0 8px!important;min-height:0!important}
body.mobile .rows{padding:2px 0!important;margin:0!important}
body.mobile .dstbox{margin-top:8px!important}
/* gruppehovedet på mobil: ▾ 4W [INTERNET] ↔ ⋯  og navnet på linjen under */
body.mobile .feed{flex-wrap:wrap;gap:8px;align-items:center;padding:8px 2px 6px}
body.mobile .feed .caret{order:0}
body.mobile .feed .lbl[data-e="feed"]{order:1;font-size:15px}
body.mobile .feed .cloudtag{display:inline-flex;order:2;font-size:11px;padding:3px 10px}
body.mobile .feed .dirmark{order:3}
body.mobile .feed .tools{order:4;margin-left:auto}
body.mobile .feed .lbl[data-e="glabel"]{order:5;flex:1 1 100%;font-size:15px;margin-top:2px}
body.mobile .chcount{order:6;flex:1 1 100%;font-size:11px}
body.mobile .feed .wire,body.mobile .cloudtag{display:none}
body.mobile .feed .lbl[data-e="glabel"]{flex:1 1 100%;font-size:14px}
body.mobile .ch{padding:11px 4px;border-bottom:1px solid var(--line);gap:10px;align-items:center}
body.mobile .ch .tools{margin-left:auto}
body.mobile .add{padding:11px 8px;font-size:13px}
body.mobile .ch .wire{display:none}
body.mobile .ch .chb{font-size:12px;min-width:44px}
body.mobile .ch .lbl{font-size:15px;flex:1}
body.mobile .grp{margin-bottom:12px}
body.mobile .sheettitle{font-size:19px}

/* plan og lager på mobil */
body.mobile .devcanvas{width:auto!important;height:auto!important}
body.mobile .dev{position:relative!important;left:auto!important;top:auto!important;
 width:auto!important;margin:0 0 12px}
body.mobile .ports{grid-template-columns:1fr!important}
body.mobile .plabel{font-size:16px;padding:10px 9px}
body.mobile .pnum{font-size:13px;padding:10px 3px;width:42px}
body.mobile .tick input{width:22px;height:22px}
body.mobile .planbar{gap:7px}
body.mobile .planbar .sharebtn{flex:1 1 auto;padding:10px 8px;font-size:12.5px}
/* På telefonen bygges topbjælken uden opdatér, csv, kolonner og ret op – de
   knapper findes slet ikke her, de åd skærmen. "Del link" bliver, når man er
   logget ind: den bruges ude på gulvet. Gæsten har den ikke – han har jo
   linket. Print og gem ligger i ☰-menuen. */
body.mobile .planbar [data-save],body.mobile .planbar [data-imp],body.mobile .planbar [data-kimp],
body.mobile .planbar .whotag,
body.mobile .planbar .whobox{display:none}
body.mobile .planbar [data-foldall],
body.mobile .planbar [data-ppdf],
body.mobile .planbar [data-share]{display:inline-flex;align-items:center;justify-content:center;
 flex:0 0 auto;gap:5px;background:var(--panel2);border-color:var(--dim);color:var(--text);
 font-size:13px;padding:10px 12px}
/* Gæstens bjælke holdes helt bar – han har print i ☰-menuen */

body.mobile .aeports,body.mobile .aegrid{grid-template-columns:1fr}

/* blokdiagram på mobil: hele fladen skaleres ned så den kan ses */

/* retningspil – erstatter stregen, når der ikke er plads til den */

body.mobile .feed .dirmark{color:inherit;font-size:17px}
/* Symbolforklaringer ligger i vejen på en telefon – men intercom-paneler skal

body.mobile .fitem.flegend{display:none!important}
body.mobile .fitem.ftext{display:none!important}
body.mobile .fitem.fpanel{position:relative!important;left:auto!important;top:auto!important;
 width:auto!important;max-width:100%;margin:10px 0}

/* grafisk intercom-panel */
.fpanel{background:#1a1a1a;border:1px solid #3a3a3a;border-radius:7px;padding:0;
 box-shadow:0 2px 8px rgba(0,0,0,.18)}

 border-bottom:1px solid #3a3a3a;border-radius:6px 6px 0 0}

 text-transform:uppercase;color:#f2f2f2;cursor:move}
.fpanel .paddr{margin-left:auto;font-family:var(--fm);font-size:10px;color:#9aa4b0;white-space:nowrap}

 padding:2px 4px;font:11px var(--fb);text-align:center}

 border-radius:6px;padding:7px 8px;font:12.5px var(--fb)}

 padding:2px;cursor:pointer}
@media print{

.fpanel .palias{margin-left:auto;font-family:var(--fm);font-size:10px;color:#9aa4b0;white-space:nowrap}

 .fpanel .pnet{background:#f7f7f7;border-color:#ddd}
 .pnf{color:#222}

 .fpanel .palias{color:#444}
}


/* panelets størrelse styres af --ps, så alt skalerer sammen */
.fpanel{--ps:1}
.fpanel .phead{padding:calc(8px*var(--ps)) calc(11px*var(--ps)) calc(7px*var(--ps))}
.fpanel .pname{font-size:calc(13px*var(--ps))}
.fpanel .palias{font-size:calc(10px*var(--ps))}
.fpanel .pnet{padding:calc(6px*var(--ps)) calc(11px*var(--ps)) calc(2px*var(--ps));
 gap:calc(4px*var(--ps)) calc(10px*var(--ps))}
.pnf{font-size:calc(9.5px*var(--ps))}
.fpanel .pkeys{padding:calc(8px*var(--ps));gap:calc(6px*var(--ps))}
.prow2{gap:calc(6px*var(--ps))}
.pkey{height:calc(42px*var(--ps));font-size:calc(11px*var(--ps));
 padding:calc(6px*var(--ps)) 2px;border-radius:calc(4px*var(--ps))}
.fpanel .pnote{padding:0 calc(11px*var(--ps)) calc(9px*var(--ps));font-size:calc(10px*var(--ps))}
/* helt små paneler: kortere tekst og tættere felter */
.fpanel.lille .pnf em{margin-right:3px}
.fpanel.mini3 .pnet{gap:2px 7px}
.fpanel.mini3 .pkey{border-radius:3px}
.fpanel.mini3 .pkey span{line-height:1.05}


/* oplysninger skjult på skærmen, men med på papiret */
.pnet.kunprint{display:none}
@media print{
 .fpanel .pnet.kunprint{display:flex!important}
 /* hvad der kommer med, vælges på det enkelte panel */
 .fpanel.pr-info .pkeys{display:none!important}
 .fpanel.pr-taster .pnet{display:none!important}
 .fpanel.pr-navn .pkeys,.fpanel.pr-navn .pnote{display:none!important}
 .fpanel.pr-navn .pnet{border-bottom:none}
 .fpanel.pr-skjul{display:none!important}
}


/* hvem er inde i projektet */
/* Bjælken er delt i tre: venstre, midte og højre. Så ligger den midt på
   skærmen uden at kunne lægge sig oven i projektnavnet. */
.hvenstre,.hhoejre{display:flex;align-items:center;gap:14px;min-width:0;flex:1 1 0;overflow:hidden}
/* et langt projektnavn skal forkortes, ikke skubbe sig ind over midten */
#crumbs{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* også de enkelte dele, ellers stikker de ud af stien og ind over midten */
#crumbs>*{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hhoejre{justify-content:flex-end}
#whoson{display:flex;align-items:center;gap:7px;flex-wrap:nowrap;overflow:hidden;
 max-width:min(420px,30vw);flex:0 0 auto}
body.mobile .hvenstre,body.mobile .hhoejre{display:none}
#whoson:empty{display:none}
.whoicon{color:var(--intercom);font-size:9px;line-height:1;animation:puls 2.4s infinite}
@keyframes puls{0%,100%{opacity:.35}50%{opacity:1}}
.whochip{display:flex;flex-direction:column;gap:0;background:var(--panel2);border:1px solid var(--line);
 border-radius:7px;padding:3px 9px;line-height:1.2;max-width:150px;flex:0 0 auto}
.whomore{font-family:var(--fm);font-size:10px;color:var(--faint);flex:0 0 auto}
.whochip.alene{opacity:.75;background:transparent;border-style:dashed}
.whochip.alene b{color:var(--dim);font-weight:500}
.whochip.advarsel{border-color:var(--lyd)}
.whochip.advarsel b{color:var(--lyd)}
.whochip b{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.whochip em{font-style:normal;font-family:var(--fm);font-size:9px;color:var(--faint);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.mobile #whoson{position:fixed;top:54px;left:0;right:0;z-index:850;background:var(--panel);
 border-bottom:1px solid var(--line);padding:5px 10px;max-width:none;overflow-x:auto}
body.mobile #whoson:empty{display:none}
@media print{#whoson{display:none}}


/* skalering af udskriften */
#printroot.maaler{display:block!important;position:fixed!important;left:-20000px!important;
 top:0!important;visibility:hidden;z-index:-1}
.pfit{transform-origin:top left}
.pfitin{transform-origin:top left}
@media print{
 .psheet{overflow:hidden}
}


/* panelet kan skubbes ud af vejen */
#sideknap{position:fixed;right:290px;top:104px;z-index:60;width:22px;height:46px;
 background:var(--panel);border:1px solid var(--line);border-right:none;
 border-radius:7px 0 0 7px;color:var(--dim);cursor:pointer;font-size:13px;line-height:1;
 display:flex;align-items:center;justify-content:center;transition:right .18s ease}
#sideknap:hover{color:var(--text);background:var(--panel2)}

.dio-sider{margin:6px 0 4px}

.dio-valg label{display:flex;align-items:center;gap:8px}

.dio-side{display:flex;flex-direction:column;gap:2px;padding:8px 11px;border-bottom:1px solid var(--line);font-size:12.5px}

/* ── låst ark ── */
.laasknap{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--dim);
 border-radius:7px;padding:5px 11px;font-size:12px;cursor:pointer;white-space:nowrap;align-self:center}

.laasknap.laast{color:#f0b429;border-color:#8a6a1c;background:rgba(240,180,41,.08)}

#laasbanner.on{display:block;background:rgba(240,180,41,.09);border-bottom:1px solid #6b5418;
 color:#e8c46a;font-size:12px;padding:7px 14px;text-align:center}

/* alt der kan ændre arket, skjules – kun foldeknapperne bliver */
body.arklaast #sheet button:not([data-fold]),

body.arklaast #sheet [data-gripc], body.arklaast #sheet .addbar, body.arklaast #sheet .add{display:none!important}

body.arklaast #sheet .fitem{cursor:default}

@media print{#laasbanner,.laasknap,.tab .tlaas{display:none!important}}



/* frekvensplanen på print */

.ppfr{display:grid;grid-template-columns:44px 86px 1fr 84px 22px 22px;gap:8px;
 padding:4px 7px;border-bottom:1px solid #ececec;font-size:11.5px;color:#111}

 text-align:right;letter-spacing:.01em}

.foldknap{color:var(--faint)}

 text-overflow:ellipsis;font-family:inherit}

 background:#2a2416;border:1px solid #6b5418;color:#e8c46a;border-radius:10px;

 border:1px solid #8a6a1c;color:#f3d58a;border-radius:8px;padding:9px 12px;font-size:13px;cursor:pointer}

/* topbjælken på telefonen */
/* låsen bor i topbjælken på telefonen – knappen i fanebåndet er overflødig */
body.mobile #tabbar .laasknap{display:none}
#mlaas{display:none;flex:none;cursor:pointer;gap:4px;align-items:center;
 font-size:11.5px;font-family:var(--fm);color:#f0b429;background:rgba(240,180,41,.1);
 border:1px solid #8a6a1c;border-radius:8px;padding:7px 9px;white-space:nowrap}
#mlaas.vis{display:inline-flex}
#mbar .mbtn.hvem{font-size:12px;padding:9px 9px;min-width:38px;font-family:var(--fm)}
#mbar .mbtn.hvem.alene{color:var(--faint)}
#mbar .mbtn.hvem.flere{color:var(--intercom);border-color:#2c5f4a}
#mbar .mbtn.hvem.advarsel{color:var(--amber,#e0a33e);border-color:#6b5418}
#mCloud{font-size:15px;padding:9px 10px}
#mbar .mtitle{min-width:0}

/* ── Linjerne på en telefon ────────────────────────────────────
   Skærmen er for smal til nummer, navn og hak på samme linje: navnet blev
   klippet, og på en telefon findes der ingen mus at holde stille. Derfor får
   navnet sin egen linje i alle områder – nummer, hak og menu står ovenover. */
/* Alt står på én linje – navnefeltet er et felt der kan ombryde, så det kun
   bliver to linjer højt, når teksten faktisk er for lang til én. */
body.mobile .portcol .port{display:grid;gap:4px;padding:4px 0;align-items:center;
 grid-template-columns:38px minmax(0,1fr) 34px 34px 32px}
/* Kun navnefeltet må krympe. Får hakkene og ⋯ lov til det samme, skrumper de
   til under en fingerbredde. */
body.mobile .portcol .port>.plabel{min-width:0;font-size:14.5px}
/* nummerfeltet er bredt på kameraplanen for computeren – på telefonen står
   der kun 1-4, og pladsen er bedre brugt på navnet */
body.mobile #plan.dom-kam .pnum{width:34px;min-width:0;padding:5px 2px}
/* typemærket skal holde sig inde i sin egen søjle – ellers skubber det hele
   linjen ud over kortets kant */
body.mobile .port.kam>.kamtype{font-size:8.5px;padding:5px 1px;min-width:0;width:100%;
 box-sizing:border-box;overflow:hidden;white-space:nowrap}
body.mobile .portcol .port>.grip,body.mobile .portcol .port>[data-pins],
body.mobile .portcol .port>[data-pdel]{display:none}
/* de tomme pladser bliver stående, så ⋯ står samme sted på alle linjer */
body.mobile .portcol .port>.tickgap{display:block;min-width:0}
/* Overskriften er det samme gitter som linjen – ellers står P og T ved siden
   af hakkene. Felterne skal fylde deres søjle ud og ikke sætte egen bredde,
   og videoområdet har en søjle mere, til ♪. */
body.mobile .porthead:not(.freqhead){display:grid;gap:4px;
 grid-template-columns:38px minmax(0,1fr) 34px 34px 32px}
body.mobile #plan.dom-video .portcol .port,
body.mobile #plan.dom-video .porthead:not(.freqhead){
 grid-template-columns:38px minmax(0,1fr) 34px 34px 30px 32px}
body.mobile .ph-n,body.mobile .ph-c,body.mobile .ph-a{width:auto}
body.mobile .audslot{width:30px}

/* kameraets kanaler */
.port.kam{display:grid;grid-template-columns:54px 62px 1fr 22px 22px 34px 22px 22px;gap:5px;align-items:center}
.kamtype{font:9.5px var(--fm);color:var(--faint);text-transform:uppercase;letter-spacing:.06em;
 background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px 0;
 text-align:center;cursor:pointer;-webkit-appearance:none;appearance:none}
.kamtype:hover{color:var(--text);border-color:var(--dim)}
.kamtype.aes{color:var(--net);border-color:#2b4a63}
.port.kam.udgaaet{opacity:.42}
.port.kam.udgaaet .plabel{text-decoration:line-through;background:transparent;border-style:dashed;cursor:not-allowed}
.port.kam.udgaaet .kamtype{text-decoration:line-through}
.kamnote{margin:2px 8px 6px;padding:5px 9px;border-radius:7px;font-size:11px;
 background:rgba(90,140,190,.12);border:1px solid #2b4a63;color:#9fc4e4}
/* kameraet har også typen (mic/line eller AES) ved siden af nummeret */
body.mobile .port.kam{grid-template-columns:34px 48px minmax(0,1fr) 34px 34px 32px;gap:3px}
body.mobile .port.kam>.plabel{min-width:0}
body.mobile .port.kam .pby,body.mobile .port.kam [data-pdel]{display:none}

/* frekvensplanen */
.freqcol .porthead.freqhead,.port.freq{grid-template-columns:52px 80px 1fr 76px 22px 22px 0 22px 22px 22px 22px}
/* Klikker man i et felt, foldes det ud over naboerne, så hele teksten kan
   læses – man skulle ellers holde musen stille og vente på en boble. */
.port.freq .plabel:focus,.port.kam .plabel:focus,.port .plabel:focus{
 position:relative;z-index:6;box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--intercom)}
.port.freq .plabel{text-overflow:ellipsis}
.port.freq{display:grid;align-items:center;gap:4px}
.freqcol .ph-f{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.freqcol .ph-t{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.pfreq{background:var(--bg);border:1px solid var(--line);color:var(--amber,#e0a33e);
 border-radius:6px;padding:5px 6px;font-family:var(--fm);font-size:12px;text-align:right}
.pfreq:focus{outline:none;border-color:var(--amber,#e0a33e)}
.pfreqt{background:var(--bg);border:1px solid var(--line);color:var(--dim);
 border-radius:6px;padding:5px 6px;font-family:var(--fm);font-size:11px}
.freqadvarsel{margin:4px 8px 6px;padding:6px 9px;border-radius:7px;font-size:11.5px;
 background:rgba(224,163,62,.12);border:1px solid #6b5418;color:#e8c46a}
/* På telefonen står nummer, MHz og hakkene øverst – og navnet på sin egen
   linje nedenunder, så hele teksten kan ses. */
body.mobile .port.freq,body.mobile .freqcol .porthead.freqhead{
 grid-template-columns:36px 64px minmax(0,1fr) 34px 34px 32px;gap:3px;padding:4px 0}
body.mobile .port.freq>.plabel{min-width:0}
body.mobile .port.freq .pfreq{font-size:13px}
body.mobile .port.freq .plabel{font-size:14.5px}
body.mobile .port.freq .pfreqt,body.mobile .port.freq .pby,
body.mobile .freqcol .ph-t,body.mobile .freqcol .ph-by,
/* flyt, indsæt og slet ligger i ⋯-menuen på telefonen */
body.mobile .port.freq .grip,body.mobile .port.freq [data-pins],
body.mobile .port.freq [data-pdel]{display:none}


/* sidepanelet i plan, blokdiagram og lager */
.sdliste{margin:10px 0 14px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.sdrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 10px;
 border-bottom:1px solid var(--line);font-size:12px;cursor:default}
.sdrow[data-sdom]{cursor:pointer}

/* Et kort en kollega har rettet i, skal kunne ses tværs over skærmen: farvet

   hovedet. Farven er hans – er der flere inde, har de hver sin. */
.dev.rettet{border-color:var(--ret);box-shadow:0 0 0 1px var(--ret),0 0 16px -4px var(--ret)}
.dev.rettet::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
 background:var(--ret);z-index:3}

 opacity:.1;pointer-events:none}

 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:84px}

 padding:4px 0 5px 8px;background:rgba(255,182,72,.05);border-radius:0 6px 6px 0}

.audn{width:62px;flex:none;background:var(--bg);border:1px solid var(--line);color:var(--dim);
 border-radius:5px;padding:4px 3px;font:9.5px var(--fm);text-align:center}
.audl{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);
 border-radius:5px;padding:4px 7px;font:11.5px var(--fb)}
.audl:focus,.audn:focus{outline:none;border-color:var(--intercom)}
.aud.set .audl{border-color:#4a3f2b;background:#1a1711}
.aud.fresh .audl{border-color:var(--ret,var(--lyd));box-shadow:0 0 0 1px var(--ret,var(--lyd))}
.aud .pby{right:76px}
.audadd{font-size:10px;margin:2px 0 0 2px}
/* håndtrykket: bindingen til en gruppe i tegningen */
.audbind{display:flex;align-items:center;gap:6px;width:100%;background:none;border:none;
 color:var(--faint);font-family:var(--fm);font-size:9.5px;letter-spacing:.04em;
 padding:2px 4px 5px 0;cursor:pointer;text-align:left}
.audbind:hover{color:var(--text)}
.audbind.on{color:var(--intercom)}
/* Knuden ⚯ er et almindeligt tegn og ikke en emoji. Den tager tekstfarven,
   så den kan være grå og stilfærdig i stedet for at råbe — håndtrykket
   fyldte for meget på en linje, hvor den står ved siden af teksten. */
/* Samme rude som i tegningen – "bundet" skal se ens ud begge steder, og
   tegnet ⚯ var både bredt og uroligt. Teksten bliver i knappen, den vises
   bare ikke. */
.bindikon{flex:none;font-size:0;color:transparent;line-height:0;opacity:.85;
 width:8px;height:8px;display:inline-flex;align-items:center;justify-content:center}
.bindikon::before{content:'';display:block;width:6px;height:6px;box-sizing:border-box;
 border:1.2px solid #8a9bb0;transform:rotate(45deg)}
.audbind.on .bindikon{opacity:1}
.audbind.on .bindikon::before{border-color:#6fa8c7;background:#6fa8c7}
.bindtekst{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.audmaerke{flex:none;width:10px;font-size:0;color:transparent;line-height:0;opacity:.8;
 display:inline-flex;align-items:center;justify-content:center}
.audmaerke::before{content:'';display:block;width:5px;height:5px;box-sizing:border-box;
 border:1.2px solid #8a9bb0;transform:rotate(45deg)}
/* En plads der skrives fra tegningen kan ikke rettes her – der er kun ét
   sted at skrive teksten, og det er i tegningen. */
.plabel.fast,.audl.fast{display:flex;align-items:center;gap:6px;cursor:default;
 background:rgba(63,217,156,.07);border-color:#2f4a3d;color:var(--text)}
.plabel.fast{flex:1;min-width:0;border:1px solid #2f4a3d;border-radius:5px;padding:5px 7px;
 font:12px var(--fb);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.audl.fast{flex:1;min-width:0;border:1px solid #2f4a3d;border-radius:5px;padding:4px 7px;
 font:11.5px var(--fb);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fastmaerke{flex:none;width:10px;font-size:0;color:transparent;line-height:0;opacity:.8;
 margin-right:2px;display:inline-flex;align-items:center;justify-content:center}
.fastmaerke::before{content:'';display:block;width:5px;height:5px;box-sizing:border-box;
 border:1.2px solid #8a9bb0;transform:rotate(45deg)}
/* håndtrykkene i tegningen */
/* Håndtrykket stod på opacity:0 og dukkede først op, når musen var over
   linjen – så kunne man ikke finde det uden at vide, at det var der.
   Det står nu fremme hele tiden: dæmpet og gråt når intet er bundet,
   fuldt og i farve når det er. */
/* ── Knuden ────────────────────────────────────────────────────
   Mærket TEGNES med css – det er ikke et skrifttegn mere. Tegnet ⚯ er
   bredere end sin egen skriftstørrelse, så da renden blev smallere, flød
   det ud over kanten og lagde sig oven i signalprikken ved siden af. En
   ring, der er tegnet, kan ikke blive bredere end den plads, den får.

   Renden står der altid, også når intet er bundet, så linjerne ikke hopper,
   når man binder eller løsner. Men er der ikke bundet noget, er ringen
   usynlig: den dukker op, når musen er på linjen. Teksten i knappen bliver
   stående for skærmlæsere – den vises bare ikke. */
.bindknap{background:none;border:none;cursor:pointer;flex:none;padding:0;
 margin:0 4px 0 0;width:8px;height:8px;font-size:0;line-height:0;color:transparent;
 display:inline-flex;align-items:center;justify-content:center;
 opacity:0;transition:opacity .1s}
/* En RUDE, ikke en ring: signalprikken ved siden af er rund og fyldt, og de
   to må ikke kunne forveksles – to cirkler ved siden af hinanden lignede
   bare et dobbelt punkt. */
.bindknap::before{content:'';display:block;width:6px;height:6px;box-sizing:border-box;
 border:1.2px solid #8b9aab;transform:rotate(45deg)}
.ch:hover .bindknap,.feed:hover .bindknap{opacity:.8}
.bindknap:hover{opacity:1!important}
.bindknap:hover::before{border-color:#4a5a6a}
/* Bundet: ruden står fremme hele tiden og er fyldt – ellers kan man ikke
   se, at linjen hænger sammen med noget. */
.bindknap.on{opacity:1}
.bindknap.on::before{border-color:#5b86a8;background:#5b86a8}
.ch:hover .bindknap.on,.feed:hover .bindknap.on{opacity:1}
.bindplads{flex:none;width:8px;margin-right:4px}
.bindknap.ud{margin:0 0 0 6px}
/* Sporplanerne står ved siden af gruppenavnet, hvor man er i forvejen.
   Knappen er dæmpet, men synlig – man skal kunne finde den uden at lede. */
/* En bar ♪ på 10 px kunne ikke findes. Knappen har sit navn med nu – det er
   den vej ind til arkivet, man skal kunne se uden at lede. */
.sporknap{background:#fff;border:1px solid #d8d8d8;border-radius:999px;cursor:pointer;
 flex:none;padding:2px 9px;margin-left:8px;white-space:nowrap;
 font:600 9.5px var(--fm);letter-spacing:.07em;text-transform:uppercase;
 color:#6b6b6b}
.sporknap:hover{color:#8a5a00;border-color:var(--lyd);background:#fff7e8}
@media print{.sporknap{display:none!important}}
.audlist.bundet{border-left-color:var(--intercom);background:rgba(63,217,156,.05)}
.audlist.bundet .aud.set .audl{border-color:#2f4a3d;background:#141c18}
/* Listen er en flex-kolonne med en højdegrænse. Flex-børn krymper som
   standard, så med mange bunker blev hver enkelt mast ned til en stribe –
   og fordi bunken klipper sit indhold, stod bjælkerne tomme. De skal
   beholde deres højde og lade listen rulle i stedet. */
/* Gruppen er bundet på den side, pilen ikke længere peger. Vi skjuler det
   ikke – man skal kunne se det og slippe det. */
.bindanden{background:rgba(255,182,72,.08);border:1px solid #4a3f2b;border-radius:8px;
 padding:9px 11px;margin-bottom:10px;font-size:12px;line-height:1.6}

 text-transform:uppercase;color:var(--lyd);margin-bottom:3px}

 background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--text)}

.grpvalg.on{border-color:var(--intercom);background:rgba(63,217,156,.1)}

.grpsti{font-family:var(--fm);font-size:9.5px;color:var(--faint)}
.grptal{font-family:var(--fm);font-size:9.5px;color:var(--lyd)}
/* bunkerne i vælgeren – ét stykke udstyr ad gangen */

 border:none;color:var(--text);padding:9px 11px;cursor:pointer;text-align:left}

.bunkepil{font-size:8px;width:8px;flex:none;color:var(--faint)}

 letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

 color:var(--dim);cursor:pointer;padding:8px 10px;font:600 12px var(--fb)}

/* ── Video containere ──────────────────────────────────────────
   Én lang liste med søgebånd foroven. Rækken er smal, for der er flere

.vcbar{display:flex;flex-wrap:wrap;align-items:center;gap:7px;

.vcnr{width:62px;flex:none;background:var(--bg);border:1px solid var(--line);color:var(--dim);
 border-radius:5px;padding:5px 3px;font:10.5px var(--fm);text-align:center}
.vcret{width:38px;flex:none;background:var(--bg);border:1px solid var(--line);
 border-radius:5px;padding:4px 0;cursor:pointer;
 font:700 9px var(--fm);letter-spacing:.06em;color:var(--dim)}
.vcrad.ind .vcret{color:var(--net);border-color:#24384f}

.vcnavn{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);

 width:5px;height:5px;border-radius:50%;background:var(--ret,var(--lyd))}

 overflow:hidden;text-overflow:ellipsis;background:var(--panel);padding:2px 4px;border-radius:4px}
.port:hover .pby{display:block}
/* På en telefon "hænger" hover fast efter et tryk, så initialerne lagde sig
   oven i afkrydsningen. Der står hvem der satte hakket i linjens ⋯-menu. */

/* og hakkene skal være store nok til en finger */

 min-width:34px;min-height:34px}

/* fri placering af kortene */
.devcanvas{position:relative;width:3400px;height:2600px}
/* smalt kort: input og output under hinanden, så teksten stadig kan ses */
.dev.narrow .ports{grid-template-columns:1fr}
.dev.narrow .portcol.ins{border-right:none;border-bottom:1px solid var(--line)}
.dev{position:absolute}
/* kortene glider på plads, når et kort foldes ud – de hopper ikke */
#plan .dev{transition:transform .14s ease}
#plan .dev.moving{transition:none}
.dev.moving{opacity:.75;z-index:50;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.dev .rs{right:-5px;bottom:-5px;opacity:0}
.dev:hover .rs{opacity:.8}
/* P- og T-mærker der lyser når alt er sat */
.devmeta{display:flex;gap:6px;align-items:center;font-family:var(--fm);font-size:10px;color:var(--faint);white-space:nowrap}
/* ── Udstyret på kortet ────────────────────────────────────────
   Tre bokse i topbjælken: optik, kamera, stativ – i den rækkefølge man
   pakker dem. Prikken til venstre siger, om det er ledigt i jobbets dage.
   En stiplet kant viser den næste plads man mangler. */
 /* Boksene står midt i bjælken. Navnet fylder kun det, det skal – ellers
    skubber det udstyret helt over i P og T, og bjælken ser skæv ud. */
.udstyr{display:flex;align-items:center;gap:6px;margin:0 auto;flex:0 1 auto;min-width:0}
/* Navnet får en fast udgangsbredde i stedet for at æde hele bjælken, men må
   give efter, når kortet er smalt – ellers skubber det P og T ud over kanten. */
.devhead.medudstyr .devnames{flex:0 1 auto;width:172px;min-width:92px}
.devhead.medudstyr .devname,.devhead.medudstyr .devplace{width:100%}
.uplads{display:flex;flex-direction:column;align-items:flex-start;gap:1px;
 background:var(--bg);border:1px solid var(--line);border-radius:7px;
 padding:4px 9px 5px 9px;cursor:pointer;position:relative;text-align:left;
 flex:0 1 auto;min-width:72px;max-width:160px;font-family:inherit}
.uplads:hover{border-color:var(--dim);background:var(--panel)}
 /* Prikken sidder ved etiketten i stedet for ude i venstre kant. Den siger
    det samme, og udstyrets navn får de ti point ekstra, det manglede. */
.uetiket{font:8.5px var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
 display:flex;align-items:center;gap:5px;max-width:100%}
.unavn{font:11.5px var(--fb);color:var(--faint);white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis;max-width:100%}
.uplads.har .unavn{color:var(--text)}
.uetiket::before{content:'';flex:none;width:6px;height:6px;border-radius:50%;background:#333a45}
.u-ledig .uetiket::before{background:#3fd99c;box-shadow:0 0 7px rgba(63,217,156,.55)}
.u-presset .uetiket::before{background:#ffb648;box-shadow:0 0 7px rgba(255,182,72,.5)}
.u-optaget .uetiket::before{background:#ff6f6f;box-shadow:0 0 7px rgba(255,111,111,.55)}
.u-ukendt .uetiket::before{background:var(--faint)}
.uplads.u-optaget{border-color:#5a2f2f}
.uplads.naeste{border-color:var(--intercom);border-style:dashed}
/* Et smalt kort har ikke plads til tre bokse ved siden af navnet –
   så bryder topbjælken i stedet for at mase felterne sammen. */
.dev.narrow .devhead{flex-wrap:wrap}
.dev.narrow .udstyr{flex-wrap:wrap;order:5;width:100%;margin-top:2px}
.dev.narrow .uplads{flex:1 1 auto;max-width:none}
body.mobile .devhead{flex-wrap:wrap}
body.mobile .udstyr{order:5;width:100%;margin-top:4px;flex-wrap:wrap}
body.mobile .uplads{flex:1 1 30%;min-width:0;max-width:none;padding:6px 9px 7px 9px}
body.mobile .unavn{max-width:100%}

/* vælgeren */
.jobrow{display:flex;align-items:center;gap:12px;margin:-2px 0 12px;padding:9px 12px;
 background:var(--bg);border:1px solid var(--line);border-radius:8px}
.jobrow.har{border-color:#2f4a3d}
.jobtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

.jobtxt span{font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* .btn er width:100%. I en flex-række vil den derfor have hele bredden og
   maser teksten ned til ingenting, så den løber ud under knappen. I de her
   to rækker skal knappen kun fylde sit eget navn. */
.jobrow .btn,.ujobmangler .btn{width:auto;flex:none;white-space:nowrap;margin:0;padding:7px 14px}
.ujobmangler{background:rgba(255,182,72,.08);border:1px solid #4a3f2b;border-radius:8px;
 padding:9px 11px;margin-bottom:10px;font-size:12px;color:var(--text);
 display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ubredt{padding:7px 10px;font-size:11.5px;color:var(--faint)}
.uvalg{display:grid;grid-template-columns:1fr auto;gap:1px 10px;width:100%;text-align:left;
 background:none;border:none;border-bottom:1px solid var(--line);color:var(--text);
 padding:8px 10px;cursor:pointer;font-family:inherit}

.uvnavn{font:13px var(--fb);grid-column:1}

.uvstatus{grid-row:1/3;grid-column:2;align-self:center;font:10px var(--fm);
 letter-spacing:.04em;white-space:nowrap;color:var(--faint)}

.uvalg.u-presset .uvstatus{color:#ffb648}
.uvalg.u-optaget .uvstatus{color:#ff6f6f}

 color:var(--faint);border-radius:7px;padding:4px 9px;cursor:pointer;font:600 12px var(--fb);line-height:1}

 box-shadow:0 0 9px rgba(94,163,255,.35)}
/* overskrifter præcis over felterne */
.porthead{display:flex;align-items:center;gap:4px;padding:1px 0 4px;font-family:var(--fm);
 font-size:8.5px;color:var(--faint);letter-spacing:.06em}

/* initialer og sletteknap lægger sig ovenpå ved musen over, så rækken ikke hopper.
   De måles fra linjens højre kant – så når videoområdet har en ♪-plads yderst,
   skal de rykke tilsvarende ind, ellers lander ✕ oven i P-hakket. */

/* --- frit placerede elementer på arket --- */
#sheet{position:relative}

.ltot{border-top:1px solid #e0e0e0;margin-top:7px;padding-top:6px;font-family:var(--fm);font-size:10.5px;color:#777;display:flex;justify-content:space-between}

/* ── Forklaringsboksen i øverste højre hjørne ──────────────────
   Boksen står i arkets hoved ved siden af titlen – ikke oven på tegningen.
   Så kan den aldrig dække en sektion, hverken på skærmen eller på papir.
   En tom afstandsklods i venstre side holder titlen midt på arket. */
/* Boksen ligger i sin egen linje øverst til højre, OVER titlen. Den og titlen
   deler ingenting: trækker man i boksen, bliver titlen stående præcis hvor
   den er, og den er stadig centreret på arket. */
.sheethead{display:block}
.sheethead .infoboks{margin:0 0 12px auto}
.infoboks{position:relative;background:#fff;border:1px solid #c4c4c4;border-radius:5px;
 padding:calc(8px*var(--isk)) calc(12px*var(--isk));box-shadow:0 1px 4px rgba(0,0,0,.08);--isk:1}
/* Boksen er aflang: signalfarverne til venstre, navn og telefon ved siden af */
/* Rækken brydes ikke: signalfarverne ombryder inde i deres egen spalte, så
   navn og telefon bliver stående ved siden af i stedet for at falde ned under. */
.infoboks .iindhold{display:flex;align-items:flex-start;gap:calc(14px*var(--isk));flex-wrap:nowrap}
.infoboks.smal .iindhold{flex-wrap:wrap}
body.mobile .infoboks .iindhold{flex-wrap:wrap}
/* Farverne fylder kun det de skal. Trækker man boksen bred, bliver luften
   liggende ude i højre side i stedet for midt imellem farverne og navnet. */
.infoboks .isignaler{flex:0 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-content:flex-start;
 gap:calc(3px*var(--isk)) calc(13px*var(--isk))}
.infoboks .ichip{display:flex;align-items:center;gap:calc(6px*var(--isk));white-space:nowrap;
 font-size:calc(11px*var(--isk))}
.infoboks .idot{width:calc(10px*var(--isk));height:calc(10px*var(--isk));border-radius:50%;flex:none}
.infoboks .ifolk{flex:0 0 auto;border-left:1px solid #e3e3e3;padding-left:calc(12px*var(--isk));
 display:flex;flex-direction:column;gap:calc(3px*var(--isk))}
.infoboks .ifelt{display:flex;align-items:baseline;font-size:calc(11px*var(--isk));color:#333}
.infoboks .ifelt .ivaerdi{font-weight:600;overflow-wrap:anywhere;cursor:text;
 min-width:calc(64px*var(--isk));white-space:nowrap}
.infoboks .ifelt .ivaerdi.tom{font-weight:400;color:#b0b0b0}
/* Dagene er jobbets, ikke tegningens – de rettes ét sted, under Projekter.
   Her står de bare, i monospace så datoerne flugter. */
.infoboks .idage .ivaerdi{font-family:var(--fm);font-size:calc(10px*var(--isk));
 font-weight:500;color:#555;cursor:pointer}
.infoboks .idage .ivaerdi:hover{color:#111}
.infoboks .idage .ivaerdi.tom{font-weight:400;color:#b8b8b8}
@media print{.infoboks .idage .ivaerdi{color:#333}}
.infoboks:hover .rs{opacity:.85}
.infoboks:hover .fitools{opacity:1}
@media print{.infoboks .fitools,.infoboks .rs{display:none!important}}
/* Trækkes boksen smal, falder navn og telefon ned under farverne af sig selv */
.infoboks.smal .ifolk{border-left:none;padding-left:0;border-top:1px solid #e3e3e3;
 padding-top:calc(6px*var(--isk));margin-top:calc(3px*var(--isk));width:100%}
/* På telefonen er der ikke plads ved siden af titlen – så lægger den sig under */
body.mobile .infoboks{width:auto!important;margin:4px 0 16px;--isk:1!important}
body.mobile .infoboks .ifolk{border-left:none;padding-left:0;border-top:1px solid #e3e3e3;
 padding-top:6px;margin-top:3px;width:100%}
body.mobile .infoboks .rs{display:none}

/* håndtag til at trække i størrelsen */
.rs{position:absolute;right:-4px;bottom:-4px;width:13px;height:13px;border:1px solid #0a5bd3;background:#fff;border-radius:3px;cursor:nwse-resize;opacity:0;z-index:7}
.rs.edge{right:-5px;top:0;bottom:18px;height:auto;width:9px;border-radius:2px;cursor:ew-resize;z-index:5}
.rs.edge.left{left:-5px;right:auto}
/* Boksen hænger fast i højre kant, så den vokser til VENSTRE. Håndtaget
   sidder derfor i venstre hjørne – ellers trækker man den modsatte vej. */
.rs.venstre{left:-4px;right:auto;cursor:nesw-resize}

/* pilens retning */
.wire::after{content:'';position:absolute;top:-4.5px;width:0;height:0;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.wire:not(.rtl)::after{right:-1px;border-left:4.5px solid currentColor}
.wire.rtl::after{left:-1px;border-right:4.5px solid currentColor}
.wire.both::before{content:'';position:absolute;top:-4.5px;left:-1px;width:0;height:0;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;border-right:4.5px solid currentColor}
.endtag{font-family:var(--fm);font-size:9.5px;letter-spacing:.04em;padding:1px 5px;border:1px solid currentColor;border-radius:9px;white-space:nowrap;cursor:text;opacity:.85;margin:0 2px}
.endtag:hover{opacity:1;background:rgba(10,91,211,.09)}

/* Et felt med en skygge i: pladsholderen er den anden sides tekst, og den

 color:#7b8aa0;font-style:italic;opacity:1}

<script>
window.onerror=function(m,src,line,col){
  var d=document.createElement('div');
  d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#7f1d1d;color:#fff;'
    +'font:13px/1.5 monospace;padding:14px 18px;white-space:pre-wrap';
  d.textContent='SignalFlow kunne ikke starte:\n'+m+'\nlinje '+line+':'+col
    +'\n\nVis denne tekst til udvikleren.';
  (document.body||document.documentElement).appendChild(d);
};

/* ================= forklaringer =================
   Browserens egen boble kommer langsomt og kan ikke læses ordentligt.
   Den her overtager alle title-tekster og viser dem hurtigt ved musen. */
(function(){
 let box=null, timer=null, cur=null;
 const make=()=>{
  if(box)return box;
  box=document.createElement('div');
  box.id='tipbox';
  document.body.appendChild(box);
  return box;
 };
 const show=(el,x,y)=>{
  const t=el.getAttribute('data-tip'); if(!t)return;
  const b=make();
  b.textContent=t;
  b.style.display='block';
  const r=b.getBoundingClientRect();
  let left=x+14, top=y+18;
  if(left+r.width>innerWidth-8)left=innerWidth-r.width-8;
  if(top+r.height>innerHeight-8)top=y-r.height-12;
  b.style.left=Math.max(8,left)+'px';
  b.style.top=Math.max(8,top)+'px';
 };
 const hide=()=>{clearTimeout(timer); if(box)box.style.display='none'; cur=null};
 document.addEventListener('mouseover',e=>{
  /* På en telefon er der ingen mus – så lægger boblen sig bare i vejen */
  if(document.body.classList.contains('mobile')){hide();return}
  const el=e.target.closest('[title],[data-tip]');
  if(!el){hide();return}
  if(el.hasAttribute('title')){        // flyt teksten væk fra browseren
   el.setAttribute('data-tip',el.getAttribute('title'));
   el.removeAttribute('title');
  }
  if(el===cur)return;
  cur=el; clearTimeout(timer);
  const x=e.clientX, y=e.clientY;
  timer=setTimeout(()=>show(el,x,y),260);
 });
 document.addEventListener('mouseout',e=>{
  if(cur&&!cur.contains(e.relatedTarget))hide();
 });
 document.addEventListener('mousedown',hide);
 document.addEventListener('scroll',hide,true);
 window.addEventListener('blur',hide);
})();

/* ================= model ================= */
const LAYERS={video:'Video',lyd:'Lyd',intercom:'Intercom',net:'Net'};
const COL={video:'#c62828',lyd:'#9a6500',intercom:'#1e7a55',net:'#1e56b0'};
const DOT={video:'#ff5252',lyd:'#ffb648',intercom:'#3fd99c',net:'#5ea3ff'};
const TRANSPORTS=['EPL','Internet','SAT','GC Fiber','Fiber','Trådløs','Kabel','—'];
let seq=1; const id=()=>'x'+(seq++)+Date.now().toString(36).slice(-3);

const newSheet=(title='Nyt ark')=>({id:id(),title,sections:[]});

/* Ældre projekter har sider uden id. Uden id kan to maskiner ikke se, at det
   er den SAMME side – og så kan en rettelse gå tabt ved fletning. Vi giver dem
   et fast id ud fra pladsen, så begge maskiner når frem til det samme. */
function sikrePageIds(liste){
 (liste||[]).forEach((p,i)=>{ if(p&&!p.id)p.id='side'+(i+1) });
 return liste;
}
const newSection=(dst='Modtager',src='Afsender')=>({id:id(),src,dst,groups:[]});
const newGroup=(label='Ny kilde')=>({id:id(),label,feed:'TX 1',layer:'video',transport:'EPL',role:'primær',channels:[],sub:null});

/* ---- flyt en linje op eller ned ved at trække i den ----
   Numrene bliver på deres plads: det er teksten der flytter sig, ligesom når
   man flytter et signal til et andet stik. */
function dragRow(e, grip, rowSel, listeAf, felt, efter){
 e.preventDefault(); e.stopPropagation();
 const row=grip.closest(rowSel);
 const holder=row.parentElement;
 const raekker=[...holder.querySelectorAll(rowSel)];
 const fra=raekker.indexOf(row);
 row.classList.add('rowmoving');
 const mark=document.createElement('div');
 mark.className='rowmark';
 let til=fra;
 const vis=y=>{
  til=raekker.length;
  for(let i=0;i<raekker.length;i++){
   const r=raekker[i].getBoundingClientRect();
   if(y < r.top+r.height/2){til=i;break}
  }
  if(til<raekker.length)holder.insertBefore(mark,raekker[til]);
  else holder.appendChild(mark);
 };
 vis(e.clientY);
 const move=ev=>vis(ev.clientY);
 const up=()=>{
  document.removeEventListener('mousemove',move);
  document.removeEventListener('mouseup',up);
  mark.remove(); row.classList.remove('rowmoving');
  let ny=til>fra?til-1:til;
  if(ny===fra||ny<0)return;
  snap();
  const liste=listeAf();
  const numre=liste.map(x=>x[felt]);        // numrene hører til pladsen
  const [flyt]=liste.splice(fra,1);
  liste.splice(ny,0,flyt);
  liste.forEach((x,i)=>{x[felt]=numre[i]});
  efter();
 };
 document.addEventListener('mousemove',move);
 document.addEventListener('mouseup',up);
}

const newCh=(n)=>({id:id(),nr:'Ch. '+n,label:'',layer:'lyd'});

/* Tegningen kalder nummeret "nr", planen kalder det "n" – derfor feltnavnet.
   Mønsteret tager det SIDSTE tal i teksten, så både "Ch. 3" og "4W2" virker. */
const NRM=/^(.*?)(\d+)(\D*)$/;

/* Numrene i en gruppe hører til hver sin serie: "Ch. 1, Ch. 2 …" er én,
   "4W 1, 4W 2 …" en anden, og video har sin egen. To linjer er i samme serie,
   når de har samme signaltype OG samme tekst foran tallet.
   Uden det ville en slettet lydkanal trække intercom-numrene nedenunder med
   sig – 4W 1 blev til 4W 0. */
function nrSerie(x,felt){
 const m=x&&String(x[felt||'nr']||'').match(NRM);
 if(!m)return null;                                 // linjen har slet intet tal
 return (x.layer||'')+'\u0000'+m[1].trim().toLowerCase();
}
/* Ryk numrene i ÉN serie én op eller ned fra et bestemt sted. Alt andet
   nedenunder står helt stille.
   Vi tæller ikke om fra toppen: mange grupper springer med vilje – fx fra
   Ch. 8 til Ch. 11 – og de spring skal bevares. */
function skubSerie(liste,fra,retning,serie,felt){
 const f=felt||'nr';
 if(!serie)return;                                  // intet tal at rykke efter
 for(let i=fra;i<liste.length;i++){
  if(nrSerie(liste[i],f)!==serie)continue;
  const m=String(liste[i][f]||'').match(NRM);
  if(m)liste[i][f]=m[1]+(parseInt(m[2],10)+retning)+m[3];
 }
}
/* Find det nummer en ny linje skal have på den plads den lægger sig ind på */
function nyttNr(liste,i,felt){
 const f=felt||'nr';
 const efter=liste[i];
 const m=efter&&String(efter[f]||'').match(NRM);
 if(m)return m[1]+parseInt(m[2],10)+m[3];
 const foer=liste[i-1];
 const m2=foer&&String(foer[f]||'').match(NRM);
 if(m2)return m2[1]+(parseInt(m2[2],10)+1)+m2[3];
 return '';
}

/* Lad afsender-/modtagerbokse vokse, så de altid omslutter de bokse der er låst i dem.
   Kaldes efter hver tegning, så også print og eksport får de rigtige højder med. */
function fitBoxes(){
 el.querySelectorAll('.srcbox,.dstbox,.rows').forEach(c=>{
  let need=0;
  c.querySelectorAll(':scope > .fitem').forEach(n=>{
   need=Math.max(need, n.offsetTop + n.offsetHeight);
  });
  if(!need)return;
  const cur=parseFloat(c.style.minHeight)||0;
  c.style.minHeight=Math.max(cur, need+12)+'px';
 });
}


/* ---- flyt faner ved at trække i dem ----
   Man skal kunne klikke på en fane uden at flytte den, derfor går den først
   i træk-tilstand, når musen har bevæget sig et stykke. */
let faneFlyttet=false;
function dragTab(e, tab, tabSel, listeAf, aktivIndex, saetAktiv, efter){
 if(e.button!==0)return;
 const holder=tab.parentElement;
 const start=e.clientX;
 let aktiv=false, til=-1, mark=null;
 const faner=()=>[...holder.querySelectorAll(tabSel)];
 const vis=x=>{
  const f=faner().filter(t=>t!==tab);
  til=f.length;
  for(let i=0;i<f.length;i++){
   const r=f[i].getBoundingClientRect();
   if(x < r.left+r.width/2){til=i;break}
  }
  if(!mark){mark=document.createElement('div');mark.className='tabmark'}
  if(til<f.length)holder.insertBefore(mark,f[til]); else holder.insertBefore(mark,tab.nextSibling);
 };
 const move=ev=>{
  if(!aktiv){
   if(Math.abs(ev.clientX-start)<5)return;        // stadig et klik
   aktiv=true; faneFlyttet=true; tab.classList.add('tabmoving');
  }
  ev.preventDefault(); vis(ev.clientX);
 };
 const up=ev=>{
  document.removeEventListener('mousemove',move);
  document.removeEventListener('mouseup',up);
  if(mark)mark.remove();
  tab.classList.remove('tabmoving');
  if(!aktiv){faneFlyttet=false;return}
  const liste=listeAf();
  const fra=[...holder.querySelectorAll(tabSel)].indexOf(tab);
  if(fra<0||til<0||til===fra){faneFlyttet=false;efter();return}
  snap();
  const aktivSide=liste[aktivIndex()];            // husk hvilken side der er åben
  const [flyt]=liste.splice(fra,1);
  liste.splice(til,0,flyt);
  saetAktiv(Math.max(0,liste.indexOf(aktivSide)));
  efter();
  setTimeout(()=>{faneFlyttet=false},50);
 };
 document.addEventListener('mousemove',move);
 document.addEventListener('mouseup',up);
}

/* ── Håndtrykkene i tegningen ──────────────────────────────────
   Venstre side af en kanal: hvor i planen signalet kommer fra (INPUT).
   Højre side af gruppen: hvilket OUTPUT i planen gruppen fodrer.
   Pladsen er der altid, også når der ikke er bundet noget – ellers ville
   linjerne hoppe, hver gang man bandt eller løsnede. */
function bindKnapIn(g,ch){
 /* Lyd peger på et lydinput, video peger på et videoinput. Intercom og net
    har ikke noget at pege på endnu, så de får en tom plads, der holder
    linjerne på række. */
 const lag=ch.layer||'lyd';
 if(lag!=='lyd'&&lag!=='video')return '<span class="bindplads"></span>';
 const b=ch.ind;
 const hvor=b?indMaalNavn(b):'';
 return `<button class="bindknap ind ${b?'on':''}" data-bindin="${g.id}|${ch.id}"
   title="${b?'Kommer fra '+esc(hvor)+' – klik for at skifte eller løsne'
            :'Vælg hvor '+(lag==='video'?'videoen':'kanalen')+' kommer fra i planen'}">⚯</button>`;
}
function bindKnapUd(g){
 const u=udFor(g.id);
 const sider=grpSider(g);
 const ord=sider.length>1?'videosignal':(sider[0]==='ins'?'videoinput':'videooutput');
 return `<button class="bindknap ud ${u?'on':''}" data-bindout="${g.id}"
   title="${u?'Gruppens lyd ligger på '+esc((u.dv.name||'')+' · '+SIDENAVN[u.side].toLowerCase()+' '+(u.port.n||'')+' '+(u.port.label||''))+' – klik for at skifte eller løsne':'Bind gruppens lyd til et '+ord+' i planen'}">⚯</button>`;
}
/* Hvad står der i virkeligheden på linjen? Er den bundet fra tegningen, er
   det tegningens tekst – ellers planens eget felt. Print, regneark og
   optællinger skal bruge DEN, ikke det tomme felt. */
function portTekst(dom2,dv,p,side){
 /* Det man SER, er det der printes. Har planen sin egen tekst, er det
    den; ellers står skyggen fra tegningen, og så er det den. */
 if((p.label||'').trim())return p.label;
 if(side==='ins'){
  const sp=plabelSpoeg(dom2,dv,p,side);
  if(sp)return sp.tekst;
 }
 return p.label||'';
}

/* Hvad står der i tegningen ud for den her linje i planen? Før blev feltet
   LÅST med tegningens tekst, så man ikke kunne skrive sin egen. Men
   tegningen og kanalplanen går til to slags kolleger og skal kunne
   forklare det samme på hver sin måde – så nu er teksten en skygge, man
   kan hente over eller lade være. */
function plabelSpoeg(dom2,dv,p,side){
 if(side!=='ins')return null;
 const alle=indAlleFor(dom2,dv.id,p.id);
 if(!alle.length)return null;
 const med=alle.filter(x=>(x.ch.label||'').trim());
 if(!med.length)return null;
 return {tekst:med[0].ch.label,
         fra:(med[0].g.label||'tegningen')+(med[0].ch.nr?' · '+med[0].ch.nr:''),
         flere:med.length>1?med.length:0};
}
/* Feltet med skyggen i. Bruges af alle tre slags linjer i planen –
   almindelige, kameralinjer og frekvenslinjer – så de opfører sig ens. */
function planLabelMaerke(dom2,dv,p,side){
 const sp=plabelSpoeg(dom2,dv,p,side);
 return sp?`<span class="fastmaerke" title="${esc('Hænger sammen med '+sp.fra
   +' – teksten der er: '+sp.tekst)}">⚯</span>`:'';
}
function planLabelFelt(dom2,dv,p,side,ekstra){
 const sp=plabelSpoeg(dom2,dv,p,side);
 const ph=sp?esc(sp.tekst):(ekstra&&ekstra.ph?esc(ekstra.ph):'—');
 const t=(sp&&!p.label)
   ? esc('Står i '+sp.fra+': '+sp.tekst+' — mellemrum eller enter henter den over'
         +(sp.flere?' ('+sp.flere+' kanaler peger herpå)':''))
   : esc(p.label);
 return `${sp?planLabelMaerke(dom2,dv,p,side):''}<input class="plabel${(!p.label&&sp)?' harspoeg':''}" value="${esc(p.label)}"
   list="lbls" placeholder="${ph}" title="${t}"
   ${sp?`data-spoeg="${esc(sp.tekst)}"`:''}
   ${(ekstra&&ekstra.disabled)?'disabled':''}
   data-plabel="${dv.id}|${side}|${p.id}">`;
}
/* Beholdes for de steder der kun spørger OM der er en binding. */

/* Navnet på det sted i planen en kanal kommer fra */
function indMaalNavn(b){
 const p=ensurePlan();
 const dv=((p[b.dom]||{}).devices||[]).find(x=>x.id===b.dev);
 if(!dv)return 'et sted der ikke findes længere';
 const port=(dv.ins||[]).find(x=>x.id===b.port);
 if(!port)return dv.name||'';
 if(b.aud){
  const a=audListe(port).find(x=>x.id===b.aud);
  return (dv.name||'')+' · '+(port.label||port.n||'')+' · '+(a?a.n:'lydkanal');
 }
 return (dv.name||'')+' · '+PLANDOMS[b.dom]+' input '+(port.n||'');
}

/* ── Forklaringsboksen ─────────────────────────────────────────
   Hvert ark har en boks i øverste højre hjørne med signalfarverne, hvem der
   har lavet tegningen og et telefonnummer. Den er der fra starten – også på
   gamle projekter, hvor der slet ikke står noget om den endnu.
   Navn og telefon gælder HELE projektet: man skriver dem ét sted, og så står
   de på alle sider. Om boksen vises, og hvor stor den er, er derimod sidens
   eget – man kan sagtens ville have den væk på én enkelt side. */
const INFO_B=350;                  // bredden boksen starter med – lige akkurat om indholdet
const INFO_MIN=230, INFO_MAX=820;
const INFO_SMAL=300;               // under denne bredde falder navn og telefon ned under
function infoBoks(sh){const s=sh||sheet(); if(!s.info)s.info={}; return s.info}
function infoVises(sh){const s=sh||sheet(); return !s.info||s.info.vis!==false}
function infoBredde(sh){
 const o=(sh||sheet()).info||{};
 return Math.max(INFO_MIN,Math.min(INFO_MAX,+o.w||INFO_B));
}
/* Gå alle ark igennem – både siderne og de underark, der ligger inde i
   grupperne. Bruges når navn eller telefon skal slå igennem overalt. */
function alleArk(fn){
 const gaa=sh=>{
  if(!sh)return;
  fn(sh);
  (sh.sections||[]).forEach(sc=>(sc.groups||[]).forEach(g=>{if(g.sub)gaa(g.sub)}));
 };
 (pages||[]).forEach(gaa);
}
/* Navn og telefon skrives ét sted og gælder hele projektet: har siden ikke sit
   eget, låner den fra den første side der har noget. Så får nye sider og
   underark det med af sig selv, uden at vi skal stemple dem ved oprettelsen.
   Skriver man noget andet på en enkelt side, står DET ved magt på den side. */
function infoFra(felt){
 let fundet='';
 alleArk(a=>{ if(!fundet && a.info && a.info[felt]) fundet=a.info[felt] });
 return fundet;
}
/* Står der slet intet navn i projektet, foreslår vi den der er logget ind.
   Forslaget bliver først skrevet ind, når nogen retter feltet – ellers ville en
   kollega, der bare kigger, komme til at stå som ophavsmand. */
function infoAf(sh){
 const o=(sh||sheet()).info||{};
 if(o.af)return {tekst:o.af, gemt:true};
 const laant=infoFra('af');
 if(laant)return {tekst:laant, gemt:true};
 const m=meName();
 return {tekst:(m&&m!=='?')?m:'', gemt:false};
}
function infoTlf(sh){
 const o=(sh||sheet()).info||{};
 return o.tlf || infoFra('tlf') || '';
}
/* Skriften følger bredden, men kun til en vis grænse – ellers bliver teksten
   ulæselig, når boksen trækkes helt sammen. */
/* Skriften vokser kun halvt så hurtigt som boksen. Trækker man den bredere,
   skal den ekstra plads mest blive til plads – ellers bliver boksen bare en
   forstørrelse af sig selv og aldrig mere aflang. */
const infoSkala=w=>Math.max(.82,Math.min(1.5,1+(w/INFO_B-1)*0.45));
function infoHTML(sh){
 const w=infoBredde(sh);
 const af=infoAf(sh);
 const tlf=infoTlf(sh);
 /* Ingen etiketter: et navn og et telefonnummer kan man se hvad er. Først når
    feltet er tomt, står der hvad man skal skrive – ellers kunne man ikke gætte
    hvor man trykker. */
 const felt=(tom,vaerdi,noegle,hint)=>
  `<div class="ifelt">`
  +`<span class="ivaerdi ${vaerdi?'':'tom'}" data-e="${noegle}" title="${hint}">`
  +`${esc(vaerdi||tom)}</span></div>`;
 return `<div class="infoboks ${w<INFO_SMAL?'smal':''}" style="width:${w}px;--isk:${infoSkala(w).toFixed(3)}">
   <div class="iindhold">
     <div class="isignaler">
       ${Object.keys(LAYERS).map(k=>
         `<span class="ichip"><span class="idot" style="background:${DOT[k]}"></span>`
        +`<span style="color:${COL[k]}">${esc(LAYERS[k])}</span></span>`).join('')}
     </div>
     <div class="ifolk">
       ${felt('skriv dit navn',af.tekst,'infoaf','Hvem har lavet tegningen – skrives én gang og står på alle sider')}
       ${felt('telefonnummer',tlf,'infotlf','Telefonnummer – skrives én gang og står på alle sider')}
       <div class="ifelt idage">
         <span class="ivaerdi ${harJob()?'':'tom'}" data-jobboks="1"
           title="${harJob()?'Jobbets dage – klik for at rette dem':'Jobbets dage – klik for at sætte dem. De gælder hele projektet.'}"
           >${esc(harJob()?jobKort():'jobbets dage')}</span>
       </div>
     </div>
   </div>
   <span class="fitools">
     <button class="mini" data-infovaek="1" title="Fjern forklaringsboksen fra denne side">✕</button>
   </span>
   <span class="rs venstre" data-rs="info|${sh.id}" title="Træk for at gøre boksen større eller mindre"></span>
 </div>`;
}

/* ── Sidepanelet i de øvrige visninger ─────────────────────────
   Panelet stod tomt i plan, blokdiagram og lager – og fanen til at åbne
   det hang der uden noget at åbne. Nu viser det, hvor langt man er, og de
   få ting man ellers skal lede efter. */
function sideAndet(){
  const s=document.getElementById('side'); if(!s) return;
  if(view==='plan'){
    const p=ensurePlan();
    const tal=k=>{
      const ds=alive((p[k]||{devices:[]}).devices||[]);
      let linjer=0, sat=0, tjek=0;
      ds.forEach(d=>['ins','outs'].forEach(side2=>alive(d[side2]||[]).forEach(x=>{
        if(!x.label) return; linjer++; if(x.patched)sat++; if(x.checked)tjek++;
      })));
      return {kort:ds.length, linjer, sat, tjek};
    };
    const raek=Object.keys(PLANDOMS).map(k=>{
      const t=tal(k), pct=t.linjer?Math.round(t.tjek/t.linjer*100):0;
      return `<div class="sdrow ${k===planDom?'on':''}" data-sdom="${k}" title="Skift til ${PLANDOMS[k]}">
        <span class="sdnavn">${PLANDOMS[k]}</span>
        <span class="sdtal">${t.kort} kort · ${t.linjer} linjer</span>
        <span class="sdbar"><i style="width:${pct}%"></i></span>
        <span class="sdpct">${t.linjer?pct+'%':'—'}</span></div>`;
    }).join('');
    /* frekvenser: advar hvis den samme står to steder */
    let dub='';
    if(planDom==='freq'){
      const brugt={};
      alive((p.freq||{devices:[]}).devices||[]).forEach(d=>alive(d.ins||[]).forEach(x=>{
        const f=(x.freq||'').trim(); if(f)(brugt[f]=brugt[f]||[]).push(d.name);
      }));
      const d2=Object.keys(brugt).filter(f=>brugt[f].length>1);
      if(d2.length) dub=`<div class="sadvarsel">⚠ Samme frekvens flere steder:<br>${
        d2.map(f=>esc(f)+' <em>'+esc([...new Set(brugt[f])].join(', '))+'</em>').join('<br>')}</div>`;
    }
    s.innerHTML=`<h2>PLAN</h2><div class="sub">${PLANDOMS[planDom]}</div>
      <div class="sdliste">${raek}</div>${dub}
      <div class="hint">
        <b>Sådan arbejder man</b>
        <div class="symliste">
          <div><span class="ikon">✎</span><span>klik i et felt og skriv · <kbd>Enter</kbd> går til næste linje</span></div>
          <div><span class="ikon">P</span><span>patchet · <b>T</b> tjekket – initialerne viser hvem der satte hakket</span></div>
          <div><span class="ikon">⋯</span><span>muligheder for linjen</span></div>
          <div><span class="ikon">⠿</span><span>træk linjen op eller ned</span></div>
          <div><span class="ikon">🔗</span><span>Del link: modtageren kan rette i planen uden at logge ind</span></div>
        </div>
        ${planDom==='freq'?'Frekvensplanen advarer selv, hvis den samme MHz står to gange på samme system.':''}

/* tekstfelt i højrepanelet: ét undo-snapshot pr. indtastning, ikke pr. bogstav */
function bindText(inp,apply){

const mEl=document.getElementById('modal');
function closeModal(){mEl.classList.remove('on');mEl.innerHTML=''}
function openModal(title,sub,body,onMount){
 mEl.innerHTML=`<div class="mbox"><h3>${esc(title)}</h3><div class="msub">${esc(sub)}</div>${body}</div>`;
 mEl.classList.add('on');

/* Vinduet må KUN lukke, når man både trykker og slipper på den mørke baggrund.
   Ellers lukker det, når man markerer tekst i et felt og kommer til at slippe
   musen uden for vinduet – og så var arbejdet tabt. */
let trykStartedeUdenfor=false;
/* Hvor startede museklikket? Bruges til at kende forskel på et rigtigt klik
   og et træk, der bare endte et andet sted – fx når man markerer tekst. */
let trykStart=null;
document.addEventListener('mousedown',e=>{trykStart=e.target},true);
mEl.addEventListener('mousedown',ev=>{trykStartedeUdenfor = ev.target===mEl});
mEl.addEventListener('click',ev=>{
 if(ev.target===mEl && trykStartedeUdenfor && mEl.dataset.locked!=='1')closeModal();
 trykStartedeUdenfor=false;
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&mEl.classList.contains('on')&&mEl.dataset.locked!=='1'){closeModal()}},true);

/* gør en hex-farve mørkere/lysere */
function shade(hex,amt){
 const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||'');
 if(!m)return hex;
 const f=n=>Math.max(0,Math.min(255,parseInt(n,16)+amt)).toString(16).padStart(2,'0');
 return '#'+f(m[1])+f(m[2])+f(m[3]);
}

/* ---- kopiering ---- */
function reId(sh){sh.sections.forEach(s=>{s.id=id();s.groups.forEach(g=>{g.id=id();g.channels.forEach(c=>c.id=id());if(g.sub)reId(g.sub)})})}
function cloneGroup(g){const c=JSON.parse(JSON.stringify(g));c.id=id();c.channels.forEach(ch=>ch.id=id());if(c.sub)reId(c.sub);return c}
function cloneSection(sc){const c=JSON.parse(JSON.stringify(sc));c.id=id();c.groups=c.groups.map(g=>cloneGroup(g));return c}

/* alle sektioner på tværs af sider, til målvælgeren */
/* Et låst ark må heller ikke kunne modtage noget udefra – ellers kan man
   kopiere ind i en plan, der er sendt videre. Og den side man står på er
   næsten altid målet, så den kommer først. */
function sideLaast(pi){ return !!(pages[pi]&&pages[pi].laast) }
function sorterMaal(out){
  return out.sort((a,b)=>(a.pi===activePage?0:1)-(b.pi===activePage?0:1));
}
function maalOption(t,i){
  const l=sideLaast(t.pi);
  return `<option value="${i}"${l?' disabled':''}${(!l&&t.pi===activePage&&!maalOption._valgt)?(maalOption._valgt=1,' selected'):''}>`
    +esc(t.label)+(l?'  🔒 låst':'')+'</option>';
}
function allSectionTargets(){
 const out=[];
 pages.forEach((p,pi)=>p.sections.forEach(sc=>out.push({pi,sc,label:p.title+' › '+sc.src+' → '+sc.dst})));
 return sorterMaal(out);
}
function allGroupTargets(){
 const out=[];
 pages.forEach((p,pi)=>p.sections.forEach(sc=>sc.groups.forEach(g=>out.push({pi,sc,g,label:p.title+' › '+sc.dst+' › '+(g.feed||'')+' '+g.label}))));
 return sorterMaal(out);
}


/* Sikkerhedsnet for kopiering og flytning: uanset hvordan man er nået hertil,
   skrives der aldrig i et låst ark. */
function maalErLaast(pi){
  if(!sideLaast(pi)) return false;
  alert('"'+pages[pi].title+'" er låst.\n\nLås arket op, hvis der skal kopieres ind i det.');
  return true;
}

    </select></div>

  <div id="pGroup">
    <div class="msec">Placér gruppen i</div>
    <div class="mf"><select name="secTarget">
      ${(maalOption._valgt=0, secs.map(maalOption).join(''))}
    </select></div>
    <label class="chk"><input type="checkbox" name="move"> Flyt i stedet for at kopiere</label>
  </div>

  <div id="pChans" style="display:none">
    <div class="msec">Vælg kanaler</div>
    <div class="chklist">
      ${g.channels.map((c,i)=>`<label class="chk"><input type="checkbox" name="ch" value="${i}" checked>
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${DOT[c.layer]}"></span>
        ${esc(c.nr)} ${esc(c.label||'')}</label>`).join('')||'<div class="msub">Ingen kanaler</div>'}
    </div>
    <div class="msec">Ind i gruppen</div>
    <div class="mf"><select name="grpTarget">
      ${(maalOption._valgt=0, grps.map(maalOption).join(''))||'<option value="">Ingen andre grupper</option>'}
    </select></div>
  </div>

  <div class="mrow">
    <button class="btn go" data-ok="1">Udfør</button>
    <button class="btn" data-cancel="1">Annullér</button>
  </div>`,root=>{
   const what=root.querySelector('[name="what"]');
   what.onchange=()=>{
     root.querySelector('#pGroup').style.display = what.value==='group'?'':'none';
     root.querySelector('#pChans').style.display = what.value==='chans'?'':'none';
   };
   root.querySelector('[data-cancel]').onclick=closeModal;
   root.querySelector('[data-ok]').onclick=()=>{
     const t0 = what.value==='group' ? secs[+val(root,'secTarget')] : grps[+val(root,'grpTarget')];
     if(t0 && maalErLaast(t0.pi))return;
     snap();
     if(what.value==='group'){
       const t=secs[+val(root,'secTarget')]; if(!t)return closeModal();
       t.sc.groups.push(cloneGroup(g));
       if(root.querySelector('[name="move"]').checked){
         const [,sc]=findGrp(gid); sc.groups=sc.groups.filter(x=>x.id!==gid);
       }
     }else{
       const t=grps[+val(root,'grpTarget')]; if(!t)return closeModal();
       const picked=[...root.querySelectorAll('[name="ch"]:checked')].map(i=>g.channels[+i.value]);
       picked.forEach(c=>{const n=JSON.parse(JSON.stringify(c));n.id=id();t.g.channels.push(n)});
     }
     closeModal(); sel=null; draw();
   };
 });
}

/* kopiér en hel sektion til en anden side */
function copySection(secId){
 const sc=sheet().sections.find(s=>s.id===secId); if(!sc)return;
 openModal('Kopiér sektion',esc(sc.src)+' → '+esc(sc.dst),`
  <div class="mf"><label>Til side</label>
    <select name="page">
      ${pages.map((p,i)=>`<option value="${i}"${p.laast?' disabled':''}${i===activePage&&!p.laast?' selected':''}>`
        +esc(p.title)+(p.laast?'  🔒 låst':'')+(i===activePage?'  (denne side)':'')+'</option>').join('')}
    </select></div>
  <div class="mgrid one">
    <label class="chk"><input type="checkbox" name="move"> Flyt i stedet for at kopiere</label>
    <label class="chk"><input type="checkbox" name="empty"> Kopiér kun opsætningen (uden kanaler)</label>
  </div>
  <div class="mrow">
    <button class="btn go" data-ok="1">Udfør</button>
    <button class="btn" data-cancel="1">Annullér</button>
  </div>`,root=>{
   root.querySelector('[data-cancel]').onclick=closeModal;
   root.querySelector('[data-ok]').onclick=()=>{
     const pi=+val(root,'page');
     if(maalErLaast(pi))return;
     snap();
     const copy=cloneSection(sc);
     if(root.querySelector('[name="empty"]').checked)copy.groups.forEach(g=>g.channels=[]);
     pages[pi].sections.push(copy);
     if(root.querySelector('[name="move"]').checked&&pi!==activePage){
       sheet().sections=sheet().sections.filter(s=>s.id!==secId);
     }
     closeModal(); sel=null; draw();
   };
 });
}
