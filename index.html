/* ================= samtidig redigering =================
   Hvert par sekunder spørger vi databasen, om nogen har gemt noget nyere.
   Er der det, flettes deres ændringer ind i vores – linje for linje, hvor den
   nyeste rettelse vinder. Derfor kan to personer rette hver sin stagebox
   samtidig uden at slette for hinanden. */
let lastSync=null;      // serverens tidsstempel vi sidst har set
let pushTimer=null, syncTimer=null, dirty=false;

function planDevices(pl,k){return (pl&&pl[k]&&pl[k].devices)||[]}

function mergePlan(mine,theirs){
 if(!theirs)return mine;
 if(!mine)return theirs;
 const out={};
 Object.keys(PLANDOMS).forEach(k=>{
  const a=planDevices(mine,k), b=planDevices(theirs,k);
  const byId={}; const order=[];
  const put=d=>{if(!byId[d.id]){byId[d.id]=JSON.parse(JSON.stringify(d));order.push(d.id)}
                else byId[d.id]=mergeDev(byId[d.id],d)};
  a.forEach(put); b.forEach(put);
  out[k]={devices:order.map(i=>byId[i])};
 });
 return out;
}
function mergeDev(a,b){
 const d=JSON.parse(JSON.stringify(a));
 /* en sletning står ved magt, medmindre den anden side har rettet bagefter */
 const adel=a.del||0, bdel=b.del||0, del=Math.max(adel,bdel);
 d.del = del && del >= Math.max(newestTouch(a),newestTouch(b)) ? del : 0;
 if((b.mt||0)>(a.mt||0)){d.name=b.name;d.place=b.place;d.mt=b.mt}
 ['ins','outs'].forEach(side=>{
  const byId={}; const order=[];
  (a[side]||[]).forEach(p=>{byId[p.id]=p;order.push(p.id)});
  (b[side]||[]).forEach(p=>{
   if(!byId[p.id]){byId[p.id]=p;order.push(p.id)}
   else{
    const cur=byId[p.id];
    if(Math.max(p.at||0,p.del||0) > Math.max(cur.at||0,cur.del||0))byId[p.id]=p;
   }
  });
  d[side]=order.map(i=>byId[i]);
 });
 return d;
}

let pollN=0;
async function pull(){
 if(!cloudId||!session())return;
 applyingRemote=true;
 try{ return await pullInner() } finally { applyingRemote=false }
}
async function pullInner(){
 let r;
 try{ r=await sbFetch('signalflow_projects?id=eq.'+cloudId+'&select=updated_at,updated_by'); }
 catch(e){ setSync('ingen forbindelse',true); return; }
 if(!r||!r.length)return;
 const t=r[0].updated_at;
 pollN++;
 /* Står tidsstemplet stille (fx hvis triggeren ikke er kørt), henter vi alligevel
    hele projektet en gang imellem og sammenligner indholdet. */
 const forced = (pollN%4===0);
 if(lastSync&&t===lastSync&&!forced){setSync('opdateret');return}
 const full=await sbFetch('signalflow_projects?id=eq.'+cloudId+'&select=name,data,updated_at,updated_by');
 if(lastSync&&t===lastSync&&forced){
  const same=JSON.stringify((full[0].data||{}).plan||null)===JSON.stringify(ensurePlan());
  if(same){setSync('opdateret');return}
 }
 if(!lastSync){lastSync=t;setSync('opdateret');
  const d0=full[0].data||{};
  plan=mergePlan(ensurePlan(),d0.plan);
  if(view==='plan')drawPlan();
  return;}
 const d=full[0].data||{};
 const foc=focusedRef();
 const keep=foc&&foc.dataset.plabel?{ref:foc.dataset.plabel,val:foc.value}:null;
 plan=mergePlan(ensurePlan(),d.plan);
 if(keep){
  const [did,side,pid]=keep.ref.split('|');
  const dv=(planDevices(plan,planDom)||[]).find(x=>x.id===did);
  const p=dv&&dv[side].find(x=>x.id===pid);
  if(p)p.label=keep.val;      // det man er i gang med at skrive, vinder
 }
 if(!dirty&&d.pages)pages=d.pages;          // tegningen tages kun hvis vi ikke selv har rettet
 if(!dirty&&d.name)projectName=d.name;
 if(activePage>=pages.length)activePage=0;
 doc=pages[activePage];
 lastSync=full[0].updated_at;
 setSync('opdateret · '+(full[0].updated_by||'')); 
 autosave();
 if(view==='plan')syncPlanDOM(); else if(view==='blocks'){if(!bdrag&&!linkFrom)drawBlocks()} else draw();
 if(dirty)push();                            // send vores egne rettelser videre
}

function push(){
 clearTimeout(pushTimer);
 pushTimer=setTimeout(async()=>{
  if(!cloudId||!session()||!dirty)return;
  try{

/* Supabase viser adressen med /rest/v1/ bagpå. Vi sætter den selv på,
   så den fjernes her, uanset hvordan brugeren har indsat den. */
function baseUrl(u){
 return String(u||'').trim().replace(/\/+$/,'').replace(/\/rest\/v1$/i,'');
}

/* ---- login ---- */
const session=()=>{try{return JSON.parse(load(LS_SESSION)||'null')}catch(e){return null}};
const setSession=s=>{s?store(LS_SESSION,JSON.stringify(s)):localStorage.removeItem(LS_SESSION)};
const userName=()=>{const s=session();return s&&s.email?s.email:''};

async function authCall(grant,body){
 const c=cfg();
 if(!c.url||!c.key)throw new Error('Databasen er ikke sat op endnu.');
 let r;
 try{
  r=await fetch(baseUrl(c.url)+'/auth/v1/token?grant_type='+grant,{
   method:'POST',
   headers:{'apikey':c.key,'Content-Type':'application/json'},
   body:JSON.stringify(body)});
 }catch(e){throw new Error('Kunne ikke få forbindelse til serveren.')}
 const t=await r.text();
 let d={}; try{d=JSON.parse(t)}catch(e){}
 if(!r.ok){
  const m=(d.error_description||d.msg||d.message||'').toLowerCase();
  if(m.includes('invalid'))throw new Error('Forkert e-mail eller adgangskode.');
  if(m.includes('confirm'))throw new Error('Brugeren er ikke bekræftet endnu. Bekræft e-mailen, eller slå bekræftelse fra i Supabase.');
  throw new Error(d.error_description||d.msg||('Login mislykkedes ('+r.status+')'));
 }
 return d;
}
async function signIn(email,password){
 const d=await authCall('password',{email:email,password:password});
 setSession({access_token:d.access_token,refresh_token:d.refresh_token,
             email:(d.user&&d.user.email)||email});
 return true;
}
async function refreshSession(){
 const s=session(); if(!s||!s.refresh_token)return false;
 try{
  const d=await authCall('refresh_token',{refresh_token:s.refresh_token});
  setSession({access_token:d.access_token,refresh_token:d.refresh_token,email:s.email});
  return true;
 }catch(e){setSession(null);return false}
}
function signOut(){
 setSession(null); cloudId=null;
 /* den lokale kopi ryddes, så næste bruger af maskinen ikke kan se noget */
 try{localStorage.removeItem(LS_DATA)}catch(e){}
 pages=[blank()]; activePage=0; doc=pages[0]; plan=blankPlan(); blocks=null;
 projectName='Nyt projekt'; lastSync=null; dirty=false;

async function sbFetch(path,opts,retried){
 const c=cfg();
 if(!c.url||!c.key)throw new Error('Databasen er ikke sat op endnu.');
 const s=session();
 if(!s)throw new Error('Du er ikke logget ind.');
 let r;
 try{
  r=await fetch(baseUrl(c.url)+'/rest/v1/'+path,Object.assign({
    headers:{'apikey':c.key,'Authorization':'Bearer '+s.access_token,
             'Content-Type':'application/json','Prefer':'return=representation'}
  },opts||{}));
 }catch(e){
  throw new Error('Kunne ikke få forbindelse. Tjek projekt-URL og at du er på nettet.');
 }
 if(r.status===401&&!retried){
  /* adgangen er udløbet – forny og prøv igen én gang */
  if(await refreshSession())return sbFetch(path,opts,true);
  if(typeof lockOut==='function')lockOut();
  throw new Error('Du er blevet logget ud. Log ind igen.');
 }
 if(r.status===401||r.status===403)
  throw new Error('Adgang nægtet. Tjek at din bruger har adgang i reglerne på tabellen.');
 if(r.status===404)
  throw new Error('Tabellen findes ikke. Kør SQL-koden i opsætningen.');
 if(!r.ok)throw new Error('Databasen svarede '+r.status+': '+(await r.text()).slice(0,140));
 const t=await r.text();
 return t?JSON.parse(t):null;
}

create or replace function sf_plan_get(tok uuid)
returns table(name text, plan jsonb, updated_at timestamptz, updated_by text)
language sql security definer set search_path = public as $$
  select p.name, p.data->'plan', p.updated_at, p.updated_by
  from signalflow_projects p where p.share_token = tok
$$;

create or replace function sf_plan_set(tok uuid, newplan jsonb, who text)
returns timestamptz language plpgsql security definer set search_path = public as $$
declare ts timestamptz;
begin
  update signalflow_projects
     set data = jsonb_set(data, '{plan}', newplan, true),
         updated_by = coalesce(who,''), updated_at = now()
   where share_token = tok
   returning updated_at into ts;
  return ts;
end $$;

revoke all on function sf_plan_get(uuid) from public;
revoke all on function sf_plan_set(uuid, jsonb, text) from public;

/* PostgreSQL kan svare med og uden tidszone. Mangler den, er tiden UTC –
   uden dette ville alt se to timer gammelt ud her i dansk sommertid. */
function parseTS(v){
 if(!v)return null;
 if(typeof v==='number')return new Date(v);
 let t=String(v).trim().replace(' ','T');
 if(!/(Z|[+-]\d{2}:?\d{2})$/.test(t))t+='Z';
 const d=new Date(t);
 return isNaN(d)?new Date(v):d;
}
function tid(v){
 const d=parseTS(v)||new Date(v);
 return d.toLocaleString('da-DK',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}

/* ================= lager =================
   Samme equipment-tabel som lagerprogrammet (East Production). Vi rører kun
   de felter der findes i forvejen, og lægger SignalFlows tekniske detaljer i
   'tech'. Egne felter ligger i 'custom_fields' – præcis som i lagerprogrammet,
   så begge programmer kan læse og skrive det samme udstyr. */
let lagerRows=null, lagerCats=[];

const techOf=e=>{
 const t=e&&e.tech;
 if(!t)return {ins:[],outs:[],conIn:'',conOut:''};
 return {ins:t.ins||[], outs:t.outs||[], conIn:t.conIn||'', conOut:t.conOut||''};
};
/* skriver en værdi ind i custom_fields, så lagerprogrammet også kan se den */
function cfSet(e,label,value){
 e.custom_fields=Array.isArray(e.custom_fields)?e.custom_fields.slice():[];
 const i=e.custom_fields.findIndex(x=>(x.label||'').toLowerCase()===label.toLowerCase());
 if(value===''||value==null){ if(i>=0)e.custom_fields.splice(i,1); return }
 if(i>=0)e.custom_fields[i]={label:e.custom_fields[i].label,value:String(value)};
 else e.custom_fields.push({label:label,value:String(value)});
}

/* fælles billedhåndtering: skalér ned og giv en data-URL tilbage */
function readImage(f,cb){
 const rd=new FileReader();
 rd.onload=()=>{
  const im=new Image();
  im.onload=()=>{
   const max=260, sc=Math.min(1,max/Math.max(im.width,im.height));
   const cv=document.createElement('canvas');
   cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
   cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
   cb(cv.toDataURL('image/png'));
  };
  im.src=rd.result;
 };
 rd.readAsDataURL(f);
}
function pickImageFile(cb){
 const fi=document.createElement('input'); fi.type='file'; fi.accept='image/*';
 fi.onchange=()=>{const f=fi.files[0]; if(f)readImage(f,cb)};
 fi.click();
}

const PAPER={A4:{p:210,l:297},A3:{p:297,l:420},Letter:{p:215.9,l:279.4},Tabloid:{p:279.4,l:431.8}};
function exportPDF(o){
 const idx = o.scope==='all' ? pages.map((_,i)=>i) : [activePage];
 /* Lås arkets bredde til den, elementerne er placeret efter, og skalér hele arket
    ned til papiret. Ellers ombrydes indholdet, mens de frie bokse bliver liggende. */
 const W = el.clientWidth || 1340;
 const mm = (PAPER[o.paper]||PAPER.A4)[o.orient==='landscape'?'l':'p'];
 /* Marginen lægges inde i arket, ikke som sidemargin. Så har browseren ingen
    margin at skrive adresse og sidehoved i, og papiret bliver rent. */
 const padPx = o.margin * 96/25.4;
 const k = Math.min(1, (mm*96/25.4) / (W + 2*padPx));
 const stamp = new Date().toLocaleDateString('da-DK',{day:'2-digit',month:'2-digit',year:'numeric'});
 document.getElementById('printroot').innerHTML = idx.map(i=>
   `<div class="psheet">${renderPageHTML(i,o.allLayers)}
      <div class="pfoot">${esc(pages[i].title)} · side ${idx.indexOf(i)+1} af ${idx.length} · udskrevet ${stamp}</div>
    </div>`).join('');
 document.getElementById('pagestyle').textContent =
   `@page{size:${o.paper} ${o.orient};margin:0}
    @media print{#printroot{width:${W+2*padPx}px;zoom:${k.toFixed(4)}}
                 .psheet{width:${W}px;margin:${padPx}px}}`;
 closeModal();
 setTimeout(()=>{
   window.print();
   setTimeout(()=>{document.getElementById('printroot').innerHTML=''},600);
 },120);
}

/* CSV med semikolon og BOM, så dansk Excel åbner det korrekt */
function exportCSV(o){
 const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 const rows=[['Side','Afsender','Modtager','Feed/TX','Gruppe','Transport','Signaltype','Rolle','Retning','Kanal','Kanaltekst','Kanaltype']];
 const idx = o.scope==='all' ? pages.map((_,i)=>i) : [activePage];
 idx.forEach(pi=>{
  const walk=(sh,prefix)=>{
   sh.sections.forEach(sc=>sc.groups.forEach(g=>{
    if(!o.allLayers&&!vis(g.layer,g.role))return;
    const dtxt=v=>({ltr:'frem',rtl:'retur',both:'begge veje'})[v||'ltr'];
    const base=[prefix,sc.src,sc.dst,g.feed||'',g.label,g.transport||'',LAYERS[g.layer]||g.layer,g.role];
    if(!g.channels.length)rows.push(base.concat([dtxt(g.dir),'','','']));
    g.channels.forEach(ch=>rows.push(base.concat([dtxt(ch.dir||g.dir),ch.nr,ch.label||'',LAYERS[ch.layer]||ch.layer])));
    if(o.subs&&g.sub)walk(g.sub,prefix+' › '+g.label);
   }));
  };
  walk(pages[pi],pages[pi].title);
 });
 dl('\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n'),
    fileName('csv',o.scope!=='all'),'text/csv;charset=utf-8');
 closeModal();
}

    E('',est,rowsX+feedW2+10,ry,cloudX,ry);

     +`fontSize=14;fontStyle=1;spacing=8;fillColor=${fill};strokeColor=${stroke};fontColor=${font};`;
   const srcLines=(sc.srcLines||[]).map(l=>l.t).join('\n');
   const dstLines=(sc.dstLines||[]).map(l=>l.t).join('\n');
   V(sc.src+(srcLines?'\n\n'+srcLines:''),
     boxS(st.srcBg||'#e9c440', st.srcBd||'#bd9a2c', st.srcFg||'#2b2417'), M,secTop,srcW,secH);
   V(sc.dst+(dstLines?'\n\n'+dstLines:''),
     boxS(st.dstBg||'#6d8764', st.dstBd||'#4c6245', st.dstFg||'#f3f7f1'), dstX,secTop,dstW,secH);

   /* bokse der er låst fast i denne sektion – stables i den boks de hører til */
   ['src','dst'].forEach(side=>{
    let iy=secTop+42;
    (sh.items||[]).filter(i=>i.anchor&&i.anchor.sec===sc.id&&i.anchor.side===side).forEach(it=>{
     const w=Math.min(it.w||240, (side==='src'?srcW:dstW)-24);
     const h=itemH(it);
     V(itemText(it),
       'rounded=1;arcSize=6;html=1;whiteSpace=wrap;verticalAlign=top;align=left;fontSize=10;'
      +'fillColor=#ffffff;strokeColor=#cfcfcf;spacing=7;',
       (side==='src'?M:dstX)+12, iy, w, h);
     iy+=h+10;
    });
   });
   y=secTop+secH+26;
  });

  /* frit placerede bokse */
  const scale=(SHEETW-2*M)/Math.max(600,(el.clientWidth||1340));
  (sh.items||[]).filter(i=>!i.anchor).forEach(it=>{
   V(itemText(it),
     'rounded=1;arcSize=6;html=1;whiteSpace=wrap;verticalAlign=top;align=left;fontSize=10;'
    +(it.type==='text'?'fillColor=none;strokeColor=none;':'fillColor=#ffffff;strokeColor=#cfcfcf;')+'spacing=7;',
     M+(it.x||0)*scale, M+40+(it.y||0)*scale, (it.w||240), itemH(it));
  });

  return `<diagram name="${X(sh.title)}" id="d${n+1}">`
   +`<mxGraphModel dx="1200" dy="800" grid="0" gridSize="10" guides="1" tooltips="1" connect="1" `
   +`arrows="1" fold="1" page="1" pageScale="1" pageWidth="1600" pageHeight="1200" math="0" shadow="0">`
   +`<root><mxCell id="0"/><mxCell id="1" parent="0"/>${cells.join('')}</root>`
   +`</mxGraphModel></diagram>`;
 }).join('');

 dl(`<mxfile host="SignalFlow" type="device">${diagrams}</mxfile>`,
    fileName('drawio',o.scope!=='all'),'application/xml');
 closeModal();
}
/* hjælpere til bokse i draw.io */
function itemText(it){
 if(it.type==='text')return it.text||'';
 const rows=(it.rows||[]).map(r=>`${r.sym||'●'}  ${r.label||''}${(r.count===''||r.count==null)?'':'   '+r.count}`);
 const tot=(it.rows||[]).reduce((a,r)=>a+(+r.count||0),0);
 return [it.title||'Forklaring',''].concat(rows)
   .concat(it.showTotal!==false?['','I alt   '+tot]:[]).join('\n');
}
function itemH(it){
 if(it.type==='text')return Math.max(26,(String(it.text||'').split('\n').length)*16+14);
 return 34+(it.rows||[]).length*15+(it.showTotal!==false?20:0);
}

function planRows(kun){
 const rows=[['Domæne','Udstyr','Placering','Side','Nr','Signal','Patchet','Tjekket','Sat af','Tidspunkt']];
 Object.keys(PLANDOMS).filter(k=>!kun||k===kun).forEach(k=>alive((ensurePlan()[k].devices||[])).forEach(d=>{
  [['ins','Input'],['outs','Output']].forEach(([side,txt])=>{
   alive(d[side]).forEach(p=>rows.push([PLANDOMS[k],d.name,d.place||'',txt,p.n,p.label||'',
     p.patched?'ja':'', p.checked?'ja':'', p.by||'',
     p.at?new Date(p.at).toLocaleString('da-DK'):'']));
  });
 }));
 return rows;
}

 dl('\ufeff'+planRows(kun).map(r=>r.map(q).join(';')).join('\r\n'),navn,'text/csv;charset=utf-8');

/* ---- træk og skalér ---- */
let dragState=null;
document.getElementById('sheet').addEventListener('mousedown',ev=>{
 const rs=ev.target.closest('[data-rs]');
 if(rs){
  ev.preventDefault();
  const [kind,ref]=rs.dataset.rs.split('|');
  const sc=sheet().sections.find(s=>s.id===ref);
  const it=kind==='item'?findItem(ref):null;
  const st=sc?SS(sc):null;
  dragState={mode:'resize',kind,ref,sc,it,st,x0:ev.clientX,y0:ev.clientY,
    w0:it?it.w:(st?px(kind.startsWith('src')?st.srcW:st.dstW,kind.startsWith('src')?190:210):0),
    h0:st?px(kind==='src'?st.srcH:st.dstH,0):0,
    dx0:st?px(kind==='srcin'?st.srcDX:st.dstDX,0):0,
    el:rs.parentElement};
  snap(); document.body.style.userSelect='none';
  return;
 }
 const dh=ev.target.closest('.fdrag');
 if(dh){
  const node=dh.closest('.fitem');
  if(!node)return;
  const it=findItem(node.dataset.item);
  if(!it)return;
  if(ev.target.closest('.mini')||ev.target.closest('.rs'))return;
  ev.preventDefault();
  const r=node.getBoundingClientRect();
  dragState={mode:'move',it,el:node,
    gx:ev.clientX-r.left, gy:ev.clientY-r.top, w:r.width};
  node.classList.add('dragging');
  node.style.width=r.width+'px';
  node.style.left=r.left+'px';
  node.style.top=r.top+'px';
  sel={t:'item',id:it.id};
  snap(); document.body.style.userSelect='none';
 }
});

/* find den boks der ligger under punktet – ellers arket selv */
function dropTarget(x,y){
 const boxes=[];
 el.querySelectorAll('.section').forEach(secEl=>{
  const sec=secEl.dataset.sec;
  const add=(sel2,side)=>{const c=secEl.querySelector(sel2); if(c)boxes.push({c,sec,side})};
  add('.srcbox','src'); add('.dstbox','dst'); add('.rows','rows');
 });
 for(const b of boxes){
  const r=b.c.getBoundingClientRect();
  if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return b;
 }
 return null;
}
function highlightDrop(t){
 el.querySelectorAll('.drophere').forEach(n=>n.classList.remove('drophere'));
 if(t)t.c.classList.add('drophere');
}

document.addEventListener('mousemove',ev=>{
 if(!dragState)return;
 const dx=ev.clientX-dragState.x0, dy=ev.clientY-dragState.y0;
 const d=dragState;
 if(d.mode==='move'){
  d.el.style.left=(ev.clientX-d.gx)+'px';
  d.el.style.top =(ev.clientY-d.gy)+'px';
  highlightDrop(dropTarget(ev.clientX-d.gx+14, ev.clientY-d.gy+12));
 } else if(d.kind==='item'){
  d.el.style.width=Math.max(90,d.w0+dx)+'px';
 } else if(d.kind==='srcin'){
  d.el.style.marginRight=Math.max(0,d.dx0-dx)+'px';
 } else if(d.kind==='dstin'){
  d.el.style.marginLeft=Math.max(0,d.dx0+dx)+'px';
 } else {
  const w=Math.max(90,d.w0+(d.kind==='src'?dx:-dx));
  const h=Math.max(0,d.h0+dy);
  const sec=d.el.closest('.section');
  const st=SS(d.sc);
  sec.style.gridTemplateColumns=`${d.kind==='src'?w:px(st.srcW,190)}px 1fr ${d.kind==='dst'?w:px(st.dstW,210)}px`;
  d.el.style.minHeight=h+'px';
  d.wNow=w; d.hNow=h;
 }
});
document.addEventListener('mouseup',()=>{
 const d=dragState; if(!d)return;
 dragState=null; document.body.style.userSelect='';
 if(d.mode==='move'){
  const r=d.el.getBoundingClientRect();
  const t=dropTarget(r.left+14, r.top+12);
  highlightDrop(null);
  if(t){
   const cr=t.c.getBoundingClientRect();
   const maxX=Math.max(0, t.c.clientWidth - r.width - 6);
   d.it.anchor={sec:t.sec, side:t.side,
     dx:Math.min(maxX, Math.max(6, Math.round(r.left-cr.left-t.c.clientLeft))),
     dy:Math.max(6, Math.round(r.top -cr.top -t.c.clientTop))};
  }else{
   const sr=el.getBoundingClientRect();
   delete d.it.anchor;
   d.it.x=Math.max(0,Math.round(r.left-sr.left-el.clientLeft));
   d.it.y=Math.max(0,Math.round(r.top -sr.top -el.clientTop));
  }
 } else if(d.kind==='item'){
  let w=parseFloat(d.el.style.width)||d.w0;
  if(d.it.anchor){
   const c=d.el.parentElement;
   if(c)w=Math.min(w, c.clientWidth - d.it.anchor.dx - 6);
  }
  d.it.w=Math.max(90,w);
 } else if(d.kind==='srcin'){
  SS(d.sc).srcDX=parseFloat(d.el.style.marginRight)||0;
 } else if(d.kind==='dstin'){
  SS(d.sc).dstDX=parseFloat(d.el.style.marginLeft)||0;
 } else {
  const st=SS(d.sc);
  if(d.kind==='src'){st.srcW=d.wNow;st.srcH=d.hNow}else{st.dstW=d.wNow;st.dstH=d.hNow}
 }
 draw();
});

/* ================= handlinger ================= */
function addSec(){snap();sheet().sections.push(newSection('Modtager '+(sheet().sections.length+1),sheet().sections[0]?sheet().sections[0].src:'Afsender'));draw()}
function move(gid,d){snap();const[g,sc]=findGrp(gid);const i=sc.groups.indexOf(g),j=i+d;if(j<0||j>=sc.groups.length)return;sc.groups.splice(i,1);sc.groups.splice(j,0,g);draw()}
function drill(gid){const[g]=findGrp(gid);if(!g)return;if(!g.sub){snap();g.sub=newSheet(g.label);g.sub.sections.push(newSection('Modtager',g.label))}path.push(g);sel=null;draw();document.getElementById('stage').scrollTop=0}

/* inline redigering */
let editing=null;

/* Afslut en igangværende redigering uden at tegne om. Kaldes før enhver anden
   handling, så et felt aldrig kan blive hængende og spærre for videre skrivning. */
function commitEdit(save){
 if(!editing)return;
 const kind=editing.kind, ref=editing.ref, inp=editing.inp;
 editing=null;
 if(!inp||!inp.isConnected)return;          // feltet er allerede fjernet – glem det
 if(save!==false){
  const v=inp.value;
  if(v!==getVal(kind,ref)){snap();setVal(kind,ref,v)}
 }
}

function startEdit(node){
 commitEdit(true);                          // gem det forrige felt i stedet for at blokere
 const kind=node.dataset.e, ref=node.dataset.id;
 const cur=getVal(kind,ref);
 const inp=document.createElement('input');
 inp.id='inlineEdit';
 inp.value=cur;
 inp.style.cssText='font:inherit;color:#111;background:#fff;border:1.5px solid #0a5bd3;'
  +'border-radius:3px;padding:0 4px;min-width:80px;width:'+Math.max(90,cur.length*8+24)+'px';
 editing={kind:kind,ref:ref,inp:inp};
 node.replaceWith(inp); inp.focus(); inp.select();

 const finish=function(save){
  if(!editing||editing.inp!==inp)return;
  commitEdit(save);
  draw();
 };
 inp.onkeydown=function(e){
  if(e.key==='Enter'){e.preventDefault();finish(true)}
  else if(e.key==='Escape'){e.preventDefault();finish(false)}
  else if(e.key==='Tab'){e.preventDefault();commitEdit(true);draw();focusNext(kind,ref,e.shiftKey)}
  e.stopPropagation();
 };
 inp.onblur=function(){finish(true)};
}

/* Tab springer videre til næste tekst af samme slags – hurtigt når man skriver
   mange kanaler i træk. Shift+Tab går tilbage. */
function focusNext(kind,ref,back){
 const all=[].slice.call(el.querySelectorAll('[data-e="'+kind+'"]'));
 let i=-1;
 for(let j=0;j<all.length;j++){if(all[j].dataset.id===ref){i=j;break}}
 const next=all[i+(back?-1:1)];
 if(next)startEdit(next);
}
function getVal(k,r){
 if(k==='title')return sheetTitle();
 if(k==='src'){const sc=sheet().sections.find(s=>s.id===r);return sc?sc.src:''}
 if(k==='dst'){const sc=sheet().sections.find(s=>s.id===r);return sc?sc.dst:''}
 if(k==='srcline'||k==='dstline'){const[sid,lid]=String(r).split('|');
   const sc=sheet().sections.find(s=>s.id===sid);if(!sc)return '';
   const L=(k==='srcline'?sc.srcLines:sc.dstLines)||[];const o=L.find(l=>l.id===lid);return o?o.t:''}
 const [gid,cid]=String(r).split('|'); const [g]=findGrp(gid); if(!g)return '';
 if(k==='feed')return g.feed; if(k==='glabel')return g.label; if(k==='transport')return g.transport;
 if(k==='tx')return g.tx||''; if(k==='rx')return g.rx||'';
 if(k==='chtx'||k==='chrx'){const c2=g.channels.find(c=>c.id===cid);return c2?(k==='chtx'?c2.tx:c2.rx)||'':''}
 const ch=g.channels.find(c=>c.id===cid); if(!ch)return '';
 return k==='chnr'?ch.nr:ch.label;
}
function setVal(k,r,v){
 if(k==='title'){setSheetTitle(v);return}
 if(k==='src'){const sc=sheet().sections.find(s=>s.id===r);if(sc)sc.src=v;return}
 if(k==='dst'){const sc=sheet().sections.find(s=>s.id===r);if(sc)sc.dst=v;return}
 if(k==='srcline'||k==='dstline'){const[sid,lid]=String(r).split('|');
   const sc=sheet().sections.find(s=>s.id===sid);if(!sc)return;
   const L=(k==='srcline'?sc.srcLines:sc.dstLines)||[];const o=L.find(l=>l.id===lid);
   if(!o)return;
   if(v.trim()==='')  {  // tom tekst fjerner linjen
     if(k==='srcline')sc.srcLines=L.filter(l=>l.id!==lid); else sc.dstLines=L.filter(l=>l.id!==lid);
   } else o.t=v;
   return}
 const [gid,cid]=String(r).split('|'); const [g]=findGrp(gid); if(!g)return;
 if(k==='feed'){g.feed=v;return} if(k==='glabel'){g.label=v;return} if(k==='transport'){g.transport=v;return}
 if(k==='tx'){g.tx=v;return} if(k==='rx'){g.rx=v;return}
 if(k==='chtx'||k==='chrx'){const c2=g.channels.find(c=>c.id===cid);
   if(c2){if(k==='chtx')c2.tx=v; else c2.rx=v} return}
 const ch=g.channels.find(c=>c.id===cid); if(!ch)return;
 if(k==='chnr')ch.nr=v; else ch.label=v;
}

/* klik på arket */
el.addEventListener('click',ev=>{
 const t=ev.target;
 if(editing&&t!==editing.inp)commitEdit(true);   // gem det åbne felt før alt andet
 const d=k=>t.closest('['+k+']');
 let n;
 if(n=d('data-addsec')){addSec();return}
 if(n=d('data-addgrp')){snap();const sc=sheet().sections.find(s=>s.id===n.dataset.addgrp);const g=newGroup('Kilde '+(sc.groups.length+1));g.feed='TX '+(sc.groups.length+1);g.channels=[newCh(1)];sc.groups.push(g);sel={t:'grp',id:g.id};draw();return}
 if(n=d('data-addch')){snap();const[g]=findGrp(n.dataset.addch);g.channels.push(newCh(g.channels.length+1));draw();return}
 if(n=d('data-delg')){snap();const[g,sc]=findGrp(n.dataset.delg);sc.groups=sc.groups.filter(x=>x!==g);sel=null;draw();return}
 if(n=d('data-cdir')){snap();const[gid,cid]=n.dataset.cdir.split('|');const[g]=findGrp(gid);
   const c=g.channels.find(x=>x.id===cid);
   const order=['ltr','rtl','both'];
   c.dir=order[(order.indexOf(c.dir||g.dir||'ltr')+1)%3];
   draw();return}
 if(n=d('data-crole')){snap();const[gid,cid]=n.dataset.crole.split('|');const[g]=findGrp(gid);
   const c=g.channels.find(x=>x.id===cid);
   c.role=(c.role||g.role)==='backup'?'primær':'backup';
   draw();return}
 if(n=d('data-delc')){snap();const[gid,cid]=n.dataset.delc.split('|');const[g]=findGrp(gid);g.channels=g.channels.filter(c=>c.id!==cid);draw();return}
 if(n=d('data-delsec')){snap();sheet().sections=sheet().sections.filter(s=>s.id!==n.dataset.delsec);draw();return}
 if(n=d('data-up')){move(n.dataset.up,-1);return}
 if(n=d('data-down')){move(n.dataset.down,1);return}
 if(n=d('data-dup')){snap();const[g,sc]=findGrp(n.dataset.dup);const cp=JSON.parse(JSON.stringify(g));cp.id=id();cp.channels.forEach(c=>c.id=id());sc.groups.splice(sc.groups.indexOf(g)+1,0,cp);draw();return}
 if(n=d('data-drill')){drill(n.dataset.drill);return}
 if(n=d('data-secedit')){editSection(n.dataset.secedit);return}
 if(n=d('data-gedit')){editGroup(n.dataset.gedit);return}
 if(n=d('data-seccopy')){copySection(n.dataset.seccopy);return}
 if(n=d('data-gcopy')){copyGroup(n.dataset.gcopy);return}
 if(n=d('data-secfocus')){focus={t:'sec',id:n.dataset.secfocus};sel=null;draw();return}
 if(n=d('data-gfocus')){focus={t:'grp',id:n.dataset.gfocus};sel=null;draw();return}
 if(n=d('data-unfocus')){focus=null;draw();return}
 if(n=d('data-addtext')){addText();return}
 if(n=d('data-addlegend')){addLegend();return}
 if(n=d('data-iedit')){const it=findItem(n.dataset.iedit);it&&(it.type==='text'?editText(it.id):editLegend(it.id));return}
 if(n=d('data-idel')){snap();sheet().items=items().filter(i=>i.id!==n.dataset.idel);sel=null;draw();return}
 if(n=d('data-idup')){snap();const o=findItem(n.dataset.idup);const c=JSON.parse(JSON.stringify(o));c.id=id();c.x+=24;c.y+=24;items().push(c);draw();return}
 if(n=d('data-boxadd')){const[sid,side]=n.dataset.boxadd.split('|');snap();
   const sc=sheet().sections.find(x=>x.id===sid);const k=side+'Lines';
   (sc[k]||(sc[k]=[])).push({id:id(),t:'Ny tekst'});draw();return}
 if(n=d('data-fold')){const[g]=findGrp(n.dataset.fold);g.collapsed=!g.collapsed;draw();return}
 if(n=d('data-cyc')){snap();const[gid,cid]=n.dataset.cyc.split('|');const[g]=findGrp(gid);const ch=g.channels.find(c=>c.id===cid);const ks=Object.keys(LAYERS);ch.layer=ks[(ks.indexOf(ch.layer)+1)%ks.length];draw();return}
 if(n=d('data-e')){startEdit(n);return}
 const fit=t.closest('[data-item]');
 if(fit){const it=findItem(fit.dataset.item);if(it){sel={t:'item',id:it.id};draw();return}}
 const gr=t.closest('[data-grp]');
 sel=gr?{t:'grp',id:gr.dataset.grp}:null;
 draw();
});

/* lag-knapper */
document.querySelectorAll('.busbtn').forEach(b=>b.onclick=()=>{
 const l=b.dataset.l;
 if(l==='backup'){backupOn=!backupOn;b.classList.toggle('on',backupOn)}
 else{on.has(l)?on.delete(l):on.add(l);b.classList.toggle('on',on.has(l))}
 draw();
});

/* tastatur */
document.addEventListener('keydown',e=>{
 /* I kanalplanen står markøren næsten altid i et felt, så fortryd skal
    virke alligevel – ellers kan man ikke fortryde en linje man lige rettede. */
 if(view==='plan'&&(e.ctrlKey||e.metaKey)&&e.key==='z'){
  e.preventDefault(); if(document.activeElement)document.activeElement.blur(); undo(); return;
 }
 if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')return;
 if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}
 if((e.ctrlKey||e.metaKey)&&e.key==='p'){e.preventDefault();openExport()}
 if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();openExport()}
 if(e.key==='Escape'){sel=null;draw()}
});

/* gem / åbn / print */
document.getElementById('bUndo').onclick=undo;
document.getElementById('bUndo').disabled=true;
document.getElementById('bExport').onclick=openExport;
document.getElementById('bCloud').onclick=openCloud;
document.getElementById('bFoldAll').onclick=()=>{
 const gs=[];sheet().sections.forEach(sc=>sc.groups.forEach(g=>gs.push(g)));
 const anyOpen=gs.some(g=>!g.collapsed);
 snap(); gs.forEach(g=>g.collapsed=anyOpen); draw();
};
document.getElementById('bNew').onclick=()=>{if(confirm('Start forfra med ét tomt projekt? Alle sider slettes.')){snap();pages=[blank()];activePage=0;doc=pages[0];path=[];sel=null;cloudId=null;projectName='Nyt projekt';draw()}};
document.getElementById('bSave').onclick=()=>{
 const project=snapshot();
 const b=new Blob([JSON.stringify(project,null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);
 a.download=fileName('json');a.click();
};
document.getElementById('bOpen').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
   try{
     const data=JSON.parse(r.result);
     pages = Array.isArray(data.pages)&&data.pages.length ? data.pages : [data];
     plan = data.plan||blankPlan();
     blocks = data.blocks||blankBlocks();  // ældre filer var ét ark uden 'pages'
     projectName = data.name || (f.name||'').replace(/\.json$/i,'').replace(/_/g,' ') || 'Projekt';
     activePage=0; doc=pages[0]; path=[]; sel=null; undoStack=[];
     document.getElementById('bUndo').disabled=true;
     draw();
   }catch(err){alert('Kunne ikke læse filen: '+err.message)}
 };
 r.readAsText(f); e.target.value='';
};

if(restoreAuto()){/* genoptaget fra autogem */}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));

/* ---- intet vises før der er logget ind ---- */
function unlock(){
 document.body.classList.add('unlocked');
 ensurePlan(); ensureBlocks();
 restoreAuto();
 draw();
 applyUrl();
 startSync();
 if(!cloudId&&!new URLSearchParams(location.search).get('p'))setTimeout(openProjects,400);
}
function lockOut(){
 document.body.classList.remove('unlocked');
 const m=document.getElementById('gMsg'); if(m)m.textContent='';
 const pw=document.getElementById('gPw'); if(pw)pw.value='';
}
document.getElementById('gGo').onclick=function(){
 const msg=document.getElementById('gMsg');
 const who=document.getElementById('gWho').value.trim();
 const c=cfg(); setCfg({url:c.url,key:c.key,who:who||c.who});
 this.textContent='Logger ind …'; msg.textContent='';
 signIn(document.getElementById('gEmail').value.trim(),
        document.getElementById('gPw').value)
   .then(()=>{this.textContent='Log ind';unlock()})
   .catch(e=>{msg.textContent=e.message;this.textContent='Log ind'});
};
['gEmail','gPw','gWho'].forEach(i=>{
 document.getElementById(i).onkeydown=e=>{
  if(e.key==='Enter'){e.preventDefault();document.getElementById('gGo').click()}
 };
});
const _t=new URLSearchParams(location.search).get('t');
if(_t){
 startGuest(_t);
}else if(session()){
 unlock();
}else{
 document.getElementById('gWho').value=cfg().who||'';
 setTimeout(()=>document.getElementById('gEmail').focus(),100);
}
</script>
