<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; frame-src blob:; object-src blob:; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Udlejningsregnskab</title>
<style>
:root{
  --papir:#EEF1F4; --flade:#FFFFFF; --flade2:#F6F8FA; --blaek:#1C2733; --blaek2:#4A5868; --blaek3:#7A8796;
  --linje:#D3DAE2; --linje2:#E4E9EE; --groen:#1F6F5C; --groen-lys:#DCEDE7; --roed:#A23B2A; --roed-lys:#F6E1DC;
  --gul:#8A6A12; --gul-lys:#F5EBCB; --fokus:#2F6FB3;
  --serif:"Charter","Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --papir:#141A21; --flade:#1B232C; --flade2:#202A34; --blaek:#E3E8EE; --blaek2:#B0BAC6; --blaek3:#8693A2;
  --linje:#33404D; --linje2:#29343F; --groen:#5DBB9F; --groen-lys:#1E3A33; --roed:#E3826F; --roed-lys:#3F2621;
  --gul:#D9B653; --gul-lys:#3A3220; --fokus:#7FB2EA;}}
:root[data-theme="dark"]{
  --papir:#141A21; --flade:#1B232C; --flade2:#202A34; --blaek:#E3E8EE; --blaek2:#B0BAC6; --blaek3:#8693A2;
  --linje:#33404D; --linje2:#29343F; --groen:#5DBB9F; --groen-lys:#1E3A33; --roed:#E3826F; --roed-lys:#3F2621;
  --gul:#D9B653; --gul-lys:#3A3220; --fokus:#7FB2EA;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papir);color:var(--blaek);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:1.65rem;line-height:1.2}
h2{font-size:1.25rem;line-height:1.3;margin:1.6rem 0 .6rem}
h3{font-size:1.05rem;margin:1.2rem 0 .4rem}
p{margin:.4rem 0;max-width:70ch}
a{color:var(--groen)}
.tal{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;font-family:var(--sans)}
.neg{color:var(--roed)}
.dim{color:var(--blaek3)}
.lille{font-size:.85rem}
button,.knap{font:inherit;font-size:.92rem;border:1px solid var(--linje);background:var(--flade);color:var(--blaek);
  padding:.42rem .8rem;border-radius:var(--r);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
button:hover,.knap:hover{border-color:var(--blaek3)}
button.hoved{background:var(--groen);border-color:var(--groen);color:#fff}
:root[data-theme="dark"] button.hoved{color:#0E1A16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.hoved{color:#0E1A16}}
button.fare{color:var(--roed);border-color:var(--roed)}
button.flad{border-color:transparent;background:transparent;padding:.3rem .5rem}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--fokus);outline-offset:2px}
input,select,textarea{font:inherit;font-size:.95rem;color:var(--blaek);background:var(--flade);border:1px solid var(--linje);
  border-radius:var(--r);padding:.38rem .5rem;min-width:0;max-width:100%}
input[type=checkbox]{width:1.05rem;height:1.05rem;accent-color:var(--groen)}
label.felt{display:flex;flex-direction:column;gap:.2rem;font-size:.85rem;color:var(--blaek2)}
label.felt>input,label.felt>select{font-size:.95rem;color:var(--blaek)}

/* Ramme */
.ramme{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav.side{background:var(--flade);border-right:1px solid var(--linje);padding:1.2rem .8rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:.15rem}
nav.side .navn{font-family:var(--serif);font-size:1.1rem;font-weight:600;padding:.2rem .6rem 1rem}
nav.side a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--blaek2);padding:.45rem .6rem;border-radius:var(--r)}
nav.side a:hover{background:var(--flade2);color:var(--blaek)}
nav.side a[aria-current=page]{background:var(--groen-lys);color:var(--blaek);font-weight:600}
nav.side .antal{font-size:.78rem;font-variant-numeric:tabular-nums;color:var(--blaek3)}
nav.side .bund{margin-top:auto;font-size:.82rem;color:var(--blaek3);padding:.6rem}
nav.side .bund a{display:inline;padding:0;color:var(--groen)}
main{padding:1.6rem 2rem 4rem;max-width:1180px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.raekke{display:flex;gap:.6rem;align-items:flex-end;flex-wrap:wrap}
.panel{background:var(--flade);border:1px solid var(--linje);border-radius:8px;padding:1rem 1.1rem;margin:.8rem 0}
.tom{padding:2rem 1rem;text-align:center;color:var(--blaek2)}
.besked{padding:.6rem .8rem;border-radius:var(--r);margin:.6rem 0;font-size:.92rem}
.besked.fejl{background:var(--roed-lys);color:var(--roed)}
.besked.ok{background:var(--groen-lys);color:var(--groen)}
.besked.adv{background:var(--gul-lys);color:var(--gul)}

/* Tabeller */
.tabelboks{overflow-x:auto;background:var(--flade);border:1px solid var(--linje);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:.45rem .65rem;text-align:left;vertical-align:middle;border-bottom:1px solid var(--linje2)}
th{font-weight:600;color:var(--blaek2);font-size:.82rem;background:var(--flade2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tr.sum td{font-weight:600;border-top:1px solid var(--linje)}
tr.gruppe td{font-family:var(--serif);font-weight:600;padding-top:.9rem;background:var(--flade)}
tr.klik{cursor:pointer}
tr.klik:hover td{background:var(--flade2)}
td.handling{text-align:right;white-space:nowrap}

/* Bankafstemning */
.bankpost{display:grid;grid-template-columns:86px 1fr 120px;gap:.3rem 1rem;padding:.8rem 1rem;border-bottom:1px solid var(--linje2);align-items:center}
.bankpost:last-child{border-bottom:0}
.bankpost .tekst{font-weight:500;overflow-wrap:anywhere}
.bankpost .beloeb{font-size:1.02rem;font-weight:600}
.bankpost .kontering{grid-column:2 / 4;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.bankpost .kontering select.konto{flex:1 1 260px}
.bankpost .kontering select.ejd{flex:0 1 150px}
.bankpost.udfoert{background:var(--flade2)}
.stempel{display:inline-flex;align-items:center;gap:.4rem;border:2px solid var(--groen);color:var(--groen);border-radius:4px;
  padding:.1rem .55rem;font-family:var(--serif);font-weight:600;font-variant-numeric:tabular-nums;transform:rotate(-2deg);
  animation:stempel .28s ease-out}
@keyframes stempel{from{transform:scale(1.5) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(-2deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.stempel{animation:none}}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--flade2);border:1px solid var(--linje);border-radius:999px;padding:.08rem .55rem;font-size:.82rem;max-width:240px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;padding:0 .1rem;color:var(--blaek3)}

/* Indbakke */
.filgitter{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.8rem}
.fil{background:var(--flade);border:1px solid var(--linje);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.fil .billede{aspect-ratio:3/4;background:var(--flade2);display:flex;align-items:center;justify-content:center;color:var(--blaek3);font-family:var(--serif);font-size:1.4rem;cursor:pointer}
.fil .billede img{width:100%;height:100%;object-fit:cover}
.fil .info{padding:.5rem .6rem;font-size:.82rem;display:flex;flex-direction:column;gap:.35rem}
.fil .info b{font-weight:500;overflow-wrap:anywhere}
.slipzone{border:2px dashed var(--linje);border-radius:8px;padding:1.4rem;text-align:center;color:var(--blaek2);background:var(--flade)}
.slipzone.over{border-color:var(--groen);background:var(--groen-lys)}

/* Kladde */
.kladdelinjer td{padding:.3rem .35rem}
.kladdelinjer input,.kladdelinjer select{width:100%}
.kladdelinjer input.tal{text-align:right}
.diff{font-weight:600}

/* Dialog */
dialog{border:1px solid var(--linje);border-radius:10px;padding:0;background:var(--flade);color:var(--blaek);max-width:min(560px,94vw);width:100%}
dialog::backdrop{background:rgba(20,26,33,.45)}
dialog .indhold{padding:1.1rem 1.2rem}
dialog .knapper{display:flex;justify-content:flex-end;gap:.5rem;padding:.8rem 1.2rem;border-top:1px solid var(--linje2)}
.forevisning{width:100%;height:70vh;border:0;background:#fff}
dialog.stor{max-width:min(1000px,96vw)}

.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--blaek);color:var(--papir);padding:.55rem 1rem;border-radius:var(--r);font-size:.92rem;z-index:50;max-width:90vw}
.faner{display:flex;gap:.25rem;border-bottom:1px solid var(--linje);margin:.8rem 0 1rem;overflow-x:auto}
.faner button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:.5rem .8rem;color:var(--blaek2)}
.faner button[aria-selected=true]{border-bottom-color:var(--groen);color:var(--blaek);font-weight:600}
.progress{height:6px;background:var(--linje2);border-radius:3px;overflow:hidden;margin:.6rem 0}
.progress div{height:100%;background:var(--groen);width:0;transition:width .2s}

.login{max-width:360px;margin:12vh auto;padding:0 1rem}
.login h1{margin-bottom:.3rem}
.login form{display:flex;flex-direction:column;gap:.8rem;margin-top:1.4rem}

@media (max-width:820px){
  .ramme{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  nav.side{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:.4rem .5rem;z-index:5;border-right:0;border-bottom:1px solid var(--linje)}
  nav.side .navn,nav.side .bund{display:none}
  nav.side a{flex:0 0 auto;gap:.4rem}
  main{padding:1rem 1rem 4rem}
  .bankpost{grid-template-columns:1fr auto;padding:.8rem}
  .bankpost .dato{grid-column:1 / 3;font-size:.85rem;color:var(--blaek3)}
  .bankpost .kontering{grid-column:1 / 3}
}
@media print{
  nav.side,.ikke-print,.faner,button{display:none!important}
  .ramme{display:block} main{padding:0;max-width:none}
  body{background:#fff;color:#000;font-size:10.5pt}
  .tabelboks,.panel{border:0} th{position:static}
}
</style>
</head>
<body>
<div id="app"><div class="tom">Indlæser…</div></div>
<dialog id="dlg"></dialog>

<script src="config.js"></script>
<script src="lib/sb.js"></script>
<script src="lib/parsers.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
