function blankBlocks(){return {pages:[{id:id(),title:'Fiberplan',nodes:[],links:[]}]}}
function mergeBlocks(mine,theirs){
 if(!theirs||!theirs.pages||!theirs.pages.length)return mine;
 if(!mine||!mine.pages||!mine.pages.length)return theirs;
 const flettet=mergePages(sikrePageIds(mine.pages),sikrePageIds(theirs.pages));
 const imgs=Object.assign({},theirs.imgs||{},mine.imgs||{});   // symboler lægges sammen
 return {pages:flettet.length?flettet:mine.pages, imgs:imgs};
}
function ensureBlocks(){
 if(!blocks||!blocks.pages||!blocks.pages.length)blocks=seedBlocks();
 if(blockPage>=blocks.pages.length)blockPage=0;
 return blocks;
}
const bp=()=>ensureBlocks().pages[blockPage];
const bnode=nid=>bp().nodes.find(n=>n.id===nid);

/* find et sted hvor der ikke allerede står noget */
function freeSpot(w,h){
 const top=bp().nodes.filter(n=>!n.parent);
 if(!top.length)return {x:60,y:110};
 const right=Math.max(...top.map(n=>n.x+(n.w||160)));
 if(right+w+40<2100)return {x:right+40,y:110};
 const bottom=Math.max(...top.map(n=>n.y+(n.h||90)));
 return {x:60,y:bottom+40};
}

 drawBlocks();
}

/* ── Lydkanaler i et videosignal ───────────────────────────────
   Et videosignal har lyd med sig – som regel otte kanaler. Lå de alle sammen
   fremme, ville et kort med 16 videolinjer vise 144 linjer, og så kan man
   ikke se noget. Derfor er de foldet sammen, og man åbner ét signal ad gangen.

   Kanalerne fylder INTET, før der står noget i dem. En kanal har et fast id,
   der er regnet ud fra videolinjens id ("x12~a3" = tredje lydkanal på linje
   x12), så den kan flettes mellem to maskiner, uden at den nogensinde har
   været gemt. Først når nogen skriver i den – eller sætter et hak – lægger
   den sig i p.aud.

   Formen er den samme som en almindelig linje (n, label, by, at, patched,
   checked). Så virker "hvem rettede hvad", hakkene og farvemarkeringen af
   nye rettelser på lydkanalerne uden at skulle laves om. */
const AUD_STD=8;                        // otte kanaler som udgangspunkt
const audId=(p,i)=>p.id+'~a'+i;
const audNr=id=>{const m=/~a(\d+)$/.exec(id); return m?+m[1]:0};
/* Hele listen som den skal vises: de otte faste plus dem der måtte være
   kommet til, og med det der er gemt lagt ind på rette plads. */
function audListe(p){
 /* Planen har sine EGNE kanaltekster. Før var en bundet port bogstaveligt
    gruppens kanaler – ét sæt tekst vist to steder. Det kunne ikke holde,
    da ét input skulle kunne gå til flere grupper: hvis tre grupper hænger
    på samme input, hvis tekst er så "den rigtige"?

    Nu ejer hver side sin egen tekst, og den anden sides står som spøgelse
    i et tomt felt. Det er også dét, der gør, at tegningen og kanalplanen
    kan forklare det samme på to måder til to slags kolleger. */
 const bundne=portGrps(p);
 /* Har porten en gruppe, men ingen egne rækker endnu, skal der være lige
    så mange rækker som gruppen har kanaler – ellers er der ikke noget at
    vise spøgelserne i. */
 if(bundne.length && !(p.aud||[]).some(a=>!a.del)){
  const f=grpFind(bundne[0]);
  if(f){ const n=grpLyd(f.g).length; if(n>(+p.audN||0)) p.audN=n; }
 }
 const gemt={}; (p.aud||[]).forEach(a=>{ if(!a.del)gemt[a.id]=a });
 let antal=AUD_STD;
 Object.keys(gemt).forEach(id=>{ antal=Math.max(antal, audNr(id)) });
 antal=Math.max(antal, +p.audN||0);
 const ud=[];
 for(let i=1;i<=antal;i++){
  const id=audId(p,i);
  ud.push(gemt[id]||{id:id, n:'Kanal '+i, label:'', by:'', at:0});
  delete gemt[id];
 }
 Object.keys(gemt).forEach(id=>ud.push(gemt[id]));   // kanaler uden fast nummer
 return ud;
}
/* ── Bindingen til tegningen ───────────────────────────────────
   Et videosignal kan bindes til en gruppe i tegningen. Så er gruppens
   lydkanaler OG videosignalets lydkanaler det samme – ikke to kopier der
   skal holdes ens. Derfor virker det automatisk begge veje: retter man
   teksten i tegningen, står den i planen, og omvendt. Laver man en
   kanal mere det ene sted, er den der også det andet. */
const grpLag=(g,lag)=>(g.channels||[]).filter(c=>(c.layer||'lyd')===lag);
const grpLyd=g=>grpLag(g,'lyd');
const antalKanaler=(g,lag)=>{const n=grpLag(g,lag).length; return n+(n===1?' kanal':' kanaler')};
/* Alle grupper i hele projektet – også dem der ligger på underark */
function alleGrupper(){
 const ud=[];
 const gaa=(sh,pi,sti)=>{
  (sh.sections||[]).forEach(sc=>(sc.groups||[]).forEach(g=>{
   ud.push({g:g, pi:pi, sti:sti, sek:(sc.src||'')+' → '+(sc.dst||'')});
   if(g.sub)gaa(g.sub, pi, sti+' › '+(g.label||''));
  }));
 };
 (pages||[]).forEach((p,i)=>gaa(p,i,p.title||'Side '+(i+1)));
 return ud;
}
/* Opslaget sker én gang pr. optegning – ellers gennemgår vi hele projektet
   for hver eneste lydkanal der skal tegnes. */
let grpCache=null;
const grpNulstil=()=>{grpCache=null};
function grpFind(gid){
 if(!gid)return null;
 if(!grpCache){ grpCache={}; alleGrupper().forEach(x=>{grpCache[x.g.id]=x}) }
 return grpCache[gid]||null;
}
/* ── Bindinger fra tegningen til planens INPUT ────────────
   Et input i planen kan komme hvilket som helst sted fra i tegningen,
   så den binding sidder på den enkelte kanal i gruppen – ikke på gruppen.
   Den går KUN én vej: tegningen skriver navnet, planen viser det.
   Derfor ligger teksten ét sted, og der er ingen tvivl om hvem der bestemmer.

   Målet er enten en inputlinje i en plan (fx lydplanens input 5) eller en
   lydkanal under et videoinput. Begge dele kan lade sig gøre. */
const indNoegle=b=>b&&(b.dom+'|'+b.dev+'|'+b.port+(b.aud?'|'+b.aud:''));
let indCache=null;
const indNulstil=()=>{indCache=null};
function indIndeks(){
 if(indCache)return indCache;
 indCache={};
 /* Flere kanaler må gerne pege på det SAMME input: ét input kan sagtens
    bruges til flere ting. Før lå der ét opslag pr. plads, og den sidste
    skrev de andre væk – de forsvandt uden at sige noget. Nu er det en
    liste pr. plads. */
 alleGrupper().forEach(x=>(x.g.channels||[]).forEach(c=>{
  if(c.ind&&c.ind.dev&&c.ind.port){
   const k=indNoegle(c.ind);
   (indCache[k]||(indCache[k]=[])).push({ch:c,g:x.g,pi:x.pi,sti:x.sti});
  }
 }));
 return indCache;
}
/* Alle kanaler, der peger på den her plads. */
function indAlleFor(dom2,dev,port,aud){
 return indIndeks()[dom2+'|'+dev+'|'+port+(aud?'|'+aud:'')]||[];
}
/* ── Spøgelsesteksten ──────────────────────────────────────────
   Tegningen og kanalplanen går til to slags kolleger og skal kunne
   forklare det samme på hver sin måde. Derfor ejer hver side sin egen
   tekst – men den anden sides står som en grå skygge i et tomt felt, så
   man kan se den og hente den over med mellemrum eller enter.

   Kilden findes i den rækkefølge: en kanal i tegningen, der peger lige
   på den her række, ellers gruppen der ligger på porten, på samme plads
   i listen. */
function spoegelsePlan(dom2, dv, p, audId, i){
 const d=indAlleFor(dom2, dv.id, p.id, audId);
 if(d.length && (d[0].ch.label||'').trim())
  return {tekst:d[0].ch.label, fra:(d[0].g.label||'tegningen')};
 const gs=portGrps(p);
 for(let k=0;k<gs.length;k++){
  const f=grpFind(gs[k]); if(!f)continue;
  const c=grpLyd(f.g)[i];
  if(c && (c.label||'').trim()) return {tekst:c.label, fra:(f.g.label||'gruppen')};
 }
 return null;
}
/* Den anden vej: hvad står der i planen ud for den her kanal i tegningen? */
function spoegelseGrp(g, ch, i){
 if(ch.ind && ch.ind.dev && ch.ind.port){
  const pl=ensurePlan();
  const dv=((pl[ch.ind.dom||'video']||{}).devices||[]).find(x=>x.id===ch.ind.dev);
  const po=dv&&['outs','ins'].map(sd=>(dv[sd]||[]).find(x=>x.id===ch.ind.port)).find(Boolean);
  if(po){
   const liste=audListe(po);
   const r=ch.ind.aud ? liste.find(a=>a.id===ch.ind.aud) : liste[i];
   if(r && (r.label||'').trim())
    return {tekst:r.label, fra:((dv.name||'')+' '+(po.n||'')).trim()||'planen'};
  }
 }
 const u=udAlleFor(g.id);
 for(let k=0;k<u.length;k++){
  const r=audListe(u[k].port)[i];
  if(r && (r.label||'').trim())
   return {tekst:r.label, fra:((u[k].dv.name||'')+' '+(u[k].port.n||'')).trim()||'planen'};
 }
 return null;
}

/* Hvad er bundet til denne plads i planen – hvis noget? */
/* Den første af dem – til de steder, der kun skal vide OM der er nogen. */
function indFor(dom2,dev,port,aud){
 const a=indAlleFor(dom2,dev,port,aud);
 return a.length?a[0]:null;
}
/* Hvor er denne gruppe bundet hen som OUTPUT? Bindingen står på plan-linjen,
   så vi leder efter den der peger tilbage på gruppen. */
/* Hvilken side af udstyret hører gruppen til?
   Peger pilen ud mod modtageren, ligger gruppens lyd på et OUTPUT – signalet
   forlader udstyret. Er pilen vendt om, kommer signalet den anden vej, og så
   er det et INPUT, der skal vælges. Går det begge veje, kan det være begge. */
function grpSider(g){
 const d=(g&&g.dir)||'ltr';
 if(d==='rtl')return ['ins'];
 if(d==='both')return ['outs','ins'];
 return ['outs'];
}
const SIDENAVN={outs:'Output', ins:'Input'};
/* Hvilke grupper hænger på den her port? Før kunne der kun være én –
   nu er det en liste, for det samme signal kan sagtens bære flere
   grupper. Gamle linjer har stadig det enkelte felt, og det tæller med. */
function portGrps(o){
 if(!o)return [];
 if(Array.isArray(o.grps))return o.grps.filter(Boolean);
 return o.grp?[o.grp]:[];
}
function portSatGrps(o, liste){
 const r=(liste||[]).filter(Boolean);
 if(r.length){ o.grps=r; } else { delete o.grps; }
 delete o.grp;                       // det gamle felt bruges ikke mere
}
function portHarGrp(o,gid){ return portGrps(o).indexOf(gid)>=0 }

/* Alle de steder gruppen ligger. En gruppe kan sendes ud flere steder –
   fx det samme signal til to modtagere. */
function udAlleFor(gid){
 const p=ensurePlan();
 const ud=[];
 Object.keys(PLANDOMS).forEach(dom2=>{
  ((p[dom2]||{}).devices||[]).forEach(dv=>{
   if(dv.del)return;
   ['outs','ins'].forEach(side=>{
    alive(dv[side]).forEach(o=>{
     if(portHarGrp(o,gid))ud.push({dom:dom2, dv:dv, port:o, side:side});
    });
   });
  });
 });
 return ud;
}
/* Den første – til de steder, der kun skal bruge ét sted at pege hen. */
function udFor(gid){
 const a=udAlleFor(gid);
 return a.length?a[0]:null;
}
function grpNavn(gid){
 const f=grpFind(gid);
 if(!f)return '';
 return (f.g.label||f.g.feed||'gruppe')+' · '+f.sti;
}
/* Hvor skal der skrives hen – i gruppen eller i videolinjens egne kanaler?
   Felterne hedder ikke det samme de to steder: tegningen kalder nummeret
   "nr", planen kalder det "n". */
function audRef(p,id,opret){
 /* Altid i planens egne kanaler. Skal teksten også stå i tegningen, henter
    man den derovre med mellemrum eller enter – den smitter ikke af selv. */
 return {o:audFind(p,id,opret), nf:'n', pi:-1};
}
/* Rettes en gruppe fra planen, skal sidens tidsstempel med – ellers
   kan en kollegas fletning smide rettelsen væk igen. */
function grpRettet(pi){ if(pi>=0&&pages[pi])pages[pi].mt=Date.now() }

/* Find kanalen – og lav den, hvis den skal skrives i for første gang */
function audFind(p,id,opret){
 p.aud=p.aud||[];
 let a=p.aud.find(x=>x.id===id);
 if(!a&&opret){
  a={id:id, n:'Kanal '+(audNr(id)||''), label:'', by:'', at:0};
  p.aud.push(a);
  p.aud.sort((x,y)=>(audNr(x.id)||999)-(audNr(y.id)||999));
 }
 return a;
}
const audSkrevet=p=>audListe(p).filter(a=>a.label).length;
/* Hvilket signal står åbent lige nu. Det er en visning, ikke data: det bliver
   hverken gemt eller sendt videre til kollegerne. */
let audAaben=null;
const audNoegle=(dv,side,p)=>dv.id+'|'+side+'|'+p.id;
const newestTouch=d=>Math.max(0,(d.mt||0),
  ...Object.keys(d.udstyr||{}).map(k=>d.udstyr[k].at||0),
  ...(d.ins||[]).concat(d.outs||[]).map(p=>Math.max(p.at||0,p.del||0)));

function mkPorts(n,pre){
 const a=[];
 for(let i=1;i<=n;i++)a.push({id:id(),n:String(i),label:'',by:'',at:0});
 return a;
}
function addDevice(tpl){
 snap();
 const d={id:id(),type:tpl.t,name:tpl.t,place:'',
   ins:mkPorts(tpl.i),outs:mkPorts(tpl.o)};
 /* På et kamera bærer linjerne deres type: alle mic/line, eller 1–2 mic og
    3–4 som AES-parret. Et kamera uden AES får bare de to analoge spor, og
    man kan plusse flere til bagefter. */
 if(planDom==='kam'){
   const m=tpl.kam||'mic';
   d.ins.forEach((p,i)=>{ p.kamtype = (m==='micaes'&&i>=2) ? 'aes' : 'mic' });
 }
 dom().devices.push(d); drawPlan();
}

/* alle tekster der har været brugt før – bruges som forslag i felterne */
function usedLabels(){
 const set=new Set();
 Object.keys(PLANDOMS).forEach(k=>(ensurePlan()[k].devices||[]).forEach(d=>{
  d.ins.concat(d.outs).forEach(p=>{if(p.label)set.add(p.label)});
 }));
 /* signalflowets kanalnavne er også gode forslag */
 pages.forEach(pg=>pg.sections.forEach(sc=>sc.groups.forEach(g=>
   g.channels.forEach(c=>{if(c.label)set.add(c.label)}))));
 return [...set].sort((a,b)=>a.localeCompare(b,'da'));
}

/* ---- hvem har rettet hvad, og hvad er nyt siden sidst ---- */
const seenKey=()=>'signalflow:seen:'+(cloudId||'lokal');
/* Når et projekt gemmes i databasen første gang, skifter nøglen fra "lokal" til
   projektets id. Uden dette ville alt pludselig se ulæst ud igen. */
function migrateSeen(){
 if(!cloudId)return;
 const k='signalflow:seen:'+cloudId, lokal=load('signalflow:seen:lokal');
 if(!load(k)&&lokal)store(k,lokal);
}
const lastSeen=()=>{const v=load(seenKey());return v?+v:0};
function markSeen(){store(seenKey(),String(Date.now()));drawPlan()}
function newCount(){
 const t=lastSeen(); if(!t)return 0;
 let n=0;
 Object.keys(PLANDOMS).forEach(k=>(ensurePlan()[k].devices||[]).forEach(d=>{
  d.ins.concat(d.outs).forEach(p=>{if(p.at&&p.at>t&&p.by!==meName())n++});
 }));
 return n;
}
const meName=()=>cfg().who||userName().split('@')[0]||'?';
const hasName=()=>meName()!=='?';
function touch(p){p.by=hasName()?meName():'';p.at=Date.now()}
function fresh(p){const t=lastSeen();return t&&p.at&&p.at>t&&p.by!==meName()}

/* ── Hvem har rettet hvad siden sidst ──────────────────────────
   Hver kollega får sin egen farve, og kortene de har rettet i bliver
   markeret med den. Den første farve er orange, for i langt de fleste
   tilfælde har én kollega været inde – og så er det den man ser.
   Farven følger navnet, så den samme person har den samme farve hver gang
   og på alle maskiner. Er to navne uheldige og rammer det samme sted,
   rykkes den ene videre, så to kolleger aldrig har samme farve samtidig. */
const RET_FARVER=['#ff9a3c','#56c2ff','#b78bff','#5fd38a','#ff6f91','#ffd93d','#4dd0c4','#ff8a65'];
/* Tildelingen laves én gang pr. optegning og læses af både kortene og linjerne */
let retFarveNu={};
/* Alle navne med nye rettelser i HELE planen får tildelt farve én gang pr.
   optegning – ellers kunne den samme person få to farver på to kort.
   Navnene sorteres, så tildelingen er den samme hver gang, og den FØRSTE får
   orange: er der kun én kollega inde – og det er der næsten altid – er
   markeringen orange. Kommer der flere, får de hver sin farve. */
function retFarver(){
 const navne=new Set();
 Object.keys(PLANDOMS).forEach(k=>((ensurePlan()[k]||{}).devices||[]).forEach(d=>{
  alive(d.ins).concat(alive(d.outs)).forEach(p=>{ if(fresh(p))navne.add(p.by||'?') });
 }));
 const kort={};
 [...navne].sort((a,b)=>a.localeCompare(b,'da')).forEach((n,i)=>{
  kort[n]=RET_FARVER[i%RET_FARVER.length];
 });
 return kort;
}
/* Hvem har rettet i netop dette kort – i den rækkefølge de sidst rørte det */
function kortRettere(dv){
 const sidst={};
 alive(dv.ins).concat(alive(dv.outs)).forEach(p=>{
  if(!fresh(p))return;
  const n=p.by||'?';
  if(!sidst[n]||p.at>sidst[n])sidst[n]=p.at;
 });
 return Object.keys(sidst).sort((a,b)=>sidst[b]-sidst[a]);
}
function ago(ms){
 if(!ms)return '';
 const s=Math.round((Date.now()-ms)/1000);
 if(s<60)return 'lige nu';
 if(s<3600)return Math.round(s/60)+' min siden';
 if(s<86400)return Math.round(s/3600)+' t siden';
 return new Date(ms).toLocaleDateString('da-DK',{day:'2-digit',month:'2-digit'});
}



/* ---- opdatér skærmen uden at forstyrre den der skriver ----
   I stedet for at tegne planen forfra, retter vi kun de felter der rent faktisk
   har ændret sig – og aldrig det felt markøren står i. */
let applyingRemote=false;

function focusedRef(){
 const a=document.activeElement;
 if(!a)return null;
 return a.dataset&&(a.dataset.plabel||a.dataset.pnum||a.dataset.dname||a.dataset.dplace)?a:null;
}
/* Hvad er brugeren lige nu i gang med at skrive?
   Vi kan ikke bruge "hvilket felt har fokus", for en gentegning flytter fokus.
   I stedet husker vi det sidste felt der blev TASTET i, og hvor længe siden. */
let skriver={ref:null,val:'',ts:0};
document.addEventListener('input',e=>{
 const t=e.target;
 if(t&&t.dataset&&t.dataset.plabel)skriver={ref:t.dataset.plabel,val:t.value,ts:Date.now()};
},true);
const SKRIVEVINDUE=12000;     // i 12 sekunder regner vi feltet for "i brug"
function skriverSelv(ref){
 return !!ref && skriver.ref===ref && (Date.now()-skriver.ts)<SKRIVEVINDUE;
}

function planStructure(){
 return (Object.keys(PLANDOMS).map(k=>
   planDevices(ensurePlan(),k).map(d=>d.id+':'+d.ins.length+'/'+d.outs.length).join(',')
 )).join('|');
}

function syncPlanDOM(){
 const el2=document.getElementById('plan');
 if(!el2||!el2.querySelector('.devgrid'))return drawPlan();
 const foc=focusedRef();

 /* er der kommet eller forsvundet udstyr eller linjer, må vi tegne forfra –
    men kun hvis ingen står og skriver lige nu */
 if(el2.dataset.struct!==planStructure()){
  if(foc){el2.dataset.pending='1';return}
  return drawPlan();
 }

 dom().devices.forEach(dv=>{
  const card=el2.querySelector('[data-dev="'+dv.id+'"]');
  if(!card)return;
  const nm=card.querySelector('[data-dname]');
  if(nm&&nm!==foc&&nm.value!==dv.name)nm.value=dv.name;
  const pl=card.querySelector('[data-dplace]');
  if(pl&&pl!==foc&&pl.value!==(dv.place||''))pl.value=dv.place||'';

  ['ins','outs'].forEach(side=>{
   dv[side].forEach(p=>{
    const ref=dv.id+'|'+side+'|'+p.id;
    const inp=el2.querySelector('[data-plabel="'+CSS.escape(ref)+'"]');
    if(!inp)return;
    const row=inp.closest('.port');
    if(inp!==foc&&inp.value!==(p.label||''))inp.value=p.label||'';
    const num=row.querySelector('[data-pnum]');
    if(num&&num!==foc&&num.value!==p.n)num.value=p.n;
    row.classList.toggle('set',!!p.label);
    row.classList.toggle('fresh',fresh(p));
    const by=row.querySelector('.pby');
    if(by)by.textContent=p.by?(p.by+' · '+ago(p.at)):'';
   });
   const col=card.querySelector('.portcol.'+side);
   if(col)col.querySelector('.portitle span').textContent=
     dv[side].filter(p=>p.label).length+'/'+dv[side].length;
  });
  const meta=card.querySelector('.devmeta');
  if(meta)meta.textContent=(dv.ins.filter(p=>p.label).length+dv.outs.filter(p=>p.label).length)
    +'/'+(dv.ins.length+dv.outs.length)+' sat';
 });

 /* bjælken med "nye ændringer" opdateres for sig */
 const bar=el2.querySelector('.planbar');
 const n=newCount(), badge=el2.querySelector('.newsbadge');
 if(n&&!badge){ if(!foc)drawPlan(); }
 else if(badge&&!n)badge.remove();
 else if(badge)badge.textContent=n+' '+(n===1?'ny ændring':'nye ændringer')+' siden sidst · markér som set';
}

/* når man forlader et felt, tegnes de ventende ændringer ind */
document.addEventListener('focusout',()=>{
 const el2=document.getElementById('plan');
 setTimeout(()=>{
  if(view!=='plan'||!el2)return;
  if(focusedRef())return;
  if(el2.dataset.pending==='1'){el2.dataset.pending='';drawPlan()}
 },120);
});

 <div class="canvaswrap"><div id="bcanvas" class="bcanvas ${snapOn?'snap':''}">

 h+=`</div></div>`;

 el2.innerHTML=h;

 if(typeof autosave==='function')autosave();

function nodeTools(n){

   <button class="mini" data-bedit="${n.id}" title="Navn, farve og størrelse">✎</button>
   <button class="mini" data-bdup="${n.id}" title="Dublér">⧉</button>

/* stregerne tegnes ovenpå, ud fra hvor kasserne faktisk står */
function drawLinks(){
 const svg=document.getElementById('blinks');
 const wrap=document.getElementById('bcanvas');
 if(!svg||!wrap)return;
 const wr=wrap.getBoundingClientRect();
 const pos=nid=>{
  const e=wrap.querySelector('[data-bn="'+CSS.escape(nid)+'"]');
  if(!e)return null;
  const r=e.getBoundingClientRect();
  return {x:r.left-wr.left+r.width/2, y:r.top-wr.top+r.height/2,
          w:r.width, h:r.height, l:r.left-wr.left, t:r.top-wr.top};
 };
 /* mødepunkt på kanten, så stregen ikke går ind over kassen */
 const edge=(a,b)=>{
  const dx=b.x-a.x, dy=b.y-a.y;
  if(!dx&&!dy)return {x:a.x,y:a.y};
  const sx=dx?(a.w/2)/Math.abs(dx):Infinity, sy=dy?(a.h/2)/Math.abs(dy):Infinity;
  const s=Math.min(sx,sy);
  return {x:a.x+dx*s, y:a.y+dy*s};
 };
 let out=`<defs>${Object.keys(LINKSTYLE).map(k=>
   `<marker id="ar-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="${LINKSTYLE[k].c}"/></marker>
    <marker id="ars-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="${LINKSTYLE[k].c}"/></marker>`).join('')}</defs>`;
 bp().links.forEach(L=>{
  const a=pos(L.from), b=pos(L.to);
  if(!a||!b)return;
  const st=LINKSTYLE[L.style]||LINKSTYLE.fiber;
  const p1=edge(a,b), p2=edge(b,a);
  const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
  out+=`<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}"
     stroke="${st.c}" stroke-width="2.4" ${L.dash?'stroke-dasharray="7 5"':''}
     marker-end="url(#ar-${L.style||'fiber'})" ${L.both?`marker-start="url(#ars-${L.style||'fiber'})"`:''}
     class="blink" data-bl="${L.id}"/>`;
  if(L.label)out+=`<g class="bllabel" data-bl="${L.id}">
     <rect x="${mx-L.label.length*3.6-7}" y="${my-11}" width="${L.label.length*7.2+14}" height="21" rx="5"
       fill="#0b0e13" stroke="${st.c}" stroke-width="1"/>
     <text x="${mx}" y="${my+4}" text-anchor="middle" fill="#e9eef5" font-size="11.5">${esc(L.label)}</text></g>`;
 });
 svg.innerHTML=out;
 svg.querySelectorAll('[data-bl]').forEach(n=>n.onclick=e=>{e.stopPropagation();editLink(n.dataset.bl)});
}



/* ---- hjælpelinjer: vis når det man trækker flugter med noget andet ---- */
function showGuides(card,canvas,vaelg){
 clearGuides(canvas);
 const r=card.getBoundingClientRect(), wr=canvas.getBoundingClientRect();
 const me={l:r.left-wr.left, r:r.right-wr.left, cx:r.left-wr.left+r.width/2,
           t:r.top-wr.top, b:r.bottom-wr.top, cy:r.top-wr.top+r.height/2};
 const T=8;                                   // hvor tæt på det skal være
 let snapX=null, snapY=null;
 canvas.querySelectorAll(vaelg||'.bnode').forEach(o=>{
  if(o===card||card.contains(o))return;
  const q=o.getBoundingClientRect();
  const it={l:q.left-wr.left, r:q.right-wr.left, cx:q.left-wr.left+q.width/2,
            t:q.top-wr.top, b:q.bottom-wr.top, cy:q.top-wr.top+q.height/2};
  [['l','l'],['l','r'],['r','l'],['r','r'],['cx','cx']].forEach(([a,b])=>{
   if(Math.abs(me[a]-it[b])<=T){ guide(canvas,'v',it[b]); if(snapX===null)snapX=it[b]-(me[a]-me.l) }
  });
  [['t','t'],['t','b'],['b','t'],['b','b'],['cy','cy']].forEach(([a,b])=>{
   if(Math.abs(me[a]-it[b])<=T){ guide(canvas,'h',it[b]); if(snapY===null)snapY=it[b]-(me[a]-me.t) }
  });
 });
 return {x:snapX,y:snapY};
}
function guide(canvas,retning,pos){
 const d=document.createElement('div');
 d.className='guide '+retning;
 if(retning==='v')d.style.left=pos+'px'; else d.style.top=pos+'px';
 canvas.appendChild(d);
}
function clearGuides(canvas){ canvas.querySelectorAll('.guide').forEach(g=>g.remove()) }

 el2.querySelectorAll('[data-bpage]').forEach(b=>b.addEventListener('mousedown',ev=>{

 }));

    const inp=document.createElement('input');

 });

 if(bd)bd.onclick=()=>{

 };
 const pa=el2.querySelector('[data-bpadd]');
 if(pa)pa.onclick=()=>{const t=prompt('Navn på siden:','Ny side');if(t===null)return;
   snap();ensureBlocks().pages.push({id:id(),title:t||'Ny side',nodes:[],links:[]});

 el2.querySelectorAll('[data-badd]').forEach(b=>b.onclick=()=>{

 });
 const ex=el2.querySelector('[data-bexp]'); if(ex)ex.onclick=printBlocks;
 const bc=el2.querySelector('[data-bcancel]');
 if(bc)bc.onclick=()=>{blockTool=null;linkFrom=null;drawBlocks()};

 el2.querySelectorAll('[data-bedit]').forEach(b=>b.onclick=e=>{e.stopPropagation();editNode(b.dataset.bedit)});
 el2.querySelectorAll('[data-bdel]').forEach(b=>b.onclick=e=>{e.stopPropagation();
   snap();const nid=b.dataset.bdel;
   bp().nodes=bp().nodes.filter(n=>n.id!==nid&&n.parent!==nid);
   bp().links=bp().links.filter(L=>L.from!==nid&&L.to!==nid);
   drawBlocks()});
 el2.querySelectorAll('[data-bdup]').forEach(b=>b.onclick=e=>{e.stopPropagation();
   snap();const n=bnode(b.dataset.bdup);
   const c=JSON.parse(JSON.stringify(n));c.id=id();c.x+=24;c.y+=24;
   bp().nodes.push(c);drawBlocks()});

 /* dobbeltklik-fri redigering: klik direkte på teksten */
 el2.querySelectorAll('[data-btext]').forEach(t=>t.onclick=e=>{
   if(blockTool==='link')return;
   e.stopPropagation();
   const n=bnode(t.dataset.btext);

   inp.className='btextedit'; inp.value=n.label;
   t.replaceWith(inp); inp.focus(); inp.select();
   let finished=false;
   const done=save=>{
     if(finished)return;          // Enter udløser også blur – gem kun én gang
     finished=true;
     if(save&&inp.value!==n.label){snap();n.label=inp.value}
     drawBlocks();
   };
   inp.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();done(true)}
                      if(ev.key==='Escape'){ev.preventDefault();done(false)}ev.stopPropagation()};
   inp.onblur=()=>done(true);
 });

 /* forbind: klik afsender, klik modtager */
 el2.querySelectorAll('[data-bn]').forEach(node=>{
  node.addEventListener('click',e=>{
   if(blockTool!=='link')return;
   e.stopPropagation();
   const nid=node.dataset.bn;
   if(!linkFrom){linkFrom=nid;drawBlocks();return}
   if(linkFrom===nid){linkFrom=null;drawBlocks();return}
   snap();
   bp().links.push({id:id(),from:linkFrom,to:nid,label:'',style:'fiber',dash:false,both:false});
   const nl=bp().links[bp().links.length-1];
   linkFrom=null; drawBlocks(); editLink(nl.id);
  });
  node.addEventListener('mousedown',e=>{
   if(blockTool==='link')return;
   if(e.target.closest('.mini')||e.target.closest('.btextedit')||e.target.closest('[data-brs]')||e.target.closest('.btxt'))return;

   bdrag={n:n,el:node,gx:e.clientX-r.left,gy:e.clientY-r.top};
   node.classList.add('bdragging');
   snap(); document.body.style.userSelect='none';
  });
 });
 el2.querySelectorAll('[data-brs]').forEach(hn=>hn.addEventListener('mousedown',e=>{
  e.preventDefault(); e.stopPropagation();
  const n=bnode(hn.dataset.brs);
  const r=hn.parentElement.getBoundingClientRect();
  bresize={n:n,el:hn.parentElement,x0:e.clientX,y0:e.clientY,w0:r.width,h0:r.height};
  snap(); document.body.style.userSelect='none';
 }));
 if(canvas)canvas.onclick=e=>{if(e.target===canvas&&blockTool==='link'){linkFrom=null;drawBlocks()}};
}

let bdrag=null, bresize=null;
document.addEventListener('mousemove',e=>{
 if(bdrag){
  const wrap=document.getElementById('bcanvas');
  const host=bdrag.n.parent?wrap.querySelector('[data-bn="'+CSS.escape(bdrag.n.parent)+'"]'):wrap;
  const hr=host.getBoundingClientRect();
  const rx=Math.max(0,e.clientX-bdrag.gx-hr.left), ry=Math.max(0,e.clientY-bdrag.gy-hr.top);
  bdrag.el.style.left=rx+'px'; bdrag.el.style.top=ry+'px';
  /* flugter den med noget? så vis en linje – en flugt vinder over gitteret */
  const s2=snapOn?showGuides(bdrag.el,wrap):{x:null,y:null};
  if(snapOn){
   bdrag.el.style.left=Math.max(0,Math.round(s2.x!==null?s2.x:Math.round(rx/GRID)*GRID))+'px';
   bdrag.el.style.top =Math.max(0,Math.round(s2.y!==null?s2.y:Math.round(ry/GRID)*GRID))+'px';
  }
  drawLinks();
 } else if(bresize){
  bresize.el.style.width=Math.max(120,snapTo(bresize.w0+(e.clientX-bresize.x0)))+'px';
  bresize.el.style.height=Math.max(90,snapTo(bresize.h0+(e.clientY-bresize.y0)))+'px';
  showGuides(bresize.el,document.getElementById('bcanvas'));
  drawLinks();
 }
});
document.addEventListener('mouseup',e=>{
 if(bdrag){
  const n=bdrag.n, el3=bdrag.el;
  el3.classList.remove('bdragging');
  clearGuides(document.getElementById('bcanvas'));
  n.x=parseFloat(el3.style.left)||0; n.y=parseFloat(el3.style.top)||0;
  /* slippes udstyret oven i en kasse, hører det til den kasse */
  if(n.t!=='box'){
   const wrap=document.getElementById('bcanvas');
   const r=el3.getBoundingClientRect();
   let target=null;
   bp().nodes.filter(b=>b.t==='box').forEach(b=>{
    const be=wrap.querySelector('[data-bn="'+CSS.escape(b.id)+'"]');
    if(!be)return;
    const br=be.getBoundingClientRect();
    if(r.left+14>br.left&&r.left+14<br.right&&r.top+10>br.top&&r.top+10<br.bottom)target=b.id;
   });
   if(target!==(n.parent||null)){
    const wr=wrap.getBoundingClientRect();
    if(target){
     const be=wrap.querySelector('[data-bn="'+CSS.escape(target)+'"]').getBoundingClientRect();
     n.parent=target; n.x=Math.max(6,r.left-be.left); n.y=Math.max(30,r.top-be.top);
    }else{ delete n.parent; n.x=Math.max(0,r.left-wr.left); n.y=Math.max(0,r.top-wr.top) }
   }
  }
  bdrag=null; document.body.style.userSelect=''; drawBlocks();
 } else if(bresize){
  clearGuides(document.getElementById('bcanvas'));
  bresize.n.w=parseFloat(bresize.el.style.width)||bresize.n.w;
  bresize.n.h=parseFloat(bresize.el.style.height)||bresize.n.h;
  bresize=null; document.body.style.userSelect=''; drawBlocks();
 }
});

function ownSyms(){ const b=ensureBlocks(); b.imgs=b.imgs||{}; return b.imgs }

  <div class="mrow"><button class="btn" data-cancel="1">Luk</button></div>`,root=>{

     addItem('img',b.dataset.img,IMGLIB[b.dataset.img].n); closeModal()});

/* ---- importér mellem plan og blokdiagram ----

  <div id="impArch" class="chklist" style="max-height:180px">Henter …</div>

    <button class="btn go" data-ok="1">Importér</button>

      <b>${esc(r2.name)}</b>
      <span style="margin-left:auto;font-family:var(--fm);font-size:9.5px;color:var(--faint)">
        ${esc(PLANDOMS[r2.domain]||r2.domain||'')}</span></label>`).join('')
     :'<div class="msub" style="padding:9px;text-transform:none;letter-spacing:0">Arkivet er tomt.</div>';
    filtrer();
   }).catch(e=>{root.querySelector('#impArch').innerHTML=
     '<div class="msub" style="padding:9px;color:var(--video)">'+esc(e.message)+'</div>'});

   /* søg i begge lister på én gang */
   const soeg=root.querySelector('[name="impq"]');
   const filtrer=()=>{
    const q=(soeg.value||'').toLowerCase();
    let synligeA=0, synligeB=0;
    root.querySelectorAll('#impSrc .chk, #impArch .chk').forEach(l=>{
     const t=l.textContent.toLowerCase();
     const vis=!q||t.includes(q);
     l.style.display=vis?'':'none';
     if(vis){ if(l.closest('#impSrc'))synligeA++; else synligeB++ }
    });
    const tom=(boks,n)=>{
     const b2=root.querySelector(boks); if(!b2)return;
     let m=b2.querySelector('.intet');
     if(!n&&q){ if(!m){m=document.createElement('div');m.className='msub intet';
       m.style.cssText='padding:9px;text-transform:none;letter-spacing:0';
       m.textContent='Ingen match.';b2.appendChild(m)} }
     else if(m)m.remove();
    };
    tom('#impSrc',synligeA); tom('#impArch',synligeB);
   };
   soeg.oninput=filtrer;
   setTimeout(()=>soeg.focus(),120);

   root.querySelector('[data-cancel]').onclick=closeModal;
   root.querySelector('[data-ok]').onclick=()=>{
    const picked=[...root.querySelectorAll('[data-imp]:checked')].map(c=>c.dataset.imp);
    if(!picked.length)return closeModal();
    snap();
    picked.forEach(k=>{
     const arkiv = k.startsWith('a:') ? arch.find(x=>x.id===k.slice(2)) : null;
     if(tilBlok){
      /* ind på diagrammet som en kasse med billede eller symbol */
      let navn='Udstyr', img=null;
      if(arkiv){navn=arkiv.name; img=arkiv.img}
      else{
       const [,dm,did]=k.split(':');
       const d=((ensurePlan()[dm]||{}).devices||[]).find(x=>x.id===did);
       if(!d)return; navn=d.name;
      }
      const s0=freeSpot(130,120);
      const n={id:id(),t:'item',x:s0.x,y:s0.y,w:120,label:navn};
      if(img)n.src=img; else n.sym='rack';
      if(lastBox){n.parent=lastBox;n.x=18;n.y=46+bp().nodes.filter(x=>x.parent===lastBox).length*126}
      bp().nodes.push(n);
     }else{
      /* ind i planen som et kort */
      if(arkiv){dom().devices.push(lagerToDevice(arkiv));return}
      const [,pi,nid]=k.split(':');
      const pg=(ensureBlocks().pages||[])[+pi];
      const n=pg&&(pg.nodes||[]).find(x=>x.id===nid);
      if(!n)return;
      dom().devices.push({id:id(),type:n.label,name:n.label||'Udstyr',place:pg.title||'',mt:Date.now(),
        ins:[{id:id(),n:'1',label:'',by:'',at:0}],outs:[{id:id(),n:'1',label:'',by:'',at:0}]});
     }
    });
    closeModal();
    if(tilBlok)drawBlocks(); else drawPlan();
   };
 });
}

 openModal('Tilføj udstyr eller stik','Vælg et billede, et symbol – eller læg dit eget ind',`

  <div class="picks">

   ${Object.keys(own).map(k=>`<button class="pick" data-own="${k}">
      <img src="${own[k].src}"><span>${esc(own[k].n)}</span>
      <b class="mini" data-rmimg="${k}" title="Fjern fra biblioteket">✕</b></button>`).join('')}
  </div>
  <div class="msec">Symboler</div>
  <div class="picks sym">
   ${Object.keys(SYMLIB).map(k=>`<button class="pick" data-sym="${k}">
      <span class="bsym">${SYMLIB[k]}</span><span>${k}</span></button>`).join('')}
  </div>
  <div class="msec">Dit eget billede</div>
  <div class="mf">
    <input type="file" id="imgUp" accept="image/*">
    <div class="msub" style="text-transform:none;letter-spacing:0;font-size:11.5px;margin-top:6px">
      Billedet gemmes i projektet, så kollegerne ser det samme. Det skaleres automatisk ned.
    </div>
  </div>
  <div class="mrow"><button class="btn" data-cancel="1">Luk</button></div>`,root=>{
   root.querySelector('[data-cancel]').onclick=closeModal;
   root.querySelectorAll('[data-own]').forEach(b=>b.onclick=e=>{
     if(e.target.dataset.rmimg)return;
     const k=b.dataset.own; addItem('own',own[k].src,own[k].n); closeModal()});
   root.querySelectorAll('[data-rmimg]').forEach(b=>b.onclick=e=>{
     e.stopPropagation(); snap(); delete ensureBlocks().imgs[b.dataset.rmimg]; closeModal(); pickItem()});
   root.querySelector('#imgUp').onchange=e=>{
     const f=e.target.files[0]; if(!f)return;
     const rd=new FileReader();
     rd.onload=()=>{
      const im=new Image();
      im.onload=()=>{
       const max=260, sc=Math.min(1,max/Math.max(im.width,im.height));
       const cv=document.createElement('canvas');
       cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
       cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
       const src=cv.toDataURL('image/png');
       const nm=(f.name||'Billede').replace(/\.[^.]+$/,'');
       snap();
       ensureBlocks().imgs=ensureBlocks().imgs||{};
       const k=id(); ensureBlocks().imgs[k]={n:nm,src:src};
       addItem('own',src,nm); closeModal();
      };
      im.src=rd.result;
     };
     rd.readAsDataURL(f);
   };
 });
}

/* ---- udskriv blokdiagrammet ---- */
function printBlocks(){
 const c=document.getElementById('bcanvas');
 if(!c)return;
 const w=Math.max(c.scrollWidth,900), hgt=Math.max(c.scrollHeight,600);
 const padPx=8*96/25.4;
 const sideB=420*96/25.4, sideH=297*96/25.4;     // A3 liggende
 /* Skalér så hele diagrammet er der – både i bredden og højden. Vi bruger
    transform frem for zoom, fordi Safari ikke regner zoom med ved print. */
 const k=Math.max(0.2,Math.min((sideB-2*padPx)/w,(sideH-2*padPx-26)/hgt,1.8));
 const bredde=w*k, hoejde=hgt*k;
 document.getElementById('printroot').innerHTML=
  `<div class="psheet blockprint" style="width:${sideB}px;height:${(sideH-2).toFixed(0)}px">
     <div class="sheettitle">${esc(projectName)} · ${esc(bp().title)}</div>
     <div class="pfit" style="width:${bredde}px;height:${hoejde}px;overflow:hidden;
          margin:0 auto">
       <div class="pfitin" style="width:${w}px;height:${hgt}px;transform:scale(${k.toFixed(4)});transform-origin:top left">
         <div class="bcanvas printed" style="width:${w}px;height:${hgt}px">${c.innerHTML}</div>
       </div>
     </div>
   </div>`;
 document.getElementById('pagestyle').textContent=
  `@page{size:A3 landscape;margin:0}
   @media print{
     html,body{margin:0!important;padding:0!important}
     #printroot{width:${sideB}px;margin:0}
     .psheet{padding:${padPx}px;box-sizing:border-box;overflow:hidden;margin:0;
             break-inside:avoid;page-break-inside:avoid;
             break-before:page;page-break-before:always;
             break-after:auto;page-break-after:auto}
     .psheet:first-child{break-before:auto;page-break-before:auto}
   }`;
 const navn=projectName+' – Blokdiagram – '+bp().title;
 setTimeout(()=>udskriv(navn),150);
}

/* ---- tegn planen ---- */
const CARDW=760;
/* Ret op: gitter og hjælpelinjer, så kortene kan stilles lige op. */
let planSnap=true;
const labelled=(dv,side)=>ports(dv,side).filter(p=>p.label);
const devDone=dv=>{
 const all=labelled(dv,'ins').concat(labelled(dv,'outs'));
 return all.length>0 && all.every(p=>p.patched&&p.checked);
};

function drawPlan(){
 if(!lastSeen())store(seenKey(),String(Date.now()));
 /* Har området udstyrsbokse, skal prikkerne vise noget rigtigt med det samme –
    ikke først når man åbner vælgeren. */
 if(pladserFor(planDom).length) udstyrsDataSikret();
 const el2=document.getElementById('plan');
 const nyt=newCount();
 const labels=usedLabels();
 /* én farve pr. kollega, tildelt samlet for hele planen */
 retFarveNu=retFarver();
 grpNulstil(); indNulstil();      // opslagene hentes forfra ved hver optegning

 let h=`<div class="planbar">
   <div class="domtabs">${Object.keys(PLANDOMS).map(k=>
     `<button class="domtab ${k===planDom?'on':''}" data-dom="${k}" title="${PLANDOMS[k]}-planen – hvert område har sit eget udstyr">${PLANDOMS[k]}</button>`).join('')}</div>
   ${(guestToken||planDom==='vc')?''
     /* Containerne hentes ikke fra blokdiagrammet eller lageret – de bor i
        routeren. De har deres egne knapper nede i listen. */
     :`<button class="sharebtn left" data-imp="1" title="Hent udstyr der allerede er brugt på blokdiagrammet">⤒ Fra blokdiagram</button>
     <button class="sharebtn left" data-kimp="1" title="Importér en plan fra csv, Excel eller indsat tekst">⤒ Importér fil</button>`}
   ${nyt?`<button class="newsbadge" data-seen="1">${nyt} ${nyt===1?'ny ændring':'nye ændringer'} siden sidst · markér som set</button>`:''}
   ${meName()==='?'?`<input class="whobox" id="whoBox" placeholder="Dine initialer" title="Vises ud for de linjer du retter">`:
     `<span class="whotag" title="Dine initialer – klik for at rette">${esc(meName())}</span>`}
   <button class="sharebtn save" data-save="1" title="Gem i databasen nu, så kollegerne kan se det">Gem</button>
   ${mobil?''/* planen henter selv hvert sjette sekund */
     :`<button class="sharebtn" data-refresh="1" title="Hent kollegernes ændringer nu">↻ Opdatér</button>`}
   ${guestToken?''/* en gæst deler ikke linket videre – han har det jo */
     :`<button class="sharebtn" data-share="1" title="Kopiér et link der åbner denne plan – modtageren skal ikke logge ind">🔗 Del link</button>`}
   <button class="sharebtn" data-ppdf="1" title="Print ${PLANDOMS[planDom]}-planen eller gem den som PDF">↧ PDF</button>
   ${mobil?'':`
   <button class="sharebtn" data-pcsv="1" title="Hent ${PLANDOMS[planDom]}-planen som regneark til Excel">↧ CSV</button>`}
   ${(mobil||planDom==='vc')?''/* containerne står i én liste – der er ingen kort at stille op */:`
   <button class="sharebtn" data-kol1="1" title="Stil kortene i én lang kolonne, så du kun skal rulle nedad">↕ Én kolonne</button>
   <button class="sharebtn" data-kol3="1" title="Stil kortene op i tre kolonner ved siden af hinanden">⫴ Tre kolonner</button>`}
   ${planDom==='vc'?''
     :`<button class="sharebtn" data-foldall="1" title="Fold alle kort sammen, så kun linjer med signal vises – tryk igen for at folde ud">⊟ Fold tomme</button>`}
   ${(mobil||planDom==='vc')?''/* På telefonen står kortene i én kolonne i forvejen – der er intet at rette op */
     :`<button class="sharebtn ${planSnap?'on':''}" data-psnap="1" title="Lås til gitter: kortene falder på plads i lige rækker, og der vises hjælpelinjer når de flugter">⊞ Ret op</button>`}
   ${(guestToken||planDom==='vc')?'':`
     <div class="planadd">
       <button class="sharebtn save" data-arch="1" title="Hent udstyr fra lageret">+ Udstyr</button>
     </div>`}
 </div>`;

 /* Video containerne står i én liste med søgning og filtre – ikke som kort
    på et lærred. Der er flere hundrede af dem, og de skal findes, ikke
    bladres igennem. Resten af planen er den samme: samme bånd foroven,
    samme felter i lydsporene, samme binding til tegningen. */
 if(planDom==='vc'){
  h+=vcListeHTML();
  h+=`<datalist id="lbls">${labels.map(l=>`<option value="${esc(l)}">`).join('')}</datalist>`;
  el2.className=(el2.className||'').replace(/\s*dom-\w+/g,'')+' dom-vc';
  el2.innerHTML=h;
  bindPlan();
  bindVC();
  if(typeof mobilTitel==='function')mobilTitel();
  if(typeof autosave==='function')autosave();
  if(typeof sideAndet==='function')sideAndet();
  return;
 }

 const list=devs();
 if(!list.length){
  h+=`<div class="planempty">Ingen ${PLANDOMS[planDom].toLowerCase()}-udstyr endnu.<br>
      Vælg et stykke udstyr i menuen ovenfor for at komme i gang.</div>`;
 }


 /* Kort uden plads får en, så de ikke lander oven i hinanden.
    Højden gættes ud fra antal linjer, så stakken bliver pæn fra start.
    Alle områder starter i ÉN kolonne: tre kolonner var svære at overskue, og
    man skulle rulle til siden for at finde den yderste. Har man selv flyttet
    kortene ud i flere kolonner, bliver de stående – vi rører kun dem, der
    ikke har en plads endnu, og de lægger sig nederst. */
 const estH=d=>74+Math.max(ports(d,'ins').length,ports(d,'outs').length)*30+46;
 let bund=20;
 list.forEach(d=>{
  if(typeof d.y==='number')bund=Math.max(bund, d.y+estH(d)+24);
 });
 list.forEach(d=>{
  if(typeof d.x==='number'&&typeof d.y==='number')return;
  d.x=20; d.y=bund; bund+=estH(d)+24;
 });
 h+=`<div class="devcanvas ${planSnap?'snap':''}" id="devcanvas">`;
 list.forEach(dv=>{
  const lab=labelled(dv,'ins').concat(labelled(dv,'outs'));
  const np=lab.filter(p=>p.patched).length, nc=lab.filter(p=>p.checked).length;
  const done=devDone(dv);
  /* har kolleger rettet i kortet siden sidst, får det deres farve */
  const rettere=kortRettere(dv);
  const retStil=rettere.length?`;--ret:${retFarveNu[rettere[0]]||RET_FARVER[0]}`:'';
  h+=`<div class="dev ${(dv.w||CARDW)<580?'narrow':''} ${rettere.length?'rettet':''}" data-dev="${dv.id}" style="left:${dv.x}px;top:${dv.y}px;width:${dv.w||CARDW}px${retStil}">
    <div class="devhead ${pladserFor(planDom).length?'medudstyr':''}">
      <span class="draghandle" data-dragdev="${dv.id}" title="Træk for at flytte kortet">⠿</span>
      <div class="devnames">
        <input class="devname" value="${esc(dv.name)}" data-dname="${dv.id}" placeholder="Navn på udstyr">
        <input class="devplace" value="${esc(dv.place||'')}" data-dplace="${dv.id}" placeholder="Placering, fx Studie">
      </div>
      ${rettere.length?`<span class="retfolk" title="Rettet siden du sidst så planen:\n${esc(rettere.join('\n'))}">${
        rettere.map(n=>`<span class="retchip" style="--ret:${retFarveNu[n]||RET_FARVER[0]}">${esc(n)}</span>`).join('')
      }</span>`:''}
      ${udstyrBjaelke(dv)}
      <div class="devmeta">
        <button class="pt p ${lab.length&&np===lab.length?'lit':''}" data-dall="${dv.id}|patched"
          title="Patchet – ${np} af ${lab.length}. Klik for at sætte alle">P<em>${np}/${lab.length}</em></button>
        <button class="pt t ${lab.length&&nc===lab.length?'lit':''}" data-dall="${dv.id}|checked"
          title="Tjekket – ${nc} af ${lab.length}. Klik for at sætte alle">T<em>${nc}/${lab.length}</em></button>
      </div>
      <div class="devacts">
        ${foldKnap(dv)}
        <button class="mini rowmenu" data-kortmenu="${dv.id}" title="Muligheder for kortet">⋯</button>
        ${guestToken?'':`<button class="mini" data-darch="${dv.id}" title="Skriv kortets kanaler på et stykke udstyr, der findes på lageret">⤓</button>`}
        <button class="mini" data-ddup="${dv.id}" title="Lav en kopi af hele kortet">⧉</button>
        <button class="mini" data-ddel="${dv.id}" title="Slet kortet og alle dets linjer">✕</button>
      </div>
    </div>
    ${planDom==='freq' ? `<div class="ports enkelt">${freqListe(dv)}</div>`
     : planDom==='kam' ? `<div class="ports ${ports(dv,'outs').length?'':'enkelt'}">${kamListe(dv)}
         ${ports(dv,'outs').length?portList(dv,'outs','Retur'):''}</div>` : `
    <div class="ports ${(ports(dv,'ins').length&&ports(dv,'outs').length)?'':'enkelt'}">
      ${ports(dv,'ins').length?portList(dv,'ins','Input'):''}
      ${ports(dv,'outs').length?portList(dv,'outs','Output'):''}
      ${(!ports(dv,'ins').length&&!ports(dv,'outs').length)?
        `<div class="ingenlinjer">Ingen linjer endnu
           <button class="add" data-padd="${dv.id}|ins">+ input</button>
           <button class="add" data-padd="${dv.id}|outs">+ output</button>
         </div>`
       /* Mangler den ene side helt, skal der stadig være en vej til at
          oprette den første linje – ellers sidder man fast. */
       :(!ports(dv,'outs').length?
        `<div class="startside"><button class="add" data-padd="${dv.id}|outs"
            title="Giv kortet et output">+ output</button></div>`
       :(!ports(dv,'ins').length?
        `<div class="startside"><button class="add" data-padd="${dv.id}|ins"
            title="Giv kortet et input">+ input</button></div>`:''))}
    </div>`}
    <span class="rs" data-devrs="${dv.id}" title="Træk for at gøre kortet bredere eller smallere"></span>
  </div>`;
 });
 h+=`</div>
  <datalist id="lbls">${labels.map(l=>`<option value="${esc(l)}">`).join('')}</datalist>
  <datalist id="freqtyper">${FREQTYPER.map(t=>`<option value="${t}">`).join('')}</datalist>`;

 /* området med på beholderen, så fx kameraplanen kan have bredere nummerfelt */
 el2.className=(el2.className||'').replace(/\s*dom-\w+/g,'')+' dom-'+planDom;
 el2.innerHTML=h;
 bindPlan();
 if(typeof mobilTitel==='function')mobilTitel();
 if(typeof autosave==='function')autosave();
 if(typeof sideAndet==='function')sideAndet();
}


/* ══════════════════════════════════════════════════════════════
   VIDEO CONTAINERE
   Når systemet bygges, oprettes der containere i videorouteren: ét
   videosignal med op til 16 lydspor hængt på. Der er så mange af dem –
   Remote 2 har flere hundrede faste – at de ikke kan stå i grupper på
   sider som tegningen. Derfor står de i én liste med søgning og filtre,
   og de foldes ud én ad gangen.

   En container ER et stykke "udstyr" i planen med ÉN linje: ind-containere
   har linjen på inputsiden, ud-containere på outputsiden. Det er ikke en
   omvej – det er dét, der gør, at lydsporene, bindingen til tegningen,
   spøgelsesteksten, hakkene for patchet/tjekket, "hvem rettede hvad" og
   sammenfletningen mellem to maskiner virker her uden en linje ny kode.
   Nummeret og navnet står på containeren og skrives med over i linjen,
   så print, regneark og tegningens opslag ser det samme.
   ══════════════════════════════════════════════════════════════ */
const VC_SPOR=16;                  // 16 lydspor pr. container
let vcSoeg='';
let vcF={retning:'',lyd:'',bundet:'',bib:''};
let vcUde=new Set();               // containere der står foldet UD

const vcAlle=()=>alive(((ensurePlan().vc)||{}).devices||[]);
const vcRetning=dv=>((dv&&dv.retning)==='ud'?'ud':'ind');
const vcSide=dv=>(vcRetning(dv)==='ind'?'ins':'outs');
/* Den ene linje. Den ledes efter på begge sider: er en container vendt om,
   eller kommer den skæv ind fra et regneark, skal den stadig kunne vises. */
function vcPort(dv){
 if(!dv)return null;
 const i=alive(dv.ins||[]), o=alive(dv.outs||[]);
 return (vcSide(dv)==='ins' ? (i[0]||o[0]) : (o[0]||i[0])) || null;
}
function vcPortSide(dv){
 const p=vcPort(dv); if(!p)return vcSide(dv);
 return alive(dv.ins||[]).indexOf(p)>=0 ? 'ins' : 'outs';
}
/* Nummeret og navnet bor på containeren. Linjen får dem skrevet med, så alt
   det, der læser planen – print, csv, tegningens spøgelser – ser det samme
   ét sted fra. */
function vcSyncPort(dv){
 const p=vcPort(dv); if(!p)return;
 p.n=String(dv.nr||'');
 p.label=String(dv.name||'');
}
const vcSkrevet=dv=>{const p=vcPort(dv);return p?audSkrevet(p):0};
const vcSporAntal=dv=>{const p=vcPort(dv);return p?audListe(p).length:0};
const vcBundne=dv=>{const p=vcPort(dv);return p?portGrps(p):[]};
function vcSporTekster(dv){
 const p=vcPort(dv); if(!p)return [];
 return audListe(p).map(a=>((a.n||'')+' '+(a.label||'')).trim());
}
/* Biblioteksnavnene der faktisk er i brug i projektet. */
function vcBiblioteker(){
 const s=new Set();
 vcAlle().forEach(dv=>{ if(dv.bib)s.add(dv.bib) });
 return [...s].sort((a,b)=>a.localeCompare(b,'da'));
}

/* Næste ledige nummer. Containere nummereres i routeren, så vi gætter kun
   det næste tal – resten retter man selv. */
function vcNaesteNr(){
 let m=0;
 vcAlle().forEach(dv=>{
  const n=parseInt(String(dv.nr||'').replace(/[^\d]/g,''),10);
  if(!isNaN(n)&&n>m)m=n;
 });
 return String(m+1);
}
function vcNyPort(nr){
 return {id:id(), n:String(nr||''), label:'', by:'', at:0, audN:VC_SPOR};
}
function vcOpret(retning, o){
 o=o||{};
 const nr = o.nr!==undefined ? String(o.nr) : vcNaesteNr();
 const dv={id:id(), type:'Video container', name:o.navn||'', nr:nr,
   retning:(retning==='ud'?'ud':'ind'), bib:o.bib||'', ins:[], outs:[], mt:Date.now()};
 const p=vcNyPort(nr);
 p.label=dv.name;
 dv[vcSide(dv)].push(p);
 /* Sporene fylder intet, før der står noget i dem – præcis som lydkanalerne
    på et videosignal. Kommer der tekster med fra et bibliotek eller et
    regneark, lægges de ind her. */
 (o.spor||[]).forEach((t,i)=>{
  if(!t)return;
  const r=audRef(p, audId(p,i+1), true);
  if(r&&r.o){ r.o.label=String(t); touch(r.o) }
 });
 ((ensurePlan().vc).devices||[]).push(dv);
 return dv;
}
function vcNy(retning){
 snap();
 const dv=vcOpret(retning);
 vcUde.add(dv.id);
 autosave(); drawPlan();
 setTimeout(()=>{
  const f=document.querySelector('[data-vcnavn="'+CSS.escape(dv.id)+'"]');
  if(f){f.focus();f.select()}
 },60);
}
/* Ind bliver ud og omvendt: linjen flytter side, så den stadig ligger, hvor
   planen forventer en ind- eller udgang. */
function vcVendRetning(dv){
 snap();
 const p=vcPort(dv), fra=vcPortSide(dv), til=(fra==='ins'?'outs':'ins');
 if(p){
  dv[fra]=(dv[fra]||[]).filter(x=>x!==p);
  if(!dv[til])dv[til]=[];
  dv[til].push(p);
  touch(p);
 }
 dv.retning = (til==='ins'?'ind':'ud');
 autosave(); drawPlan();
}
function vcSlet(dv){
 snap();
 dv.del=Date.now(); dv.by=meName();
 vcUde.delete(dv.id);
 autosave(); drawPlan();
}

/* ── Søgning og filtre ────────────────────────────────────────
   Containerne findes ikke ved at bladre – der er for mange. Søgningen
   leder også i lydsporene, for det er tit dét man kan huske: "hvor ligger
   KOMM 4 henne?". */
function vcFiltreret(){
 const q=vcSoeg.trim().toLowerCase();
 const ud=vcAlle().filter(dv=>{
  if(vcF.retning && vcRetning(dv)!==vcF.retning)return false;
  if(vcF.bib==='egne'){ if(dv.bib)return false }
  else if(vcF.bib && dv.bib!==vcF.bib)return false;
  const skrevet=vcSkrevet(dv);
  if(vcF.lyd==='har' && !skrevet)return false;
  if(vcF.lyd==='tom' && skrevet)return false;
  const b=vcBundne(dv).length;
  if(vcF.bundet==='ja' && !b)return false;
  if(vcF.bundet==='nej' && b)return false;
  if(!q)return true;
  if(String(dv.nr||'').toLowerCase().indexOf(q)>=0)return true;
  if((dv.name||'').toLowerCase().indexOf(q)>=0)return true;
  if((dv.bib||'').toLowerCase().indexOf(q)>=0)return true;
  return vcSporTekster(dv).some(t=>t.toLowerCase().indexOf(q)>=0);
 });
 /* Nummeret sorteres som tal, så 9 kommer før 10. Står ind og ud med samme
    nummer, står de ved siden af hinanden – de hører jo sammen. */
 return ud.sort((a,b)=>{
  const c=String(a.nr||'').localeCompare(String(b.nr||''),'da',{numeric:true});
  if(c!==0)return c;
  if(vcRetning(a)!==vcRetning(b))return vcRetning(a)==='ind'?-1:1;
  return (a.name||'').localeCompare(b.name||'','da');
 });
}
const vcFiltrePaa=()=>!!(vcF.retning||vcF.lyd||vcF.bundet||vcF.bib||vcSoeg.trim());

/* ── Listen ───────────────────────────────────────────────────── */

   title="${navne.length?esc('Hører til '+navne.join(', ')+' – klik for at skifte eller løsne')
            :'Bind containeren til en gruppe i tegningen'}">⚯</button>`;
}

     title="Containerens nummer i routeren">
   <button class="vcret" data-vcvend="${dv.id}"
     title="${ret==='ind'?'Ind-container – klik for at gøre den til en ud-container'
                         :'Ud-container – klik for at gøre den til en ind-container'}">${ret==='ind'?'IND':'UD'}</button>
   <input class="vcnavn" value="${esc(dv.name||'')}" list="lbls" placeholder="navn på containeren"
     data-vcnavn="${dv.id}" title="Hvad containeren hedder">
   ${dv.bib?`<span class="vcbibm" title="Kommer fra biblioteket ${esc(dv.bib)}">${esc(dv.bib)}</span>`:''}
   <span class="vcspor ${skrevet?'har':''}" title="${skrevet} af ${antal} lydspor er beskrevet">${skrevet}/${antal}</span>
   ${vcBindMaerke(dv)}
   ${ret==='ud'?`<button class="mini vcvej" data-vcvej="${dv.id}"
     title="Vis signalets vej gennem systemet">⤳</button>`:'<span class="vcslot"></span>'}
   <button class="mini rowmenu" data-pmenu="${dv.id}|${side}|${p?p.id:''}"
     title="Muligheder for denne container">⋯</button>
   <button class="mini" data-vcdel="${dv.id}" title="Fjern containeren">✕</button>
 </div>
 ${ude&&p?`<div class="vcspormere">${audBlokKrop(dv,side,p)}</div>`:''}`;
}
function vcListeHTML(){
 const alle=vcAlle();
 const vist=vcFiltreret();
 const bibs=vcBiblioteker();
 const ind=alle.filter(dv=>vcRetning(dv)==='ind').length;
 /* Står man med en kort liste, skal man kunne se om det er filtrene eller
    lageret af containere, der er årsagen. */
 const svar = !alle.length ? ''

 return `<div class="vcbar">

     placeholder="Søg nummer, navn eller lydspor…"

   <select id="vcFRetning" class="${vcF.retning?'paa':''}" title="Ind- eller ud-containere">
     <option value="">Ind og ud</option>
     <option value="ind" ${vcF.retning==='ind'?'selected':''}>Kun ind</option>
     <option value="ud" ${vcF.retning==='ud'?'selected':''}>Kun ud</option>
   </select>
   <select id="vcFLyd" class="${vcF.lyd?'paa':''}" title="Om der er skrevet lydspor på">
     <option value="">Med og uden lyd</option>
     <option value="har" ${vcF.lyd==='har'?'selected':''}>Kun med lydspor</option>
     <option value="tom" ${vcF.lyd==='tom'?'selected':''}>Kun uden lydspor</option>
   </select>
   <select id="vcFBundet" class="${vcF.bundet?'paa':''}" title="Om containeren hører til en gruppe i tegningen">

   </select>
   ${bibs.length?`<select id="vcFBib" class="${vcF.bib?'paa':''}" title="Hvilket bibliotek containeren kommer fra">
     <option value="">Alle biblioteker</option>
     <option value="egne" ${vcF.bib==='egne'?'selected':''}>Kun egne</option>
     ${bibs.map(b=>`<option value="${esc(b)}" ${vcF.bib===b?'selected':''}>${esc(b)}</option>`).join('')}
   </select>`:''}
   ${vcFiltrePaa()?`<button class="sharebtn" data-vcryd="1" title="Vis alle containere igen">Ryd</button>`:''}
   <span class="vcsvar ${vcFiltrePaa()&&!vist.length?'tom':''}">${esc(
     vcFiltrePaa()&&!vist.length?'ingen rammer søgningen':svar)}</span>
   ${guestToken?'':`
   <button class="sharebtn save" data-vcny="ind" title="Opret en container der kommer ind i systemet">+ Ind</button>
   <button class="sharebtn save" data-vcny="ud" title="Opret en container der går ud af systemet">+ Ud</button>
   <button class="sharebtn" data-vcbib="1"
     title="De faste containere pr. vogn – hent dem ind i stedet for at taste dem">⤓ Bibliotek</button>`}
   <button class="sharebtn" data-vcfoldalle="1"
     title="Fold alle de viste containere ud eller sammen">${vcUde.size?'⊟ Fold sammen':'⊞ Fold ud'}</button>
 </div>
 ${!alle.length
   ? `<div class="planempty">Ingen video containere endnu.<br>

   : `<div class="vcliste">
       <div class="vchead"><span class="h-f"></span><span class="h-nr">Nr</span>

       ${vist.length?'':`<div class="vctom">Ingen containere rammer søgningen eller filtrene.</div>`}

/* ── Bind containeren til en gruppe i tegningen ────────────────
   Samme data som håndtrykket i tegningen skriver – bare taget fra den anden
   ende. Sidder man i containerlisten, skal man ikke først finde gruppen i
   tegningen for at binde de to sammen. */
function vcBindVaelg(dvId){
 const dv=vcAlle().find(x=>x.id===dvId);
 const p=dv&&vcPort(dv);
 if(!p)return;
 const nu=portGrps(p);
 const grupper=alleGrupper().filter(x=>grpLyd(x.g).length||x.g.layer==='video');
 const krop = grupper.length
  ? `<div class="grpliste">${grupper.map(x=>{
      const paa=nu.indexOf(x.g.id)>=0;
      const andre=udAlleFor(x.g.id).filter(u=>u.port!==p);
      return `<button class="grpvalg ${paa?'on':''}" data-vcg="${x.g.id}">
        <span class="grpnavn">${esc(x.g.label||x.g.feed||'gruppe')}</span>
        <span class="grpsti">${esc(x.sti+' · '+x.sek)}</span>
        <span class="grptal">${grpLyd(x.g).length} lydkanaler</span>
        ${paa?'<span class="grptal">containeren ligger her</span>':''}
        ${andre.length?`<span class="grptal">bruges også af ${esc(andre.map(u=>
          (u.dv.name||u.dv.nr||'')+' · '+PLANDOMS[u.dom]).join(', '))}</span>`:''}
      </button>`}).join('')}</div>`
  : `<div class="msub" style="text-transform:none;letter-spacing:0;line-height:1.6">
       Der er ingen grupper i tegningen endnu.<br>
       Læg en kilde ind under Tegning først.</div>`;
 openModal('Hvor hører containeren til?',
  (dv.nr?'Container '+dv.nr+' · ':'')+(dv.name||'uden navn')
   +' – vælg den gruppe i tegningen, containeren bærer',
  krop+`<div class="msub" style="text-transform:none;letter-spacing:0;font-size:11.5px;line-height:1.6;margin-top:12px">
      Gruppens lydkanaler står som grå skygge i containerens tomme spor –
      mellemrum eller enter henter teksten over. Din egen tekst bliver
      stående, så tegningen og containerlisten kan forklare det samme på
      hver sin måde. En container må godt bære flere grupper.
    </div>
    <div class="mrow" style="margin-top:12px">
      ${nu.length?`<button class="btn" data-vcloes="1">Løsn alle bindinger</button>`:''}
      <button class="btn" data-annul="1">Luk</button>
    </div>`,
  root=>{
   root.querySelectorAll('[data-vcg]').forEach(b=>b.onclick=()=>{
    snap();
    const gid=b.dataset.vcg;
    const liste=portGrps(p).slice();
    const i=liste.indexOf(gid);
    if(i>=0)liste.splice(i,1); else liste.push(gid);
    portSatGrps(p, liste);
    touch(p); autosave(); drawPlan(); vcBindVaelg(dvId);
   });
   const l=root.querySelector('[data-vcloes]');
   if(l)l.onclick=()=>{ snap(); portSatGrps(p,[]); touch(p); autosave(); closeModal(); drawPlan() };
   const a=root.querySelector('[data-annul]');
   if(a)a.onclick=closeModal;
  });
}

/* ── Signalvejen ──────────────────────────────────────────────
   Hvor kommer signalet i en ud-container fra? Vejen findes gennem
   bindingen til tegningen: containeren bærer en gruppe, gruppen står på et
   ark med en afsender og en modtager, og de andre steder, den samme gruppe
   ligger, er den anden ende – tit en ind-container. Lydsporene stilles op
   side om side, så man kan se, hvad der faktisk er i hvert spor hele vejen
   igennem. Intet af det er noget, der skal vedligeholdes: det er de
   bindinger, der allerede er lavet, læst forlæns. */
function vcVejData(dv){
 const p=vcPort(dv);
 const ud=[];
 vcBundne(dv).forEach(gid=>{
  const f=grpFind(gid);
  if(!f)return;
  /* Alle andre steder gruppen ligger – den anden ende af vejen. */
  const andre=udAlleFor(gid).filter(u=>u.port!==p);
  const kanaler=grpLyd(f.g);
  const spor=audListe(p).map((a,i)=>{
   const c=kanaler[i]||null;
   /* Peger en kanal i tegningen lige på det her spor, er det den, der
      gælder – ellers står kanalen på samme plads i listen. */
   const direkte=indAlleFor('vc', dv.id, p.id, a.id);
   const ch=direkte.length?direkte[0].ch:c;
   let fra='';
   if(ch&&ch.ind&&ch.ind.dev)fra=indMaalNavn(ch.ind);
   return {nr:a.n||String(i+1), min:a.label||'', tegning:ch?(ch.label||''):'', fra:fra,
           patched:!!a.patched, checked:!!a.checked};
  });
  ud.push({g:f.g, sti:f.sti, sek:f.sek, andre:andre, spor:spor});
 });
 return ud;
}
function vcVejHTML(dv){
 const veje=vcVejData(dv);
 const mig=`<span class="vvbox mig">${esc((dv.nr?dv.nr+' · ':'')+(dv.name||'container'))}
   <em>${vcRetning(dv)==='ind'?'ind-container':'ud-container'}</em></span>`;
 if(!veje.length){
  return `<div class="vvtom">Containeren er ikke bundet til nogen gruppe i tegningen,
    så der er ingen vej at følge endnu.<br>
    Tryk på knuden <b>⚯</b> i containerens linje og vælg gruppen – så kan vejen vises.</div>`;
 }
 return veje.map(v=>{
  const ind=v.andre.filter(u=>u.dom==='vc'&&vcRetning(u.dv)==='ind');
  const andet=v.andre.filter(u=>!(u.dom==='vc'&&vcRetning(u.dv)==='ind'));
  const kasse=u=>`<span class="vvbox">${esc((u.dv.nr?u.dv.nr+' · ':'')+(u.dv.name||'')
    +(u.dom!=='vc'?' ':'')) || '(uden navn)'}
    <em>${u.dom==='vc'?(vcRetning(u.dv)==='ind'?'ind-container':'ud-container')
         :PLANDOMS[u.dom]+' · '+SIDENAVN[u.side].toLowerCase()+' '+esc(u.port.n||'')}</em></span>`;
  return `<div class="vvvej">
   <div class="vvkaede">
     ${ind.length?ind.map(kasse).join('<span class="vvpil">→</span>')
                 :'<span class="vvbox mangler">ingen ind-container bundet<em>bind den i tegningen eller i listen</em></span>'}
     <span class="vvpil">→</span>
     <span class="vvbox gruppe">${esc(v.g.label||v.g.feed||'gruppe')}
       <em>${esc(v.sek)} · ${esc(v.sti)}${v.g.transport?' · '+esc(v.g.transport):''}</em></span>
     <span class="vvpil">→</span>
     ${mig}
   </div>
   ${andet.length?`<div class="vvandet">Samme gruppe ligger også på:
     ${andet.map(u=>esc((u.dv.name||u.dv.nr||'')+' · '+PLANDOMS[u.dom]+' '
       +SIDENAVN[u.side].toLowerCase()+' '+(u.port.n||''))).join(' · ')}</div>`:''}
   <table class="vvtab">
     <tr><th>Spor</th><th>I containeren</th><th>I tegningen</th><th>Kommer fra</th><th>P</th><th>T</th></tr>
     ${v.spor.map(s=>`<tr class="${s.min||s.tegning?'':'tomspor'}">
       <td class="vvnr">${esc(s.nr)}</td>
       <td>${esc(s.min)||'<span class="vvintet">—</span>'}</td>
       <td>${esc(s.tegning)||'<span class="vvintet">—</span>'}</td>
       <td class="vvfra">${esc(s.fra)||'<span class="vvintet">—</span>'}</td>
       <td>${s.min?(s.patched?'✓':'☐'):''}</td>
       <td>${s.min?(s.checked?'✓':'☐'):''}</td>
     </tr>`).join('')}
   </table>
  </div>`;
 }).join('');
}
function vcVisVej(dvId){
 const dv=vcAlle().find(x=>x.id===dvId);
 if(!dv)return;
 openModal('Signalvej',
  (dv.nr?'Container '+dv.nr+' · ':'')+(dv.name||'uden navn')
   +' – fra ind-container gennem tegningen og ud igen',
  `<div class="vvrude">${vcVejHTML(dv)}</div>
   <div class="mrow" style="margin-top:12px">
     <button class="btn" data-vvprint="1">↧ Print vejen</button>
     <button class="btn" data-annul="1">Luk</button>
   </div>`,
  root=>{
   const a=root.querySelector('[data-annul]'); if(a)a.onclick=closeModal;
   const pr=root.querySelector('[data-vvprint]');
   if(pr)pr.onclick=()=>vcVejPrint(dv);
  });
}
function vcVejPrint(dv){
 document.getElementById('printroot').innerHTML=
   `<div class="psheet planprint"><div class="sheettitle">${esc(projectName)} · Signalvej · ${
     esc((dv.nr?dv.nr+' · ':'')+(dv.name||''))}</div>
    <div class="vvrude">${vcVejHTML(dv)}</div></div>`;
 document.getElementById('pagestyle').textContent=
   `@page{size:A4 landscape;margin:0}@media print{.psheet{margin:38px}}`;
 closeModal();
 setTimeout(()=>udskriv(projectName+' – Signalvej '+(dv.nr||'')),120);
}

/* ── Regneark og print ────────────────────────────────────────
   Containerne skal ud i samme form som resten: én linje pr. lydspor, så
   det kan sorteres og klistres ind i routerens eget ark. */
function vcRows(){
 const rows=[['Nr','Container','Vej','Bibliotek','Gruppe i tegningen','Spor nr','Lydspor',
   'Står i tegningen','Kommer fra','Patchet','Tjekket','Sat af','Tidspunkt']];
 vcFiltreret().forEach(dv=>{
  const p=vcPort(dv); if(!p)return;
  const grp=vcBundne(dv).map(g=>grpNavn(g)).join(' / ');
  const veje=vcVejData(dv);
  const spor=veje.length?veje[0].spor:audListe(p).map((a,i)=>({
    nr:a.n||String(i+1), min:a.label||'', tegning:'', fra:'',
    patched:!!a.patched, checked:!!a.checked}));
  const skrevet=spor.filter(s=>s.min||s.tegning);
  /* En container uden et eneste spor skal stadig med – ellers mangler den i
     listen, og man tror den ikke findes. */
  (skrevet.length?skrevet:[{nr:'',min:'',tegning:'',fra:'',patched:false,checked:false}])
   .forEach(s=>rows.push([dv.nr||'', dv.name||'', vcRetning(dv)==='ind'?'Ind':'Ud',
     dv.bib||'', grp, s.nr, s.min, s.tegning, s.fra,
     s.patched?'ja':'', s.checked?'ja':'', p.by||'',
     p.at?new Date(p.at).toLocaleString('da-DK'):'']));
 });
 return rows;
}
function vcCSV(){
 const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 dl('﻿'+vcRows().map(r=>r.map(q).join(';')).join('\r\n'),
    fileName('csv',false,'containere'),'text/csv;charset=utf-8');
 closeModal();
}
/* Sporene på papir: KUN dem der står noget i, og de står ned ad –
   1, 2, 3, 4, 5 – ikke på skift til venstre og højre. Papiret bruges i
   stedet til at stille to containere ved siden af hinanden, så en liste på
   seksten containere ikke bliver til seksten sider med luft på. */
function vcPrintSpor(dv){
 const p=vcPort(dv); if(!p)return [];
 const veje=vcVejData(dv);
 const alle=veje.length?veje[0].spor:audListe(p).map((a,i)=>({
   nr:a.n||String(i+1), min:a.label||'', tegning:'',
   patched:!!a.patched, checked:!!a.checked}));
 return alle.filter(s=>(s.min||'').trim()||(s.tegning||'').trim());
}
function vcPrintHTML(){
 const vist=vcFiltreret();
 const kort=vist.map(dv=>{
  const p=vcPort(dv); if(!p)return '';
  const grp=vcBundne(dv).map(g=>grpNavn(g)).join(' / ');
  const spor=vcPrintSpor(dv);
  return `<div class="ppdev vckort"><div class="ppname">
     <span class="ppvcret">${vcRetning(dv)==='ind'?'IND':'UD'}</span>
     ${esc(dv.nr||'')} · ${esc(dv.name||'uden navn')}${dv.bib?' · '+esc(dv.bib):''}
     ${grp?'<span class="ppvcgrp">'+esc(grp)+'</span>':''}</div>
    ${spor.length
      ? `<div class="ppvcspor">${spor.map(s=>`<div class="ppvcr">
          <span class="ppn">${esc(s.nr)}</span>
          <span class="ppl">${esc(s.min||s.tegning||'')}</span>
          <span class="ppb">${s.patched?'✓':'☐'}</span>
          <span class="ppb">${s.checked?'✓':'☐'}</span>
        </div>`).join('')}</div>`
      : `<div class="ppvctom">ingen lydspor skrevet</div>`}
   </div>`;
 }).filter(Boolean);
 const skrevet=vist.reduce((n,dv)=>n+vcPrintSpor(dv).length,0);
 return `<div class="sheettitle">${esc(projectName)} · Video containere${
   vcFiltrePaa()?' · udvalg':''}${harJob()?` <span class="ppdage">${esc(jobTekst())}</span>`:''}</div>
  <div class="ppvcsum">${vist.length} container${vist.length===1?'':'e'} · ${
    skrevet} lydspor skrevet</div>
  <div class="ppvcpar">${kort.join('')}</div>`;
}

 document.getElementById('pagestyle').textContent=

/* ── Knapperne i listen ───────────────────────────────────────── */
/* Menuen bag ⋯ i en containerlinje. Den åbnes også, når man trykker på en
   container på telefonen, hvor knapperne i linjen ikke er fremme. */
function sheetContainer(dv){
 const ude=vcUde.has(dv.id);
 const ret=vcRetning(dv);
 const grp=vcBundne(dv).map(g=>grpNavn(g)).filter(Boolean);
 const punkter=[
  {ikon:ude?'▾':'▸', tekst:ude?'Fold lydsporene sammen':'Fold lydsporene ud',
   vaerdi:vcSkrevet(dv)+'/'+vcSporAntal(dv),
   gør:()=>{ if(ude)vcUde.delete(dv.id); else vcUde.add(dv.id); drawPlan() }}
 ];
 if(ret==='ud')punkter.push({ikon:'⤳',tekst:'Vis signalvej',
   under:'følg signalet fra ind-containeren og gennem tegningen',
   gør:()=>vcVisVej(dv.id)});
 punkter.push({ikon:'⚯',tekst:'Bind til tegningen',
   vaerdi:grp.join(', '),
   under:grp.length?'':'containeren hører ikke til nogen gruppe endnu',
   gør:()=>vcBindVaelg(dv.id)});
 punkter.push({skil:1});
 punkter.push({ikon:'⇄',tekst:ret==='ind'?'Gør den til en ud-container':'Gør den til en ind-container',
   gør:()=>vcVendRetning(dv)});
 punkter.push({skil:1});
 punkter.push({ikon:'✕',tekst:'Fjern containeren',fare:1,gør:()=>vcSlet(dv)});
 openSheet((dv.nr?dv.nr+'  ·  ':'')+(dv.name||'uden navn'), punkter);
}

/* ══════════════════════════════════════════════════════════════
   BIBLIOTEK OVER CONTAINERE
   Remote 2 har flere hundrede faste containere, og DNK47 det samme. De
   skifter ikke fra produktion til produktion, så de skal ikke tastes ind i
   hvert projekt. De bor i databasen med ét bibliotek pr. vogn, læses ind
   fra routerens eget regneark, og hentes ind i et projekt med ét tryk.

   Det der hentes ind, er en KOPI. Projektet skal kunne rettes uden at
   biblioteket følger med – og omvendt skal en rettelse i biblioteket ikke
   ændre en plan, der er afleveret. Hver kopi husker hvilket bibliotek den
   kom fra, så man kan filtrere på det bagefter.
   ══════════════════════════════════════════════════════════════ */
const VCB_TAB='signalflow_vc_biblioteker';
const VCC_TAB='signalflow_vc_containere';
let VCB={liste:null, valgt:null, cont:null, soeg:'', valg:new Set(),
         ret:'', fejl:'', henter:false};

function vcbAntalAf(r){
 /* PostgREST svarer på indlejret optælling som [{count:n}] – men ikke alle
    udgaver gør det. Kan vi ikke få tallet, viser vi ingenting i stedet for
    at gætte. */
 const c=r && r[VCC_TAB];
 if(Array.isArray(c)&&c.length&&typeof c[0].count==='number')return c[0].count;
 if(typeof c==='number')return c;
 return null;
}
async function vcbHent(){
 VCB.fejl='';
 try{
  VCB.liste=await sbFetch(VCB_TAB+'?select=id,navn,note,opdateret_at,opdateret_af,'
    +VCC_TAB+'(count)&order=navn.asc') || [];
 }catch(e){
  /* Uden tabellen kan man stadig arbejde – man har bare ikke et bibliotek. */
  VCB.liste=[];
  VCB.fejl=/findes ikke/i.test(e.message||'')
    ? 'Biblioteket er ikke sat op i databasen endnu. Kør SQL-koden under ☁ Projekter › Opsætning.'
    : (e.message||String(e));
 }
}
async function vcbContHent(bibId){
 VCB.cont=null;
 try{
  VCB.cont=await sbFetch(VCC_TAB+'?select=id,nr,navn,retning,spor,sort'
    +'&bibliotek_id=eq.'+encodeURIComponent(bibId)
    +'&order=retning.asc,sort.asc,nr.asc&limit=2000') || [];
 }catch(e){ VCB.cont=[]; VCB.fejl=e.message||String(e) }
}

/* Hvad ligger allerede i projektet? Henter man det samme bibliotek to gange,
   skal man ikke få alt i to udgaver. */
function vcbIProjektet(){
 const s=new Set();
 vcAlle().forEach(dv=>s.add(vcRetning(dv)+'|'+String(dv.nr||'').trim().toLowerCase()));
 return s;
}
function vcbFiltreret(){
 const q=VCB.soeg.trim().toLowerCase();
 return (VCB.cont||[]).filter(c=>{
  if(VCB.ret && (c.retning||'ind')!==VCB.ret)return false;
  if(!q)return true;
  if(String(c.nr||'').toLowerCase().indexOf(q)>=0)return true;
  if((c.navn||'').toLowerCase().indexOf(q)>=0)return true;
  return (c.spor||[]).some(t=>String(t||'').toLowerCase().indexOf(q)>=0);
 });
}

 if(VCB.henter)return '<div class="hint">Henter …</div>';
 const bibs=VCB.liste||[];
 const fejl=VCB.fejl?`<div class="imp-tom">${esc(VCB.fejl)}</div>`:'';

   ? `<div class="vcbliste">${bibs.map(r=>{
